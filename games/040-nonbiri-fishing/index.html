 else if(k==='hook'){B(520,.08,'triangle',.08);B(780,.12,'triangle',.08,.06)}
 else if(k==='hit'){B(600+x*140,.1,'triangle',.08);B(900+x*140,.12,'triangle',.06,.06)}
 else if(k==='perfect'){[1046,1318,1568].forEach((f,i)=>B(f,.1,'sine',.07,i*.05))}
 else if(k==='miss')B(190,.18,'sawtooth',.045)
 else if(k==='catch'){[523,659,784,1046].forEach((f,i)=>B(f,.16,'triangle',.08,i*.08))}
 else if(k==='rare'){[523,659,784,1046,1318,1568].forEach((f,i)=>B(f,.2,'triangle',.08,i*.09))}
 else if(k==='escape'){[440,370,294].forEach((f,i)=>B(f,.16,'sine',.06,i*.1))}
 else if(k==='unlock'){[784,988,1175,1568].forEach((f,i)=>B(f,.18,'sine',.08,i*.1))}}
function beep(freq,dur=.1,type='sine',vol=.08,delay=0){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const t0=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,t0);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g).connect(audioContext.destination);o.start(t0);o.stop(t0+dur+.02)}catch{}}
function fitPanel(){const p=$('.panel');if(!p)return;const r=p.getBoundingClientRect(),limit=$('#action')?.getBoundingClientRect(),bottom=limit?limit.bottom+46:r.bottom,over=bottom-innerHeight;if(over>0)window.scrollBy(0,Math.min(r.top-6,over+6))}
function pickFish(spot,book){const list=FISH.filter(f=>f.spot===spot),W=[0,60,30,12];let tot=0;const w=list.map(f=>{const v=W[f.r]*(book.c[f.id]?1:2.5);tot+=v;return v});let x=Math.random()*tot;for(let i=0;i<list.length;i++){x-=w[i];if(x<=0)return list[i]}return list[0]}
function spotOpen(book,s){return book.u.includes(s.id)}
function speciesIn(book,spot){return FISH.filter(f=>f.spot===spot&&book.c[f.id]).length}

function mount(){stop();const book=loadBook();let spot=book.u.includes(read('spot','river'))?read('spot','river'):'river';
 const S={phase:'ready',t:0,float:null,fish:null,biteAt:0,nibbles:[],zone:0,hits:0,lives:2,quality:[],freeze:0,winEnd:0,shadow:null,splash:[],flying:null,sessionBest:0};
 stage(`<div class="fi-tabs" id="tabs"></div><div class="fi-wrap">${canvas(600,300)}<div id="card" class="fi-card" hidden></div></div>
 <div class="fi-meter" id="meter"></div><div class="fi-state" id="state">どこで釣ろうかな？</div><button id="action" class="primary fi-action">🎣 投げる</button>
 <div class="fi-book"><h2>魚の図鑑 <span id="count"></span></h2><div id="book"></div></div>`,stat('釣った数',book.total,'total')+stat('図鑑',`0/${FISH.length}`,'dex')+stat('今日の最大','-','best'));
 $('#action').after($('#notice'));
 const c=$('#canvas'),ctx=c.getContext('2d');
 function tabs(){$('#tabs').innerHTML=SPOTS.map(s=>{const open=spotOpen(book,s);const need=s.need?`${SPOTS.find(o=>o.id===s.need.spot).name}で${s.need.n}種`:'';return `<button data-spot="${s.id}" class="${s.id===spot?'selected':''}" ${open?'':'disabled'} aria-label="${s.name}${open?'':'（'+need+'釣るとひらく）'}">${open?s.icon:'🔒'} ${s.name}</button>`}).join('');
  $$('[data-spot]').forEach(b=>b.onclick=()=>{if(S.phase!=='ready'&&S.phase!=='done')return say('釣りの最中は 場所を変えられないよ。');spot=b.dataset.spot;save('spot',spot);resetScene();tabs();setState(`${SPOTS.find(s=>s.id===spot).icon} ${SPOTS.find(s=>s.id===spot).name}にやってきた。`);say(hintFor())})}
 function hintFor(){const s=SPOTS.find(o=>o.id===spot),n=speciesIn(book,spot),all=FISH.filter(f=>f.spot===spot).length;const next=SPOTS.find(o=>o.need&&o.need.spot===spot&&!spotOpen(book,o));return next?`${s.name}の魚 ${n}/${all}種。あと${Math.max(0,next.need.n-n)}種で「${next.name}」へ行けるよ。`:`${s.name}の魚 ${n}/${all}種。★3のめずらしい魚もいるよ。`}
 function drawBook(){const dex=FISH.filter(f=>book.c[f.id]).length;$('#dex').textContent=`${dex}/${FISH.length}`;$('#total').textContent=book.total;$('#count').textContent=`${dex} / ${FISH.length}`;
  $('#book').innerHTML=SPOTS.map(s=>{const list=FISH.filter(f=>f.spot===s.id),n=list.filter(f=>book.c[f.id]).length;return `<h3>${spotOpen(book,s)?s.icon:'🔒'} ${s.name}　${n}/${list.length}</h3><div class="fish-grid">${list.map(f=>{const got=book.c[f.id];return `<div class="card ${got?'':'unknown'}"><span class="ic"${got?fishStyle(f):''}>${f.icon}</span>${got?`<b>${f.name}</b>`:'？？？'}<span class="rs">${stars(f.r)}</span><small>${got?`${got}匹${book.s[f.id]?`・最大 ${book.s[f.id]}cm`:''}`:'まだ見つけていない'}</small></div>`}).join('')}</div>`}).join('')}
 function setState(t){$('#state').textContent=t}
 function meter(){const m=$('#meter');
  if(S.phase==='reel'){if(!m.querySelector('.fi-bar')){m.innerHTML=`<span class="fi-hits" id="hits"></span><div class="fi-bar"><div class="fi-zone" id="zone"></div><div class="fi-marker" id="marker"></div></div><span class="fi-life" id="life"></span>`}
   $('#zone').style.left=S.zone+'%';$('#zone').style.width=S.fish.w+'%';$('#hits').textContent=`${S.hits}/${S.fish.hits}`;$('#life').textContent='💪'.repeat(S.lives)+'·'.repeat(2-S.lives)}
  else{const tip={ready:'「投げる」で 竿をふろう。',cast:'ポチャン！',wait:'浮きが大きく しずんだら 合わせよう。',bite:'今だ！ 合わせて！',done:'もう一度投げて、図鑑をうめよう。'}[S.phase]||'';m.innerHTML=`<div class="fi-hint">${tip}</div>`}}
 function action(){const now=S.t,btn=$('#action');
  if(S.phase==='ready'||S.phase==='done'){$('#card').hidden=true;S.phase='cast';S.castT=0;S.float={x:300+Math.random()*200,y:175+Math.random()*60,sink:0};S.fish=pickFish(spot,book);S.hits=0;S.lives=2;S.quality=[];S.splash=[];S.flying=null;
   const wait=1.6+Math.random()*2.3;S.biteAt=now+.7+wait;S.nibbles=[];const nn=Math.floor(Math.random()*3);for(let i=0;i<nn;i++)S.nibbles.push(now+.9+Math.random()*(wait-.5));
   S.shadow={x:S.float.x+(Math.random()<.5?-1:1)*170,y:S.float.y+30,r:S.fish.r};btn.textContent='✋ 合わせる';btn.classList.remove('alert');setState('魚が来るのを待とう…');say('');sfx('cast');meter()}
  else if(S.phase==='cast'||S.phase==='wait'){escape('早すぎた！ 魚がびっくりして 逃げちゃった。')}
  else if(S.phase==='bite'){S.phase='reel';S.mp=0;S.zone=newZone();btn.textContent='🎣 釣り上げる';btn.classList.remove('alert');sfx('hook');setState(S.fish.r===3?'大物だ！ 緑の中で止めよう！':S.fish.hits>1?`手ごたえあり！ ${S.fish.hits}回 成功させよう！`:'白い印が 緑の中の時に押そう！');meter()}
  else if(S.phase==='reel'){if(S.t<S.freeze)return;const pos=markerPos(),z=S.zone,w=S.fish.w;
   if(pos>=z&&pos<=z+w){const q=1-Math.abs(pos-(z+w/2))/(w/2);S.quality.push(q);S.hits++;S.splash.push({x:S.float.x,y:S.float.y,t:0});
    if(q>.7){sfx('perfect');say('✨ ぴったり！ 大きく育った魚かも！')}else{sfx('hit',S.hits);say('いいぞ！')}
    if(S.hits>=S.fish.hits)return caught();S.freeze=S.t+.45;S.zone=newZone();meter()}
   else{S.lives--;sfx('miss');S.freeze=S.t+.45;if(S.lives<=0)return escape('糸がゆるんで 逃げられちゃった。');say('おしい！ あと1回ミスすると逃げちゃうよ。');meter()}}}
 function newZone(){const w=S.fish.w;let z;do{z=4+Math.random()*(92-w)}while(S.zone&&Math.abs(z-S.zone)<12&&Math.random()<.8);return z}
 function markerPos(){return (Math.sin(S.mp-Math.PI/2)+1)*50}
 function escape(msg){S.phase='done';S.float&&(S.float.sink=0);S.shadow=null;sfx('escape');setState(msg);say('もう一度 投げてみよう。');$('#action').textContent='🎣 もう一度投げる';$('#action').classList.remove('alert');meter()}
 function caught(){const f=S.fish,q=S.quality.reduce((a,b)=>a+b,0)/S.quality.length,[a,b]=f.size,size=Math.round(a+(b-a)*clamp(.15*Math.random()+.85*q,0,1));
  const first=!book.c[f.id],record=!first&&size>(book.s[f.id]||0);book.c[f.id]=(book.c[f.id]||0)+1;book.s[f.id]=Math.max(book.s[f.id]||0,size);book.total++;
  let unlocked=null;for(const s of SPOTS)if(s.need&&!spotOpen(book,s)&&speciesIn(book,s.need.spot)>=s.need.n){book.u.push(s.id);unlocked=s}
  save('book',book);S.phase='done';S.shadow=null;S.flying={t:0,x:S.float.x,y:S.float.y};S.sessionBest=Math.max(S.sessionBest,size);$('#best').textContent=S.sessionBest+'cm';
  const card=$('#card');card.hidden=true;later(()=>{if(S.phase==='done'&&S.flying)card.hidden=false},650);card.innerHTML=`<div class="fish"${fishStyle(f)}>${f.icon}</div><h3>${f.name}が釣れた！</h3><p><span style="color:#ffd35c">${stars(f.r)}</span>　${size}cm</p><p>${first?'<span class="tag new">図鑑に登録！</span>':''}${record?'<span class="tag">サイズ新記録！</span>':''}${q>.7?'<span class="tag">ぴったり名人</span>':''}</p>`;
  sfx(f.r===3||first?'rare':'catch');setState(f.r===3?`すごい！ めずらしい${f.name}！`:`${f.name}（${size}cm）ゲット！`);$('#action').textContent='🎣 もう一度投げる';drawBook();meter();
  const dex=FISH.filter(o=>book.c[o.id]).length,spotAll=FISH.filter(o=>o.spot===spot).every(o=>book.c[o.id]);
  if(unlocked){tabs();later(()=>sfx('unlock'),700);say(`🎉 ${unlocked.icon} 「${unlocked.name}」に行けるようになった！ 上のボタンで移動しよう。`)}
  else if(dex===FISH.length&&first)say('🏆 図鑑コンプリート！ 20種類ぜんぶ集まったよ。こんどはサイズ記録に挑戦！');
  else if(spotAll&&first)say(`🎉 ${SPOTS.find(s=>s.id===spot).name}の魚を ぜんぶ見つけた！`);
  else say(hintFor())}
 function resetScene(){S.phase='ready';S.float=null;S.shadow=null;S.flying=null;$('#card').hidden=true;$('#action').textContent='🎣 投げる';meter()}
 $('#action').onclick=action;on(c,'pointerdown',e=>{e.preventDefault();action()});
 on(window,'keydown',e=>{if((e.key===' '||e.key==='Enter')&&!$('#start')){if(document.activeElement===$('#action'))return;e.preventDefault();action()}});
 on(document,'visibilitychange',()=>{if(document.hidden&&['cast','wait','bite','reel'].includes(S.phase))escape('おかえり。魚は どこかへ行っちゃった。')});
 /* ---- 描画 ---- */
 const cloud=[[80,40,1],[330,60,.8],[520,30,1.2]],starsXY=[...Array(40)].map((_,i)=>[(i*97)%600,(i*53)%110,(i%3)+1]);
 function draw(dt){const sp=SPOTS.find(s=>s.id===spot),t=S.t,night=spot==='night',H=300,WY=120;
  let g=ctx.createLinearGradient(0,0,0,WY);g.addColorStop(0,sp.sky[0]);g.addColorStop(1,sp.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,600,WY);
  if(night){for(const [x,y,r] of starsXY){ctx.globalAlpha=.5+.5*Math.sin(t*2+x);circle(ctx,x,y,r*.8,'#fff')}ctx.globalAlpha=1;circle(ctx,500,42,20,'#fff6c9');circle(ctx,508,36,17,sp.sky[0])}
  else{circle(ctx,540,36,20,'#fff3b0');ctx.fillStyle='#ffffffcc';for(const [x,y,s] of cloud){const cx=(x+t*8*s)%700-50;ctx.beginPath();ctx.ellipse(cx,y,34*s,11*s,0,0,7);ctx.ellipse(cx+18*s,y-7*s,20*s,10*s,0,0,7);ctx.fill()}}
  ctx.fillStyle=sp.far;ctx.beginPath();ctx.moveTo(0,WY);if(spot==='river'){ctx.quadraticCurveTo(120,60,260,WY);ctx.quadraticCurveTo(380,80,600,WY-10)}else{ctx.lineTo(380,WY);ctx.quadraticCurveTo(430,88,480,WY)}ctx.lineTo(600,WY);ctx.closePath();ctx.fill();
  if(spot==='night'){ctx.fillStyle='#e8eefc';ctx.fillRect(452,78,8,30);circle(ctx,456,76,4+Math.sin(t*3),'#ffe58a')}
  g=ctx.createLinearGradient(0,WY,0,H);g.addColorStop(0,sp.water[0]);g.addColorStop(1,sp.water[1]);ctx.fillStyle=g;ctx.fillRect(0,WY,600,H-WY);
  ctx.strokeStyle=night?'#ffffff22':'#ffffff44';ctx.lineWidth=2;for(let i=0;i<6;i++){const y=WY+18+i*30;ctx.beginPath();for(let x=0;x<=600;x+=20)ctx.lineTo(x,y+Math.sin(x/40+t*1.6+i)*3);ctx.stroke()}
  if(night){ctx.fillStyle='#fff6c933';ctx.fillRect(480,WY,40,H-WY)}
  // 桟橋と釣り人
  ctx.fillStyle='#8a5a33';ctx.fillRect(0,236,170,64);ctx.fillStyle='#6d4424';for(let x=10;x<170;x+=34)ctx.fillRect(x,236,4,64);ctx.fillStyle='#a8703f';ctx.fillRect(0,232,172,8);
  ctx.font='40px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🧒',70,206);
  // 魚の影
  if(S.shadow&&(S.phase==='wait'||S.phase==='cast'||S.phase==='bite'||S.phase==='reel')&&S.float){const f=S.float,sh=S.shadow;if(S.phase==='reel'){sh.x=f.x+Math.sin(t*9)*18;sh.y=f.y+18+Math.cos(t*7)*6}else{sh.x+=(f.x-sh.x)*Math.min(1,dt*.9);sh.y+=(f.y+22-sh.y)*Math.min(1,dt*.9)}
   ctx.fillStyle='#00000040';ctx.beginPath();ctx.ellipse(sh.x,sh.y,14+sh.r*9,6+sh.r*3,0,0,7);ctx.fill()}
  // 竿と糸
  const bend=S.phase==='reel'?18+Math.sin(t*14)*5:S.phase==='bite'?10:0,base=[92,214],tip=[214,96+bend];
  ctx.strokeStyle='#5a3a1e';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...base);ctx.quadraticCurveTo(160,120+bend*.6,tip[0],tip[1]);ctx.stroke();
  let fp=null;if(S.float){const f=S.float;if(S.phase==='cast'){const k=clamp(S.castT/.7,0,1);fp=[tip[0]+(f.x-tip[0])*k,tip[1]+(f.y-tip[1])*k-Math.sin(k*Math.PI)*90]}else{let dy=Math.sin(t*2.4)*2;if(S.phase==='wait'&&S.nib>t)dy+=5;if(S.phase==='bite')dy+=12+Math.sin(t*20)*3;if(S.phase==='reel')dy+=8+Math.sin(t*16)*3;fp=[f.x,f.y+dy]}}
  if(fp&&!S.flying){ctx.strokeStyle='#ffffffb0';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(...tip);ctx.quadraticCurveTo((tip[0]+fp[0])/2,Math.max(tip[1],fp[1])+(S.phase==='reel'?0:30),fp[0],fp[1]);ctx.stroke();
   if(S.phase==='bite'||S.phase==='reel'){ctx.strokeStyle='#ffffff88';for(let i=0;i<2;i++){const r=((t*40+i*20)%40)+8;ctx.globalAlpha=1-r/48;ctx.beginPath();ctx.ellipse(fp[0],S.float.y+6,r*1.6,r*.5,0,0,7);ctx.stroke()}ctx.globalAlpha=1}
   const sunk=S.phase==='bite'||S.phase==='reel';circle(ctx,fp[0],fp[1],8,'#fff');ctx.fillStyle='#ff4d5e';ctx.beginPath();ctx.arc(fp[0],fp[1],8,Math.PI,0);ctx.fill();
   if(S.phase==='bite'){label(ctx,'！',fp[0]+18,fp[1]-22,'#ffe066',34)}}
  for(const s of S.splash){s.t+=dt;ctx.globalAlpha=Math.max(0,1-s.t/.5);ctx.font='26px system-ui';ctx.fillText('💦',s.x+(Math.random()-.5)*6,s.y-20-s.t*40)}ctx.globalAlpha=1;S.splash=S.splash.filter(s=>s.t<.5);
  if(S.flying&&S.flying.t<1){const k=S.flying.t;S.flying.t+=dt*1.6;const x=S.flying.x+(300-S.flying.x)*k,y=S.flying.y-Math.sin(k*Math.PI)*120;ctx.save();ctx.filter=S.fish.f||'none';ctx.font='44px system-ui';ctx.fillText(S.fish.icon,x,y);ctx.restore()}}
 function stepPhase(dt){const btn=$('#action');
  if(S.phase==='cast'){if(S.castT>=.7){S.phase='wait';sfx('plop');meter()}}
  else if(S.phase==='wait'){if(S.nibbles.length&&S.t>=S.nibbles[0]){S.nibbles.shift();S.nib=S.t+.28;sfx('nibble');setState('ちょんちょん… まだかな？')}
   if(S.t>=S.biteAt){S.phase='bite';S.winEnd=S.t+WINDOW[S.fish.r];btn.classList.add('alert');sfx('bite');setState(S.fish.r===3?'グイッ！ 大きな影！ 今すぐ合わせて！':'かかった！ 今すぐ合わせて！');meter()}}
  else if(S.phase==='bite'&&S.t>S.winEnd)escape('魚が えさだけ取って 逃げちゃった…');
  else if(S.phase==='reel'){S.mp+=dt*S.fish.sp*2.35*(1+S.hits*.08);const m=$('#marker');if(m)m.style.left=markerPos()+'%';if(S.fish.r===3&&S.t>=S.freeze){S.zone=clamp(S.zone+Math.sin(S.t*1.3)*.25,2,98-S.fish.w);const z=$('#zone');if(z)z.style.left=S.zone+'%'}}}
 loop(dt=>{S.t+=dt;if(S.phase==='cast')S.castT+=dt;stepPhase(dt);draw(dt)});
 tabs();drawBook();meter();say(hintFor());fitPanel()}
function launch(){mount()}
app.innerHTML=`<section class="panel intro"><div class="icon">${CONFIG.emoji}</div><h2>${CONFIG.title}</h2><p>${CONFIG.rules}</p><button class="primary" id="start">あそぶ</button><p class="small">${CONFIG.controls}</p></section>`;
