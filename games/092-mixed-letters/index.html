<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>ならべかえことば｜無料ブラウザゲーム｜ルドット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root{
    --bg:#131322; --panel:#1c1c33; --edge:#2c2c4d;
    --ink:#eeecfa; --sub:#9d99c0;
    --pink:#ff5fa2; --cyan:#53e0d8; --gold:#ffd166; --violet:#a06bff;
    --green:#7be37a;
    --w:480px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 60% at 50% 0%,#1f1b3f 0%,var(--bg) 62%);
    background-color:var(--bg); color:var(--ink);
    font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',monospace,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:10px 10px 28px; overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }
  .backbar,header,#wrap,.help{width:min(var(--w),100%)}
  .backbar{margin:0 2px 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;min-height:28px}
  .backbar a{color:var(--sub);text-decoration:none;padding:4px 0}
  .backbar button{background:none;border:1px solid var(--edge);border-radius:999px;color:var(--sub);font-size:14px;padding:4px 14px;cursor:pointer;font-family:inherit;min-width:48px;min-height:30px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 8px}
  h1{font-size:22px;margin:0;letter-spacing:2px;color:var(--gold);text-shadow:0 0 12px rgba(255,209,102,.55);font-weight:400}
  .age-badge{display:inline-flex;padding:3px 10px;border:1px solid rgba(255,209,102,.35);border-radius:999px;color:var(--gold);background:rgba(255,209,102,.08);font-size:11px;letter-spacing:1px;white-space:nowrap}

  #wrap{
    position:relative;border:2px solid #5a4a22;border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,#1d1c38,#17162c);
    box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 24px rgba(255,209,102,.16);
    min-height:456px;display:flex;flex-direction:column;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  #wrap button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px 6px 12px;background:linear-gradient(180deg,#2d2a55,#211f42);border-bottom:2px solid #121126}
  .hl{display:flex;flex-direction:column;line-height:1.25;min-width:0}
  #hudStage{font-size:14px;color:var(--gold);font-weight:400;white-space:nowrap}
  #hudQ{font-size:12px;color:var(--sub);white-space:nowrap}
  #hudHearts{font-size:20px;letter-spacing:3px;white-space:nowrap}
  #hudHearts i{font-style:normal;color:var(--pink);text-shadow:0 0 8px rgba(255,95,162,.7)}
  #hudHearts i.off{color:#3d3a63;text-shadow:none}
  #hudHearts.cnt{font-size:14px;color:var(--cyan);letter-spacing:1px}
  .hr{display:flex;align-items:center;gap:8px}
  #hudScore{font-size:18px;color:var(--cyan);text-shadow:0 0 8px rgba(83,224,216,.6);min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
  #quitBtn{width:40px;height:36px;border-radius:10px;border:1px solid var(--edge);background:rgba(0,0,0,.25);color:var(--sub);font-family:inherit;font-size:15px;cursor:pointer;padding:0}
  .trow{display:flex;align-items:center;gap:8px;padding:8px 12px 0}
  .tbar{flex:1;height:10px;border-radius:999px;background:#0e0d1f;border:1px solid var(--edge);overflow:hidden}
  #tfill{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#2fb9c9,var(--cyan))}
  #tfill.warn{background:linear-gradient(90deg,#e0a93a,var(--gold))}
  #tfill.danger{background:linear-gradient(90deg,#e23f7f,var(--pink))}
  #tnum{font-size:15px;color:var(--ink);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
  #tnum.danger{color:var(--pink)}

  #stage{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;padding:8px 0 4px}
  .clue{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;padding:0 10px;min-height:32px}
  .chip{font-size:14px;padding:4px 12px;border-radius:999px;border:1px solid rgba(255,209,102,.5);color:var(--gold);background:rgba(255,209,102,.09);white-space:nowrap}
  .chip.dec{border-color:rgba(255,95,162,.55);color:var(--pink);background:rgba(255,95,162,.09);font-size:12px}
  .chip.combo{border-color:rgba(83,224,216,.55);color:var(--cyan);background:rgba(83,224,216,.09);font-size:12px}
  .line{display:flex;justify-content:center;gap:6px;padding:0 12px}
  .line>div{flex:0 1 62px;aspect-ratio:1;min-width:0;position:relative;border-radius:12px}
  .slot{border:2px dashed rgba(83,224,216,.5);background:rgba(83,224,216,.06)}
  .slot.next{border-color:var(--cyan);box-shadow:0 0 10px rgba(83,224,216,.45)}
  .cell{background:rgba(255,255,255,.035);box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
  .tile{
    position:absolute;inset:0;width:100%;height:100%;padding:0;margin:0;cursor:pointer;
    font-family:inherit;font-size:clamp(20px,6.6vw,30px);line-height:1;color:#3a2400;
    border:none;border-radius:12px;
    background:linear-gradient(180deg,#fff1c2 0%,#ffd976 45%,#f5b93a 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(160,96,0,.45),0 3px 8px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
  }
  .tile:active{filter:brightness(1.1)}
  .tile.locked{background:linear-gradient(180deg,#d9fffb 0%,#7fe9e1 45%,#2fb9b1 100%);color:#04302d;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(0,90,84,.45),0 0 12px rgba(83,224,216,.6);cursor:default}
  .tile.hit{background:linear-gradient(180deg,#e6ffd9 0%,#a5ef8f 45%,#58c257 100%);color:#0d3a0c;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(20,100,20,.45),0 0 10px rgba(123,227,122,.5)}
  .tile.miss{background:linear-gradient(180deg,#ffd9e6 0%,#ff9cc2 45%,#e55590 100%);color:#40041c}
  .tile.ok{background:linear-gradient(180deg,#ffffff 0%,#fff0a8 40%,#ffd166 100%);box-shadow:inset 0 2px 0 #fff,inset 0 -5px 0 rgba(160,96,0,.4),0 0 16px rgba(255,209,102,.9);animation:hop .5s ease both}
  .tile.reveal{background:linear-gradient(180deg,#efe6ff 0%,#c4a6ff 45%,#8a5be0 100%);color:#1c0b40}
  .tile.gone{visibility:hidden}
  .tile.guide{animation:guide 1s ease-in-out infinite}
  .tile.cur{outline:3px solid var(--cyan);outline-offset:2px}
  .tile.bump{animation:bump .18s ease}
  @keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-12px) scale(1.12)}100%{transform:translateY(0) scale(1)}}
  @keyframes bump{0%{transform:scale(.82)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes guide{0%,100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(160,96,0,.45),0 0 0 0 rgba(83,224,216,.9)}50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -5px 0 rgba(160,96,0,.45),0 0 0 6px rgba(83,224,216,.55),0 0 18px rgba(83,224,216,.9)}}
  #slots.shake{animation:shake .36s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  #msg{min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.4;color:var(--ink);padding:0 10px}
  #msg.ok{color:var(--gold)} #msg.ng{color:var(--pink)} #msg.tip{color:var(--cyan)} #msg.sub{color:var(--sub)}
  .row{display:flex;gap:6px;padding:4px 10px 10px}
  .btn{flex:1;min-height:46px;font-family:inherit;font-size:14px;padding:6px 2px;border-radius:12px;border:2px solid #4a4480;background:linear-gradient(180deg,#3a3570,#27244f);color:var(--ink);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 #111026;white-space:nowrap}
  .btn small{font-size:11px;color:var(--sub)}
  .btn:active{transform:translateY(2px)}
  .btn:disabled{opacity:.45;cursor:default}
  #hintBtn{border-color:#8a7430;color:var(--gold)}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  .pop{position:absolute;left:50%;z-index:2;pointer-events:none;font-size:24px;color:var(--gold);text-shadow:0 0 10px rgba(255,209,102,.9),0 2px 0 #3a2400;white-space:nowrap;animation:popup .95s ease-out forwards}
  .pop.c{color:var(--cyan);font-size:17px;text-shadow:0 0 10px rgba(83,224,216,.9)}
  .pop.p{color:var(--pink);font-size:17px;text-shadow:0 0 10px rgba(255,95,162,.9)}
  @keyframes popup{0%{transform:translate(-50%,6px) scale(.6);opacity:0}18%{transform:translate(-50%,-6px) scale(1.15);opacity:1}100%{transform:translate(-50%,-52px) scale(1);opacity:0}}

  #overlay{position:absolute;inset:0;display:none;flex-direction:column;gap:9px;align-items:center;justify-content:center;background:rgba(17,16,34,.96);text-align:center;padding:10px 12px;overflow:auto;z-index:3}
  #overlay.show{display:flex}
  #ovBig{font-size:27px;letter-spacing:2px;color:var(--gold);text-shadow:0 0 16px rgba(255,209,102,.7);line-height:1.25}
  #ovBig.lose{color:var(--pink);text-shadow:0 0 16px rgba(255,95,162,.7)}
  #ovBig.win{animation:hop .7s ease both}
  .logo{display:flex;gap:5px;justify-content:center}
  .logo span{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#3a2400;background:linear-gradient(180deg,#fff1c2,#ffd976 45%,#f5b93a);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(160,96,0,.45),0 3px 8px rgba(0,0,0,.5)}
  .logo span:nth-child(1){transform:rotate(-8deg)} .logo span:nth-child(2){transform:translateY(4px) rotate(5deg)} .logo span:nth-child(3){transform:rotate(-3deg)} .logo span:nth-child(4){transform:translateY(3px) rotate(9deg)}
  #ovNote{font-size:13px;color:var(--ink);line-height:1.7}
  #ovNote b{color:var(--gold);font-weight:400}
  #ovNote .c{color:var(--cyan)}
  #ovNote .stars{font-size:34px;letter-spacing:6px;color:var(--gold);text-shadow:0 0 14px rgba(255,209,102,.8);line-height:1.2}
  #ovNote .stars i{font-style:normal;color:#3d3a63;text-shadow:none}
  #stageGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(340px,100%)}
  #stageGrid button{font-family:inherit;min-height:46px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 0}
  #stageGrid button b{font-weight:400;font-size:17px}
  #stageGrid button small{font-size:11px;color:var(--gold);letter-spacing:0}
  #stageGrid button small i{font-style:normal;color:#4a4675}
  #stageGrid button.lock{color:#5d5990;cursor:default}
  #stageGrid button.lock small{color:#5d5990}
  #stageGrid button.on{border-color:var(--gold);background:rgba(255,209,102,.13);box-shadow:0 0 10px rgba(255,209,102,.4)}
  #stageInfo{font-size:12px;color:var(--cyan);min-height:17px}
  .acts{display:flex;flex-direction:column;gap:7px;align-items:center;width:min(300px,100%)}
  .acts button{font-family:inherit;width:100%;min-height:44px;font-size:16px;border-radius:10px;cursor:pointer;letter-spacing:1px;padding:6px 10px}
  #startBtn{background:linear-gradient(180deg,#ffe08a,#ffc23d);color:#3a2400;border:none;box-shadow:0 0 16px rgba(255,209,102,.5),0 3px 0 #8a5a00}
  #altBtn{background:none;color:var(--cyan);border:1px solid rgba(83,224,216,.6);font-size:14px}
  #titleBtn{background:none;color:var(--sub);border:1px solid var(--edge);font-size:13px;min-height:40px}
  #ovStats{font-size:12px;color:var(--sub)}
  .help{color:#b9b5d8;font-size:13px;margin-top:12px;line-height:1.75;background:rgba(13,11,32,.66);border:1px solid rgba(90,75,158,.5);border-radius:12px;padding:10px 12px}
  .help b{color:var(--gold);font-weight:400}
  @media (hover:hover){
    .backbar a:hover{color:var(--gold)}
    .backbar button:hover,#quitBtn:hover,#titleBtn:hover{color:var(--gold);border-color:var(--gold)}
    .tile:hover{filter:brightness(1.08)}
    .tile.locked:hover{filter:none}
    .btn:hover:not(:disabled){border-color:var(--gold)}
    #stageGrid button:not(.lock):hover{border-color:var(--gold)}
    #startBtn:hover{filter:brightness(1.08)}
    #altBtn:hover{background:rgba(83,224,216,.1)}
  }
  @media (max-width:380px){ h1{font-size:20px} .btn{font-size:13px} }
</style>

    tapSlot(i) { return q && q.slots[i] ? tapTile(q.slots[i]) : false; },
    back() { return back(); }, hint() { return hint(); }, pass() { return pass(); },
    step(ms) { let left = ms / 1000; while (left > 1e-9) { const d = Math.min(0.05, left); update(d); left -= d; } },
    auto(b) { auto = !!b; }, seed(n) { rnd = n == null ? Math.random : seeded(n); },
    setTime(t) { timeLeft = t; drawTimer(); }, setHints(n) { hints = n; refresh(); }, setHearts(n) { hearts = n; refresh(); },
    setQn(n) { qn = n; refresh(); }, setSolved(n) { solved = n; },
    words() { return WORDS.map(x => ({ w: x.w, cat: x.cat, e: x.e })); },
    alts() { return [...ALTS]; }, cats() { return Object.keys(CATS); },
    accepts(s) { return accepts(s); },
    makeQ(word, decoys) { const x = makeQ(DICT.get(word), decoys | 0); return { rack: x.tiles.map(t => t.ch).join(''), decoy: x.tiles.filter(t => t.decoy).map(t => t.ch), acts: x.hintActs }; },
    solve(rack, len) { return solve(rack, len); },
    stages() { return STAGES.map(s => ({ len: s.len.slice(), t: s.t, decoy: s.decoy })); },
    plan() { return planFor(); }
  };

  // ---------------- はじめる（イベント登録は いちばん最後） ----------------
  loadSave(); drawMute(); sizeFx(); showTitle();
  selStage = save.unlocked - 1; renderStageGrid();
  muteBtn.addEventListener('click', () => { acted = true; muted = !muted; try { localStorage.setItem(KEY + 'mute', muted ? '1' : '0'); } catch (e) {} drawMute(); muteBtn.blur(); if (!muted) sfx.put(2); });
  $('startBtn').addEventListener('click', () => { acted = true; $('startBtn').blur(); if (primaryAct) primaryAct(); });
  $('altBtn').addEventListener('click', () => { acted = true; $('altBtn').blur(); if (altAct) altAct(); });
  $('titleBtn').addEventListener('click', () => { acted = true; $('titleBtn').blur(); showTitle(); });
  $('hintBtn').addEventListener('click', () => { $('hintBtn').blur(); hint(); });
  $('backBtn').addEventListener('click', () => { $('backBtn').blur(); back(); });
  $('passBtn').addEventListener('click', () => { $('passBtn').blur(); pass(); });
  $('quitBtn').addEventListener('click', () => { $('quitBtn').blur(); if (phase !== 'title') { sfx.back(); showTitle(); } });
  document.addEventListener('pointerdown', () => { acted = true; }, { passive: true });
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', sizeFx);
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
