  if(ball.s>0){ctx.fillStyle='#00000055';ctx.beginPath();ctx.ellipse(ball.x+2,ball.y+3,BR*ball.s,BR*.8*ball.s,0,0,Math.PI*2);ctx.fill();const g=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,BR*ball.s);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#d9dccf');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,BR*ball.s,0,Math.PI*2);ctx.fill()}
  parts.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6)});ctx.globalAlpha=1;
  if(banner>0){const a=Math.min(1,banner/.4);ctx.globalAlpha=a;ctx.fillStyle='#0a1226cc';rr(40,GH/2-40,GW-80,70,16);ctx.fill();ctx.fillStyle='#ffe08a';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.fillText(`ホール ${hole+1}　パー${h.par}`,GW/2,GH/2-8);ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText(h.name,GW/2,GH/2+20);ctx.globalAlpha=1}
 }
 window.__golfState=()=>({hole,mode,shots,clock,x:ball.x,y:ball.y,scores:[...scores]});
 setup();loop(dt=>{update(dt);draw()});
}
function launch(){mount()}
function intro(){const bestV=Number(read('best-v2',0))||0;app.innerHTML=`<section class="panel intro"><div class="icon">${CONFIG.emoji}</div><h2>${CONFIG.title}</h2><p>${CONFIG.rules}</p><div class="golf-legend"><span>🟫 かべではね返る</span><span>🟨 すなはとまりやすい</span><span>🟦 池は1打プラス</span><span>➤ 坂はころがる</span></div>${bestV?`<p class="best-line" style="margin-top:14px">ベスト ${bestV}打（パー27）</p>`:''}<button class="primary" id="start">あそぶ</button><p class="small">${CONFIG.controls}</p></section>`;$('#start').onclick=launch}
intro();
on(window,'keydown',e=>{if(e.key==='Enter'&&$('#start')){e.preventDefault();stop();launch()}});
</script></body></html>
