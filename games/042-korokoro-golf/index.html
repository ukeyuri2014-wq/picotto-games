</head><body><header><a class="brand" href="../../index.html">LUDOT</a><a href="../../index.html">ゲーム一覧へ ↗</a></header><main><div class="eyebrow">SPORTS · #042</div><h1>⛳ ころころミニゴルフ</h1><p class="lead">壁を使って、カップをねらおう。</p><div id="app"></div><p id="storage-warning" class="save-warning" hidden>このブラウザでは記録を保存できません。この画面ではそのまま遊べます。</p><details class="notes"><summary>遊び方</summary><p>方向と強さを決めてボールを打とう。壁に反射する全9ホール。少ない打数でクリアを目指そう。</p><p>スライダーで方向・強さを調整して「打つ」。</p></details></main><footer>無料・ダウンロード不要 · LUDOT</footer><script>
'use strict';

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function stop(){cleanup.forEach(f=>f());cleanup=[]}
function read(key,fallback){try{const s=localStorage.getItem('ludot-'+CONFIG.id+'-'+key);return s===null?fallback:JSON.parse(s)}catch{return fallback}}

function best(n){const old=Number(read('best',0))||0;if(n>old)save('best',n);return Math.max(n,old)}

function stage(content,stats=''){app.innerHTML=`<section class="panel"><div class="toolbar"><div class="stats">${stats}</div><button id="restart">やり直す</button></div><div id="play">${content}</div><div id="notice" class="notice" role="status" aria-live="polite"></div></section>`;$('#restart').onclick=()=>{stop();launch()}}

let audioContext;function tone(freq=440,dur=.1){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.09,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+dur);o.connect(g).connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+dur)}catch{}}
function canvas(w=600,h=420){return `<canvas id="canvas" width="${w}" height="${h}" aria-label="${CONFIG.title}のプレイ画面"></canvas>`}
function loop(fn){let active=true,id,last=performance.now();function step(now){if(!active)return;const dt=Math.min((now-last)/1000,.05);last=now;fn(dt,now);if(active)id=requestAnimationFrame(step)}id=requestAnimationFrame(step);cleanup.push(()=>{active=false;cancelAnimationFrame(id)})}
function point(e,c){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}

const HOLES=Array.from({length:9},(_,i)=>({ball:[75,300],cup:[525,75],walls:i===0?[]:i%3===1?[[270,40,18,230]]:i%3===2?[[200,150,240,18]]:[[200,50,18,180],[380,220,18,100]],radius:13-i*.35}));
function mount(){let hole=0,shots=0,total=0,ball,done=false,cleared=false;stage(canvas(600,380)+'<div class="grid two"><label>方向 <span id="angle-label">−35°</span><input id="angle" type="range" min="-180" max="180" value="-35"></label><label>強さ <span id="power-label">55</span><input id="power" type="range" min="1" max="100" value="55"></label></div><div class="row controls"><button id="hit" class="primary">打つ</button><button id="next" hidden>次のホールへ</button></div>',stat('ホール','1 / 9','hole')+stat('このホール','0打','shots')+stat('合計','0打','total'));const c=$('#canvas'),ctx=c.getContext('2d');function setup(){const h=HOLES[hole];ball={x:h.ball[0],y:h.ball[1],vx:0,vy:0};shots=0;cleared=false;$('#hole').textContent=`${hole+1} / 9`;$('#shots').textContent='0打';$('#hit').disabled=false;$('#next').hidden=true;say('矢印の方向に打つよ。右が0°、上が−90°。')}setup();['angle','power'].forEach(k=>$('#'+k).oninput=()=>$('#'+k+'-label').textContent=$('#'+k).value+(k==='angle'?'°':''));$('#hit').onclick=()=>{if(done||cleared||Math.hypot(ball.vx,ball.vy)>1)return;const a=+$('#angle').value*Math.PI/180,p=+$('#power').value*5;ball.vx=Math.cos(a)*p;ball.vy=Math.sin(a)*p;shots++;total++;$('#shots').textContent=shots+'打';$('#total').textContent=total+'打';$('#hit').disabled=true};$('#next').onclick=()=>{hole++;setup()};loop(dt=>{if(done)return;const h=HOLES[hole];if(!cleared){const steps=4,s=dt/steps;for(let i=0;i<steps;i++){const ox=ball.x,oy=ball.y;ball.x+=ball.vx*s;ball.y+=ball.vy*s;for(const [x,y,w,hh] of h.walls){if(ball.x+7>x&&ball.x-7<x+w&&ball.y+7>y&&ball.y-7<y+hh){if(ox+7<=x||ox-7>=x+w){ball.x=ox;ball.vx*=-.8}else{ball.y=oy;ball.vy*=-.8}}}if(ball.x<23||ball.x>577){ball.x=clamp(ball.x,23,577);ball.vx*=-.8}if(ball.y<23||ball.y>357){ball.y=clamp(ball.y,23,357);ball.vy*=-.8}ball.vx*=Math.exp(-1.2*s);ball.vy*=Math.exp(-1.2*s);if(Math.hypot(ball.x-h.cup[0],ball.y-h.cup[1])<h.radius&&Math.hypot(ball.vx,ball.vy)<250){cleared=true;ball.vx=ball.vy=0;ball.x=h.cup[0];ball.y=h.cup[1];tone(750);if(hole===8){done=true;const prev=Number(read('record',Infinity));save('record',Math.min(prev,total));result('9ホール完走！',`合計 ${total}打。ベスト ${Math.min(prev,total)}打`)}else{$('#next').hidden=false;say(shots===1?'ホールインワン！':'カップイン！')}break}}if(!cleared&&Math.hypot(ball.vx,ball.vy)<4){ball.vx=ball.vy=0;$('#hit').disabled=false}}ctx.fillStyle='#174d45';ctx.fillRect(0,0,600,380);ctx.strokeStyle='#6aab91';ctx.lineWidth=12;ctx.strokeRect(10,10,580,360);ctx.fillStyle='#9bb3b1';h.walls.forEach(w=>ctx.fillRect(...w));circle(ctx,...h.cup,h.radius,'#071e26');label(ctx,'⚑',h.cup[0]+8,h.cup[1]-16,'#ffd18a',27);if(!cleared&&ball.vx===0&&ball.vy===0){const a=+$('#angle').value*Math.PI/180;ctx.strokeStyle='#cce9d9';ctx.setLineDash([5,5]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+Math.cos(a)*60,ball.y+Math.sin(a)*60);ctx.stroke();ctx.setLineDash([])}circle(ctx,ball.x,ball.y,7,'#f8f8e9')})}
