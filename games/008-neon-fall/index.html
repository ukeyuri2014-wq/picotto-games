<head>
<meta charset="utf-8">

<title>ネオンフォール｜無料ブラウザゲーム｜ルドット</title>

<style>
  :root{
    --bg:#131322; --panel:#1c1c33; --edge:#2c2c4d;
    --ink:#eeecfa; --sub:#a9a5cc;
    --cyan:#53e0d8; --pink:#ff5fa2; --gold:#ffd166;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(ellipse at 50% 0%,#1f1f3d 0%,var(--bg) 60%);background-color:var(--bg); color:var(--ink);
    font-family:'DotGothic16','Hiragino Kaku Gothic ProN',monospace,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:12px 10px 30px; overflow-x:hidden;
  }
  .backbar{width:min(560px,100%);margin:0 2px 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .backbar a{color:var(--sub);text-decoration:none;white-space:nowrap}
  .backbar .tools{display:flex;gap:6px}
  .backbar button{background:none;border:1px solid var(--edge);border-radius:999px;color:var(--sub);font-size:14px;padding:4px 10px;cursor:pointer;font-family:inherit;min-width:40px}
  .backbar button.off{opacity:.45}
  @media (hover:hover){
    .backbar a:hover{color:var(--cyan)}
    .backbar button:hover{color:var(--cyan);border-color:var(--cyan)}
    #overlay button:hover{filter:brightness(1.12)}
  }
  .backbar a:focus-visible{color:var(--cyan);outline:none}
  header{width:min(560px,100%);display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 2px 8px}
  h1{font-size:24px;margin:0;letter-spacing:2px;color:var(--cyan);text-shadow:0 0 12px rgba(83,224,216,.5);font-weight:400}
  .age-badge{display:inline-flex;padding:4px 10px;border:1px solid rgba(83,224,216,.35);border-radius:999px;color:var(--cyan);background:rgba(83,224,216,.08);font-size:11px;letter-spacing:1px;white-space:nowrap}
  #layout{display:flex;gap:10px;align-items:flex-start;justify-content:center;width:min(560px,100%)}
  #boardwrap{position:relative;flex:0 1 auto}
  canvas{display:block;background:#10101f;border:2px solid var(--edge);border-radius:6px;touch-action:none}
  #board{width:min(300px,56vw,calc((100vh - 200px) / 2));height:auto;box-shadow:0 0 24px rgba(83,224,216,.12)}
  #side{display:flex;flex-direction:column;gap:8px;min-width:118px}
  .box{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:6px 10px;font-size:13px}
  .box .label{color:var(--sub);font-size:12px;letter-spacing:1px}
  .box .val{font-size:20px;color:var(--gold)}
  .box .val small{font-size:12px;color:var(--sub)}
  .mini{width:84px;height:64px;border-radius:6px}
  #holdBox.used canvas{opacity:.35}
  #overlay{
    position:absolute;inset:0;display:none;flex-direction:column;gap:7px;
    align-items:center;justify-content:center;background:rgba(19,19,34,.9);
    border-radius:6px;text-align:center;padding:8px;
  }
  #overlay.show{display:flex}
  #overlay .big{font-size:28px;letter-spacing:3px;color:var(--pink);text-shadow:0 0 16px rgba(255,95,162,.6)}
  #overlay .big.title{color:var(--cyan);text-shadow:0 0 16px rgba(83,224,216,.6)}
  #overlay .big.good{color:var(--gold);text-shadow:0 0 16px rgba(255,209,102,.6)}
  #overlay .note{font-size:14px;color:var(--ink);line-height:1.5}
  #overlay button{
    font-family:inherit;font-size:16px;background:var(--cyan);color:#00201e;
    border:none;border-radius:8px;padding:9px 12px;cursor:pointer;letter-spacing:1px;width:min(190px,100%);
  }
  #overlay button.alt{background:var(--panel);color:var(--ink);border:1px solid var(--edge)}
  #overlay button.pk{background:var(--pink);color:#2a0014}
  #overlay button.gd{background:var(--gold);color:#2a1d00}
  #overlay .mode small{display:block;font-size:12px;opacity:.85;letter-spacing:0}
  .stagepick{display:flex;align-items:center;gap:4px;width:min(200px,100%)}
  .stagepick button.arrow{width:34px !important;flex:0 0 34px;padding:12px 0 !important;background:var(--panel) !important;color:var(--ink) !important;border:1px solid var(--edge) !important}
  .stagepick .mode{flex:1;min-width:0;white-space:nowrap;padding:9px 4px}
  #pads{display:flex;gap:6px;justify-content:center;margin-top:10px;width:min(560px,100%)}
  #pads button{
    flex:1;max-width:84px;font-family:inherit;font-size:26px;padding:10px 0;line-height:1.1;
    background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:10px;cursor:pointer;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #pads button svg{display:block;margin:0 auto}
  #pads button small{display:block;font-size:11px;color:var(--sub)}
  #pads button:active,#pads button.on{background:#26264a;border-color:var(--cyan)}
  .help{width:min(560px,100%);color:var(--sub);font-size:13px;margin-top:10px;line-height:1.7}
  @media (max-width:430px){
    #side{min-width:92px;gap:6px} .box{padding:5px 8px} .box .val{font-size:16px}
    .mini{width:72px;height:54px}
    h1{font-size:21px}
  }
</style>

<body>

<div class="backbar"><a href="../../index.html">← いちらんへ</a><span class="tools"><button id="bgm-btn" aria-label="BGMのオンオフ">🎵</button><button id="pause-btn" aria-label="いちじていし">⏸</button><button id="mute-btn" aria-label="おとのオンオフ">🔊</button></span></div>

<header>
  <h1>ネオンフォール</h1>

<div id="layout">
  <div id="boardwrap">

  <div id="side">

<div id="pads">
  <button id="pHold" aria-label="ホールド">⇄<small>ホールド</small></button>

  <button id="pDown" aria-label="した">▼</button>

  <button id="pRight" aria-label="みぎ">▶</button>

<div class="help">
  そうさ：←→でうごかす / ↑かZ・Xでかいてん / ↓でちょっとおとす / スペースでいっきにおとす / CかShiftでホールド / Pでいちじていし。<br>
  スマホ：ばんめんをタップでかいてん、ヨコにスライドでうごかす、したにシュッとはらうといっきにおとす、うえにはらうとホールド。<br>
  モードは3つ：ずっとあそべる「エンドレス」、しょうがいブロックをこえる「ステージ」（全15ステージ）、40ラインをはやくけす「40ライン」。
</div>

<script>
(() => {
  const COLS = 10, ROWS = 20, CELL = 30;
  const cv = document.getElementById('board'), ctx = cv.getContext('2d');
  const ncv = document.getElementById('next'), nctx = ncv.getContext('2d');
  const hcv = document.getElementById('hold'), hctx = hcv.getContext('2d');
  const BEST_KEY = 'picotto_neonfall_best';          // 既存キー（エンドレスのベストスコア）
  const STAGE_KEY = 'ludot_neonfall_stage';          // 新キー：到達ステージ
  const SPRINT_KEY = 'ludot_neonfall_40l';           // 新キー：40ラインのベストタイム(秒)
  const BGM_KEY = 'ludot_neonfall_bgm';
  const MAX_STAGE = 15;
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // ---- sound -------------------------------------------------------------
  let muted = ls.get('picotto_neonfall_mute') === '1';
  let bgmOn = ls.get(BGM_KEY) !== '0';
  let ac = null;
  function audio() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  function beep(freq, dur = 0.06, type = 'square', gain = 0.04, slide = 0, when = 0) {
    if (muted) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + when;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function arp(notes, step = 0.06, type = 'triangle', gain = 0.05) {
    notes.forEach((f, i) => beep(f, step * 1.6, type, gain, 0, i * step));
  }
  // BGM：シンプルなチップチューン（先読みスケジューラ）
  const N = n => 440 * Math.pow(2, (n - 69) / 12);
  const MEL = [76,null,79,76, 74,null,72,74, 76,null,72,null, 69,null,null,null,
               72,null,76,79, 81,null,79,76, 74,null,76,72, 74,null,null,null];
  const BASS = [45,45,52,52, 43,43,50,50, 41,41,48,48, 40,40,47,47];
  let bgmStep = 0, bgmNext = 0;
  function bgmTick() {
    if (muted || !bgmOn || over || paused || !ac || ac.state !== 'running') { if (ac) bgmNext = ac.currentTime + 0.05; return; }
    const tempo = Math.max(0.105, 0.16 - (level - 1) * 0.005);
    if (bgmNext < ac.currentTime) bgmNext = ac.currentTime + 0.05;
    while (bgmNext < ac.currentTime + 0.25) {
      const w = bgmNext - ac.currentTime;
      const m = MEL[bgmStep % MEL.length];
      if (m) beep(N(m), tempo * 1.4, 'square', 0.014, 0, w);
      if (bgmStep % 2 === 0) beep(N(BASS[(bgmStep / 2) % BASS.length]), tempo * 1.8, 'triangle', 0.035, 0, w);
      bgmStep++; bgmNext += tempo;
    }
  }
  setInterval(bgmTick, 60);

  const muteBtn = document.getElementById('mute-btn');
  const bgmBtn = document.getElementById('bgm-btn');
  const pauseBtn = document.getElementById('pause-btn');
  function syncMute() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
    bgmBtn.classList.toggle('off', !bgmOn || muted);
  }
  muteBtn.addEventListener('click', () => {
    muted = !muted; ls.set('picotto_neonfall_mute', muted ? '1' : '0'); syncMute();
    muteBtn.blur();
  });
  bgmBtn.addEventListener('click', () => {
    bgmOn = !bgmOn; ls.set(BGM_KEY, bgmOn ? '1' : '0'); audio(); syncMute(); bgmBtn.blur();
  });
  pauseBtn.addEventListener('click', () => { togglePause(); pauseBtn.blur(); });
  syncMute();

  // ---- pieces --------------------------------------------------------------
  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
  };
  const COLORS = {
    I: '#53e0d8', O: '#ffd166', T: '#b06bff', S: '#6ee77a',
    Z: '#ff5fa2', J: '#5f8dff', L: '#ff9a4d',
  };
  const GARBAGE = '#4d4f73';
  const SIZE = { I: 4, O: 4, T: 3, S: 3, Z: 3, J: 3, L: 3 };

  // ---- state -----------------------------------------------------------------
  let grid, cur, next, hold = null, holdUsed = false, bag = [];
  let score = 0, lines = 0, level = 1, combo = -1;
  let best = +(ls.get(BEST_KEY) || 0);
  let stageMax = Math.min(MAX_STAGE, Math.max(1, +(ls.get(STAGE_KEY) || 1)));
  let sprintBest = +(ls.get(SPRINT_KEY) || 0);
  let mode = 'endless', stage = 1, stageGoal = 0;
  let over = true, paused = false, started = false;
  let dropTimer = 0, lockTimer = -1, lockResets = 0;
  let clearing = null;   // {rows:[..], t}
  let simTime = 0, playTime = 0;
  let pickStage = stageMax;
  // effects
  const parts = [], popups = [];
  let shake = 0, flash = 0, dropTrail = null;

  function speedMs() {
    const table = [800, 700, 610, 520, 440, 360, 290, 220, 160, 120, 90];
    return table[Math.min(level - 1, table.length - 1)];
  }
  function bagNext() {
    if (!bag.length) {
      bag = Object.keys(SHAPES).slice();
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
    }
    return bag.pop();
  }
  function newPiece(kind) {
    const cells = SHAPES[kind].map(c => c.slice());
    return { kind, cells, x: 3, y: -1, size: SIZE[kind] };
  }
  function eachCell(p, fn) { for (const [cx, cy] of p.cells) fn(p.x + cx, p.y + cy); }
  function collides(p, dx = 0, dy = 0, cells = p.cells) {
    for (const [cx, cy] of cells) {
      const x = p.x + cx + dx, y = p.y + cy + dy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }
  function rotated(p) {
    if (p.kind === 'O') return p.cells;
    const n = p.size;
    return p.cells.map(([x, y]) => [n - 1 - y, x]);
  }
  function tryRotate() {
    const cells = rotated(cur);
    for (const [dx, dy] of [[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1]]) {
      if (!collides(cur, dx, dy, cells)) {
        cur.cells = cells; cur.x += dx; cur.y += dy;
        resetLock(); beep(520, 0.05, 'square', 0.03);
        return true;
      }
    }
    return false;
  }
  function tryMove(dx, dy) {
    if (collides(cur, dx, dy)) return false;
    cur.x += dx; cur.y += dy;
    if (dx) { resetLock(); beep(260, 0.03, 'square', 0.02); }
    return true;
  }
  function resetLock() {
    if (lockTimer >= 0 && lockResets < 12) { lockTimer = 0; lockResets++; }
  }
  function ghostY() {
    let dy = 0;
    while (!collides(cur, 0, dy + 1)) dy++;
    return cur.y + dy;
  }
  function hardDrop() {
    if (over || paused || clearing) return;
    const from = cur.y, to = ghostY();
    const xs = cur.cells.map(c => cur.x + c[0]);
    dropTrail = { x0: Math.min(...xs), x1: Math.max(...xs) + 1, y0: from, y1: to, t: 0.18, color: COLORS[cur.kind] };
    score += (to - from) * 2;
    cur.y = to;
    beep(140, 0.08, 'square', 0.05);
    shake = Math.max(shake, 3);
    lockNow();
  }
  function doHold() {
    if (over || paused || clearing || holdUsed) return;
    const k = cur.kind;
    if (hold) { cur = newPiece(hold); } else { cur = next; next = newPiece(bagNext()); drawNext(); }
    hold = k; holdUsed = true;
    lockTimer = -1; lockResets = 0; dropTimer = 0;
    beep(420, 0.05, 'triangle', 0.04, 200);
    drawHold();
    if (collides(cur, 0, 0)) gameOver();
  }
  function lockNow() {
    eachCell(cur, (x, y) => { if (y >= 0) grid[y][x] = COLORS[cur.kind]; });
    let topOut = false;
    eachCell(cur, (x, y) => { if (y < 0) topOut = true; });
    lockTimer = -1; lockResets = 0;
    const full = [];
    for (let y = 0; y < ROWS; y++) if (grid[y].every(v => v)) full.push(y);
    if (full.length) {
      clearing = { rows: full, t: 0 };
      for (const y of full) for (let x = 0; x < COLS; x++) burst(x, y, grid[y][x], 3);
      const pitch = [0, 660, 740, 880, 1040][full.length];
      arp([pitch, pitch * 1.26, pitch * 1.5].slice(0, Math.max(2, full.length)), 0.05, 'triangle', 0.06);
      if (full.length >= 3) shake = Math.max(shake, full.length * 3);
      flash = full.length >= 4 ? 0.5 : 0.15;
    } else {
      combo = -1;
      beep(90, 0.05, 'triangle', 0.04);
      if (topOut) { gameOver(); return; }
      spawn();
    }
  }
  function burst(cx, cy, color, n) {
    for (let i = 0; i < n; i++) {
      parts.push({
        x: (cx + 0.5) * CELL, y: (cy + 0.5) * CELL,
        vx: (Math.random() - 0.5) * 380, vy: -Math.random() * 300 - 40,
        life: 0.6 + Math.random() * 0.4, max: 1, c: color || '#fff', s: 3 + Math.random() * 4,
      });
    }
  }
  function popup(text, color = '#ffd166', size = 30, y = 260) {
    popups.push({ text, color, size, y, t: 0, life: 1.3 });
  }
  function finishClear() {
    const rows = clearing.rows;
    clearing = null;
    for (const y of rows) { grid.splice(y, 1); grid.unshift(Array(COLS).fill(null)); }
    const n = rows.length;
    lines += n;
    combo++;
    let gained = [0, 100, 300, 500, 800][n] * level;
    if (combo > 0) gained += 50 * combo * level;
    const perfect = grid.every(r => r.every(v => !v));
    if (perfect) gained += 2000 * level;
    score += gained;
    const names = ['', 'シングル', 'ダブル!', 'トリプル!!', 'ネオン4!!!'];
    const colors = ['', '#eeecfa', '#53e0d8', '#b06bff', '#ffd166'];
    popup(names[n], colors[n], n >= 4 ? 40 : 28 + n * 2);
    popups.push({ text: '+' + gained, color: '#ffd166', size: 20, y: 300, t: 0, life: 1.1 });
    if (combo > 0) popups.push({ text: combo + 'れんさ!', color: '#ff5fa2', size: 22, y: 220, t: 0, life: 1.2 });
    if (perfect) { popup('ぜんぶけし!', '#6ee77a', 34, 180); arp([523, 659, 784, 1047, 1319], 0.07, 'square', 0.05); }
    if (mode !== 'stage') {
      const nl = Math.floor(lines / 10) + 1;
      if (nl > level) {
        level = nl;
        popups.push({ text: 'レベル ' + level + '!', color: '#53e0d8', size: 26, y: 140, t: 0, life: 1.4 });
        arp([523, 659, 784, 1047], 0.08, 'square', 0.04);
      }
    }
    updateHud();
    if (mode === 'sprint' && lines >= 40) { finishSprint(); return; }
    if (mode === 'stage' && lines >= stageGoal) { finishStage(); return; }
    spawn();
  }
  function spawn() {
    cur = next || newPiece(bagNext());
    next = newPiece(bagNext());
    holdUsed = false;
    drawNext(); drawHold();
    dropTimer = 0;
    if (collides(cur, 0, 0)) gameOver();
  }
  function fmtTime(t) {
    const m = Math.floor(t / 60), s = t - m * 60;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }
  function gameOver() {
    over = true;
    beep(220, 0.4, 'sawtooth', 0.05, -160);
    shake = 8;
    let note;
    if (mode === 'endless') {
      const record = score > best;
      if (record) { best = score; ls.set(BEST_KEY, best); }
      note = `スコア ${score}<br>ライン ${lines}` + (record ? '<br>✨しんきろく!' : '');
    } else if (mode === 'stage') {
      note = `ステージ${stage}<br>あと ${Math.max(0, stageGoal - lines)} ライン だった!`;
    } else {
      note = `${lines} / 40 ライン<br>またチャレンジしよう!`;
    }
    updateHud();
    showOverlay('GAME OVER', note, [
      { t: 'もういちど', cls: 'pk', fn: () => start(mode, stage) },
      { t: 'モードをえらぶ', cls: 'alt', fn: showTitle },
    ]);
  }
  function finishStage() {
    over = true;
    const cleared = stage;
    if (cleared >= stageMax && cleared < MAX_STAGE) { stageMax = cleared + 1; ls.set(STAGE_KEY, stageMax); }
    pickStage = Math.min(MAX_STAGE, cleared + 1);
    updateHud();
    arp([523, 659, 784, 1047, 784, 1047, 1319], 0.09, 'square', 0.05);
    for (let i = 0; i < 40; i++) burst(Math.random() * COLS, Math.random() * 6 + 4, Object.values(COLORS)[i % 7], 1);
    if (cleared >= MAX_STAGE) {
      showOverlay('ALL CLEAR!', `ぜんぶのステージをクリア!<br>スコア ${score}<br>すごい!!`, [
        { t: 'モードをえらぶ', cls: '', fn: showTitle },
      ], 'good');
    } else {
      showOverlay('STAGE CLEAR!', `ステージ${cleared} クリア!<br>スコア ${score}`, [
        { t: `つぎへ（ステージ${cleared + 1}）`, cls: 'gd', fn: () => start('stage', cleared + 1) },
        { t: 'モードをえらぶ', cls: 'alt', fn: showTitle },
      ], 'good');
    }
  }
  function finishSprint() {
    over = true;
    const t = playTime;
    const record = !sprintBest || t < sprintBest;
    if (record) { sprintBest = +t.toFixed(1); ls.set(SPRINT_KEY, sprintBest); }
    arp([523, 659, 784, 1047, 1319], 0.08, 'square', 0.05);
    showOverlay('40ライン!', `タイム ${fmtTime(t)}` + (record ? '<br>✨しんきろく!' : `<br>ベスト ${fmtTime(sprintBest)}`), [
      { t: 'もういちど', cls: 'gd', fn: () => start('sprint') },
      { t: 'モードをえらぶ', cls: 'alt', fn: showTitle },
    ], 'good');
  }
  function updateHud() {
    document.getElementById('score').textContent = score;
    const L = document.getElementById('lines'), LL = document.getElementById('linesLabel');
    const V = document.getElementById('level'), VL = document.getElementById('levelLabel');
    const B = document.getElementById('best'), BL = document.getElementById('bestLabel');
    if (mode === 'stage') {
      LL.textContent = 'のこり'; L.innerHTML = Math.max(0, stageGoal - lines) + '<small> ライン</small>';
      VL.textContent = 'ステージ'; V.textContent = stage;
      BL.textContent = 'とうたつ'; B.textContent = stageMax;
    } else if (mode === 'sprint') {
      LL.textContent = 'ライン'; L.innerHTML = lines + '<small>/40</small>';
      VL.textContent = 'タイム'; V.textContent = fmtTime(playTime);
      BL.textContent = 'ベスト'; B.textContent = sprintBest ? fmtTime(sprintBest) : '-';
    } else {
      LL.textContent = 'ライン'; L.textContent = lines;
      VL.textContent = 'レベル'; V.textContent = level;
      BL.textContent = 'ベスト'; B.textContent = best;
    }
  }
  function addGarbage(rowsN) {
    let lastHole = -1;
    for (let i = 0; i < rowsN; i++) {
      let hole;
      do { hole = Math.floor(Math.random() * COLS); } while (hole === lastHole);
      lastHole = hole;
      const row = Array(COLS).fill(GARBAGE); row[hole] = null;
      // ときどき穴を2つにして子どもでも消しやすく
      if (i % 3 === 2) row[(hole + 5) % COLS] = null;
      grid[ROWS - 1 - i] = row;
    }
  }
  function start(m = mode, st = stage) {
    mode = m;
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    score = 0; lines = 0; combo = -1; over = false; paused = false; started = true;
    bag = []; next = null; hold = null; holdUsed = false; clearing = null; playTime = 0;
    parts.length = 0; popups.length = 0;
    if (mode === 'stage') {
      stage = Math.max(1, Math.min(MAX_STAGE, st));
      level = Math.min(11, 1 + Math.floor((stage - 1) * 0.7));
      stageGoal = 5 + stage;
      addGarbage(Math.min(9, Math.ceil(stage * 0.6)));
      popup('ステージ ' + stage, '#53e0d8', 32, 240);
      popups.push({ text: stageGoal + 'ライン けそう!', color: '#eeecfa', size: 20, y: 285, t: 0, life: 1.6 });
    } else {
      level = 1;
      popup(mode === 'sprint' ? '40ライン スタート!' : 'スタート!', '#53e0d8', 28, 260);
    }
    overlay.classList.remove('show');
    audio();
    bgmStep = 0;
    updateHud();
    spawn();
  }
  function togglePause(force) {
    if (over || !started) return;
    paused = force !== undefined ? force : !paused;
    Object.keys(held).forEach(k => delete held[k]);
    pauseBtn.textContent = paused ? '▶' : '⏸';
    if (paused) {
      showOverlay('ひとやすみ', 'いちじていし中', [
        { t: 'つづける', cls: '', fn: () => togglePause(false) },
        { t: 'やめてモードをえらぶ', cls: 'alt', fn: () => { paused = false; over = true; pauseBtn.textContent = '⏸'; showTitle(); } },
      ], 'title');
    } else overlay.classList.remove('show');
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && !over && !paused) togglePause(true); });

  const overlay = document.getElementById('overlay');
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function showOverlay(bigText, note, buttons, bigCls = '') {
    overlay.replaceChildren();
    overlay.append(el('div', 'big ' + bigCls, bigText), el('div', 'note', note));
    for (const b of buttons) {
      const bt = el('button', b.cls, b.t);
      bt.addEventListener('click', b.fn);
      overlay.append(bt);
    }
    overlay.classList.add('show');
  }
  function showTitle() {
    over = true; started = false;
    overlay.replaceChildren();
    overlay.append(el('div', 'big title', 'NEON FALL'), el('div', 'note', 'ブロックをそろえて<br>ヨコ1れつでけす！'));
    const b1 = el('button', 'mode', 'エンドレス<small>ベスト ' + best + '</small>');
    b1.id = 'startBtn';
    b1.addEventListener('click', () => start('endless'));
    const row = el('div', 'stagepick');
    const lft = el('button', 'arrow', '◀'), rgt = el('button', 'arrow', '▶');
    lft.setAttribute('aria-label', 'まえのステージ'); rgt.setAttribute('aria-label', 'つぎのステージ');
    const b2 = el('button', 'mode pk');
    b2.id = 'stageBtn';
    const syncStage = () => { b2.innerHTML = 'ステージ ' + pickStage + '<small>' + (5 + pickStage) + 'ラインけす</small>'; };
    syncStage();
    lft.addEventListener('click', () => { pickStage = Math.max(1, pickStage - 1); syncStage(); beep(300, 0.03); });
    rgt.addEventListener('click', () => { pickStage = Math.min(stageMax, pickStage + 1); syncStage(); beep(360, 0.03); });
    b2.addEventListener('click', () => start('stage', pickStage));
    row.append(lft, b2, rgt);
    const b3 = el('button', 'mode gd', '40ライン<small>' + (sprintBest ? 'ベスト ' + fmtTime(sprintBest) : 'タイムアタック') + '</small>');
    b3.id = 'sprintBtn';
    b3.addEventListener('click', () => start('sprint'));
    overlay.append(b1, row, b3);
    overlay.classList.add('show');
    grid = null; cur = null; next = null; hold = null;
    drawNext(); drawHold();
  }

  // ---- input ---------------------------------------------------------------
  const held = {};
  function press(action) {
    if (over || paused || clearing) return;
    if (action === 'left') tryMove(-1, 0);
    else if (action === 'right') tryMove(1, 0);
    else if (action === 'down') { if (tryMove(0, 1)) { dropTimer = 0; score += 1; } }
    else if (action === 'rot') tryRotate();
    else if (action === 'drop') hardDrop();
    else if (action === 'hold') doHold();
  }
  const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down', ArrowUp: 'rot',
                   KeyX: 'rot', Space: 'drop', KeyZ: 'rot', KeyC: 'hold', ShiftLeft: 'hold', ShiftRight: 'hold' };
  document.addEventListener('keydown', e => {
    if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); togglePause(); return; }
    if ((e.code === 'Enter' || e.code === 'Space') && overlay.classList.contains('show')) {
      const b = overlay.querySelector('button:not(.arrow)');
      if (b && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); b.click(); }
      return;
    }
    const a = KEYMAP[e.code];
    if (!a) return;
    e.preventDefault();
    if (held[a]) return;
    held[a] = { das: 0 };
    press(a);
  });
  document.addEventListener('keyup', e => {
    if (KEYMAP[e.code]) delete held[KEYMAP[e.code]];
  });
  // key auto-repeat (DAS 170ms, then 45ms; down repeats at 45ms)
  function repeatHeld(dt) {
    for (const a of ['left', 'right', 'down']) {
      const h = held[a];
      if (!h) continue;
      h.das += dt * 1000;
      const das = a === 'down' ? 45 : 170;
      while (h.das > das) { h.das -= 45; press(a); }
    }
  }
  // pad buttons (hold to repeat)
  const padMap = { pLeft: 'left', pRight: 'right', pDown: 'down', pRot: 'rot', pDrop: 'drop', pHold: 'hold' };
  for (const [id, a] of Object.entries(padMap)) {
    const b = document.getElementById(id);
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {}
      b.classList.add('on');
      press(a);
      if (a === 'left' || a === 'right' || a === 'down') held[a] = { das: 0 };
    });
    const stop = () => { delete held[a]; b.classList.remove('on'); };
    b.addEventListener('pointerup', stop);
    b.addEventListener('pointercancel', stop);
    b.addEventListener('lostpointercapture', stop);
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
  // ばんめんのスワイプ操作（タップ=かいてん / ヨコ=いどう / した=ソフト・はらうとハード / うえにはらう=ホールド）
  let sw = null;
  cv.addEventListener('pointerdown', e => {
    if (over || paused) return;
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    sw = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, t0: performance.now(), moved: false, soft: 0, lastY: e.clientY, lastT: performance.now(), vy: 0 };
  });
  cv.addEventListener('pointermove', e => {
    if (!sw || e.pointerId !== sw.id || over || paused) return;
    const cellPx = cv.getBoundingClientRect().width / COLS;
    const dx = e.clientX - sw.lx;
    if (Math.abs(dx) >= cellPx * 0.9) {
      const steps = Math.trunc(dx / (cellPx * 0.9));
      for (let i = 0; i < Math.abs(steps); i++) press(steps > 0 ? 'right' : 'left');
      sw.lx += steps * cellPx * 0.9; sw.moved = true;
    }
    const dy = e.clientY - sw.ly;
    if (dy >= cellPx * 1.1 && Math.abs(e.clientX - sw.x0) < Math.abs(e.clientY - sw.y0)) {
      const steps = Math.floor(dy / (cellPx * 1.1));
      for (let i = 0; i < steps; i++) press('down');
      sw.ly += steps * cellPx * 1.1; sw.moved = true;
    }
    const now = performance.now();
    const dtm = now - sw.lastT;
    if (dtm > 0) sw.vy = sw.vy * 0.5 + ((e.clientY - sw.lastY) / dtm) * 0.5;
    sw.lastY = e.clientY; sw.lastT = now;
  });
  function endSwipe(e) {
    if (!sw || e.pointerId !== sw.id) return;
    const dt = performance.now() - sw.t0;
    const tx = e.clientX - sw.x0, ty = e.clientY - sw.y0;
    const dist = Math.hypot(tx, ty);
    if (!over && !paused) {
      if (ty > 40 && sw.vy > 0.9 && Math.abs(ty) > Math.abs(tx) * 1.5) press('drop');
      else if (ty < -40 && dt < 400 && Math.abs(ty) > Math.abs(tx) * 1.5) press('hold');
      else if (!sw.moved && dist < 14 && dt < 350) press('rot');
    }
    sw = null;
  }
  cv.addEventListener('pointerup', endSwipe);
  cv.addEventListener('pointercancel', e => { sw = null; });

  // ---- draw ------------------------------------------------------------------
  function block(c, x, y, color, size = CELL) {
    c.fillStyle = color;
    c.fillRect(x + 1, y + 1, size - 2, size - 2);
    c.fillStyle = 'rgba(255,255,255,.28)';
    c.fillRect(x + 1, y + 1, size - 2, Math.max(2, size * 0.14));
    c.fillStyle = 'rgba(0,0,0,.25)';
    c.fillRect(x + 1, y + size - size * 0.2, size - 2, size * 0.17);
  }
  function draw(dt) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    // grid dots
    ctx.fillStyle = 'rgba(157,153,192,.14)';
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
      ctx.fillRect(x * CELL + CELL / 2, y * CELL + CELL / 2, 2, 2);
    // stage goal / sprint line bar
    if (grid && started && mode !== 'endless') {
      const goal = mode === 'stage' ? stageGoal : 40;
      const r = Math.min(1, lines / goal);
      ctx.fillStyle = 'rgba(83,224,216,.18)'; ctx.fillRect(0, 0, 4, cv.height);
      ctx.fillStyle = '#53e0d8'; ctx.fillRect(0, cv.height * (1 - r), 4, cv.height * r);
    }
    if (grid) {
      ctx.shadowColor = 'rgba(83,224,216,.0)';
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
        if (grid[y][x]) block(ctx, x * CELL, y * CELL, grid[y][x]);
      // danger glow
      let top = ROWS;
      for (let y = 0; y < ROWS; y++) if (grid[y].some(v => v)) { top = y; break; }
      if (top < 5 && !over) {
        ctx.fillStyle = `rgba(255,95,162,${0.1 + 0.08 * Math.sin(simTime * 8)})`;
        ctx.fillRect(0, 0, cv.width, CELL * 3);
      }
    }
    if (clearing) {
      const a = Math.sin(clearing.t * 40) > 0 ? 0.85 : 0.35;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      const w = cv.width * Math.min(1, 1 - clearing.t / 0.3 + 0.2);
      for (const y of clearing.rows) ctx.fillRect((cv.width - w) / 2, y * CELL, w, CELL);
    } else if (!over && cur && grid) {
      const gy = ghostY();
      ctx.globalAlpha = 0.24;
      eachCell({ ...cur, y: gy }, (x, y) => { if (y >= 0) block(ctx, x * CELL, y * CELL, COLORS[cur.kind]); });
      ctx.globalAlpha = 1;
      // ゴーストの外枠
      ctx.strokeStyle = COLORS[cur.kind]; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
      eachCell({ ...cur, y: gy }, (x, y) => { if (y >= 0) ctx.strokeRect(x * CELL + 1.5, y * CELL + 1.5, CELL - 3, CELL - 3); });
      ctx.globalAlpha = 1;
      ctx.shadowColor = COLORS[cur.kind]; ctx.shadowBlur = 12;
      eachCell(cur, (x, y) => { if (y >= 0) block(ctx, x * CELL, y * CELL, COLORS[cur.kind]); });
      ctx.shadowBlur = 0;
    }
    // hard drop trail
    if (dropTrail) {
      const g = ctx.createLinearGradient(0, dropTrail.y0 * CELL, 0, (dropTrail.y1 + 1) * CELL);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, dropTrail.color);
      ctx.globalAlpha = dropTrail.t / 0.18 * 0.5;
      ctx.fillStyle = g;
      ctx.fillRect(dropTrail.x0 * CELL, Math.max(0, dropTrail.y0) * CELL, (dropTrail.x1 - dropTrail.x0) * CELL, (dropTrail.y1 - Math.max(0, dropTrail.y0) + 1) * CELL);
      ctx.globalAlpha = 1;
    }
    // particles
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;
    // popups
    ctx.textAlign = 'center';
    for (const p of popups) {
      const k = p.t / p.life;
      const sc = k < 0.12 ? 0.6 + k / 0.12 * 0.5 : 1.1 - Math.min(0.1, (k - 0.12));
      ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
      ctx.font = `${Math.round(p.size * sc)}px DotGothic16, sans-serif`;
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(10,10,25,.85)';
      const y = p.y - k * 30;
      ctx.strokeText(p.text, cv.width / 2, y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, cv.width / 2, y);
    }
    ctx.globalAlpha = 1;
    if (flash > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  }
  function drawMini(c, cvs, kind) {
    c.clearRect(0, 0, cvs.width, cvs.height);
    if (!kind) return;
    const s = 16;
    const cells = SHAPES[kind];
    const xs = cells.map(q => q[0]), ys = cells.map(q => q[1]);
    const w = (Math.max(...xs) - Math.min(...xs) + 1) * s;
    const h = (Math.max(...ys) - Math.min(...ys) + 1) * s;
    const ox = (cvs.width - w) / 2 - Math.min(...xs) * s;
    const oy = (cvs.height - h) / 2 - Math.min(...ys) * s;
    for (const [x, y] of cells) block(c, ox + x * s, oy + y * s, COLORS[kind], s);
  }
  function drawNext() { drawMini(nctx, ncv, next && next.kind); }
  function drawHold() {
    drawMini(hctx, hcv, hold);
    document.getElementById('holdBox').classList.toggle('used', holdUsed);
  }

  // ---- loop -------------------------------------------------------------------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    step(dt);
    fx(dt);
    draw(dt);
    requestAnimationFrame(loop);
  }
  function fx(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.life -= dt * 1.2;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) { popups[i].t += dt; if (popups[i].t > popups[i].life) popups.splice(i, 1); }
    shake = Math.max(0, shake - dt * 30);
    flash = Math.max(0, flash - dt * 2);
    if (dropTrail) { dropTrail.t -= dt; if (dropTrail.t <= 0) dropTrail = null; }
  }
  let hudT = 0;
  function step(dt) {
    if (over || paused) return;
    simTime += dt;
    playTime += dt;
    if (mode === 'sprint') { hudT += dt; if (hudT > 0.1) { hudT = 0; document.getElementById('level').textContent = fmtTime(playTime); } }
    if (clearing) {
      clearing.t += dt;
      if (clearing.t > 0.3) finishClear();
      return;
    }
    repeatHeld(dt);
    // gravity
    dropTimer += dt * 1000;
    const ms = held.down ? 45 : speedMs();
    while (dropTimer > ms) {
      dropTimer -= ms;
      if (!tryMove(0, 1)) {
        if (lockTimer < 0) lockTimer = 0;
        break;
      } else { lockTimer = -1; if (held.down) score += 1; }
    }
    // lock delay
    if (lockTimer >= 0) {
      if (collides(cur, 0, 1)) {
        lockTimer += dt * 1000;
        if (lockTimer > 450) lockNow();
      } else lockTimer = -1;
    }
  }
  showTitle();
  updateHud();
  requestAnimationFrame(loop);

  // test hook (headless-friendly): step simulation manually and inspect state
  window.__test = {
    start, press, hardDrop, doHold, togglePause, showTitle, gameOver,
    step: ms => step(ms / 1000),
    state: () => ({ over, paused, mode, stage, stageGoal, stageMax, score, lines, level, best, sprintBest, hold, holdUsed, grid, cur: cur && { kind: cur.kind, x: cur.x, y: cur.y }, clearing: !!clearing }),
    setPiece: kind => { cur = newPiece(kind); },
    fillRow: (y, gap) => { for (let x = 0; x < COLS; x++) grid[y][x] = x === gap ? null : '#888'; },
    setLines: n => { lines = n; },
    setScore: n => { score = n; },
  };
})();
</script>
