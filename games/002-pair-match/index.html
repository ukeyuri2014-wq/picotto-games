<style>

  .topbar a, .topbar button.mute {
    color: #53e0d8;

    border: 1px solid #2c2c4d;

  .topbar h1 {

    color: transparent;

    white-space: nowrap;

  .stage {
    position: relative;

    background: #191930;
    border: 1px solid #2c2c4d;
    border-radius: 20px;

    align-items: center;
    gap: 6px;

  .chip {
    background: rgba(19, 19, 34, 0.85);
    border: 1px solid #2c2c4d;

    font-size: 0.95rem;

  .chip.time { color: #53e0d8; }

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .board.cols5 { grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .board.cols6 { grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .card {
    aspect-ratio: 1;
    position: relative;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .card-inner {
    position: absolute;
    inset: 0;
  }
  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
  }
  .board.cols6 .face { border-radius: 10px; }
  /* 2Dフリップ（横につぶれて→ひろがる）。3D変形なしで全ブラウザ対応 */
  .face.front {
    background:
      radial-gradient(circle at 20% 20%, rgba(199, 125, 255, 0.18) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(83, 224, 216, 0.15) 0%, transparent 40%),
      radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.5px),
      linear-gradient(150deg, #232345, #1b1b38);
    background-size: auto, auto, 12px 12px, auto;
    border: 1px solid #363063;
    color: #8f88c9;
    font-family: "Mochiy Pop One", sans-serif;
    font-size: 1.5rem;
    transform: scaleX(1);
    transition: transform 0.16s ease 0.16s;
    text-shadow: 0 0 10px rgba(199, 125, 255, 0.5);
  }
  .board.cols6 .face.front { font-size: 1.1rem; }
  .face.front::before, .face.front::after {
    content: "✦";
    position: absolute;
    font-size: 0.7rem;
    color: #53e0d8;
    opacity: 0.7;
  }
  .face.front::before { top: 5px; left: 7px; }
  .face.front::after { bottom: 5px; right: 7px; color: #ff5fa2; }
  .board.cols6 .face.front::before, .board.cols6 .face.front::after { display: none; }
  .card.open .face.front {
    transform: scaleX(0);
    transition: transform 0.16s ease 0s;
  }
  .face.back {
    background: linear-gradient(150deg, #2d2250, #241f42);
    border: 1px solid #53e0d8;
    transform: scaleX(0);
    transition: transform 0.16s ease 0s;
  }
  .face.back svg { width: 72%; height: 72%; display: block; }
  .card.open .face.back {
    transform: scaleX(1);
    transition: transform 0.16s ease 0.16s;
  }
  @media (hover: hover) {
    .card:hover .face.front { border-color: #ff5fa2; }
  }
  .card:focus-visible { outline: 2px solid #53e0d8; outline-offset: 2px; border-radius: 14px; }
  .card.matched .face.back {
    border-color: #ffd166;
    box-shadow: 0 0 14px rgba(255, 209, 102, 0.5);
  }
  .card.matched .card-inner { animation: match-hop 0.5s ease; }
  @keyframes match-hop {
    0% { transform: translateY(0) scale(1); }
    35% { transform: translateY(-12px) scale(1.12) rotate(4deg); }
    65% { transform: translateY(0) scale(0.95) rotate(-2deg); }
    100% { transform: translateY(0) scale(1); }
  }
  .card.miss .card-inner { animation: miss-shake 0.36s ease; }
  @keyframes miss-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
  }
  .card.matched { cursor: default; }
  .spark {
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    animation: spark-fly 0.6s ease-out forwards;
  }
  @keyframes spark-fly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
  }
  .toast {
    position: absolute;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-size: 1.6rem;
    color: #ffd166;
    text-shadow: 0 2px 0 #131322, 0 0 18px rgba(255, 209, 102, 0.6);
    pointer-events: none;
    z-index: 6;
    white-space: nowrap;
    animation: toast 0.9s ease forwards;
  }
  @keyframes toast {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    70% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
  }
  .confetti-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 20px;
    pointer-events: none;
    z-index: 10;
  }
  .confetti-piece {
    position: absolute;
    top: -14px;
    width: 8px;
    height: 13px;
    border-radius: 2px;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(620px) rotate(660deg); opacity: 0.6; }
  }
  @media (prefers-reduced-motion: reduce) {
    .face.front, .face.back, .card.open .face.front, .card.open .face.back { transition: none; }
    .card.matched .card-inner, .card.miss .card-inner, .spark, .toast { animation: none; }
    .spark, .toast { display: none; }
    .confetti-piece { animation: none; display: none; }
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(19, 19, 34, 0.95);

    flex-direction: column;

    justify-content: center;
    text-align: center;
    padding: 16px;
    gap: 10px;
    z-index: 5;

    font-weight: 400;

    border: 2px solid #3a3470;
    background: linear-gradient(160deg, #2a2352, #1f1b3d);
    color: #eeecfa;
    font-family: inherit;
    border-radius: 16px;
    padding: 10px 4px 8px;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .lvl .ln { font-weight: 900; font-size: 1rem; }
  .lvl .ls { font-size: 0.8rem; color: #9d99c0; font-weight: 700; }
  .lvl .lstar { font-size: 0.95rem; letter-spacing: 1px; color: #ffd166; }
  .lvl.easy { border-color: #53e0d8; }
  .lvl.normal { border-color: #ff5fa2; }
  .lvl.hard { border-color: #c77dff; }

  .stars { display: flex; gap: 8px; font-size: 2.2rem; line-height: 1; }
  .stars span { opacity: 0.18; filter: grayscale(1); transform: scale(0.6); transition: transform 0.25s cubic-bezier(.3,1.8,.5,1), opacity 0.2s; }
  .stars span.on { opacity: 1; filter: none; transform: scale(1); }
  .overlay .newrec {
    font-weight: 900; font-size: 0.92rem; color: #131322;

  .btn {

    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    border-radius: 999px;
    padding: 12px 30px;
    min-height: 48px;
    cursor: pointer;
    box-shadow: 0 4px 22px rgba(255, 61, 140, 0.5);
    -webkit-tap-highlight-color: transparent;

  .btn.sub {
    background: #26224a;
    border: 1px solid #4a4380;
    box-shadow: none;
    color: #eeecfa;
    font-size: 0.95rem;
    padding: 12px 18px;
  }

    .btn:hover { filter: brightness(1.12); }
  }
  .btn:active { transform: translateY(2px); }
  .btn:focus-visible { outline: 2px solid #53e0d8; outline-offset: 2px; }
  .hint { font-size: 0.78rem; color: #9d99c0; }

    mushroom: '<rect x="14" y="20" width="12" height="14" rx="5" fill="#fff3e0"/><path d="M4 22a16 14 0 0 1 32 0z" fill="#c9773f"/><circle cx="13" cy="14" r="2.6" fill="#fff3e0"/><circle cx="22" cy="11" r="2.2" fill="#fff3e0"/><circle cx="29" cy="17" r="2.2" fill="#fff3e0"/>',
    fish: '<path d="M6 20q12-13 24 0-12 13-24 0z" fill="#4db8ff"/><path d="M29 20l8-7v14z" fill="#2f8ed8"/><circle cx="13" cy="18.5" r="2" fill="#13233a"/><path d="M18 14q3 6 0 12" stroke="#bfe6ff" stroke-width="1.5" fill="none"/>',
    cloud: '<path d="M10 30a7 7 0 0 1 0-14 9 9 0 0 1 17-3 7.5 7.5 0 0 1 3 17z" fill="#e6eeff"/><circle cx="15" cy="22" r="1.6" fill="#3a3355"/><circle cx="23" cy="22" r="1.6" fill="#3a3355"/><path d="M17 25.5q2 1.6 4 0" stroke="#3a3355" stroke-width="1.4" fill="none" stroke-linecap="round"/>',
    crown: '<path d="M5 30L7 11l8 9 5-12 5 12 8-9 2 19z" fill="#ffc53d" stroke="#d99a1a" stroke-width="1.4" stroke-linejoin="round"/><rect x="5" y="29" width="30" height="5" rx="2" fill="#e8a92a"/><circle cx="20" cy="23" r="2.6" fill="#ff4f8f"/><circle cx="12" cy="25" r="1.8" fill="#53e0d8"/><circle cx="28" cy="25" r="1.8" fill="#53e0d8"/>',
    note: '<path d="M15 29V9l17-4v19" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linejoin="round"/><ellipse cx="11" cy="29" rx="5.5" ry="4.2" fill="#3ddc97"/><ellipse cx="28" cy="24" rx="5.5" ry="4.2" fill="#3ddc97"/><path d="M15 13l17-4" stroke="#3ddc97" stroke-width="3"/>',
    planet: '<circle cx="20" cy="20" r="10" fill="#ffb38a"/><path d="M13 16q7-2 14 1M11 22q9 2 18-1" stroke="#e8875a" stroke-width="1.6" fill="none"/><ellipse cx="20" cy="21" rx="18" ry="5" fill="none" stroke="#ffe0cc" stroke-width="2.4" transform="rotate(-15 20 21)"/>',
    rocket: '<path d="M20 3c7 6 8 15 6 23H14c-2-8-1-17 6-23z" fill="#f2f2ff"/><circle cx="20" cy="14" r="3.4" fill="#53e0d8" stroke="#6f8cff" stroke-width="1.4"/><path d="M14 20l-6 8 6-1zM26 20l6 8-6-1z" fill="#ff5a6e"/><path d="M16 26q4 10 8 0z" fill="#ffb13d"/>',
  };
  const ART_KEYS = Object.keys(ART);
  const ART_NAMES = { flower: "おはな", star: "ほし", ghost: "おばけ", moon: "おつきさま", candy: "あめ", ribbon: "リボン", cat: "ねこ", cherry: "さくらんぼ", heart: "ハート", drop: "しずく", leaf: "はっぱ", mushroom: "きのこ", fish: "さかな", cloud: "くも", crown: "おうかん", note: "おんぷ", planet: "わくせい", rocket: "ロケット" };
  function svgFor(key) { return '<svg viewBox="0 0 40 40" aria-hidden="true">' + ART[key] + "</svg>"; }

  const stage = document.getElementById("stage");
  const board = document.getElementById("board");
  const movesEl = document.getElementById("moves");
  const timeEl = document.getElementById("time");
  const levelChip = document.getElementById("level-chip");
  const titleScreen = document.getElementById("title-screen");
  const clearScreen = document.getElementById("clear-screen");
  const finalScoreEl = document.getElementById("final-score");
  const bestScoreEl = document.getElementById("best-score");
  const ruleLineEl = document.getElementById("rule-line");
  const newRecEl = document.getElementById("newrec");
  const starEls = document.querySelectorAll("#stars span");

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  let level = "easy";
  let first = null;      // 1まいめにめくったカード
  let lock = false;      // はんてい中はめくれない
  let moves = 0;
  let matched = 0;
  let streak = 0;
  let startAt = 0;       // 1まいめをめくった時刻（0 = まだ）
  let elapsedSec = 0;
  let timerId = null;
  let playing = false;

  // ============ きろく ============
  function readRecords() {
    let rec = {};
    try { rec = JSON.parse(lsGet(SETTINGS.recordKey) || "{}") || {}; } catch (e) { rec = {}; }
    const legacy = Number(lsGet(SETTINGS.storageKey) || 0);
    if (legacy > 0 && !(rec.easy && rec.easy.time)) rec.easy = Object.assign({}, rec.easy || {}, { time: legacy });
    return rec;
  }
  function writeRecords(rec) { lsSet(SETTINGS.recordKey, JSON.stringify(rec)); }
  function starsText(n) { return "★★★".slice(0, n) + "☆☆☆".slice(0, 3 - n); }
  function refreshLevelStars() {
    const rec = readRecords();
    document.querySelectorAll("[data-star]").forEach(function (el) {
      const r = rec[el.dataset.star];
      el.textContent = starsText(r && r.stars ? r.stars : 0);
    });
  }
  refreshLevelStars();

  // ============ おと（BGM＋こうかおん・ミュート対応） ============
  let audioCtx = null;
  let muted = lsGet("picotto-muted") === "1";
  const muteBtn = document.getElementById("mute-btn");
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") { try { audioCtx.resume(); } catch (e) {} }
    return audioCtx;
  }
  function tone(freq, t, dur, type, vol) {
    const c = getCtx();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 0.05));
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.1);
  }
  function beep(freq, dur, type, vol, delay) {
    if (muted) return;
    try { tone(freq, getCtx().currentTime + (delay || 0), dur, type || "sine", vol || 0.1); } catch (e) {}
  }
  // オルゴールふうのしずかなループBGM
  const BGM = {
    timer: null, step: 0, next: 0,
    song: {
      bpm: 80, lead: "sine",
      melody: [784, 0, 659, 0, 523, 0, 659, 0, 587, 0, 494, 0, 392, 0, 0, 0,
               784, 0, 880, 0, 784, 0, 659, 0, 587, 0, 659, 0, 523, 0, 0, 0],
      bass:   [0, 0, 131, 0, 0, 0, 165, 0, 0, 0, 147, 0, 0, 0, 196, 0],
    },
    start: function () {
      try {
        const c = getCtx();
        this.stop();
        const spb = 60 / this.song.bpm / 2;
        this.next = c.currentTime + 0.1;
        this.step = 0;
        const self = this;
        this.timer = setInterval(function () {
          try {
            const cc = getCtx();
            while (self.next < cc.currentTime + 0.25) {
              if (!muted && !document.hidden) {
                const m = self.song.melody[self.step % self.song.melody.length];
                const b = self.song.bass[self.step % self.song.bass.length];
                if (m) tone(m, self.next, spb * 1.4, self.song.lead, 0.04);
                if (b) tone(b, self.next, spb * 1.2, "triangle", 0.05);
              }
              self.next += spb;
              self.step++;
            }
          } catch (e) {}
        }, 80);
      } catch (e) {}
    },
    stop: function () { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  };
  function updateMuteBtn() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    lsSet("picotto-muted", muted ? "1" : "0");
    updateMuteBtn();
  });
  updateMuteBtn();

  // ============ えんしゅつ ============
  const CONFETTI_COLORS = ["#ff5fa2", "#53e0d8", "#ffd166", "#c77dff", "#ffffff"];
  function throwConfetti() {
    const layer = document.createElement("div");
    layer.className = "confetti-layer";
    for (let i = 0; i < 46; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "%";
      piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      piece.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
      piece.style.animationDelay = Math.random() * 0.7 + "s";
      layer.appendChild(piece);
    }
    stage.appendChild(layer);
    setTimeout(function () { layer.remove(); }, 4200);
  }
  function sparkle(card) {
    const sr = stage.getBoundingClientRect();
    const r = card.getBoundingClientRect();
    const cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height / 2;
    for (let i = 0; i < 10; i++) {
      const s = document.createElement("span");
      s.className = "spark";
      const a = (Math.PI * 2 / 10) * i + Math.random() * 0.4;
      const d = r.width * (0.55 + Math.random() * 0.35);
      s.style.left = cx - 3.5 + "px";
      s.style.top = cy - 3.5 + "px";
      s.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + "px");
      stage.appendChild(s);
      setTimeout(function () { s.remove(); }, 650);
    }
  }
  function toast(text) {
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = text;
    stage.appendChild(t);
    setTimeout(function () { t.remove(); }, 950);
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildBoard() {
    const L = SETTINGS.levels[level];
    const picks = shuffle(ART_KEYS).slice(0, L.pairs);
    const deck = shuffle([...picks, ...picks]);
    board.innerHTML = "";
    board.className = "board" + (L.cols === 5 ? " cols5" : L.cols === 6 ? " cols6" : "");
    levelChip.textContent = L.name;
    deck.forEach(function (key, i) {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.setAttribute("aria-label", "カード " + (i + 1));
      card.dataset.art = key;
      card.innerHTML =
        '<span class="card-inner">' +
        '<span class="face front">?</span>' +
        '<span class="face back">' + svgFor(key) + "</span>" +
        "</span>";
      card.addEventListener("click", function () { flip(card); });
      board.appendChild(card);
    });
  }

  function tick() {
    if (!startAt) return;
    elapsedSec = (performance.now() - startAt) / 1000;
    timeEl.textContent = String(Math.floor(elapsedSec));
  }

  function startGame(lv) {
    if (lv) level = lv;
    first = null;
    lock = false;
    moves = 0;
    matched = 0;
    streak = 0;
    startAt = 0;
    elapsedSec = 0;
    playing = true;
    movesEl.textContent = "0";
    timeEl.textContent = "0";
    buildBoard();
    titleScreen.classList.add("hidden");
    clearScreen.classList.add("hidden");
    if (timerId) clearInterval(timerId);
    timerId = setInterval(tick, 200);
    beep(660, 0.15);
    BGM.start();
  }

  function flip(card) {
    if (!playing || lock) return;
    if (card.classList.contains("open") || card.classList.contains("matched")) return;
    if (!startAt) startAt = performance.now(); // タイムは さいしょの1まいで スタート

    card.classList.add("open");
    card.classList.remove("miss");
    card.setAttribute("aria-label", ART_NAMES[card.dataset.art] || "カード");
    beep(520, 0.07);

    if (!first) {
      first = card;
      return;
    }

    // 2まいめ
    moves++;
    movesEl.textContent = String(moves);

    if (first.dataset.art === card.dataset.art) {
      const a = first;
      a.classList.add("matched");
      card.classList.add("matched");
      first = null;
      matched++;
      streak++;
      sparkle(a); sparkle(card);
      beep(880 + Math.min(streak, 6) * 90, 0.12, "triangle");
      beep(1320 + Math.min(streak, 6) * 90, 0.12, "triangle", 0.06, 0.08);
      if (streak >= 2) toast(streak + "れんぞく！");
      if (matched === SETTINGS.levels[level].pairs) finishGame();
    } else {
      lock = true;
      streak = 0;
      const a = first, b = card;
      first = null;
      beep(180, 0.18, "sawtooth", 0.07);
      setTimeout(function () {
        a.classList.add("miss"); b.classList.add("miss");
      }, 380);
      setTimeout(function () {
        a.classList.remove("open", "miss");
        b.classList.remove("open", "miss");
        a.setAttribute("aria-label", "カード");
        b.setAttribute("aria-label", "カード");
        lock = false;
      }, 800);
    }
  }

  function starCount(pairs, mv) {
    if (mv <= Math.round(pairs * SETTINGS.star3)) return 3;
    if (mv <= Math.round(pairs * SETTINGS.star2)) return 2;
    return 1;
  }

  function finishGame() {
    playing = false;
    tick();
    clearInterval(timerId);
    timerId = null;
    BGM.stop();
    const L = SETTINGS.levels[level];
    const t = Math.round(elapsedSec * 10) / 10;
    const n = starCount(L.pairs, moves);
    const rec = readRecords();
    const prev = rec[level] || {};
    const newTime = !prev.time || t < prev.time;
    const newMoves = !prev.moves || moves < prev.moves;
    rec[level] = {
      time: newTime ? t : prev.time,
      moves: newMoves ? moves : prev.moves,
      stars: Math.max(prev.stars || 0, n),
    };
    writeRecords(rec);
    if (level === "easy") {
      const old = Number(lsGet(SETTINGS.storageKey) || 0);
      lsSet(SETTINGS.storageKey, String(old > 0 ? Math.min(old, t) : t));
    }
    finalScoreEl.textContent = "タイム " + t.toFixed(1) + "びょう ／ " + moves + "かい";
    bestScoreEl.textContent = L.name + "のきろく：" + rec[level].time.toFixed(1) + "びょう ／ " + rec[level].moves + "かい";
    ruleLineEl.textContent = n < 3
      ? "⭐3は " + Math.round(L.pairs * SETTINGS.star3) + "かい いないで そろえよう"
      : "さいこうランク！ つぎは もっとむずかしいのにも ちょうせん！";
    const firstClear = !(prev.time || prev.moves);
    const isNew = firstClear || newTime || newMoves;
    newRecEl.textContent = firstClear ? "🎉 はじめてクリア！" : newTime && newMoves ? "🎉 タイムも かいすうも じこベスト！" : newTime ? "🎉 タイムが じこベスト！" : "🎉 かいすうが じこベスト！";
    newRecEl.classList.toggle("hidden", !isNew);
    starEls.forEach(function (s) { s.classList.remove("on"); });
    refreshLevelStars();
    setTimeout(function () {
      clearScreen.classList.remove("hidden");
      throwConfetti();
      beep(659, 0.18, "sine", 0.07, 0.05);
      beep(784, 0.18, "sine", 0.07, 0.22);
      beep(1047, 0.35, "sine", 0.08, 0.39);
      for (let i = 0; i < n; i++) {
        setTimeout(function () { starEls[i].classList.add("on"); beep(988 + i * 200, 0.14, "triangle", 0.08); }, 500 + i * 300);
      }
    }, 550);
  }

  document.querySelectorAll(".lvl").forEach(function (b) {
    b.addEventListener("click", function () { startGame(b.dataset.level); });
  });
  document.getElementById("retry-btn").addEventListener("click", function () { startGame(); });
  document.getElementById("level-btn").addEventListener("click", function () {
    clearScreen.classList.add("hidden");
    refreshLevelStars();
    titleScreen.classList.remove("hidden");
  });

  buildBoard(); // タイトル画面のうしろに1回ならべておく

  // テスト用のよみとりだけの窓口（ゲームにはえいきょうしない）
  window.__ludotGame = {
    get level() { return level; }, get moves() { return moves; }, get matched() { return matched; },
    get playing() { return playing; }, get startAt() { return startAt; }, get elapsed() { return elapsedSec; },
    get lock() { return lock; },
  };
})();
</script>
</body>
</html>
