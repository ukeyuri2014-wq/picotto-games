<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>よふかしペアさがし | ピコットゲームズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(ellipse 70% 50% at 50% -10%, #35234d 0%, transparent 70%),
      #131322;
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    color: #eeecfa;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .topbar {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 14px 16px 8px;
  }
  .topbar a, .topbar button.mute {
    color: #53e0d8;
    font-weight: 900;
    text-decoration: none;
    font-size: 0.88rem;
    background: #1e1e36;
    border: 1px solid #2c2c4d;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .topbar a:hover, .topbar button.mute:hover { border-color: #53e0d8; }
  .topbar button.mute:focus-visible { outline: 2px solid #53e0d8; outline-offset: 2px; }
  .topbar h1 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: 1.05rem;
    background: linear-gradient(100deg, #ff5fa2, #c77dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stage {
    position: relative;
    width: min(94vw, 480px);
    margin: 6px 0 24px;
    background: #191930;
    border: 1px solid #2c2c4d;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(83, 224, 216, 0.12), 0 14px 34px rgba(0, 0, 0, 0.45);
    padding: 16px;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .chip {
    background: rgba(19, 19, 34, 0.85);
    border: 1px solid #2c2c4d;
    border-radius: 12px;
    padding: 6px 14px;
    font-weight: 900;
    font-size: 0.95rem;
  }
  .chip.moves { color: #ff5fa2; }
  .chip.time { color: #53e0d8; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .card {
    aspect-ratio: 1;
    position: relative;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .card-inner {
    position: absolute;
    inset: 0;
  }
  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
  }
  /* 2Dフリップ（横につぶれて→ひろがる）。3D変形なしで全ブラウザ対応 */
  .face.front {
    background:
      radial-gradient(circle at 20% 20%, rgba(199, 125, 255, 0.18) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(83, 224, 216, 0.15) 0%, transparent 40%),
      radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.5px),
      linear-gradient(150deg, #232345, #1b1b38);
    background-size: auto, auto, 12px 12px, auto;
    border: 1px solid #363063;
    color: #8f88c9;
    font-family: "Mochiy Pop One", sans-serif;
    font-size: 1.5rem;
    transform: scaleX(1);
    transition: transform 0.16s ease 0.16s;
    text-shadow: 0 0 10px rgba(199, 125, 255, 0.5);
  }
  .face.front::before, .face.front::after {
    content: "✦";
    position: absolute;
    font-size: 0.55rem;
    color: #53e0d8;
    opacity: 0.7;
  }
  .face.front::before { top: 6px; left: 8px; }
  .face.front::after { bottom: 6px; right: 8px; color: #ff5fa2; }
  .card.open .face.front {
    transform: scaleX(0);
    transition: transform 0.16s ease 0s;
  }
  .face.back {
    background: linear-gradient(150deg, #2d2250, #241f42);
    border: 1px solid #53e0d8;
    font-size: 2.1rem;
    transform: scaleX(0);
    transition: transform 0.16s ease 0s;
  }
  .card.open .face.back {
    transform: scaleX(1);
    transition: transform 0.16s ease 0.16s;
  }
  @media (prefers-reduced-motion: reduce) {
    .face.front, .face.back, .card.open .face.front, .card.open .face.back { transition: none; }
  }
  .card:hover .face.front { border-color: #ff5fa2; }
  .card:focus-visible { outline: 2px solid #53e0d8; outline-offset: 2px; border-radius: 14px; }
  .card.matched .face.back {
    border-color: #ffd166;
    box-shadow: 0 0 14px rgba(255, 209, 102, 0.5);
    animation: match-pop 0.45s ease;
  }
  @keyframes match-pop {
    0% { scale: 1; }
    40% { scale: 1.14; rotate: 4deg; }
    70% { scale: 0.96; rotate: -2deg; }
    100% { scale: 1; rotate: 0deg; }
  }
  .card.matched { cursor: default; }
  .confetti-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 20px;
    pointer-events: none;
    z-index: 10;
  }
  .confetti-piece {
    position: absolute;
    top: -14px;
    width: 8px;
    height: 13px;
    border-radius: 2px;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(620px) rotate(660deg); opacity: 0.6; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.matched .face.back { animation: none; }
    .confetti-piece { animation: none; display: none; }
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(19, 19, 34, 0.93);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 14px;
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 3rem; }
  .overlay h2 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: 1.55rem;
    background: linear-gradient(100deg, #ff5fa2, #53e0d8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .overlay p { font-size: 0.95rem; line-height: 1.8; color: #c9c5e6; }
  .overlay p b { color: #eeecfa; }
  .overlay .score-line { font-size: 1.2rem; font-weight: 900; color: #eeecfa; }
  .overlay .best-line { font-size: 0.9rem; color: #53e0d8; font-weight: 700; }
  .btn {
    border: none;
    background: linear-gradient(100deg, #ff3d8c, #ff5fa2);
    color: #fff;
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.14em;
    border-radius: 999px;
    padding: 12px 46px;
    cursor: pointer;
    box-shadow: 0 4px 22px rgba(255, 61, 140, 0.5);
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: translateY(2px); }
  .btn:focus-visible { outline: 2px solid #53e0d8; outline-offset: 2px; }
  .hint { font-size: 0.78rem; color: #9d99c0; }
  .hint a { color: #9d99c0; }
  .age-badge { display:inline-flex; width:fit-content; margin:0; padding:5px 12px; border:1px solid rgba(83,224,216,.35); border-radius:999px; color:#53e0d8!important; background:rgba(83,224,216,.08); font-size:.72rem!important; font-weight:900; letter-spacing:.06em; }
</style>
</head>
<body>

<div class="topbar">
  <a href="../../index.html">← いちらんへ</a>
  <h1>👻 よふかしペアさがし</h1>
  <button class="mute" id="mute-btn" aria-label="おとのオンオフ">🔊</button>
</div>

<div class="stage">
  <div class="hud">
    <span class="chip moves">🃏 <span id="moves">0</span> かい</span>
    <span class="chip time">⏰ <span id="time">0</span> びょう</span>
  </div>
  <div class="board" id="board"></div>

  <div class="overlay" id="title-screen">
    <div class="big">👻🌙⭐</div>
    <h2>よふかしペアさがし</h2>
    <p class="age-badge">対象年齢の目安：6歳〜</p>
    <p>
      うらがえったカードを2まいずつめくって、<br>
      おなじえもじの<b>ペア</b>をみつけよう！<br>
      ぜんぶそろえるまでの<b>タイム</b>にちょうせん。
    </p>
    <button class="btn" id="start-btn">スタート！</button>
    <p class="hint">そうさ：タップ / クリック</p>
  </div>

  <div class="overlay hidden" id="clear-screen">
    <div class="big">🎉</div>
    <h2>ぜんぶそろった！</h2>
    <p class="score-line" id="final-score">タイム：0びょう</p>
    <p class="best-line" id="best-score"></p>
    <button class="btn" id="retry-btn">もういちど！</button>
    <p class="hint"><a href="../../index.html">ゲームいちらんへもどる</a></p>
  </div>
</div>

<script>
// ================================================================
// ★カスタマイズポイント★
// えもじをかえると、じぶんだけのペアさがしになるよ！（8しゅるい）
// ================================================================
const SETTINGS = {
  emojis: ["🌸", "⭐", "👻", "🌙", "🍬", "🎀", "🐱", "🍒"],
  storageKey: "pair-match-best",
};
// ================================================================

(function () {
  const board = document.getElementById("board");
  const movesEl = document.getElementById("moves");
  const timeEl = document.getElementById("time");
  const titleScreen = document.getElementById("title-screen");
  const clearScreen = document.getElementById("clear-screen");
  const finalScoreEl = document.getElementById("final-score");
  const bestScoreEl = document.getElementById("best-score");

  let first = null;      // 1まいめにめくったカード
  let lock = false;      // はんてい中はめくれない
  let moves = 0;
  let matched = 0;
  let seconds = 0;
  let timerId = null;

  // ============ おと（BGM＋こうかおん・ミュート対応） ============
  let audioCtx = null;
  let muted = localStorage.getItem("picotto-muted") === "1";
  const muteBtn = document.getElementById("mute-btn");
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, t, dur, type, vol) {
    const c = getCtx();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 0.05));
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.1);
  }
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try { tone(freq, getCtx().currentTime, dur, type || "sine", vol || 0.1); } catch (e) {}
  }
  // オルゴールふうのしずかなループBGM
  const BGM = {
    timer: null, step: 0, next: 0,
    song: {
      bpm: 80, lead: "sine",
      melody: [784, 0, 659, 0, 523, 0, 659, 0, 587, 0, 494, 0, 392, 0, 0, 0,
               784, 0, 880, 0, 784, 0, 659, 0, 587, 0, 659, 0, 523, 0, 0, 0],
      bass:   [0, 0, 131, 0, 0, 0, 165, 0, 0, 0, 147, 0, 0, 0, 196, 0],
    },
    start: function () {
      try {
        const c = getCtx();
        this.stop();
        const spb = 60 / this.song.bpm / 2;
        this.next = c.currentTime + 0.1;
        this.step = 0;
        const self = this;
        this.timer = setInterval(function () {
          try {
            const cc = getCtx();
            while (self.next < cc.currentTime + 0.25) {
              if (!muted && !document.hidden) {
                const m = self.song.melody[self.step % self.song.melody.length];
                const b = self.song.bass[self.step % self.song.bass.length];
                if (m) tone(m, self.next, spb * 1.4, self.song.lead, 0.04);
                if (b) tone(b, self.next, spb * 1.2, "triangle", 0.05);
              }
              self.next += spb;
              self.step++;
            }
          } catch (e) {}
        }, 80);
      } catch (e) {}
    },
    stop: function () { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  };
  function updateMuteBtn() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    localStorage.setItem("picotto-muted", muted ? "1" : "0");
    updateMuteBtn();
  });
  updateMuteBtn();

  // カードの絵ごとに、うっすら色のハロー（後光）をつける
  const EMOJI_HUES = { "🌸": 330, "⭐": 45, "👻": 260, "🌙": 55, "🍬": 300, "🎀": 335, "🐱": 25, "🍒": 350 };

  // クリアのとき紙ふぶきをふらせる
  const CONFETTI_COLORS = ["#ff5fa2", "#53e0d8", "#ffd166", "#c77dff", "#ffffff"];
  function throwConfetti() {
    const stage = document.querySelector(".stage");
    const layer = document.createElement("div");
    layer.className = "confetti-layer";
    for (let i = 0; i < 46; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "%";
      piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      piece.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
      piece.style.animationDelay = Math.random() * 0.7 + "s";
      layer.appendChild(piece);
    }
    stage.appendChild(layer);
    setTimeout(function () { layer.remove(); }, 4200);
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildBoard() {
    const deck = shuffle([...SETTINGS.emojis, ...SETTINGS.emojis]);
    board.innerHTML = "";
    deck.forEach(function (emoji) {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.setAttribute("aria-label", "カード");
      card.dataset.emoji = emoji;
      const hue = EMOJI_HUES[emoji] !== undefined ? EMOJI_HUES[emoji] : 200;
      card.innerHTML =
        '<span class="card-inner">' +
        '<span class="face front">?</span>' +
        '<span class="face back" style="background: radial-gradient(circle at 50% 42%, hsla(' + hue + ', 80%, 65%, 0.4) 0%, transparent 68%), linear-gradient(150deg, #2d2250, #241f42);">' + emoji + "</span>" +
        "</span>";
      card.addEventListener("click", function () { flip(card); });
      board.appendChild(card);
    });
  }

  function startGame() {
    first = null;
    lock = false;
    moves = 0;
    matched = 0;
    seconds = 0;
    movesEl.textContent = "0";
    timeEl.textContent = "0";
    buildBoard();
    titleScreen.classList.add("hidden");
    clearScreen.classList.add("hidden");
    if (timerId) clearInterval(timerId);
    timerId = setInterval(function () {
      seconds++;
      timeEl.textContent = String(seconds);
    }, 1000);
    beep(660, 0.15);
    BGM.start();
  }

  function flip(card) {
    if (lock) return;
    if (card.classList.contains("open") || card.classList.contains("matched")) return;

    card.classList.add("open");
    beep(520, 0.07);

    if (!first) {
      first = card;
      return;
    }

    // 2まいめ
    moves++;
    movesEl.textContent = String(moves);

    if (first.dataset.emoji === card.dataset.emoji) {
      first.classList.add("matched");
      card.classList.add("matched");
      first = null;
      matched++;
      beep(1040, 0.12, "triangle");
      if (matched === SETTINGS.emojis.length) finishGame();
    } else {
      lock = true;
      const a = first, b = card;
      first = null;
      beep(180, 0.18, "sawtooth");
      setTimeout(function () {
        a.classList.remove("open");
        b.classList.remove("open");
        lock = false;
      }, 750);
    }
  }

  function finishGame() {
    clearInterval(timerId);
    timerId = null;
    BGM.stop();
    const prev = Number(localStorage.getItem(SETTINGS.storageKey) || 0);
    const best = prev > 0 ? Math.min(prev, seconds) : seconds;
    localStorage.setItem(SETTINGS.storageKey, String(best));
    finalScoreEl.textContent = "タイム：" + seconds + "びょう（" + moves + "かい）";
    bestScoreEl.textContent = "さいそくきろく：" + best + "びょう";
    setTimeout(function () {
      clearScreen.classList.remove("hidden");
      throwConfetti();
      try {
        const c = getCtx();
        if (!muted) {
          tone(659, c.currentTime + 0.05, 0.18, "sine", 0.07);
          tone(784, c.currentTime + 0.22, 0.18, "sine", 0.07);
          tone(1047, c.currentTime + 0.39, 0.35, "sine", 0.08);
        }
      } catch (e) {}
    }, 500);
  }

  document.getElementById("start-btn").addEventListener("click", startGame);
  document.getElementById("retry-btn").addEventListener("click", startGame);

  buildBoard(); // タイトル画面のうしろに1回ならべておく
})();
</script>
</body>
</html>
