function beep(freq,dur=.1,type='sine',vol=.07,delay=0){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const t0=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,t0);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g).connect(audioContext.destination);o.start(t0);o.stop(t0+dur+.02)}catch{}}

 function choose(c){const got=[];let msg='';sfx('page');
  if(c.use)st.items=st.items.filter(k=>k!==c.use);if(c.get&&!st.items.includes(c.get)){st.items.push(c.get);got.push(c.get)}if(c.set)st.flags[c.set]=true;
  if(c.kind){st.kind+=c.kind;later(()=>sfx('kind'),160);msg='♥ やさしさが ふえた！'}hud();go(c.to,got);if(msg&&!got.length)say(msg);else if(msg)say($('#notice').textContent+'　'+msg)}
 function end(key){const [icon,title,text]=ENDINGS[key],fresh=!seen.includes(key);if(fresh){seen.push(key);save('endings',seen)}hud();sfx('end');
  const sc={sky:key==='night'||key==='star'?'night':key==='return'?'morning':st.flags.late?'evening':'day',props:key==='return'?['post','trees']:['lighthouseNear','flowers'],chars:[[icon,200,170,56],...(key==='fox'?[['🦊',120,196,40]]:key==='friend'?[['🐢',110,204,30],['🐿️',150,200,30],['🦊',84,196,30]]:[])]};
  $('#story').innerHTML=`<div class="fp-scene">${svgScene(sc,st)}</div><div class="fp-end"><h2 class="fp-title" style="justify-content:center"><span>${icon}</span>${title}</h2>${fresh?'<span class="badge">新しい結末！</span>':'<span class="badge" style="background:#304569;color:#eef3ff">見たことのある結末</span>'}
   <p class="story fp-text" style="text-align:left">${text}</p><p class="progress">見つけた結末 ${seen.length} / 8　・　えらんだ回数 ${st.steps}</p>
   <div class="row"><button id="again" class="primary">もう一度 配達する</button><button id="note2">📖 結末ノート</button></div></div>`;
  $('#again').onclick=()=>mount();$('#note2').onclick=()=>note();say(seen.length===8?'🏆 8つの結末をぜんぶ見つけた！ 森いちばんの郵便屋さん！':`まだ見ていない結末が ${8-seen.length}つ あるよ。ちがう道や持ちものをためそう。`);fitPanel()}
 function note(){say('');$('#story').innerHTML=`<h2 class="fp-title">📖 結末ノート　${seen.length} / 8</h2><div class="fp-note">${END_ORDER.map(k=>{const [icon,title,,hint]=ENDINGS[k],got=seen.includes(k);return got?`<div class="card"><span class="ic">${icon}</span><b>${title}</b></div>`:`<div class="card unknown"><span class="ic">？</span><b>？？？</b>ヒント：${hint}</div>`}).join('')}</div><div class="row" style="justify-content:center;margin-top:12px"><button id="again" class="primary">最初から配達する</button></div>`;$('#again').onclick=()=>mount();fitPanel()}
 hud();go('start')}
function launch(){mount()}
app.innerHTML=`<section class="panel intro"><div class="icon">${CONFIG.emoji}</div><h2>${CONFIG.title}</h2><p>${CONFIG.rules}</p><button class="primary" id="start">あそぶ</button><p class="small">${CONFIG.controls}</p></section>`;
$('#start').onclick=launch;
on(window,'keydown',e=>{if(e.key==='Enter'&&$('#start')){e.preventDefault();stop();launch()}});

</script></body></html>
