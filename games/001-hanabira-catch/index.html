<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>はなびらキャッチ | ピコットゲームズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(ellipse 70% 50% at 50% -10%, #35234d 0%, transparent 70%),
      #131322;
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    color: #eeecfa;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .topbar {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 14px 16px 8px;
  }
  .topbar a, .topbar button.mute {
    color: #53e0d8;
    font-weight: 900;
    text-decoration: none;
    font-size: 0.88rem;
    background: #1e1e36;
    border: 1px solid #2c2c4d;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .topbar a:hover, .topbar button.mute:hover { border-color: #53e0d8; }
  .topbar h1 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: 1.02rem;
    background: linear-gradient(100deg, #ff5fa2, #c77dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stage { position: relative; width: min(94vw, 480px); margin: 6px 0 24px; }
  canvas {
    display: block;
    width: 100%;
    border-radius: 20px;
    border: 1px solid #2c2c4d;
    box-shadow: 0 0 40px rgba(255, 95, 162, 0.15), 0 14px 34px rgba(0, 0, 0, 0.45);
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(19, 19, 34, 0.92);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 14px;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 3rem; }
  .overlay h2 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: 1.55rem;
    background: linear-gradient(100deg, #ff5fa2, #53e0d8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .overlay p { font-size: 0.95rem; line-height: 1.8; color: #c9c5e6; }
  .overlay p b { color: #eeecfa; }
  .overlay .score-line { font-size: 1.25rem; font-weight: 900; color: #eeecfa; }
  .overlay .best-line { font-size: 0.9rem; color: #53e0d8; font-weight: 700; }
  .btn {
    border: none;
    background: linear-gradient(100deg, #ff3d8c, #ff5fa2);
    color: #fff;
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.14em;
    border-radius: 999px;
    padding: 12px 46px;
    cursor: pointer;
    box-shadow: 0 4px 22px rgba(255, 61, 140, 0.5);
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: translateY(2px); }
  .btn:focus-visible, .topbar button.mute:focus-visible { outline: 2px solid #53e0d8; outline-offset: 2px; }
  .hint { font-size: 0.78rem; color: #9d99c0; }
  .hint a { color: #9d99c0; }
</style>
</head>
<body>

<div class="topbar">
  <a href="../../index.html">← いちらんへ</a>
  <h1>🌸 はなびらキャッチ</h1>
  <button class="mute" id="mute-btn" aria-label="おとのオンオフ">🔊</button>
</div>

<div class="stage">
  <canvas id="game" width="480" height="640"></canvas>

  <div class="overlay" id="title-screen">
    <div class="big">🌸🧺⭐</div>
    <h2>はなびらキャッチ</h2>
    <p>
      かごをうごかして よぞらからおちてくるものをキャッチ！<br>
      🌸 おはな = <b>+10てん</b><br>
      ⭐ ほし = <b>+30てん</b><br>
      👻 おばけ = <b>−20てん</b>（とっちゃダメ！）<br>
      せいげんじかんは <b>45びょう</b>だよ。
    </p>
    <button class="btn" id="start-btn">スタート！</button>
    <p class="hint">そうさ：←→キー / マウス / ゆびでスライド</p>
  </div>

  <div class="overlay hidden" id="over-screen">
    <div class="big">🎉</div>
    <h2>じかんぎれ！</h2>
    <p class="score-line" id="final-score">スコア：0てん</p>
    <p class="best-line" id="best-score"></p>
    <button class="btn" id="retry-btn">もういちど！</button>
    <p class="hint"><a href="../../index.html">ゲームいちらんへもどる</a></p>
  </div>
</div>

<script>
// ================================================================
// ★カスタマイズポイント★
// ================================================================
const SETTINGS = {
  gameTime: 45,
  goodPoint: 10,       // おはな
  bonusPoint: 30,      // ほし
  badPoint: -20,       // おばけ
  fallSpeedStart: 130,
  fallSpeedMax: 260,
  storageKey: "hanabira-catch-best",
};
// ================================================================

(function () {
  const W = 480;
  const H = 640;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const titleScreen = document.getElementById("title-screen");
  const overScreen = document.getElementById("over-screen");
  const finalScoreEl = document.getElementById("final-score");
  const bestScoreEl = document.getElementById("best-score");
  const muteBtn = document.getElementById("mute-btn");

  let state = "title";
  let score = 0;
  let timeLeft = SETTINGS.gameTime;
  let elapsed = 0;
  let items = [];
  let popups = [];
  let sparks = [];
  let spawnTimer = 0;
  let player = { x: W / 2, y: H - 70 };
  let keys = { left: false, right: false };
  let lastTime = 0;

  const bgStars = [];
  for (let i = 0; i < 40; i++) {
    bgStars.push({ x: Math.random() * W, y: Math.random() * (H - 120), r: 0.6 + Math.random() * 1.4, tw: Math.random() * Math.PI * 2 });
  }

  // ============ おと（BGM＋こうかおん・ミュート対応） ============
  let audioCtx = null;
  let muted = localStorage.getItem("picotto-muted") === "1";
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, t, dur, type, vol) {
    const c = getCtx();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 0.05));
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.1);
  }
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try { tone(freq, getCtx().currentTime, dur, type || "sine", vol || 0.1); } catch (e) {}
  }
  // やさしいワルツ調のループBGM
  const BGM = {
    timer: null, step: 0, next: 0,
    song: {
      bpm: 100, lead: "sine",
      melody: [659, 0, 523, 0, 587, 0, 392, 0, 440, 0, 523, 0, 494, 0, 392, 0,
               659, 0, 784, 0, 659, 0, 523, 0, 587, 0, 494, 0, 523, 0, 0, 0],
      bass:   [131, 0, 196, 0, 147, 0, 196, 0, 110, 0, 196, 0, 131, 0, 196, 0],
    },
    start: function () {
      try {
        const c = getCtx();
        this.stop();
        const spb = 60 / this.song.bpm / 2;
        this.next = c.currentTime + 0.1;
        this.step = 0;
        const self = this;
        this.timer = setInterval(function () {
          try {
            const cc = getCtx();
            while (self.next < cc.currentTime + 0.25) {
              if (!muted && !document.hidden) {
                const m = self.song.melody[self.step % self.song.melody.length];
                const b = self.song.bass[self.step % self.song.bass.length];
                if (m) tone(m, self.next, spb * 0.85, self.song.lead, 0.04);
                if (b) tone(b, self.next, spb * 0.9, "triangle", 0.055);
              }
              self.next += spb;
              self.step++;
            }
          } catch (e) {}
        }, 80);
      } catch (e) {}
    },
    stop: function () { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  };
  function updateMuteBtn() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    localStorage.setItem("picotto-muted", muted ? "1" : "0");
    updateMuteBtn();
  });
  updateMuteBtn();

  // ============ 手がきスプライト ============
  function drawPetalFlower(c, x, y, r, rot) {
    c.save(); c.translate(x, y); c.rotate(rot);
    for (let k = 0; k < 5; k++) {
      c.rotate((Math.PI * 2) / 5);
      const g = c.createRadialGradient(0, -r * 0.55, 1, 0, -r * 0.55, r * 0.8);
      g.addColorStop(0, "#ffe0ec");
      g.addColorStop(1, "#ff5fa2");
      c.fillStyle = g;
      c.beginPath();
      c.ellipse(0, -r * 0.55, r * 0.36, r * 0.62, 0, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = "#ffd166";
    c.beginPath(); c.arc(0, 0, r * 0.24, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  function drawStar(c, x, y, r, rot) {
    const g = c.createRadialGradient(x, y, 2, x, y, r * 2.3);
    g.addColorStop(0, "rgba(255, 209, 102, 0.45)");
    g.addColorStop(1, "rgba(255, 209, 102, 0)");
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r * 2.3, 0, Math.PI * 2); c.fill();
    c.save(); c.translate(x, y); c.rotate(rot);
    c.fillStyle = "#ffd166";
    c.beginPath();
    for (let k = 0; k < 10; k++) {
      const rr = k % 2 === 0 ? r : r * 0.45;
      const a = (Math.PI / 5) * k - Math.PI / 2;
      if (k === 0) c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath(); c.fill();
    c.fillStyle = "rgba(255,255,255,0.85)";
    c.beginPath(); c.arc(-r * 0.25, -r * 0.35, r * 0.14, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  function drawGhost(c, x, y, r, t) {
    c.save();
    c.translate(x, y + Math.sin(t / 280) * 2.5);
    const g = c.createRadialGradient(0, -r * 0.25, 2, 0, 0, r * 1.35);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(1, "#cfc7f5");
    c.fillStyle = g;
    c.beginPath();
    c.arc(0, -r * 0.15, r * 0.85, Math.PI, 0);
    c.lineTo(r * 0.85, r * 0.55);
    const seg = (r * 1.7) / 3, bx = r * 0.85, by = r * 0.55;
    for (let k = 0; k < 3; k++) {
      c.quadraticCurveTo(bx - seg * (k + 0.5), by + r * 0.32, bx - seg * (k + 1), by);
    }
    c.closePath();
    c.fill();
    c.fillStyle = "#3a3355";
    c.beginPath();
    c.arc(-r * 0.3, -r * 0.18, r * 0.13, 0, Math.PI * 2);
    c.arc(r * 0.3, -r * 0.18, r * 0.13, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "rgba(255,95,162,0.45)";
    c.beginPath();
    c.ellipse(-r * 0.45, r * 0.08, r * 0.14, r * 0.09, 0, 0, Math.PI * 2);
    c.ellipse(r * 0.45, r * 0.08, r * 0.14, r * 0.09, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  function drawBasket(c, x, y) {
    c.save(); c.translate(x, y);
    c.strokeStyle = "#a97b4d";
    c.lineWidth = 5;
    c.beginPath(); c.arc(0, -8, 24, Math.PI * 1.08, Math.PI * 1.92); c.stroke();
    const g = c.createLinearGradient(0, -8, 0, 28);
    g.addColorStop(0, "#c99a63");
    g.addColorStop(1, "#8a6238");
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-30, -6); c.lineTo(30, -6); c.lineTo(22, 28); c.lineTo(-22, 28);
    c.closePath(); c.fill();
    c.strokeStyle = "rgba(80, 52, 24, 0.45)";
    c.lineWidth = 2;
    for (let yy = 2; yy <= 22; yy += 7) {
      const shrink = yy * 0.26;
      c.beginPath(); c.moveTo(-29 + shrink, yy); c.lineTo(29 - shrink, yy); c.stroke();
    }
    c.beginPath(); c.moveTo(-10, -6); c.lineTo(-8, 28); c.moveTo(10, -6); c.lineTo(8, 28); c.stroke();
    const rim = c.createLinearGradient(0, -12, 0, -3);
    rim.addColorStop(0, "#e6bd85");
    rim.addColorStop(1, "#b1854f");
    c.fillStyle = rim;
    c.beginPath();
    c.roundRect ? c.roundRect(-33, -12, 66, 9, 4) : c.rect(-33, -12, 66, 9);
    c.fill();
    c.restore();
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 130;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.55 + Math.random() * 0.35, max: 0.9, color: color });
    }
  }

  // ---- そうさ ----
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
    if (e.key === "ArrowLeft") keys.left = true;
    if (e.key === "ArrowRight") keys.right = true;
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
  });
  function pointerMove(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    player.x = Math.max(40, Math.min(W - 40, (cx / rect.width) * W));
  }
  canvas.addEventListener("pointermove", pointerMove);
  canvas.addEventListener("pointerdown", pointerMove);

  // ---- ゲームのながれ ----
  function startGame() {
    score = 0;
    timeLeft = SETTINGS.gameTime;
    elapsed = 0;
    items = [];
    popups = [];
    sparks = [];
    spawnTimer = 0;
    player.x = W / 2;
    state = "play";
    titleScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    beep(660, 0.15);
    BGM.start();
  }

  function endGame() {
    state = "over";
    BGM.stop();
    const best = Math.max(score, Number(localStorage.getItem(SETTINGS.storageKey) || 0));
    localStorage.setItem(SETTINGS.storageKey, String(best));
    finalScoreEl.textContent = "スコア：" + score + "てん";
    bestScoreEl.textContent = "さいこうきろく：" + best + "てん";
    overScreen.classList.remove("hidden");
    beep(440, 0.4);
  }

  document.getElementById("start-btn").addEventListener("click", startGame);
  document.getElementById("retry-btn").addEventListener("click", startGame);

  function spawnItem() {
    const r = Math.random();
    let type;
    if (r < 0.62) type = "good";
    else if (r < 0.82) type = "bad";
    else type = "bonus";
    const speedRatio = Math.min(elapsed / SETTINGS.gameTime, 1);
    const vy = SETTINGS.fallSpeedStart + (SETTINGS.fallSpeedMax - SETTINGS.fallSpeedStart) * speedRatio + Math.random() * 40;
    items.push({
      x: 40 + Math.random() * (W - 80),
      y: -30,
      vy: vy,
      type: type,
      wobble: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 3,
    });
  }

  function update(dt) {
    elapsed += dt;
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame();
      return;
    }
    const kbSpeed = 340;
    if (keys.left) player.x -= kbSpeed * dt;
    if (keys.right) player.x += kbSpeed * dt;
    player.x = Math.max(40, Math.min(W - 40, player.x));

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnItem();
      const ratio = Math.min(elapsed / SETTINGS.gameTime, 1);
      spawnTimer = 0.85 - 0.4 * ratio;
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt;
      it.wobble += dt * 3;
      it.rot += it.rotSpeed * dt;
      it.x += Math.sin(it.wobble) * 0.4;

      const caught = it.y > player.y - 26 && it.y < player.y + 26 && Math.abs(it.x - player.x) < 46;
      if (caught) {
        let pts = 0;
        if (it.type === "good") { pts = SETTINGS.goodPoint; beep(880, 0.1); burst(it.x, it.y, "#ff8fba", 8); }
        if (it.type === "bonus") { pts = SETTINGS.bonusPoint; beep(1320, 0.15, "triangle"); burst(it.x, it.y, "#ffd166", 12); }
        if (it.type === "bad") { pts = SETTINGS.badPoint; beep(150, 0.25, "sawtooth"); burst(it.x, it.y, "#c77dff", 8); }
        score = Math.max(0, score + pts);
        popups.push({
          x: it.x, y: player.y - 40,
          text: (pts > 0 ? "+" : "") + pts,
          color: pts > 0 ? (it.type === "bonus" ? "#ffd166" : "#ff5fa2") : "#c77dff",
          life: 0.8,
        });
        items.splice(i, 1);
      } else if (it.y > H + 40) {
        items.splice(i, 1);
      }
    }

    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].y -= 50 * dt;
      popups[i].life -= dt;
      if (popups[i].life <= 0) popups.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
      p.life -= dt;
      if (p.life <= 0) sparks.splice(i, 1);
    }
  }

  function drawBackground(t) {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#1b1836");
    sky.addColorStop(0.55, "#2b2050");
    sky.addColorStop(1, "#3a2a5e");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    for (const s of bgStars) {
      ctx.globalAlpha = 0.35 + 0.55 * Math.abs(Math.sin(t / 900 + s.tw));
      ctx.fillStyle = "#e8e4ff";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = "40px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🌙", 415, 88);
    ctx.fillStyle = "#241f42";
    ctx.fillRect(0, H - 36, W, 36);
    ctx.fillStyle = "#53e0d8";
    ctx.globalAlpha = 0.6;
    ctx.fillRect(0, H - 36, W, 2);
    ctx.globalAlpha = 1;
    drawPetalFlower(ctx, 40, H - 44, 10, 0.4);
    drawPetalFlower(ctx, 442, H - 44, 10, -0.3);
  }

  function draw(t) {
    drawBackground(t || 0);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const it of items) {
      if (it.type === "good") drawPetalFlower(ctx, it.x, it.y, 17, it.rot);
      else if (it.type === "bonus") drawStar(ctx, it.x, it.y, 15, it.rot);
      else drawGhost(ctx, it.x, it.y, 18, t + it.wobble * 300);
    }

    drawBasket(ctx, player.x, player.y);

    for (const p of sparks) {
      ctx.globalAlpha = Math.max(p.life / p.max, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.font = "900 22px 'Zen Maru Gothic', sans-serif";
    for (const p of popups) {
      ctx.globalAlpha = Math.max(p.life / 0.8, 0);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = "rgba(19, 19, 34, 0.78)";
    roundRect(ctx, 12, 12, 150, 40, 12);
    roundRect(ctx, W - 162, 12, 150, 40, 12);
    ctx.fillStyle = "#ff5fa2";
    ctx.font = "900 20px 'Zen Maru Gothic', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🌸 " + score + " てん", 24, 33);
    ctx.fillStyle = timeLeft <= 10 ? "#ffd166" : "#53e0d8";
    ctx.textAlign = "right";
    ctx.fillText("⏰ " + Math.ceil(timeLeft) + " びょう", W - 24, 33);
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
    c.fill();
  }

  function loop(t) {
    const dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;
    if (state === "play") update(dt);
    draw(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(function (t) {
    lastTime = t;
    requestAnimationFrame(loop);
  });
  draw(0);
})();
</script>
</body>
</html>
