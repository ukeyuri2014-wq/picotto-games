<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c063sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1238"/>
      <stop offset="0.55" stop-color="#2b2360"/>
      <stop offset="1" stop-color="#8a3f7d"/>
    </linearGradient>
    <radialGradient id="c063moon" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </radialGradient>
    <radialGradient id="c063halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c063cy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8fe6e1"/>
    </linearGradient>
    <linearGradient id="c063vi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ecff"/>
      <stop offset="1" stop-color="#a988ff"/>
    </linearGradient>
    <linearGradient id="c063pk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9f2"/>
      <stop offset="1" stop-color="#ff8fbe"/>
    </linearGradient>
    <linearGradient id="c063trail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="c063bal" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffc1da"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </radialGradient>
    <filter id="c063glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="c063soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="225" fill="url(#c063sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <rect x="22" y="18" width="2" height="2"/><rect x="64" y="46" width="1.5" height="1.5" opacity="0.7"/>
    <rect x="118" y="14" width="2" height="2" opacity="0.8"/><rect x="170" y="38" width="1.5" height="1.5"/>
    <rect x="226" y="20" width="2" height="2" opacity="0.6"/><rect x="262" y="58" width="1.5" height="1.5"/>
    <rect x="376" y="30" width="2" height="2"/><rect x="352" y="96" width="1.5" height="1.5" opacity="0.7"/>
    <rect x="34" y="92" width="1.5" height="1.5" opacity="0.8"/><rect x="92" y="78" width="2" height="2" opacity="0.5"/>
    <rect x="388" y="140" width="1.5" height="1.5" opacity="0.6"/><rect x="12" y="150" width="2" height="2" opacity="0.5"/>
  </g>
  <g fill="#53e0d8"><rect x="146" y="64" width="2" height="2"/><rect x="300" y="18" width="2" height="2"/><rect x="48" y="126" width="2" height="2" opacity="0.7"/></g>

  <!-- moon -->
  <circle cx="322" cy="52" r="56" fill="url(#c063halo)"/>
  <circle cx="322" cy="52" r="30" fill="url(#c063moon)"/>
  <circle cx="312" cy="44" r="6.5" fill="#e6c27a" opacity="0.55"/>
  <circle cx="332" cy="62" r="4.5" fill="#e6c27a" opacity="0.5"/>
  <circle cx="335" cy="40" r="3" fill="#e6c27a" opacity="0.45"/>

  <!-- far soft clouds -->
  <g fill="#ffffff" opacity="0.1">
    <ellipse cx="70" cy="196" rx="80" ry="20"/><ellipse cx="330" cy="208" rx="100" ry="24"/><ellipse cx="200" cy="218" rx="90" ry="16"/>
  </g>

  <!-- pink breakable cloud (low left) -->
  <g filter="url(#c063soft)">
    <g fill="url(#c063pk)">
      <rect x="36" y="168" width="84" height="20" rx="10"/>
      <ellipse cx="58" cy="170" rx="15" ry="11"/><ellipse cx="84" cy="166" rx="18" ry="14"/><ellipse cx="104" cy="171" rx="11" ry="9"/>
    </g>
  </g>
  <path d="M76 158 l7 9 l-6 7 l6 9 M54 172 l5 9 M102 172 l-5 10" fill="none" stroke="#a01e5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- cyan cloud with spring (center low) -->
  <g filter="url(#c063soft)">
    <g fill="url(#c063cy)">
      <rect x="150" y="176" width="104" height="22" rx="11"/>
      <ellipse cx="176" cy="178" rx="18" ry="12"/><ellipse cx="208" cy="174" rx="22" ry="16"/><ellipse cx="234" cy="180" rx="14" ry="10"/>
    </g>
  </g>
  <g filter="url(#c063soft)">
    <path d="M194 164 l16 -6 l-16 -6 l16 -6 l-16 -6" fill="none" stroke="#ffd166" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="188" y="133" width="28" height="7" rx="3.5" fill="#ff5fa2"/>
  </g>

  <!-- violet moving cloud (right mid) -->
  <g filter="url(#c063soft)">
    <g fill="url(#c063vi)">
      <rect x="276" y="128" width="90" height="20" rx="10"/>
      <ellipse cx="298" cy="130" rx="15" ry="11"/><ellipse cx="324" cy="126" rx="19" ry="14"/><ellipse cx="348" cy="131" rx="12" ry="9"/>
    </g>
  </g>
  <path d="M310 139 l-9 -5 v10 z M334 139 l9 -5 v10 z" fill="#4a1e96" opacity="0.75"/>
  <path d="M262 138 h-14 M380 138 h12" stroke="#a06bff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- cyan cloud (upper left) -->
  <g filter="url(#c063soft)">
    <g fill="url(#c063cy)">
      <rect x="92" y="88" width="80" height="18" rx="9"/>
      <ellipse cx="112" cy="90" rx="13" ry="10"/><ellipse cx="136" cy="86" rx="17" ry="13"/><ellipse cx="156" cy="91" rx="10" ry="8"/>
    </g>
  </g>

  <!-- thunder cloud (far left top) -->
  <g opacity="0.95">
    <g fill="#4d4878">
      <rect x="18" y="52" width="58" height="16" rx="8"/><ellipse cx="34" cy="52" rx="12" ry="10"/><ellipse cx="54" cy="48" rx="14" ry="12"/>
    </g>
    <path d="M50 68 l-8 13 h6 l-4 12 l12 -17 h-6 l5 -8 z" fill="#ffe66d" filter="url(#c063soft)"/>
  </g>

  <!-- jump trail -->
  <path d="M196 132 C 200 100, 214 78, 232 62 L 250 76 C 232 90, 220 108, 216 132 Z" fill="url(#c063trail)" opacity="0.7"/>

  <!-- stars to collect -->
  <g fill="#ffd166" filter="url(#c063glow)">
    <path d="M178 40 l3.5 7.5 l8 1 l-6 5.6 l1.6 8 l-7.1 -4 l-7.1 4 l1.6 -8 l-6 -5.6 l8 -1 z"/>
    <path d="M284 92 l2.6 5.6 l6 0.8 l-4.5 4.2 l1.2 6 l-5.3 -3 l-5.3 3 l1.2 -6 l-4.5 -4.2 l6 -0.8 z"/>
  </g>

  <!-- balloon -->
  <g filter="url(#c063soft)">
    <path d="M374 196 q4 8 0 16" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="374" cy="180" rx="13" ry="16" fill="url(#c063bal)"/>
    <ellipse cx="369" cy="174" rx="3" ry="4.5" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- the rabbit (hero) -->
  <g transform="translate(246 58) rotate(14)" filter="url(#c063glow)">
    <ellipse cx="-10" cy="-40" rx="7.5" ry="19" fill="#fff6e6" transform="rotate(-12 -10 -40)"/>
    <ellipse cx="10" cy="-41" rx="7.5" ry="19" fill="#fff6e6" transform="rotate(14 10 -41)"/>
    <ellipse cx="0" cy="-4" rx="24" ry="25" fill="#fff6e6"/>
    <ellipse cx="-11" cy="20" rx="9" ry="5" fill="#fff6e6"/>
    <ellipse cx="11" cy="20" rx="9" ry="5" fill="#fff6e6"/>
  </g>
  <g transform="translate(246 58) rotate(14)">
    <ellipse cx="-10" cy="-40" rx="3.2" ry="12.5" fill="#ffa6c9" transform="rotate(-12 -10 -40)"/>
    <ellipse cx="10" cy="-41" rx="3.2" ry="12.5" fill="#ffa6c9" transform="rotate(14 10 -41)"/>
    <rect x="-20" y="9" width="40" height="7.5" rx="3.5" fill="#53e0d8"/>
    <path d="M-16 13 l-14 9 l9 -11 z" fill="#53e0d8"/>
    <ellipse cx="-4" cy="-9" rx="3.6" ry="5" fill="#2a2140"/>
    <ellipse cx="13" cy="-9" rx="3.6" ry="5" fill="#2a2140"/>
    <circle cx="-2.8" cy="-10.8" r="1.4" fill="#ffffff"/>
    <circle cx="14.2" cy="-10.8" r="1.4" fill="#ffffff"/>
    <path d="M1 -1 q3.5 4 7 0" fill="none" stroke="#2a2140" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="-12" cy="-1" rx="5" ry="3.2" fill="#ff78aa" opacity="0.6"/>
    <ellipse cx="19" cy="-1" rx="4" ry="3.2" fill="#ff78aa" opacity="0.6"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M210 110 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5 z"/>
    <path d="M226 92 l1 2.8 l2.8 1 l-2.8 1 l-1 2.8 l-1 -2.8 l-2.8 -1 l2.8 -1 z"/>
    <path d="M128 60 l1.2 3.2 l3.2 1.2 l-3.2 1.2 l-1.2 3.2 l-1.2 -3.2 l-3.2 -1.2 l3.2 -1.2 z" opacity="0.8"/>
  </g>
</svg>
