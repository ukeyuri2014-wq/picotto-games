</head><body><header><a class="brand" href="../../index.html">LUDOT</a><a href="../../index.html">ゲーム一覧へ ↗</a></header><main><div class="eyebrow">SPORTS · #043</div><h1>🎳 ストライク広場</h1><p class="lead">ねらって転がす、10フレーム。</p><div id="app"></div><p id="storage-warning" class="save-warning" hidden>このブラウザでは記録を保存できません。この画面ではそのまま遊べます。</p><details class="notes"><summary>遊び方</summary><p>立ち位置と角度を選んで10本のピンを倒そう。ストライク・スペアのボーナス付き、10フレームのボウリング。</p><p>位置・角度のスライダーを調整して「投げる」。</p></details></main><footer>無料・ダウンロード不要 · LUDOT</footer><script>
'use strict';
const CONFIG={"id": "043", "title": "ストライク広場", "genre": "SPORTS", "emoji": "🎳", "color": "#c6b3ff", "author": "スタッフ", "age": "6歳〜", "date": "2026-09-13", "description": "立ち位置と角度を選んで10本のピンを倒そう。ストライク・スペアのボーナス付き、10フレームのボウリング。", "controls": "位置・角度のスライダーを調整して「投げる」。", "path": "games/043-strike-square/index.html", "tagline": "ねらって転がす、10フレーム。", "rules": "立ち位置と角度を選んで10本のピンを倒そう。ストライク・スペアのボーナス付き、10フレームのボウリング。"};
const app=document.getElementById('app');
const $=(s,r=app)=>r.querySelector(s), $$=(s,r=app)=>[...r.querySelectorAll(s)];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let cleanup=[];const on=(el,type,fn,opts)=>{el.addEventListener(type,fn,opts);cleanup.push(()=>el.removeEventListener(type,fn,opts))};
const every=(fn,ms)=>{const t=setInterval(fn,ms);cleanup.push(()=>clearInterval(t));return t};
const later=(fn,ms)=>{const t=setTimeout(fn,ms);cleanup.push(()=>clearTimeout(t));return t};
function stop(){cleanup.forEach(f=>f());cleanup=[]}
function read(key,fallback){try{const s=localStorage.getItem('ludot-'+CONFIG.id+'-'+key);return s===null?fallback:JSON.parse(s)}catch{return fallback}}
function save(key,val){try{localStorage.setItem('ludot-'+CONFIG.id+'-'+key,JSON.stringify(val))}catch{document.getElementById('storage-warning').hidden=false}}
function best(n){const old=Number(read('best',0))||0;if(n>old)save('best',n);return Math.max(n,old)}
function stat(label,value,id=''){return `<div class="stat"><small>${label}</small><b ${id?`id="${id}"`:''}>${value}</b></div>`}
function stage(content,stats=''){app.innerHTML=`<section class="panel"><div class="toolbar"><div class="stats">${stats}</div><button id="restart">やり直す</button></div><div id="play">${content}</div><div id="notice" class="notice" role="status" aria-live="polite"></div></section>`;$('#restart').onclick=()=>{stop();launch()}}
function say(s){const el=$('#notice');if(el)el.textContent=s}

let audioContext;function tone(freq=440,dur=.1){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.09,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+dur);o.connect(g).connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+dur)}catch{}}
function canvas(w=600,h=420){return `<canvas id="canvas" width="${w}" height="${h}" aria-label="${CONFIG.title}のプレイ画面"></canvas>`}
function loop(fn){let active=true,id,last=performance.now();function step(now){if(!active)return;const dt=Math.min((now-last)/1000,.05);last=now;fn(dt,now);if(active)id=requestAnimationFrame(step)}id=requestAnimationFrame(step);cleanup.push(()=>{active=false;cancelAnimationFrame(id)})}
function point(e,c){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function circle(ctx,x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}

function bowlingScore(rolls){let i=0,total=0,frames=[];for(let f=0;f<10;f++){if(rolls[i]===undefined)break;if(rolls[i]===10){if(rolls[i+2]===undefined){frames.push(null);break}total+=10+rolls[i+1]+rolls[i+2];i++}else{if(rolls[i+1]===undefined)break;const s=rolls[i]+rolls[i+1];if(s===10){if(rolls[i+2]===undefined){frames.push(null);break}total+=10+rolls[i+2]}else total+=s;i+=2}frames.push(total)}return{total,frames}}
function mount(){let frame=1,turn=[],rolls=[],pins=[],ball=null,moving=false,timer=0,done=false;stage(canvas(420,540)+'<div class="grid two"><label>投げる位置<input id="position" type="range" min="90" max="330" value="210"></label><label>角度 <span id="degrees">0°</span><input id="angle" type="range" min="-18" max="18" value="0"></label></div><div class="row controls"><button id="throw" class="primary">投げる</button></div><div id="scorecard" class="small center"></div>',stat('フレーム','1 / 10','frame')+stat('確定スコア','0','score'));const c=$('#canvas'),ctx=c.getContext('2d');function rack(){pins=[];for(let row=0;row<4;row++)for(let col=0;col<=row;col++)pins.push({x:210+(col-row/2)*34,y:145-row*29,down:false})}rack();$('#angle').oninput=()=>$('#degrees').textContent=$('#angle').value+'°';$('#throw').onclick=()=>{if(done||moving)return;const a=+$('#angle').value*Math.PI/180;ball={x:+$('#position').value,y:490,vx:Math.sin(a)*400,vy:-Math.cos(a)*400};moving=true;timer=0;$('#throw').disabled=true};function finish(){moving=false;ball=null;let knocked=pins.filter(p=>p.down).length;turn.push(knocked);rolls.push(knocked);pins=pins.filter(p=>!p.down);say(knocked===10?'ストライク！':turn.length===2&&turn[0]+knocked===10?'スペア！':knocked+'本倒した！');let frameDone=false;if(frame<10){frameDone=knocked===10||turn.length===2;if(frameDone){frame++;turn=[];rack()}}else{if(turn.length===1&&knocked===10)rack();else if(turn.length===2){if(turn[0]===10||turn[0]+turn[1]===10){if(pins.length===0)rack()}else frameDone=true}else if(turn.length===3)frameDone=true;if(frameDone){done=true;const score=bowlingScore(rolls).total;$('#score').textContent=score;result('10フレーム終了！',`${score}点！ ベスト ${best(score)}点`)}}const sc=bowlingScore(rolls);$('#score').textContent=sc.total;$('#frame').textContent=Math.min(frame,10)+' / 10';$('#scorecard').textContent='投球：'+rolls.map(n=>n===10?'X':n).join(' · ');$('#throw').disabled=done}function hit(pin,dx,dy){if(pin.down)return;pin.down=true;tone(180,.06);const others=pins.filter(p=>!p.down&&Math.hypot(p.x-pin.x,p.y-pin.y)<43&&p.y<=pin.y+4);for(const p of others){const side=(p.x-pin.x)/34;if(Math.abs(side-dx*.2)<1.2)hit(p,side,dy)}}loop(dt=>{if(done)return;if(moving){timer+=dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<70||ball.x>350){ball.x=clamp(ball.x,55,365);ball.vx=0;ball.gutter=true}if(!ball.gutter)for(const p of pins)if(!p.down&&Math.hypot(p.x-ball.x,p.y-ball.y)<23){hit(p,ball.vx/100,-1);ball.vx+=(ball.x-p.x)*2;ball.vy*=.92}if(ball.y<10||timer>3)finish()}ctx.fillStyle='#202a45';ctx.fillRect(0,0,420,540);ctx.fillStyle='#ad895f';ctx.fillRect(70,20,280,500);ctx.strokeStyle='#96734f';ctx.lineWidth=1;for(let x=90;x<350;x+=20){ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,520);ctx.stroke()}ctx.strokeStyle='#e1d4ad';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(70,440);ctx.lineTo(350,440);ctx.stroke();pins.filter(p=>!p.down).forEach(p=>{circle(ctx,p.x,p.y,10,'#f5f0e4');circle(ctx,p.x,p.y,4,'#ed7591')});if(ball)circle(ctx,ball.x,ball.y,13,'#6d58b3');else circle(ctx,+$('#position').value,490,13,'#6d58b3')})}

function launch(){mount()}
app.innerHTML=`<section class="panel intro"><div class="icon">${CONFIG.emoji}</div><h2>${CONFIG.title}</h2><p>${CONFIG.rules}</p><button class="primary" id="start">あそぶ</button><p class="small">${CONFIG.controls}</p></section>`;
