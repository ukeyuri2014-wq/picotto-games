  <!-- 1だんめ：し い く い ん（きいろ まる・きいろ まる・みずいろ・はい・はい） -->
  <g transform="translate(29 22)">
    <g filter="url(#c062soft)" opacity="0.5" fill="#ffd166"><circle cx="31" cy="33" r="31"/><circle cx="101" cy="33" r="31"/></g>
    <rect x="140" y="2" width="62" height="62" rx="11" fill="#53e0d8" filter="url(#c062soft)" opacity="0.5"/>
    <circle cx="31" cy="31" r="31" fill="url(#c062near)" stroke="#fff3c9" stroke-width="2"/>
    <circle cx="101" cy="31" r="31" fill="url(#c062near)" stroke="#fff3c9" stroke-width="2"/>
    <rect x="140" y="0" width="62" height="62" rx="11" fill="url(#c062ok)" stroke="#b6fff8" stroke-width="2"/>
    <rect x="210" y="0" width="62" height="62" rx="11" fill="url(#c062no)" stroke="#55557a" stroke-width="2"/>
    <rect x="280" y="0" width="62" height="62" rx="11" fill="url(#c062no)" stroke="#55557a" stroke-width="2"/>
    <rect x="143" y="3" width="56" height="30" rx="9" fill="url(#c062shine)"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.5">
      <!-- し -->
      <path d="M23 13 L23 39 Q23 51 34 49 Q43 47 46 37" stroke="#3a2700"/>
      <!-- い -->
      <g transform="translate(70 0)" stroke="#3a2700"><path d="M19 17 Q17 38 25 45 L28 40"/><path d="M41 20 Q47 29 46 40"/></g>
      <!-- く -->
      <g transform="translate(140 0)" stroke="#06302d"><path d="M40 13 L22 31 L40 49"/></g>
      <!-- い -->
