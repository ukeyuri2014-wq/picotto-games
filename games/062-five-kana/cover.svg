      <!-- ん -->
      <g transform="translate(280 0)" stroke="#a9a6c8"><path d="M33 12 L17 48 Q23 33 29 35 Q33 37 33 44 Q34 50 40 49 Q46 47 48 38"/></g>
    </g>
  </g>

  <!-- 2だんめ：う つ く し い（ぜんぶ みずいろ＝せいかい） -->
  <g transform="translate(29 98)">
    <rect x="-6" y="-6" width="354" height="74" rx="16" fill="#53e0d8" opacity="0.35" filter="url(#c062blur)"/>
    <g fill="url(#c062ok)" stroke="#b6fff8" stroke-width="2">
      <rect x="0" y="0" width="62" height="62" rx="11"/><rect x="70" y="-7" width="62" height="62" rx="11"/><rect x="140" y="0" width="62" height="62" rx="11"/>
      <rect x="210" y="-7" width="62" height="62" rx="11"/><rect x="280" y="0" width="62" height="62" rx="11"/>
    </g>
    <g fill="url(#c062shine)">
      <rect x="3" y="3" width="56" height="30" rx="9"/><rect x="73" y="-4" width="56" height="30" rx="9"/><rect x="143" y="3" width="56" height="30" rx="9"/>
      <rect x="213" y="-4" width="56" height="30" rx="9"/><rect x="283" y="3" width="56" height="30" rx="9"/>
    </g>
    <g fill="none" stroke="#06302d" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.5">
      <!-- う -->
      <path d="M24 13 Q32 14 39 17"/><path d="M19 30 Q43 20 44 34 Q44 46 30 52"/>
      <!-- つ -->
      <g transform="translate(70 -7)"><path d="M13 27 Q49 14 49 31 Q49 46 27 50"/></g>
      <!-- く -->
      <g transform="translate(140 0)"><path d="M40 13 L22 31 L40 49"/></g>
      <!-- し -->
      <g transform="translate(210 -7)"><path d="M23 13 L23 39 Q23 51 34 49 Q43 47 46 37"/></g>
      <!-- い -->
      <g transform="translate(280 0)"><path d="M19 17 Q17 38 25 45 L28 40"/><path d="M41 20 Q47 29 46 40"/></g>
    </g>
  </g>

  <!-- きらきら -->
  <g fill="#ffd166">
    <path d="M22 92 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M379 84 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z"/>
    <path d="M200 78 l1.8 4.8 4.8 1.8 -4.8 1.8 -1.8 4.8 -1.8 -4.8 -4.8 -1.8 4.8 -1.8z" fill="#ffffff"/>
  </g>
  <g fill="#ff5fa2"><rect x="52" y="176" width="7" height="4" rx="1" transform="rotate(-24 55 178)"/><rect x="338" y="172" width="7" height="4" rx="1" transform="rotate(30 341 174)"/></g>
  <g fill="#a06bff"><rect x="364" y="150" width="7" height="4" rx="1" transform="rotate(-40 367 152)"/><rect x="30" y="148" width="7" height="4" rx="1" transform="rotate(18 33 150)"/></g>

