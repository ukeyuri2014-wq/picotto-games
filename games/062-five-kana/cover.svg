  <g transform="translate(47 182)">
    <g fill="#1c1c33" stroke="#3a3a63" stroke-width="1.5">
      <rect x="0" y="0" width="27" height="24" rx="5"/><rect x="31" y="0" width="27" height="24" rx="5"/><rect x="93" y="0" width="27" height="24" rx="5"/>
      <rect x="155" y="0" width="27" height="24" rx="5"/><rect x="186" y="0" width="27" height="24" rx="5"/><rect x="248" y="0" width="27" height="24" rx="5"/>
      <rect x="279" y="0" width="27" height="24" rx="5"/>
    </g>
    <rect x="62" y="0" width="27" height="24" rx="5" fill="#2fb8b0" stroke="#9bfff6" stroke-width="1.5"/>
    <rect x="124" y="0" width="27" height="24" rx="12" fill="#f0b63c" stroke="#fff0bd" stroke-width="1.5"/>
    <rect x="217" y="0" width="27" height="24" rx="5" fill="#151526" stroke="#232340" stroke-width="1.5"/>
    <g fill="none" stroke-linecap="round" stroke-width="2.2" stroke="#9d99c0">
      <path d="M9 8 h9 M13 6 v12"/><path d="M40 7 q-1 8 3 10 M49 8 q2 4 1 8"/><path d="M103 8 q8 -2 8 4 q0 5 -6 6"/>
      <path d="M164 8 h9 M166 13 q8 -2 7 4"/><path d="M196 7 v9 q1 3 6 0"/><path d="M259 6 l-5 6 l5 6"/><path d="M288 9 h9 M288 15 h9"/>
    </g>
    <path d="M73 6 l-5 6 l5 6" fill="none" stroke="#06302d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M133 7 q-1 8 3 10 M142 8 q2 4 1 8" fill="none" stroke="#3a2700" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M226 9 h9 M226 15 h9" fill="none" stroke="#5d5a80" stroke-width="2.2" stroke-linecap="round"/>
