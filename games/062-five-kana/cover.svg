    <linearGradient id="c062shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="c062blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="c062soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="400" height="225" fill="url(#c062bg)"/>
  <!-- ほし -->
  <g fill="#eeecfa">
    <circle cx="22" cy="18" r="1.2" opacity="0.8"/><circle cx="70" cy="9" r="0.9" opacity="0.6"/><circle cx="128" cy="15" r="1.1" opacity="0.7"/>
    <circle cx="205" cy="8" r="0.9" opacity="0.6"/><circle cx="268" cy="14" r="1.3" opacity="0.8"/><circle cx="330" cy="7" r="0.9" opacity="0.6"/>
    <circle cx="384" cy="20" r="1.2" opacity="0.7"/><circle cx="12" cy="98" r="1" opacity="0.5"/><circle cx="390" cy="104" r="1.1" opacity="0.6"/>
    <circle cx="8" cy="170" r="1" opacity="0.5"/><circle cx="393" cy="182" r="1" opacity="0.5"/>
