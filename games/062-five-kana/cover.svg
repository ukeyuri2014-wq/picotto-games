<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c062bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b1e"/>
      <stop offset="0.6" stop-color="#1d1a44"/>
      <stop offset="1" stop-color="#3a1f66"/>
    </linearGradient>
    <radialGradient id="c062glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#53e0d8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#53e0d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c062ok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff7ee"/>
      <stop offset="1" stop-color="#27a9a2"/>
    </linearGradient>
    <linearGradient id="c062near" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#eda92c"/>
