<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="c051bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2a2163"/>
      <stop offset="0.55" stop-color="#181a40"/>
      <stop offset="1" stop-color="#0d0d1c"/>
    </radialGradient>
    <radialGradient id="c051w" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ebe9fb"/>
      <stop offset="1" stop-color="#a9a6d2"/>
    </radialGradient>
    <radialGradient id="c051k" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#655c94"/>
      <stop offset="0.55" stop-color="#211c38"/>
      <stop offset="1" stop-color="#0a0912"/>
    </radialGradient>
    <radialGradient id="c051glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c051line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="c051blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="c051soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <g id="c051star"><path d="M0,-9 L2.4,-2.4 L9,0 L2.4,2.4 L0,9 L-2.4,2.4 L-9,0 L-2.4,-2.4 Z"/></g>
  </defs>

  <rect width="400" height="225" fill="url(#c051bg)"/>

  <!-- far stars -->
  <g fill="#d6d9ff">
    <circle cx="22" cy="18" r="1" opacity=".5"/><circle cx="58" cy="52" r="0.8" opacity=".35"/><circle cx="351" cy="26" r="1.1" opacity=".55"/>
    <circle cx="382" cy="92" r="0.8" opacity=".4"/><circle cx="318" cy="188" r="1" opacity=".45"/><circle cx="15" cy="150" r="0.9" opacity=".4"/>
    <circle cx="288" cy="14" r="0.8" opacity=".35"/><circle cx="85" cy="12" r="0.9" opacity=".4"/><circle cx="372" cy="158" r="1.1" opacity=".5"/>
    <circle cx="46" cy="204" r="0.9" opacity=".4"/><circle cx="246" cy="206" r="0.8" opacity=".35"/><circle cx="116" cy="62" r="0.7" opacity=".3"/>
  </g>

  <!-- board lines -->
  <g stroke="#9aa6f0" stroke-opacity="0.34" stroke-width="1.3">
    <path d="M30,0V225 M64,0V225 M98,0V225 M132,0V225 M166,0V225 M200,0V225 M234,0V225 M268,0V225 M302,0V225 M336,0V225 M370,0V225"/>
    <path d="M0,10H400 M0,44H400 M0,78H400 M0,112H400 M0,146H400 M0,180H400 M0,214H400"/>
  </g>
  <circle cx="200" cy="112" r="3.6" fill="#53e0d8" opacity=".9"/>
  <circle cx="98" cy="44" r="3" fill="#53e0d8" opacity=".6"/>
  <circle cx="302" cy="180" r="3" fill="#53e0d8" opacity=".6"/>

  <!-- glow under the winning five -->
  <line x1="98" y1="180" x2="234" y2="44" stroke="#ffd166" stroke-width="26" stroke-linecap="round" opacity=".5" filter="url(#c051blur)"/>
  <circle cx="234" cy="44" r="46" fill="url(#c051glow)"/>

  <!-- black stones -->
  <g stroke="#a47bff" stroke-width="1.6">
    <g fill="#a06bff" opacity=".55" stroke="none" filter="url(#c051soft)">
      <circle cx="64" cy="214" r="16"/><circle cx="132" cy="112" r="16"/><circle cx="166" cy="146" r="16"/><circle cx="200" cy="112" r="16"/>
      <circle cx="234" cy="78" r="16"/><circle cx="268" cy="112" r="16"/><circle cx="166" cy="78" r="16"/><circle cx="302" cy="146" r="16"/><circle cx="302" cy="78" r="16"/>
    </g>
    <g fill="url(#c051k)">
      <circle cx="64" cy="214" r="14.5"/><circle cx="132" cy="112" r="14.5"/><circle cx="166" cy="146" r="14.5"/><circle cx="200" cy="112" r="14.5"/>
      <circle cx="234" cy="78" r="14.5"/><circle cx="268" cy="112" r="14.5"/><circle cx="166" cy="78" r="14.5"/><circle cx="302" cy="146" r="14.5"/><circle cx="302" cy="78" r="14.5"/>
    </g>
  </g>
  <g fill="#ffffff" opacity=".22">
    <ellipse cx="59" cy="208" rx="4.4" ry="2.2" transform="rotate(-28 59 208)"/><ellipse cx="127" cy="106" rx="4.4" ry="2.2" transform="rotate(-28 127 106)"/>
    <ellipse cx="161" cy="140" rx="4.4" ry="2.2" transform="rotate(-28 161 140)"/><ellipse cx="195" cy="106" rx="4.4" ry="2.2" transform="rotate(-28 195 106)"/>
    <ellipse cx="229" cy="72" rx="4.4" ry="2.2" transform="rotate(-28 229 72)"/><ellipse cx="263" cy="106" rx="4.4" ry="2.2" transform="rotate(-28 263 106)"/>
    <ellipse cx="161" cy="72" rx="4.4" ry="2.2" transform="rotate(-28 161 72)"/><ellipse cx="297" cy="140" rx="4.4" ry="2.2" transform="rotate(-28 297 140)"/>
    <ellipse cx="297" cy="72" rx="4.4" ry="2.2" transform="rotate(-28 297 72)"/>
  </g>

  <!-- other white stones -->
  <g fill="#53e0d8" opacity=".5" filter="url(#c051soft)"><circle cx="132" cy="180" r="16"/><circle cx="268" cy="146" r="16"/><circle cx="234" cy="146" r="16"/></g>
  <g fill="url(#c051w)" stroke="#53e0d8" stroke-width="1.6"><circle cx="132" cy="180" r="14.5"/><circle cx="268" cy="146" r="14.5"/><circle cx="234" cy="146" r="14.5"/></g>

  <!-- the winning five and the line that joins them -->
  <line x1="98" y1="180" x2="234" y2="44" stroke="url(#c051line)" stroke-width="7" stroke-linecap="round"/>
  <g fill="#ffd166" opacity=".65" filter="url(#c051soft)">
    <circle cx="98" cy="180" r="18"/><circle cx="132" cy="146" r="18"/><circle cx="166" cy="112" r="18"/><circle cx="200" cy="78" r="18"/><circle cx="234" cy="44" r="19"/>
  </g>
  <g fill="url(#c051w)" stroke="#ffd166" stroke-width="2.2">
    <circle cx="98" cy="180" r="14.5"/><circle cx="132" cy="146" r="14.5"/><circle cx="166" cy="112" r="14.5"/><circle cx="200" cy="78" r="14.5"/><circle cx="234" cy="44" r="15.5"/>
  </g>
  <g fill="#ffb347">
    <use href="#c051star" transform="translate(98 180) scale(.62)"/><use href="#c051star" transform="translate(132 146) scale(.62)"/>
    <use href="#c051star" transform="translate(166 112) scale(.62)"/><use href="#c051star" transform="translate(200 78) scale(.62)"/>
    <use href="#c051star" transform="translate(234 44) scale(.8)"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff3c4">
    <use href="#c051star" transform="translate(262 22) scale(1.25)"/><use href="#c051star" transform="translate(212 20) scale(.6)"/>
    <use href="#c051star" transform="translate(258 62) scale(.5)"/><use href="#c051star" transform="translate(76 156) scale(.55)"/>
  </g>
  <g fill="#53e0d8"><use href="#c051star" transform="translate(338 44) scale(.9)"/><use href="#c051star" transform="translate(44 96) scale(.7)"/></g>
  <g fill="#ff5fa2"><use href="#c051star" transform="translate(350 122) scale(.6)"/><use href="#c051star" transform="translate(110 24) scale(.55)"/></g>

  <!-- soft vignette -->
  <rect width="400" height="225" fill="none" stroke="#0d0d1c" stroke-width="26" opacity=".35" filter="url(#c051blur)"/>
</svg>
