      <g fill="#2a1420"><ellipse cx="-24" cy="1" rx="2.6" ry="3.8"/><ellipse cx="-6" cy="-1" rx="2.6" ry="3.8"/><ellipse cx="12" cy="2" rx="2.6" ry="3.8"/><ellipse cx="28" cy="0" rx="2.6" ry="3.8"/></g>
