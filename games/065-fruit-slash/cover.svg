    <circle cx="13" cy="-34" r="5" fill="#ffd166"/><circle cx="13" cy="-34" r="2.5" fill="#fff"/>
    <path d="M-12 -8 l9 4 M12 -8 l-9 4" stroke="#ff5fa2" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="-7" cy="1" r="3" fill="#ffe3ef"/><circle cx="7" cy="1" r="3" fill="#ffe3ef"/>
    <path d="M-7 11 l3.5 -3 3.5 3 3.5 -3 3.5 3" stroke="#ffe3ef" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
