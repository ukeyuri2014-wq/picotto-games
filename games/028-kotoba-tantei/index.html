 const keys=`<div class="kb" style="--cols:10">${Array.from({length:5},(_,r)=>KB_COLS.map(col=>{const c=col[r];return c&&c!==' '?`<button class="k" data-k="${c}" aria-label="${c}">${c}</button>`:'<span class="k blank"></span>'}).join('')).join('')}</div>
 <div class="kb-actions"><button class="k wide" data-act="daku" aria-label="だくてん・はんだくてん">゛゜</button><button class="k wide" data-act="small" aria-label="ちいさい もじ">小</button><button class="k wide" data-act="back" aria-label="1もじ けす">⌫ けす</button><button class="k wide enter primary" data-act="enter">こたえる</button></div>`;
 app.innerHTML=`<section class="panel game"><div class="toolbar"><div class="stat inline"><small>のこり</small><b id="remaining">6回</b><small>🔥</small><b id="streak" aria-label="れんぞく せいかい">${getStats(len).streak}</b></div><div class="row tools"><button id="hint" class="hint-btn" disabled>💡 ヒント</button>${muteBtn()}<button id="restart" aria-label="モードを えらぶ">≡</button></div></div>
 <div class="play-area"><div id="board" class="tboard len${len}">${tiles}</div>
 <div class="side"><div id="notice" class="notice" role="status" aria-live="polite">${len}もじの ことばを さがそう！</div>
 <div id="keys">${keys}</div></div></div><div id="result-layer"></div></section>`;
 bindMute();
 $('#restart').onclick=title;$('#hint').onclick=useHint;updateHintBtn();
 $$('.k[data-k]').forEach(b=>b.onclick=()=>typeKana(b.dataset.k));
 $$('.k[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
 $('#board').scrollIntoView?.({block:'nearest'});
 window.scrollTo(0,0);
}
function say(s,cls=''){const n=$('#notice');if(n){n.textContent=s;n.className='notice '+cls}}
function rowEl(r){return $(`.wordrow[data-row="${r}"]`)}
function renderCur(){if(!game)return;const row=rowEl(game.row);[...row.children].forEach((t,i)=>{t.textContent=game.cur[i]||'';t.classList.toggle('filled',!!game.cur[i])})}
function typeKana(c){if(!game||game.done||game.busy)return;if(game.cur.length>=len){bump();return}game.cur.push(c);renderCur();const t=rowEl(game.row).children[game.cur.length-1];t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');SFX.key()}
function bump(){const row=rowEl(game.row);row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');SFX.bad()}
function act(a){if(!game||game.done||game.busy)return;const L=game.cur.length;
 if(a==='back'){if(!L)return;game.cur.pop();renderCur();SFX.del();return}
 if(a==='daku'||a==='small'){if(!L){say('さきに もじを えらんでね');return}const c=game.cur[L-1],n=a==='daku'?cycleDaku(c):toggleSmall(c);if(n===c){say(`「${c}」には つけられないよ`);bump();return}game.cur[L-1]=n;renderCur();SFX.key();return}
 if(a==='enter')submit();}
function submit(){const g=game.cur.join('');
 if(game.cur.length<len){say(`あと ${len-game.cur.length}もじ いれてね`,'warn');bump();return}
 if(!DICT[len].has(g)){say(`「${g}」は ことばリストに ないみたい。ほかの ことばに しよう`,'warn');bump();return}
 const marks=judgeWord(game.chars,game.cur),row=rowEl(game.row),r=game.row;game.busy=true;
 [...row.children].forEach((t,i)=>{later(()=>{t.classList.add('flip');later(()=>t.classList.add(marks[i]),230)},i*200);SFX.flip(marks[i],i)});
 row.setAttribute('aria-label',`${g}：`+marks.map(m=>({exact:'せいかい',present:'ばしょちがい',absent:'はいってない'}[m])).join('、'));
 const won=g===game.answer;
 later(()=>{game.busy=false;
  game.cur.forEach((c,i)=>{const k=base(c),rank={absent:1,present:2,exact:3}[marks[i]];if(marks[i]==='absent'&&c!==k)return;if((game.keys[k]||0)<rank)game.keys[k]=rank});
  $$('.k[data-k]').forEach(b=>{const v=game.keys[b.dataset.k];b.classList.toggle('exact',v===3);b.classList.toggle('present',v===2);b.classList.toggle('absent',v===1)});
  game.row++;game.cur=[];$('#remaining').textContent=(6-game.row)+'回';
  if(won){[...row.children].forEach((t,i)=>later(()=>t.classList.add('jump'),i*90));finish(true)}
  else if(game.row>=6)finish(false);
  else{const left=6-game.row;const n=marks.filter(m=>m==='exact').length,p=marks.filter(m=>m==='present').length;
   say(n?`みどりが ${n}こ！ ${p?`きいろも ${p}こ。`:''}のこり ${left}回`:p?`きいろが ${p}こ。ばしょを かえてみよう（のこり ${left}回）`:`ぜんぶ はずれ。つかっていない もじを ためそう（のこり ${left}回）`);
   updateHintBtn(true)}
 },len*200+320);}
function judgeWord(ans,guess){const out=Array(ans.length).fill('absent'),left={};ans.forEach((c,i)=>{if(guess[i]===c)out[i]='exact';else left[c]=(left[c]||0)+1});guess.forEach((c,i)=>{if(out[i]!=='exact'&&left[c]){out[i]='present';left[c]--}});return out}
function hintUnlocked(){return game.row>=4?2:game.row>=2?1:0}
function updateHintBtn(announce){const b=$('#hint');if(!b||!game)return;const u=hintUnlocked();
 if(game.hints<u){b.disabled=false;b.classList.add('ready');b.textContent=game.hints===0?'💡 ヒント1':'💡 ヒント2';if(announce&&game.hints===u-1&&game.row===(u===1?2:4))SFX.hint()}
 else{b.disabled=true;b.classList.remove('ready');b.textContent=game.hints>=2?'💡 おわり':`💡 あと${(game.hints?4:2)-game.row}回`}}
function useHint(){if(!game||game.done)return;const u=hintUnlocked();if(game.hints>=u)return;game.hints++;SFX.hint();
 say(game.hints===1?`ヒント1：なかまは「${game.cat}」`:`ヒント2：${game.desc}`,'hint');updateHintBtn()}
function finish(won){game.done=true;const hb=$('#hint');if(hb){hb.disabled=true;hb.classList.remove('ready')}const s=getStats(len);s.played++;
 if(won){s.wins++;s.streak++;s.maxStreak=Math.max(s.maxStreak,s.streak);s.dist[game.row-1]++}else s.streak=0;
 save('stats'+len,s);$('#streak').textContent=s.streak;
 const tries=game.row,delay=won?.5:.2;won?SFX.win(delay):SFX.lose(delay);
 const stars=won?(tries<=2?'⭐⭐⭐':tries<=4?'⭐⭐':'⭐'):'';
 const max=Math.max(1,...s.dist);
 later(()=>{if(won)confetti();
  $('#result-layer').innerHTML=`<div class="modal-back"><section class="modal ${won?'win':'lose'}" role="dialog" aria-label="けっか">
  <h2>${won?'めいたんてい！':'ざんねん…'} ${stars}</h2>
  <p class="answer">こたえは <b>${game.answer}</b></p><p class="desc">${game.desc}</p>
  <p class="line">${won?`${tries}回で せいかい！${game.hints?`（ヒント ${game.hints}こ）`:'（ヒントなし！）'}`:'つぎは きっと わかるよ！'}</p>
  <div class="dist" aria-label="せいかいした回数の グラフ">${s.dist.map((v,i)=>`<div class="bar-row"><span>${i+1}</span><i style="width:${Math.max(8,v/max*100)}%" class="${won&&i===tries-1?'me':''}">${v}</i></div>`).join('')}</div>
  <p class="small">れんぞく <b>${s.streak}</b> ／ さいこう <b>${s.maxStreak}</b> ／ せいかい ${s.wins}/${s.played}</p>
  <div class="row center-row"><button id="again" class="primary">つぎの もんだい ▶</button><button id="menu">もどる</button></div></section></div>`;
  $('#again').onclick=start;$('#menu').onclick=title;$('#again').focus({preventScroll:true});
 },won?len*90+700:500);}
function confetti(){const layer=document.createElement('div');layer.className='confetti';const cs=['#7ce0c1','#ffd166','#ff8fb3','#8fb8ff','#fff'];for(let i=0;i<36;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cs[i%cs.length];p.style.animationDelay=Math.random()*.4+'s';p.style.setProperty('--dx',(Math.random()*120-60)+'px');layer.appendChild(p)}$('.panel.game')?.appendChild(layer);later(()=>layer.remove(),2600)}

/* ---------- PCキーボード ---------- */
window.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(!game){if(e.key==='Enter'&&$('#start')){e.preventDefault();start()}return}
 if(game.done){if(e.key==='Enter'&&$('#again')&&document.activeElement!==$('#menu')){e.preventDefault();start()}return}
 const k=e.key;
 if(k==='Enter'){e.preventDefault();if(game.buf==='n'){game.buf='';typeKana('ん')}act('enter');return}
 if(k==='Backspace'){e.preventDefault();if(game.buf){game.buf='';say('')}else act('back');return}
 if(/^[ぁ-ゖー]$/.test(k)){typeKana(k);return}
 if(!/^[a-z'-]$/i.test(k))return;e.preventDefault();
 let b=game.buf+k.toLowerCase();
 const emit=s=>[...s].forEach(typeKana);
 for(let guard=0;guard<4&&b;guard++){
  if(RT[b]){emit(RT[b]);b='';break}
  if(b.length>=2&&b[0]===b[1]&&b[0]!=='n'&&/[bcdfghjkmpqrstvwxyz]/.test(b[0])){emit('っ');b=b.slice(1);continue}
  if(b.length>=2&&b[0]==='n'&&!/[aiueoyn']/.test(b[1])){emit('ん');b=b.slice(1);continue}
  if(RT_PREFIX.has(b))break;
  b=b.slice(-1);if(!RT_PREFIX.has(b))b='';break}
 game.buf=b;if(b)say('ローマ字：'+b);
});

title();

</script></body></html>
