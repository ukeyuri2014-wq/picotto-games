      <stop offset="1" stop-color="#ff5fa2" stop-opacity=".8"/>
    </linearGradient>
    <filter id="c068glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="c068shadow" x="-30%" y="-30%" width="160%" height="170%">
