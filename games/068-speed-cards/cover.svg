<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="c068bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#2a2a5c"/>
      <stop offset="1" stop-color="#0e0e1c"/>
    </radialGradient>
    <linearGradient id="c068face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d5f0"/>
    </linearGradient>
    <linearGradient id="c068cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2aa8b8"/>
      <stop offset="1" stop-color="#1b4f86"/>
    </linearGradient>
    <linearGradient id="c068pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8478f"/>
      <stop offset="1" stop-color="#6a2f9c"/>
