      <rect x="-76" y="-48" width="48" height="48" rx="6"/><rect x="-24" y="-48" width="48" height="48" rx="6"/><rect x="28" y="-48" width="48" height="48" rx="6"/>
      <rect x="-76" y="4" width="48" height="48" rx="6"/><rect x="-24" y="4" width="48" height="48" rx="6"/><rect x="28" y="4" width="48" height="48" rx="6"/>
      <rect x="-76" y="56" width="48" height="48" rx="6"/><rect x="-24" y="56" width="48" height="48" rx="6"/><rect x="28" y="56" width="48" height="48" rx="6"/>
