      <stop offset="1" stop-color="#0d0d1c"/>
    </linearGradient>
    <radialGradient id="c081glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a06bff" stop-opacity="0.55"/>
