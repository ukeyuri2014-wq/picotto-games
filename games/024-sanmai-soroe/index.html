<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  // 盤面：半タイル単位のグリッド。タイル1枚は 2x2 半単位を占める
  const TW = 48, TH = 54, HX = 24, HY = 27, GW = 18, GH = 16;
  const FX = 24, FY = 72, LX = -1, LY = -2;             // 層ごとの見た目オフセット
  const TRAY_N = 7, SLOT_W = 56, SLOT_GAP = 6, TRAY_X = 26, TRAY_Y = 516, TRAY_H = 82, SLOT_Y = 530;
  const TRAY_W = TRAY_N * SLOT_W + (TRAY_N - 1) * SLOT_GAP;
  const KEY = 'picotto_sanmai_soroe_';
  const MUTE_KEY = KEY + 'mute', LEVEL_KEY = KEY + 'level', BEST_KEY = KEY + 'best', CLEARS_KEY = KEY + 'clears';
  const EMOJI = ['🍎', '🍇', '🍋', '🍓', '🌙', '⭐', '🐱', '🐸', '🍙', '🍩', '🌈', '🎈', '🐟', '🍄', '🔔'];
  const GOLD = '#ffd166', CYAN = '#53e0d8', PINK = '#ff5fa2', VIOLET = '#a06bff', SUB = '#9d99c0';
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';

  // ---- rng (mulberry32) -------------------------------------------------------
  let seed = (Math.random() * 4294967296) >>> 0;
  function rng() { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  const ri = n => Math.floor(rng() * n);
  function shuffleArray(a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // ---- sound ---------------------------------------------------------------
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
  let ac = null;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (muted) return; const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(); const t = a.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const SFX = {
    pick() { tone('triangle', 520, 900, 0.09, 0.06); },
    land() { tone('square', 230, 140, 0.05, 0.035); },
    bad() { tone('sawtooth', 150, 80, 0.16, 0.05); },
    triple(n) { const m = 1 + Math.min(n, 5) * 0.05; [660, 880, 1320].forEach((f, i) => tone('square', f * m, f * m, 0.12, 0.06, i * 0.06)); tone('sine', 1760 * m, 2400, 0.28, 0.03, 0.18); },
    tool() { tone('triangle', 400, 640, 0.12, 0.05); tone('triangle', 640, 960, 0.12, 0.04, 0.1); },
    shuffle() { for (let i = 0; i < 7; i++) tone('square', 320 + i * 70, 320 + i * 70, 0.04, 0.03, i * 0.045); },
    clear() { [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone('square', f, f, 0.18, 0.07, i * 0.09)); tone('triangle', 2093, 2093, 0.5, 0.05, 0.55); },
    over() { tone('sawtooth', 300, 70, 0.6, 0.07); tone('sawtooth', 220, 55, 0.7, 0.05, 0.15); },
    hover() { tone('square', 900, 900, 0.03, 0.02); },
  };
  const muteBtn = document.getElementById('mute-btn');
  function drawMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }

  // ---- state ---------------------------------------------------------------
  let tiles = [], tray = [], level = 1, best = 0, clears = 0, moves = 0;
  let phase = 'title';               // title | play | cleared | over
  let tools = { undo: 1, shuffle: 1, out: 1 };
  let pickStack = [];                // トレイにある札を取った順に
  let solutionOrder = null;          // 生成時の「解ける順序」（id列）
  let combo = 0, lastClear = null, resultToken = 0;
  // visuals
  let flights = [], pops = [], particles = [], rings = [], texts = [], wiggles = {}, vis = {}, returning = {};
  let anim = 0, shake = 0, shuffleAnim = 0, oldKinds = null, hoverId = null, cursorId = null, kbMode = false, flash = 0;
  const overlay = document.getElementById('overlay');
  const $ = id => document.getElementById(id);
  try {
    level = Math.max(1, parseInt(localStorage.getItem(LEVEL_KEY) || '1', 10) || 1);
    best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
    clears = parseInt(localStorage.getItem(CLEARS_KEY) || '0', 10) || 0;
  } catch (e) {}
  function save(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
  const byId = id => tiles.find(t => t.id === id) || tiles.find(t => String(t.id) === String(id)) || null;

  // ---- geometry / coverage -------------------------------------------------
  const overlaps = (a, b) => Math.abs(a.x - b.x) < 2 && Math.abs(a.y - b.y) < 2;
  function computeCover() {
    const alive = tiles.filter(t => !t.removed);
    for (const t of tiles) if (t.removed) { t.cover = 0; t.covered = false; }
    for (const a of alive) {
      let q = 0;
      for (const b of alive) {
        if (b.layer <= a.layer || !overlaps(a, b)) continue;
        for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
          const qx = a.x + i, qy = a.y + j;
          if (qx >= b.x && qx < b.x + 2 && qy >= b.y && qy < b.y + 2) q |= 1 << (i * 2 + j);
        }
      }
      const n = (q & 1) + (q >> 1 & 1) + (q >> 2 & 1) + (q >> 3 & 1);
      a.cover = n / 4; a.covered = n > 0;
    }
  }
  const tilePx = t => ({ x: FX + t.x * HX + t.layer * LX, y: FY + t.y * HY + t.layer * LY });
  const slotPx = i => ({ x: TRAY_X + i * (SLOT_W + SLOT_GAP) + (SLOT_W - TW) / 2, y: SLOT_Y });

  // ---- level generation ----------------------------------------------------------
  function levelParams(L) {
    L = Math.max(1, L | 0);
    return {
      count: Math.min(150, 18 + (L - 1) * 9),                 // 常に3の倍数
      layers: Math.min(8, 1 + Math.ceil(L / 2)),
      kinds: Math.min(EMOJI.length, 4 + Math.floor(L * 0.8)),
      groups: L <= 2 ? 2 : 3,                                  // 同時に「そろえかけ」にする絵柄の数（≦3 → トレイ6枚以内で解ける）
      pOpen: Math.min(0.75, 0.45 + L * 0.03),
      linger: Math.min(0.5, Math.max(0, (L - 2) * 0.06)),
      stackChance: L >= 4 ? Math.min(0.3, (L - 3) * 0.06) : 0,
    };
  }
  function growBlob(cands, n, cx, cy) {
    if (n <= 0 || !cands.length) return [];
    const key = c => c.x + ',' + c.y;
    const pool = new Map(cands.map(c => [key(c), c]));
    const chosen = [], chosenSet = new Set();
    const dist = c => Math.hypot(c.x - cx, c.y - cy);
    const sorted = cands.slice().sort((a, b) => dist(a) - dist(b));
    let frontier = [];
    const add = c => {
      chosen.push(c); chosenSet.add(key(c));
      for (const [dx, dy] of [[2, 0], [-2, 0], [0, 2], [0, -2]]) {
        const k = (c.x + dx) + ',' + (c.y + dy); const nb = pool.get(k);
        if (nb && !chosenSet.has(k) && frontier.indexOf(nb) < 0) frontier.push(nb);
      }
    };
    while (chosen.length < n) {
      if (!frontier.length) { const s = sorted.find(c => !chosenSet.has(key(c))); if (!s) break; add(s); continue; }
      let idx;
      if (rng() < 0.6) { let bd = Infinity; idx = 0; frontier.forEach((c, i) => { const d = dist(c) + rng() * 1.2; if (d < bd) { bd = d; idx = i; } }); }
      else idx = ri(frontier.length);
      const c = frontier.splice(idx, 1)[0]; add(c);
    }
    return chosen;
  }
  function genLayout(count, layers, stackChance, attempt) {
    const decay = 0.72, w = []; let ws = 0;
    for (let k = 0; k < layers; k++) { w.push(Math.pow(decay, k)); ws += w[k]; }
    const target = w.map(v => Math.round(count * v / ws));
    target[0] += count - target.reduce((a, b) => a + b, 0);
    const need = Math.ceil(target[0] * 1.35) + attempt * 3;
    let rows0 = 2, cols0 = 2;
    for (rows0 = 2; rows0 <= 8; rows0++) { cols0 = Math.max(2, Math.min(9, Math.round(rows0 * 9 / 8))); if (cols0 * rows0 >= need) break; }
    if (rows0 > 8) { rows0 = 8; cols0 = 9; }
    const x0 = 9 - cols0, y0 = 8 - rows0;
    const cx = x0 + cols0 - 1, cy = y0 + rows0 - 1;
    let px = x0 & 1, py = y0 & 1;
    const placed = [], perLayer = [];
    let leftover = 0;
    for (let k = 0; k < layers; k++) {
      if (k > 0) {
        let sh = [[1, 1], [1, 1], [1, 1], [1, 0], [0, 1]][ri(5)];
        if (rng() < stackChance) sh = [0, 0];
        px = (px + sh[0]) & 1; py = (py + sh[1]) & 1;
      }
      const inset = Math.floor(k / 2);
      const xmin = Math.max(0, x0 + inset), xmax = Math.min(GW - 2, x0 + 2 * cols0 - 2 - inset);
      const ymin = Math.max(0, y0 + inset), ymax = Math.min(GH - 2, y0 + 2 * rows0 - 2 - inset);
      const below = perLayer[k - 1] || [];
      const cands = [];
      for (let x = xmin; x <= xmax; x++) {
        if ((x & 1) !== px) continue;
        for (let y = ymin; y <= ymax; y++) {
          if ((y & 1) !== py) continue;
          if (k > 0 && !below.some(b => overlaps(b, { x, y }))) continue;
          cands.push({ x, y });
        }
      }
      const want = target[k] + leftover;
      const chosen = growBlob(cands, Math.min(want, cands.length), cx, cy);
      leftover = want - chosen.length;
      const lt = chosen.map(c => ({ x: c.x, y: c.y, layer: k }));
      perLayer.push(lt); placed.push(...lt);
    }
    for (let k = 0; k < layers && leftover > 0; k++) {
      const L = perLayer[k]; if (!L.length && k > 0) continue;
      const pk = L.length ? [L[0].x & 1, L[0].y & 1] : [x0 & 1, y0 & 1];
      const below = perLayer[k - 1] || [];
      const free = [];
      for (let x = 0; x <= GW - 2; x++) {
        if ((x & 1) !== pk[0]) continue;
        for (let y = 0; y <= GH - 2; y++) {
          if ((y & 1) !== pk[1]) continue;
          if (L.some(t => t.x === x && t.y === y)) continue;
          if (k > 0 && !below.some(b => overlaps(b, { x, y }))) continue;
          free.push({ x, y, d: Math.hypot(x - cx, y - cy) + rng() * 2 });
        }
      }
      free.sort((a, b) => a.d - b.d);
      while (free.length && leftover > 0) { const c = free.shift(); const t = { x: c.x, y: c.y, layer: k }; L.push(t); placed.push(t); leftover--; }
    }
    if (leftover > 0) return null;
    return placed;
  }
  // 上に何も乗っていないタイルをランダムに取っていく順序（＝この順で取れば必ず全部取れる）
  function removalOrder(list) {
    const n = list.length, alive = new Array(n).fill(true), order = [];
    const above = list.map((a, i) => { const arr = []; for (let j = 0; j < n; j++) if (j !== i && list[j].layer > a.layer && overlaps(a, list[j])) arr.push(j); return arr; });
    for (let step = 0; step < n; step++) {
      const free = [];
      for (let i = 0; i < n; i++) if (alive[i] && above[i].every(j => !alive[j])) free.push(i);
      if (!free.length) return null;
      const i = free[ri(free.length)]; order.push(i); alive[i] = false;
    }
    return order;
  }
  // 取る順序に沿って絵柄を割り当てる。同時に「そろえかけ」にする絵柄は P.groups 種まで → その順で取ればトレイは最大 2*groups 枚
  function assignKinds(n, P, open0, pool) {
    const open = open0.map(g => ({ kind: g.kind, placed: g.placed }));
    const out = []; let r = n;
    const need = () => open.reduce((s, g) => s + 3 - g.placed, 0);
    for (let i = 0; i < n; i++) {
      const avail = pool.filter(k => !open.some(g => g.kind === k));
      const canOpen = open.length < P.groups && r - 1 >= need() + 2 && avail.length > 0;
      let g = null;
      if (!open.length || (canOpen && rng() < P.pOpen)) {
        const kind = avail.length ? avail[ri(avail.length)] : pool[ri(pool.length)];
        g = { kind, placed: 0 }; open.push(g);
      } else {
        let cand = open; if (open.length >= 2 && rng() < P.linger) cand = open.slice(1);
        g = cand[ri(cand.length)];
      }
      g.placed++; out.push(g.kind); r--;
      if (g.placed >= 3) open.splice(open.indexOf(g), 1);
    }
    return out;
  }
  function genLevel(L) {
    const P = levelParams(L);
    const pool = EMOJI.slice(0, P.kinds);
    for (let layers = P.layers; layers >= 1; layers--) {
      for (let attempt = 0; attempt < 12; attempt++) {
        const layout = genLayout(P.count, layers, P.stackChance, attempt);
        if (!layout) continue;
        const order = removalOrder(layout); if (!order) continue;
        const kinds = assignKinds(order.length, P, [], pool);
        const ts = layout.map((t, i) => ({ id: i + 1, x: t.x, y: t.y, layer: t.layer, kind: '', removed: false, covered: false, cover: 0, born: 1 }));
        order.forEach((idx, i) => { ts[idx].kind = kinds[i]; });
        return { tiles: ts, order: order.map(i => i + 1), params: P };
      }
    }
    // 最終フォールバック：平置き
    const ts = []; let id = 1;

    rr(TRAY_X - 12, TRAY_Y, TRAY_W + 24, TRAY_H, 14); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.font = '12px DotGothic16, monospace'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'right';
    ctx.fillStyle = warn === 1 ? PINK : SUB; ctx.fillText('トレイ ' + tray.length + ' / ' + TRAY_N + (warn === 1 ? '  あぶない！' : ''), TRAY_X + TRAY_W + 10, TRAY_Y - 6);
    ctx.textAlign = 'left'; ctx.fillStyle = SUB; ctx.fillText('おなじ絵が 3まいで きえる', TRAY_X - 10, TRAY_Y - 6);
    for (let i = 0; i < TRAY_N; i++) {
      const s = slotPx(i);
      ctx.fillStyle = '#0a0a18'; rr(s.x - 4, s.y - 4, TW + 8, TH + 8, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(160,107,255,.28)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    tray.forEach(e => {
      if (flights.some(f => f.id === e.id)) return;
      const v = vis[e.id]; if (!v) return;
      const sq = v.sq > 0 ? v.sq / 0.2 : 0;
      drawTile(v.x, v.y + sq * 3, e.kind, { sx: 1 + sq * 0.16, sy: 1 - sq * 0.16 });
    });
    for (const p of pops) {
      p.ids.forEach((id, k) => {
        if (flights.some(f => f.id === id)) return;
        const s = slotPx(p.slots[k]);
        if (p.t < 0) { drawTile(s.x, s.y, p.kind, { glow: GOLD }); return; }
        const t = p.t;
        const sc = t < 0.3 ? 1 + t / 0.3 * 0.35 : Math.max(0.01, 1.35 * (1 - (t - 0.3) / 0.7));
        drawTile(s.x, s.y - t * 10, p.kind, { scale: sc, alpha: 1 - Math.max(0, t - 0.3) / 0.7, rot: (k - 1) * t * 0.7, glow: GOLD });
      });
    }
    for (const f of flights) { const q = flightPos(f), k = Math.min(1, f.t); drawTile(q.x, q.y, f.kind, { scale: 1 + 0.2 * Math.sin(Math.PI * k), rot: Math.sin(Math.PI * k) * 0.25 }); }
  }
  function drawFx() {
    for (const p of particles) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); if (p.spin) ctx.rotate(anim * p.spin); ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.restore(); }
    ctx.globalAlpha = 1;
    for (const r of rings) { ctx.globalAlpha = Math.max(0, r.life * 1.8); ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); }
    ctx.globalAlpha = 1;
    for (const t of texts) {
      const k = t.t; ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.4;
      ctx.font = (t.big ? 30 : t.small ? 13 : 20) + 'px DotGothic16, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = t.color; ctx.shadowColor = t.color; ctx.shadowBlur = 12;
      const y = t.y - easeOut(k) * 34, sc = t.big ? 1 + Math.sin(Math.min(1, k * 3) * Math.PI) * 0.25 : 1;
      ctx.save(); ctx.translate(t.x, y); ctx.scale(sc, sc); ctx.fillText(t.s, 0, 0); ctx.restore(); ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    if (flash > 0) { ctx.fillStyle = 'rgba(255,240,200,' + (flash * 0.35).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  }
  function draw() {
    ctx.save(); ctx.clearRect(0, 0, W, H);
    if (shake > 0) { const a = shake * 7; ctx.translate((Math.random() - .5) * a, (Math.random() - .5) * a); }
    drawBackground(); drawHeader(); drawField(); drawTray(); drawFx();
    ctx.restore();
  }
  let last = performance.now();
  function loop(now) { const dt = Math.min((now - last) / 1000, 0.05); last = now; update(dt); draw(); requestAnimationFrame(loop); }

  // ---- events (末尾で登録) --------------------------------------------------------
  let pdown = null;
  cv.addEventListener('pointerdown', e => { e.preventDefault(); audio(); pdown = toCanvas(e); kbMode = false; });
  cv.addEventListener('pointerup', e => { e.preventDefault(); if (!pdown) return; const p = toCanvas(e); const moved = Math.hypot(p.x - pdown.x, p.y - pdown.y); pdown = null; if (moved > 20) return; tap(p.x, p.y); });
  cv.addEventListener('pointercancel', () => { pdown = null; });
  cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { const p = toCanvas(e); const t = tileAt(p.x, p.y); hoverId = t ? t.id : null; kbMode = false; } });
  cv.addEventListener('pointerleave', () => { hoverId = null; });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (overlay.classList.contains('show')) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); audio(); $('btnMain').click(); } return; }
    if (phase !== 'play') return;
    const k = e.key.toLowerCase();
    if (e.key === 'ArrowLeft') { e.preventDefault(); kbMode = true; moveCursor(-1, 0); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); kbMode = true; moveCursor(1, 0); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); kbMode = true; moveCursor(0, -1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); kbMode = true; moveCursor(0, 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); audio(); kbMode = true; const t = byId(cursorId); if (t && canPick(t)) pick(t.id); else moveCursor(0, 0); }
    else if (k === 'z' || k === '1') { e.preventDefault(); audio(); useTool('undo'); }
    else if (k === 's' || k === '2') { e.preventDefault(); audio(); useTool('shuffle'); }
    else if (k === 'd' || k === '3') { e.preventDefault(); audio(); useTool('out'); }
    else if (k === 'r') { e.preventDefault(); audio(); startLevel(); }
  });
  $('btnMain').addEventListener('click', () => { audio(); if (phase === 'cleared') nextLevel(); else startLevel(); });
  $('btnSub').addEventListener('click', () => { audio(); resetAll(); });
  $('toolUndo').addEventListener('click', () => { audio(); useTool('undo'); });
  $('toolShuffle').addEventListener('click', () => { audio(); useTool('shuffle'); });
  $('toolOut').addEventListener('click', () => { audio(); useTool('out'); });
  $('retryBtn').addEventListener('click', () => { audio(); if (phase === 'title') return; startLevel(); });
  $('menuBtn').addEventListener('click', () => { audio(); showTitle(); });
  muteBtn.addEventListener('click', () => { muted = !muted; save(MUTE_KEY, muted ? '1' : '0'); drawMute(); });
  drawMute();
  showTitle();
  requestAnimationFrame(loop);

  window.__test = {
    state: () => ({
      phase, level, best, clears, moves, cleared: phase === 'cleared', over: phase === 'over',
      remaining: tiles.filter(t => !t.removed).length,
      tiles: tiles.map(t => ({ id: t.id, kind: t.kind, x: t.x, y: t.y, layer: t.layer, removed: t.removed, covered: t.covered, cover: t.cover })),
      tray: tray.map(e => ({ id: e.id, kind: e.kind })),
      tools: Object.assign({}, tools), pickStack: pickStack.slice(), combo,
    }),
    pick, useTool, setTiles, nextLevel,
    reset: resetLevel, resetAll,
    start: lv => { if (lv) level = Math.max(1, lv | 0); else if (phase === 'cleared') level++; startLevel(); },
    setLevel: lv => { level = Math.max(1, lv | 0); },
    title: showTitle,
    solution: () => solutionOrder ? solutionOrder.slice() : null,
    generate: L => { const g = genLevel(L); return { tiles: g.tiles.map(t => ({ id: t.id, kind: t.kind, x: t.x, y: t.y, layer: t.layer })), order: g.order, params: g.params }; },
    params: levelParams,
    setSeed: n => { seed = (n >>> 0); },
    step: ms => { for (let i = 0; i < Math.ceil(ms / 16); i++) update(0.016); draw(); },
    pickables: () => pickables().map(t => t.id),
    pickAt: (x, y) => tap(x, y),
  };
})();
</script>
</body>
</html>
