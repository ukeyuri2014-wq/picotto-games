function waveText(s,w){const l=waveList(s,w),n=k=>l.filter(x=>x===k).length;return Object.keys(ENEMIES).filter(k=>n(k)).map(k=>`${ENEMIES[k].icon}×${n(k)}`).join(' ')+(isBossWave(s,w)?' ・ ボスが来る！':'')}
function newGame(s){const st=STAGES[s],r=seeded(97+s*31),deco=[];let guard=0;
 while(deco.length<22&&guard++<600){const p=[20+r()*560,20+r()*360];if(routeDist(p,st.route)<34)continue;if(st.spots.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<40))continue;deco.push({x:p[0],y:p[1],e:st.deco[Math.floor(r()*st.deco.length)],sz:14+r()*10})}

/* ---- 1フレーム分の世界の更新（描画しない） ---- */
function hurt(G,e,d){const a=ENEMIES[e.type].armor||0;e.hp-=a?Math.max(d-a,d*.35):d;e.hitT=.12;if(e.hp<=0&&!e.dead){e.dead=true;const R=ENEMIES[e.type].reward;G.money+=R;G.fx.push({k:'puff',x:e.x,y:e.y,t:0,life:.6},{k:'text',x:e.x,y:e.y-14,s:'+'+R,c:'#ffd35c',t:0,life:.8});G.events.push(ENEMIES[e.type].boss?'boss':'pop')}}
function update(G,dt){if(G.phase!=='wave')return;G.time+=dt;const route=G.st.route;
 G.spawnT-=dt;if(G.queue.length&&G.spawnT<=0){const type=G.queue.shift(),hp=enemyHp(type,G.s,G.wave);G.enemies.push({type,x:route[0][0],y:route[0][1],seg:1,dist:0,hp,max:hp,slowT:0,slow:0,hitT:0,bob:Math.random()*6});G.spawnT=ENEMIES[type].gap}
 for(const e of G.enemies){if(e.dead||e.out)continue;const E=ENEMIES[e.type];e.slowT-=dt;e.hitT-=dt;let d=E.speed*(e.slowT>0?1-e.slow:1)*dt;
  while(d>0&&!e.out){const [ex,ey]=route[e.seg],rem=Math.hypot(ex-e.x,ey-e.y);if(rem<=d){e.x=ex;e.y=ey;d-=rem;e.dist+=rem;e.seg++;if(e.seg>=route.length){e.out=true;G.lives=Math.max(0,G.lives-E.bite);G.lastBite=E.bite;G.shake=.35;G.events.push('leak');G.fx.push({k:'text',x:ex-30,y:ey-20,s:'-'+E.bite+'🍪',c:'#ff8fa3',t:0,life:1})}}else{e.x+=(ex-e.x)/rem*d;e.y+=(ey-e.y)/rem*d;e.dist+=d;d=0}}}
 for(const t of G.towers){const T=TOWERS[t.type],L=t.level-1,[x,y]=G.st.spots[t.i];t.cool-=dt;t.flash=Math.max(0,t.flash-dt);if(t.cool>0)continue;let best=null,score=-1e9;
  for(const e of G.enemies){if(e.dead||e.out)continue;if(Math.hypot(e.x-x,e.y-y)>T.range[L])continue;const sc=e.dist-(T.slow&&e.slowT>.3?1e4:0);if(sc>score){score=sc;best=e}}
  if(best){t.cool=T.rate[L];t.flash=.14;t.aim=Math.atan2(best.y-y,best.x-x);G.shots.push({x,y,target:best,tx:best.x,ty:best.y,type:t.type,L})}}
 for(const b of G.shots){if(b.target&&!b.target.dead&&!b.target.out){b.tx=b.target.x;b.ty=b.target.y}const dx=b.tx-b.x,dy=b.ty-b.y,dd=Math.hypot(dx,dy),v=470*dt;
  if(dd<=v+6){b.done=true;const T=TOWERS[b.type],L=b.L;
   if(T.splash){G.fx.push({k:'ring',x:b.tx,y:b.ty,r:T.splash[L],t:0,life:.35,c:'#8fd3ff'});for(const e of G.enemies)if(!e.dead&&!e.out&&Math.hypot(e.x-b.tx,e.y-b.ty)<=T.splash[L])hurt(G,e,T.dmg[L])}
   else{let e=b.target;if(!e||e.dead||e.out)e=G.enemies.find(o=>!o.dead&&!o.out&&Math.hypot(o.x-b.tx,o.y-b.ty)<16);if(e){if(T.slow){e.slowT=1.7;e.slow=Math.max(e.slowT>0?e.slow:0,T.slow[L])}hurt(G,e,T.dmg[L]);G.fx.push({k:'spark',x:b.tx,y:b.ty,t:0,life:.2,c:T.shot})}}}
  else{b.x+=dx/dd*v;b.y+=dy/dd*v}}
 G.shots=G.shots.filter(b=>!b.done);G.enemies=G.enemies.filter(e=>!e.dead&&!e.out);
 if(G.lives<=0){G.phase='lose';G.events.push('lose');return}

function startWave(G){if(G.phase!=='build')return false;G.wave++;G.queue=waveList(G.s,G.wave);G.spawnT=.4;G.phase='wave';G.banner={s:isBossWave(G.s,G.wave)?`ウェーブ ${G.wave} ・ ボス登場！`:`ウェーブ ${G.wave}`,t:0};G.events.push(isBossWave(G.s,G.wave)?'bosswave':'wave');return true}
function build(G,i,type){const T=TOWERS[type];if(G.towers.some(t=>t.i===i)||G.money<T.cost)return false;G.money-=T.cost;G.towers.push({i,type,level:1,cool:.2,flash:0,aim:0,invested:T.cost});G.events.push('build');return true}
function upgrade(G,t){const c=upCost(t);if(!c||G.money<c)return false;G.money-=c;t.invested+=c;t.level++;G.events.push('up');return true}
function sell(G,t){G.money+=sellValue(t);G.towers=G.towers.filter(o=>o!==t);G.events.push('sell')}

function beep(freq,dur=.1,type='sine',vol=.08,delay=0){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const t0=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,t0);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g).connect(audioContext.destination);o.start(t0);o.stop(t0+dur+.02)}catch{}}
function sfx(k){const now=performance.now();
 if(k==='pop'){if(now-lastPop<70)return;lastPop=now;beep(880+Math.random()*200,.07,'triangle',.05)}
 else if(k==='boss'){[523,659,784,1047].forEach((f,i)=>beep(f,.16,'triangle',.07,i*.08))}
 else if(k==='leak')beep(170,.25,'sawtooth',.05)
 else if(k==='build'){beep(660,.08,'triangle');beep(990,.1,'triangle',.07,.07)}
 else if(k==='up'){[660,830,990].forEach((f,i)=>beep(f,.09,'triangle',.07,i*.06))}
 else if(k==='sell')beep(420,.12,'triangle')
 else if(k==='wave'){beep(520,.1);beep(700,.14,'sine',.08,.1)}
 else if(k==='bosswave'){beep(300,.2,'square',.04);beep(300,.2,'square',.04,.25)}
 else if(k==='clear'){beep(784,.1);beep(1046,.18,'sine',.08,.1)}
 else if(k==='win'){[523,659,784,1046,1318].forEach((f,i)=>beep(f,.2,'triangle',.08,i*.11))}
 else if(k==='lose'){[392,330,262].forEach((f,i)=>beep(f,.25,'sine',.07,i*.18))}
 else if(k==='ng')beep(200,.1,'square',.03)}
