const QUESTIONS=[['タコの腕は何本？',['6本','8本','10本'],1,'タコには8本の腕があります。'],['1年で一番日数が少ない月は？',['2月','6月','11月'],0,'2月は通常28日、うるう年は29日です。'],['氷がとけると何になる？',['水','砂','塩'],0,'氷は水が凍ったものです。'],['パンダがよく食べる植物は？',['サボテン','竹','ひまわり'],1,'ジャイアントパンダの主食は竹です。'],['太陽がのぼる方角は？',['西','南','東'],2,'太陽は東からのぼります。'],['三角形の辺はいくつ？',['3つ','4つ','5つ'],0,'三角形は3本の辺で囲まれています。'],['水の中でえら呼吸するのは？',['イルカ','金魚','クジラ'],1,'金魚はえら、イルカとクジラは肺で呼吸します。'],['「大きい」の反対の言葉は？',['長い','小さい','高い'],1,'大きいと小さいは反対の意味です。'],['ひよこが成長すると？',['ニワトリ','ハト','スズメ'],0,'ニワトリのひなを、ひよこと呼びます。'],['1時間は何分？',['30分','60分','100分'],1,'1時間は60分です。'],['ピアノで音を出すために押すものは？',['ペン','鍵盤','弦'],1,'鍵盤を押すと中のハンマーが弦をたたきます。'],['日本の国旗の丸は何色？',['青','黄色','赤'],2,'白い地に赤い丸が描かれています。'],['春の次の季節は？',['秋','夏','冬'],1,'春、夏、秋、冬の順です。'],['カブトムシの脚は何本？',['4本','6本','8本'],1,'昆虫の脚は6本です。'],['10円玉が5枚。合計は？',['15円','50円','500円'],1,'10×5＝50円です。'],['にじの形に近いものは？',['弧','四角','十字'],0,'地上からは弧のように見えることが多いです。'],['手紙を運ぶ人は？',['消防士','郵便配達員','料理人'],1,'郵便配達員が手紙やはがきを届けます。'],['シマウマの模様は？',['しま模様','水玉','星形'],0,'白と黒のしま模様が特徴です。'],['植物が根から吸うものは？',['水','石','ガラス'],0,'根は水や水に溶けた養分を吸収します。'],['月はどこのまわりを回る？',['地球','金星','火星'],0,'月は地球の自然衛星です。']];
