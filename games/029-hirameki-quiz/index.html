const ALL=Object.entries(Q).flatMap(([g,list])=>list.map((q,i)=>({g,id:g+i,q:q[0],a:q[1][0],c:q[1],e:q[2]})));
const ROUND=10,TIME=10;

function nextQuestions(genre){const pool=ALL.filter(q=>genre==='all'||q.g===genre);let bag=read('bag-'+genre,[]).filter(id=>pool.some(q=>q.id===id));
 const out=[];while(out.length<ROUND){if(!bag.length)bag=shuffle(pool.map(q=>q.id)).filter(id=>!out.some(o=>o.id===id));if(!bag.length)break;const id=bag.shift();out.push(pool.find(q=>q.id===id))}
 save('bag-'+genre,bag);return out}

function muteBtn(){return `<button id="mute" class="icon-btn" aria-label="${muted?'おとを だす':'おとを けす'}">${muted?'🔇':'🔊'}</button>`}
function bindMute(){const b=$('#mute');if(b)b.onclick=()=>{muted=!muted;save('mute',muted);b.textContent=muted?'🔇':'🔊';if(!muted)SFX.tap()}}

let genre=read('genre','all');if(genre!=='all'&&!GENRES[genre])genre='all';
function title(){stopAll();document.body.classList.remove('playing');state=null;
 const g=[['all','🌈','ぜんぶ']].concat(Object.entries(GENRES).map(([k,v])=>[k,v.icon,v.name]));
 app.innerHTML=`<section class="panel intro"><div class="intro-top">${muteBtn()}</div><div class="icon">${CONFIG.emoji}</div><h2>${CONFIG.title}</h2>
 <p>3つの中から こたえを えらぼう。<br>はやく こたえると <b>ボーナス</b>、れんぞく正解で <b>コンボ</b>！</p>
 <div class="genres" role="group" aria-label="ジャンル">${g.map(([k,i,n])=>`<button data-g="${k}" class="${genre===k?'on':''}"><span>${i}</span>${n}</button>`).join('')}</div>
 <p class="small muted" id="best-line">${bestLine()}</p>
 <button class="primary big-btn" id="start">スタート</button>
 <p class="small muted">もんだいは ぜんぶで ${ALL.length}問。1回に${ROUND}問 でるよ。</p></section>`;
 bindMute();
 $$('[data-g]').forEach(b=>b.onclick=()=>{genre=b.dataset.g;save('genre',genre);$$('[data-g]').forEach(x=>x.classList.toggle('on',x===b));$('#best-line').textContent=bestLine();SFX.tap()});
 $('#start').onclick=start;}
function genreName(g){return g==='all'?'ぜんぶ':GENRES[g].name}
function bestLine(){return `「${genreName(genre)}」の ハイスコア：${Number(read('hiscore-'+genre,0))||0}点`}

let state=null;
function start(){stopAll();document.body.classList.add('playing');
 state={qs:nextQuestions(genre),n:0,score:0,correct:0,combo:0,maxCombo:0,miss:[],locked:false,t0:0};
 app.innerHTML=`<section class="panel game"><div class="toolbar"><div class="stat inline"><small>もんだい</small><b id="num">1/${ROUND}</b><small>とくてん</small><b id="score">0</b></div><div class="row tools">${muteBtn()}<button id="quit" aria-label="やめて もどる">≡</button></div></div>
 <div class="timebar" aria-hidden="true"><i id="tb"></i></div><div id="qarea"></div></section>`;
 bindMute();$('#quit').onclick=title;draw();window.scrollTo(0,0);}
function draw(){const q=state.qs[state.n];state.locked=false;const choices=shuffle(q.c);
 $('#num').textContent=`${state.n+1}/${state.qs.length}`;
 $('#qarea').innerHTML=`<div class="qhead"><span class="badge">${GENRES[q.g].icon} ${GENRES[q.g].name}</span>${state.combo>=2?`<span class="combo-badge">🔥 ${state.combo}れんぞく</span>`:''}</div>
 <h2 class="question">${escapeHTML(q.q)}</h2>
 <div class="choices">${choices.map((s,i)=>`<button class="choice" data-c="${escapeHTML(s)}"><span class="no">${i+1}</span><span class="txt">${escapeHTML(s)}</span><span class="mark"></span></button>`).join('')}</div>
 <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
 <button id="next" class="primary next" hidden>つぎへ ▶</button>`;
 $$('.choice').forEach(b=>b.onclick=()=>answer(b));
 $('#next').onclick=next;
 const qa=$('#qarea');qa.classList.remove('slide');void qa.offsetWidth;qa.classList.add('slide');
 state.t0=performance.now();const bar=$('#tb');
 const tick=()=>{if(!state||state.locked)return;const left=Math.max(0,1-(performance.now()-state.t0)/(TIME*1000));bar.style.width=left*100+'%';bar.classList.toggle('low',left<.3);raf=requestAnimationFrame(tick)};tick();}
function answer(b){if(!state||state.locked)return;state.locked=true;cancelAnimationFrame(raf);b.blur();
 const q=state.qs[state.n],ok=b.dataset.c===q.a,el=(performance.now()-state.t0)/1000;
 $$('.choice').forEach(x=>{x.disabled=true;if(x.dataset.c===q.a){x.classList.add('right');x.querySelector('.mark').textContent='⭕'}});
 const fb=$('#feedback');
 if(ok){state.correct++;state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);
  const timeBonus=Math.round(Math.max(0,TIME-el)/TIME*50),mult=state.combo>=5?2:state.combo>=3?1.5:1,pts=Math.round((100+timeBonus)*mult);
  state.score+=pts;$('#score').textContent=state.score;SFX.ok(state.combo);b.classList.add('chosen');
  fb.innerHTML=`<b class="good">せいかい！ +${pts}</b>${mult>1?` <span class="mult">コンボ×${mult}</span>`:''}${timeBonus>=35?' <span class="fast">はやい！</span>':''}<p>${escapeHTML(q.e)}</p>`;
  floatText(b,'+'+pts);
 }else{state.combo=0;state.miss.push({q,picked:b.dataset.c});b.classList.add('wrong');b.querySelector('.mark').textContent='❌';SFX.ng();
  $('.choices').classList.add('shake');
  fb.innerHTML=`<b class="bad">ざんねん！</b> こたえは「${escapeHTML(q.a)}」<p>${escapeHTML(q.e)}</p>`;}
 fb.className='feedback show '+(ok?'ok':'ng');
 const nx=$('#next');nx.hidden=false;nx.textContent=state.n===state.qs.length-1?'けっかを見る ▶':'つぎへ ▶';nx.focus({preventScroll:true});}
function floatText(b,t){const f=document.createElement('span');f.className='float';f.textContent=t;b.appendChild(f);later(()=>f.remove(),900)}
function next(){if(!state)return;SFX.tap();if(++state.n>=state.qs.length)finish();else draw()}
function finish(){const s=state,total=s.qs.length;cancelAnimationFrame(raf);
 const hk='hiscore-'+genre,old=Number(read(hk,0))||0,isNew=s.score>old;if(isNew)save(hk,s.score);
 const oldBest=Number(read('best',0))||0;if(s.correct>oldBest)save('best',s.correct);
 const stars=s.correct>=9?3:s.correct>=6?2:s.correct>=3?1:0;
 const msg=s.correct===total?'パーフェクト！ ひらめき天才！':s.correct>=8?'すごい！ ものしりだね！':s.correct>=5?'いいね！ そのちょうし！':'つぎは もっと わかるよ！';
 SFX.end(s.correct>=5);
 $('#tb').style.width='0%';
 $('#qarea').innerHTML=`<section class="result-card"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
 <h2>${msg}</h2><p class="big-score"><b>${s.correct}</b> / ${total}問 せいかい</p>
 <p class="score-line">とくてん <b>${s.score}</b>点 ${isNew?'<span class="newrec">ハイスコア更新！</span>':`（ハイスコア ${Math.max(old,s.score)}点）`}<br><span class="muted">さいだいコンボ ${s.maxCombo}</span></p>
 <div class="row center-row"><button id="again" class="primary">もういちど</button><button id="menu">ジャンルをえらぶ</button></div></section>
 ${s.miss.length?`<details class="review" open><summary>まちがえた もんだい（${s.miss.length}）を ふくしゅう</summary><ol>${s.miss.map(m=>`<li><b>${escapeHTML(m.q.q)}</b><br><span class="rv-ok">⭕ ${escapeHTML(m.q.a)}</span> <span class="rv-ng">（えらんだ：${escapeHTML(m.picked)}）</span><br><span class="muted">${escapeHTML(m.q.e)}</span></li>`).join('')}</ol></details>`:'<p class="center perfect">まちがいゼロ！ 🎉</p>'}`;
 $('#again').onclick=start;$('#menu').onclick=title;state=null;
 if(stars===3)confetti();}
function confetti(){const layer=document.createElement('div');layer.className='confetti';const cs=['#ffd278','#7ce0c1','#ff8fb3','#8fb8ff','#fff'];for(let i=0;i<36;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cs[i%cs.length];p.style.animationDelay=Math.random()*.4+'s';p.style.setProperty('--dx',(Math.random()*120-60)+'px');layer.appendChild(p)}$('.panel.game')?.appendChild(layer);later(()=>layer.remove(),2600)}

window.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(!state){if(e.key==='Enter'&&$('#start')&&document.activeElement===document.body){e.preventDefault();start()}return}
 if(!state.locked&&/^[1-3]$/.test(e.key)){const b=$$('.choice')[+e.key-1];if(b)answer(b);return}
 if(state.locked&&(e.key==='Enter'||e.key===' ')&&document.activeElement!==$('#next')){e.preventDefault();next()}});
title();

</script></body></html>
