<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>よふかしアニマル｜無料ブラウザゲーム｜ルドット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(ellipse 70% 50% at 50% -10%, #35234d 0%, transparent 70%),
      #131322;
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    color: #eeecfa;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .topbar {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 14px 16px 8px;
  }
  .topbar a, .topbar button.mute {
    color: #53e0d8;
    font-weight: 900;
    text-decoration: none;
    font-size: 0.88rem;
    background: #1e1e36;
    border: 1px solid #2c2c4d;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: inherit;
  }
  @media (hover: hover) {
    .topbar a:hover, .topbar button.mute:hover { border-color: #53e0d8; }
    .btn:hover { filter: brightness(1.1); }
    .mode-btn:hover { border-color: #9d99c0; }
  }
  .topbar h1 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: 1.05rem;
    background: linear-gradient(100deg, #ff5fa2, #c77dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stage { position: relative; width: min(94vw, 480px); margin: 6px 0 24px; }
  canvas {
    display: block;
    width: 100%;
    border-radius: 20px;
    border: 1px solid #2c2c4d;
    box-shadow: 0 0 40px rgba(109, 216, 106, 0.14), 0 14px 34px rgba(0, 0, 0, 0.45);
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(19, 19, 34, 0.92);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 13px;
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 2.8rem; }
  .overlay h2 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: 1.55rem;
    background: linear-gradient(100deg, #6fd86a, #53e0d8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .overlay p { font-size: 0.93rem; line-height: 1.8; color: #c9c5e6; }
  .overlay p b { color: #eeecfa; }
  .overlay .score-line { font-size: 1.25rem; font-weight: 900; color: #eeecfa; }
  .overlay .best-line { font-size: 0.9rem; color: #53e0d8; font-weight: 700; }
  .btn {
    border: none;
    background: linear-gradient(100deg, #3fae55, #6fd86a);
    color: #fff;
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.14em;
    border-radius: 999px;
    padding: 12px 46px;
    cursor: pointer;
    box-shadow: 0 4px 22px rgba(111, 216, 106, 0.45);
  }
  .btn:active { transform: translateY(2px); }
  .btn:focus-visible, .topbar button.mute:focus-visible, .mode-btn:focus-visible { outline: 2px solid #53e0d8; outline-offset: 2px; }
  .hint { font-size: 0.78rem; color: #9d99c0; }
  .hint a { color: #9d99c0; }
  .age-badge { display:inline-flex; width:fit-content; margin:0; padding:5px 12px; border:1px solid rgba(83,224,216,.35); border-radius:999px; color:#53e0d8!important; background:rgba(83,224,216,.08); font-size:.72rem!important; font-weight:900; letter-spacing:.06em; }

  /* ---- タイトル・結果のレイアウト（スマホでも画面内に入るように詰める） ---- */
  #title-screen, #over-screen { padding: 14px 12px; gap: 8px; }
  #title-screen h2 { font-size: 1.4rem; }
  #title-screen .lead { font-size: 0.84rem; line-height: 1.6; }
  .modes { display: flex; gap: 8px; width: 100%; max-width: 400px; }
  .mode-btn {
    flex: 1 1 0; min-width: 0; min-height: 52px;
    border: 2px solid #2c2c4d; border-radius: 14px;
    background: rgba(28, 28, 51, 0.92); color: #eeecfa;
    font-family: inherit; font-weight: 900; font-size: 0.98rem;
    padding: 6px 4px; cursor: pointer; line-height: 1.25;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-btn small { font-size: 11px; color: #9d99c0; font-weight: 700; }
  .mode-btn.on[data-mode="doki"] { border-color: #ff5fa2; background: rgba(255, 95, 162, 0.16); box-shadow: 0 0 16px rgba(255, 95, 162, 0.3); }
  .mode-btn.on[data-mode="nonbiri"] { border-color: #53e0d8; background: rgba(83, 224, 216, 0.13); box-shadow: 0 0 16px rgba(83, 224, 216, 0.28); }
  .mode-btn.on small { color: #eeecfa; }
  .overlay p.mode-desc { font-size: 12px; line-height: 1.45; color: #c9c5e6; min-height: 1.45em; }
  .overlay p.mode-chip { font-size: 12px; line-height: 1.4; font-weight: 900; color: #9d99c0; }
  #over-screen .big { font-size: 2rem; line-height: 1; }
  #over-screen h2 { font-size: 1.4rem; }
  .overlay .best-line .newrec { color: #ffd166; }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn-row .btn { padding: 11px 18px; font-size: 1rem; letter-spacing: 0.06em; }
  .btn.sub { background: #2a2a48; box-shadow: none; border: 1px solid #4a4670; color: #eeecfa; }
  #start-btn { padding: 11px 46px; }

  /* ---- どうぶつずかん（スタンプ帳） ---- */
  .zukan {
    width: 100%; max-width: 400px;
    background: rgba(28, 28, 51, 0.9);
    border: 1px solid #2c2c4d; border-radius: 14px;
    padding: 6px 8px 6px;
  }
  .zukan.complete { border-color: #ffd166; box-shadow: 0 0 18px rgba(255, 209, 102, 0.4); }
  .zukan-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 900; color: #ffd166; margin-bottom: 3px; line-height: 1.3; }
  .zukan-head .cnt { color: #eeecfa; font-size: 13px; }
  .zukan.complete .zukan-head { color: #ffd166; text-shadow: 0 0 8px rgba(255, 209, 102, 0.6); }
  .zukan-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px 2px; }
  .stamp { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .stamp canvas { width: 42px; height: 42px; border: none; border-radius: 50%; box-shadow: none; touch-action: auto; }
  .stamp span { font-size: 11px; line-height: 1.25; color: #c9c5e6; white-space: nowrap; font-weight: 700; }
  .stamp.off span { color: #6d6896; }
  .stamp.new canvas { animation: stampin 0.7s ease-out var(--d, 0s) both; filter: drop-shadow(0 0 6px rgba(255, 209, 102, 0.8)); }
  .stamp.new::after {
    content: "NEW"; position: absolute; top: -2px; right: 50%; margin-right: -30px;
    font-size: 11px; font-weight: 900; line-height: 1; color: #131322; background: #ffd166;
    border-radius: 999px; padding: 2px 4px;
  }
  @keyframes stampin { 0% { transform: scale(1.8) rotate(-12deg); opacity: 0; } 60% { transform: scale(0.9) rotate(4deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  .zukan-foot { font-size: 11px; line-height: 1.3; color: #9d99c0; margin-top: 2px; text-align: center; }
  .zukan.complete .zukan-foot { color: #ffd166; font-weight: 900; }
</style>

<body>

<div class="topbar">
  <a href="../../index.html">← いちらんへ</a>

<div class="stage">
  <canvas id="game" width="480" height="640"></canvas>

  <div class="overlay" id="title-screen">
    <h2>よふかしアニマル</h2>
    <p class="age-badge">対象年齢の目安：6歳〜</p>
    <p class="lead">
      <b>同じ動物</b>をくっつけると<b>進化！</b>めざせ<b>ゾウ</b>。<br>
      はなすと落ちる。上の<b>ライン</b>をこえたらおしまい。
    </p>
    <div class="modes" role="radiogroup" aria-label="モードをえらぶ">
      <button class="mode-btn" data-mode="doki" role="radio" aria-checked="false">⏱ どきどき<small id="best-doki">ベスト 0</small></button>
      <button class="mode-btn" data-mode="nonbiri" role="radio" aria-checked="false">🌙 のんびり<small id="best-nonbiri">ベスト 0</small></button>

<script>
// ================================================================
// ★カスタマイズポイント★
// ANIMALS の見た目や大きさ、SCORES の点数をかえられるよ！
// ================================================================
const ANIMALS = [
  { r: 13, emoji: "🐥", name: "ひよこ",     c1: "#fff4a8", c2: "#f2b43b" },
  { r: 17, emoji: "🐹", name: "ハムスター", c1: "#ffe0b5", c2: "#d9914e" },
  { r: 22, emoji: "🐰", name: "うさぎ",     c1: "#f7eaff", c2: "#c6a3e8" },
  { r: 28, emoji: "🐱", name: "ねこ",       c1: "#ffd5a1", c2: "#e78a3f" },
  { r: 34, emoji: "🐶", name: "いぬ",       c1: "#f7c88b", c2: "#b96f35" },
  { r: 42, emoji: "🐺", name: "オオカミ",   c1: "#dbe7f4", c2: "#7189a3" },
  { r: 50, emoji: "🦍", name: "ゴリラ",     c1: "#b5b7c7", c2: "#4c5064" },
  { r: 58, emoji: "🦁", name: "ライオン",   c1: "#ffd77a", c2: "#d98222" },
  { r: 68, emoji: "🐻", name: "クマ",       c1: "#d9a76f", c2: "#74452d" },
  { r: 80, emoji: "🐘", name: "ゾウ",       c1: "#a9c8dc", c2: "#4f7894" },
];
const SCORES = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55];
const STORAGE_KEY = "yofukashi-animal-best";            // のんびりモードのベスト（むかしからの記録をそのまま使う）
const STORAGE_KEY_DOKI = "ludot_yofukashi-suika_best_doki"; // どきどきモードのベスト
const STORAGE_KEY_ZUKAN = "ludot_yofukashi-suika_zukan";    // どうぶつずかん（作れた動物の番号の配列）
const STORAGE_KEY_MODE = "ludot_yofukashi-suika_mode";      // さいごにえらんだモード
// どきどきモード：持っている動物が自動で落ちるまでの秒数
const TIMER_BASE = 6.5, TIMER_MIN = 3.5;
// ================================================================

(function () {
  "use strict";
  const W = 480, H = 640;
  const WALL_L = 52, WALL_R = 428, FLOOR = 592, LINE_Y = 152;
  const G = 1600;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const titleScreen = document.getElementById("title-screen");
  const overScreen = document.getElementById("over-screen");
  const finalScoreEl = document.getElementById("final-score");
  const bestScoreEl = document.getElementById("best-score");
  const muteBtn = document.getElementById("mute-btn");

  let state = "title";
  let animals = [];
  let sparks = [];
  let popups = [];
  let score = 0;
  let aimX = W / 2;
  let currentTier = 0;
  let nextTier = 1;
  let dropCd = 0;
  let dangerPulse = 0;
  let lastTime = 0;

  // ---- ほぞん（できなくても遊べるように） ----
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---- モード・せいげんじかん ----
  const MODE_INFO = {
    doki:    { label: "⏱ どきどき", desc: "もっている動物は 時間がたつと かってに落ちる！" },
    nonbiri: { label: "🌙 のんびり", desc: "時間せいげんなし。ゆっくり考えて 落とそう。" },
  };
  let mode = lsGet(STORAGE_KEY_MODE) === "nonbiri" ? "nonbiri" : "doki";
  let dropTimer = 0;      // のこり秒数
  let dropLimit = 0;      // このターンの持ち時間
  let lastTickSec = 99;
  let dropCount = 0;
  let pointerIsDown = false;
  let ignoreNextUp = false;
  let testHold = false;   // テスト用：自動で時間を進めない

  // ---- どうぶつずかん ----
  let zukan = loadZukan();     // 作れた動物の番号（ひよこ=0 は さいしょから）
  let newThisGame = [];
  let stampQueue = [];         // NEW！スタンプ演出のまち行列
  let stampShow = null;

  function loadZukan() {
    let arr = [];
    try {
      const raw = JSON.parse(lsGet(STORAGE_KEY_ZUKAN) || "[]");
      if (Array.isArray(raw)) arr = raw.filter(function (n) { return Number.isInteger(n) && n >= 0 && n < ANIMALS.length; });
    } catch (e) { arr = []; }
    if (arr.indexOf(0) < 0) arr.push(0);
    return Array.from(new Set(arr)).sort(function (a, b) { return a - b; });
  }
  function saveZukan() { lsSet(STORAGE_KEY_ZUKAN, JSON.stringify(zukan)); }
  function zukanComplete() { return zukan.length >= ANIMALS.length; }
  function getBest(m) { return Number(lsGet(m === "doki" ? STORAGE_KEY_DOKI : STORAGE_KEY) || 0) || 0; }

  const bgStars = [];
  for (let i = 0; i < 34; i++) {
    bgStars.push({ x: Math.random() * W, y: Math.random() * 120, r: 0.5 + Math.random() * 1.2, tw: Math.random() * Math.PI * 2 });
  }

  // ============ おと ============
  let audioCtx = null;
  let muted = lsGet("picotto-muted") === "1";
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, at, dur, type, vol) {
    const c = getCtx();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(vol, at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, at + Math.max(dur, 0.05));
    o.connect(g).connect(c.destination);
    o.start(at); o.stop(at + dur + 0.1);
  }
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try { tone(freq, getCtx().currentTime, dur, type || "sine", vol || 0.08); } catch (e) {}
  }
  // 進化音：強い動物ほど低く豊かに
  function mergeSound(tier) {
    if (muted) return;
    try {
      const c = getCtx();
      const f = 880 - tier * 62;
      tone(f, c.currentTime, 0.16, "sine", 0.09);
      tone(f * 1.5, c.currentTime + 0.04, 0.14, "sine", 0.04);
    } catch (e) {}
  }
  const BGM = {
    timer: null, step: 0, next: 0,
    song: {
      bpm: 104, lead: "sine",
      melody: [659, 0, 784, 659, 587, 0, 523, 0, 587, 0, 659, 587, 523, 0, 440, 0,
               659, 0, 784, 880, 784, 0, 659, 0, 587, 0, 523, 587, 659, 0, 0, 0],
      bass:   [131, 0, 196, 0, 165, 0, 196, 0, 147, 0, 196, 0, 131, 0, 196, 0],
    },
    start: function () {
      try {
        const c = getCtx();
        this.stop();
        const spb = 60 / this.song.bpm / 2;
        this.next = c.currentTime + 0.1;
        this.step = 0;
        const self = this;
        this.timer = setInterval(function () {
          try {
            const cc = getCtx();
            while (self.next < cc.currentTime + 0.25) {
              if (!muted && !document.hidden) {
                const m = self.song.melody[self.step % self.song.melody.length];
                const b = self.song.bass[self.step % self.song.bass.length];
                if (m) tone(m, self.next, spb * 1.1, self.song.lead, 0.032);
                if (b) tone(b, self.next, spb * 1.0, "triangle", 0.05);
              }
              self.next += spb;
              self.step++;
            }
          } catch (e) {}
        }, 80);
      } catch (e) {}
    },
    stop: function () { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  };
  function updateMuteBtn() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    lsSet("picotto-muted", muted ? "1" : "0");
    updateMuteBtn();
  });
  // スタンプを押す音：ポン＋キラリ
  function stampSound(big) {
    if (muted) return;
    try {
      const c = getCtx(), t0 = c.currentTime;
      tone(150, t0, 0.12, "triangle", 0.16);
      tone(90, t0, 0.1, "sine", 0.12);
      const notes = big ? [784, 988, 1175, 1568, 1319, 1568] : [1047, 1319, 1568];
      notes.forEach(function (f, i) { tone(f, t0 + 0.1 + i * (big ? 0.11 : 0.07), big ? 0.3 : 0.18, "triangle", 0.07); });
    } catch (e) {}
  }
  // のこり時間の「ピッ」
  function tickSound(sec) {
    if (muted) return;
    try {
      const c = getCtx();
      tone(sec <= 1 ? 1175 : 880, c.currentTime, 0.07, "square", 0.035);
      if (sec <= 1) tone(1175, c.currentTime + 0.12, 0.07, "square", 0.035);
    } catch (e) {}
  }

  // ============ エフェクト ============
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.5 + Math.random() * 0.3, max: 0.8, color: color });
    }
  }
  function popup(x, y, text, color) {
    popups.push({ x: x, y: y, text: text, color: color, life: 0.9 });
  }

  // ============ ゲームのながれ ============
  let rng = Math.random; // テストでは決まった乱数にできる
  function randTier() { return Math.floor(rng() * 5); }
  function startGame(m) {
    if (m === "doki" || m === "nonbiri") setMode(m);
    animals = [];
    sparks = [];
    popups = [];
    score = 0;
    dropCd = 0;
    dropCount = 0;
    newThisGame = [];
    stampQueue = [];
    stampShow = null;
    ignoreNextUp = false;
    currentTier = randTier();
    nextTier = randTier();
    state = "play";
    armTimer();
    titleScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    beep(660, 0.15);
    BGM.start();
  }
  function gameOver() {
    state = "over";
    BGM.stop();
    stampQueue = [];
    stampShow = null;
    const prev = getBest(mode);
    const best = Math.max(score, prev);
    lsSet(mode === "doki" ? STORAGE_KEY_DOKI : STORAGE_KEY, String(best));
    document.getElementById("over-mode").textContent = MODE_INFO[mode].label + " モード";
    finalScoreEl.textContent = "スコア：" + score;
    bestScoreEl.innerHTML = "さいこうきろく：" + best + (score > prev && score > 0 ? ' <span class="newrec">🎉 きろくこうしん！</span>' : "");
    renderZukan(document.getElementById("zukan-over"), newThisGame);
    updateTitle();
    overScreen.classList.remove("hidden");
    beep(220, 0.4, "sawtooth", 0.09);
    setTimeout(function () { beep(165, 0.5, "sawtooth", 0.08); }, 200);
  }
  function showTitle() {
    state = "title";
    BGM.stop();
    animals = [];
    sparks = [];
    popups = [];
    stampQueue = [];
    stampShow = null;
    updateTitle();
    overScreen.classList.add("hidden");
    titleScreen.classList.remove("hidden");
  }
  function setMode(m) {
    mode = m === "nonbiri" ? "nonbiri" : "doki";
    lsSet(STORAGE_KEY_MODE, mode);
    updateTitle();
  }

  // ---- タイトル画面・ずかんの表示 ----
  function updateTitle() {
    document.querySelectorAll(".mode-btn").forEach(function (b) {
      const on = b.getAttribute("data-mode") === mode;
      b.classList.toggle("on", on);
      b.setAttribute("aria-checked", on ? "true" : "false");
    });
    document.getElementById("best-doki").textContent = "ベスト " + getBest("doki");
    document.getElementById("best-nonbiri").textContent = "ベスト " + getBest("nonbiri");
    document.getElementById("mode-desc").textContent = MODE_INFO[mode].desc;
    renderZukan(document.getElementById("zukan-title"), []);
  }
  function renderZukan(box, fresh) {
    const done = zukanComplete();
    box.classList.toggle("complete", done);
    box.innerHTML = "";
    const head = document.createElement("div");
    head.className = "zukan-head";
    const ttl = document.createElement("span");
    ttl.textContent = done ? "🏆 ずかん コンプリート！" : "📖 どうぶつずかん";
    const cnt = document.createElement("span");
    cnt.className = "cnt";
    cnt.textContent = zukan.length + " / " + ANIMALS.length;
    head.appendChild(ttl); head.appendChild(cnt);
    box.appendChild(head);
    const grid = document.createElement("div");
    grid.className = "zukan-grid";
    for (let k = 0; k < ANIMALS.length; k++) {
      const got = zukan.indexOf(k) >= 0;
      const cell = document.createElement("div");
      cell.className = "stamp" + (got ? "" : " off") + (fresh.indexOf(k) >= 0 ? " new" : "");
      cell.setAttribute("data-tier", String(k));
      if (fresh.indexOf(k) >= 0) cell.style.setProperty("--d", (fresh.indexOf(k) * 0.28 + 0.15) + "s");
      const cv = document.createElement("canvas");
      cv.width = 84; cv.height = 84;
      cv.setAttribute("aria-hidden", "true");
      drawStamp(cv.getContext("2d"), 42, 42, 1.95, k, got, done);
      const nm = document.createElement("span");
      nm.textContent = got ? ANIMALS[k].name : "？？？";
      cell.appendChild(cv); cell.appendChild(nm);
      grid.appendChild(cell);
    }
    box.appendChild(grid);
    const foot = document.createElement("div");
    foot.className = "zukan-foot";
    if (done) foot.textContent = "ぜんぶの動物に会えたよ！ すごい！";
    else if (fresh.length) foot.textContent = "こんかい " + fresh.length + "こ スタンプゲット！ あと " + (ANIMALS.length - zukan.length) + "しゅるい";
    else foot.textContent = "同じ動物をくっつけて 進化させるとスタンプがもらえる";
    box.appendChild(foot);
  }
  // スタンプ1こ（s=大きさの倍率、ずかん用・プレイ中の演出の両方で使う）
  function drawStamp(c, x, y, s, tier, got, gold) {
    c.save();
    const R = 20 * s;
    if (got) {
      c.fillStyle = gold ? "rgba(255, 209, 102, 0.16)" : "rgba(255, 95, 162, 0.13)";
      c.beginPath(); c.arc(x, y, R, 0, Math.PI * 2); c.fill();
      c.strokeStyle = gold ? "#ffd166" : "#ff5fa2";
      c.lineWidth = 2.2 * s;
      c.beginPath(); c.arc(x, y, R - 1.2 * s, 0, Math.PI * 2); c.stroke();
      c.lineWidth = 0.9 * s;
      c.globalAlpha = 0.7;
      c.beginPath(); c.arc(x, y, R - 4 * s, 0, Math.PI * 2); c.stroke();
      c.globalAlpha = 1;
      const r = (tier === 2 ? 9 : tier === 7 ? 10.5 : 12) * s;
      drawAnimal(c, x, y + (tier === 2 ? 5 : 2) * s, r, tier, 0);
    } else {
      c.fillStyle = "rgba(255, 255, 255, 0.04)";
      c.beginPath(); c.arc(x, y, R, 0, Math.PI * 2); c.fill();
      c.strokeStyle = "#4a4670";
      c.lineWidth = 1.4 * s;
      c.setLineDash([3 * s, 3 * s]);
      c.beginPath(); c.arc(x, y, R - 1.2 * s, 0, Math.PI * 2); c.stroke();
      c.setLineDash([]);
      c.fillStyle = "#6d6896";
      c.font = "900 " + Math.round(17 * s) + "px 'Zen Maru Gothic', sans-serif";
      c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText("？", x, y + 1 * s);
    }
    c.restore();
  }

  // ---- どきどきモードの持ち時間 ----
  // 持っている動物が大きいほど・盤面がうまるほど・たくさん落とすほど 少しずつ短くなる
  function calcLimit() {
    let top = FLOOR;
    for (const f of animals) if (f.grace <= 0) top = Math.min(top, f.y - f.r);
    const fill = Math.max(0, Math.min(1, (FLOOR - top) / (FLOOR - LINE_Y)));
    const lim = TIMER_BASE - currentTier * 0.15 - Math.min(dropCount * 0.012, 0.9) - fill * fill * 1.2;
    return Math.round(Math.max(TIMER_MIN, Math.min(TIMER_BASE, lim)) * 10) / 10;
  }
  function armTimer() {
    dropLimit = calcLimit();
    dropTimer = dropLimit;
    lastTickSec = 99;
  }
  function autoDrop() {
    if (state !== "play" || dropCd > 0) return;
    const spec = ANIMALS[currentTier];
    const x = Math.max(WALL_L + spec.r + 1, Math.min(WALL_R - spec.r - 1, aimX));
    popup(x, 150, "じかんぎれ！", "#ff7aa8");
    if (pointerIsDown) ignoreNextUp = true;
    dropAnimal();
  }

  function dropAnimal() {
    if (state !== "play" || dropCd > 0) return;
    const spec = ANIMALS[currentTier];
    const x = Math.max(WALL_L + spec.r + 1, Math.min(WALL_R - spec.r - 1, aimX));
    animals.push({ x: x, y: 108, vx: 0, vy: 140, r: spec.r, tier: currentTier, grace: 1.3, overT: 0, flash: 0, sndCd: 0 });
    currentTier = nextTier;
    nextTier = randTier();
    dropCd = 0.55;
    dropCount++;
    beep(520, 0.07, "sine", 0.05);
  }

  // ---- はじめて作れた動物 → スタンプ ----
  function gotAnimal(tier, x, y) {
    if (zukan.indexOf(tier) >= 0) return;
    zukan.push(tier);
    zukan.sort(function (a, b) { return a - b; });
    newThisGame.push(tier);
    saveZukan();
    stampQueue.push({ tier: tier, complete: false, n: zukan.length });
    if (zukanComplete()) stampQueue.push({ tier: tier, complete: true, n: zukan.length });
    burst(x, y, "#ffd166", 18);
  }
  function nextStamp() {
    if (stampShow || !stampQueue.length) return;
    const s = stampQueue.shift();
    stampShow = { tier: s.tier, complete: s.complete, n: s.n, t: 0, dur: s.complete ? 3.2 : 1.9, hit: false };
  }

  // ============ 物理 ============
  function physics(dt) {
    for (const f of animals) {
      f.grace -= dt;
      if (f.flash > 0) f.flash -= dt;
      if (f.sndCd > 0) f.sndCd -= dt;
      f.vy += G * dt;
      f.vx *= 0.999;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
    }
    const merges = [];
    for (let iter = 0; iter < 3; iter++) {
      // かべ・ゆか
      for (const f of animals) {
        if (f.x - f.r < WALL_L) { f.x = WALL_L + f.r; f.vx = Math.abs(f.vx) * 0.25; }
        if (f.x + f.r > WALL_R) { f.x = WALL_R - f.r; f.vx = -Math.abs(f.vx) * 0.25; }
        if (f.y + f.r > FLOOR) {
          f.y = FLOOR - f.r;
          if (f.vy > 160 && !(f.sndCd > 0)) {
            beep(300 + f.tier * 20, 0.04, "sine", 0.015);
            f.sndCd = 0.3;
          }
          f.vy = -Math.abs(f.vy) * 0.12;
          f.vx *= 0.96;
        }
      }
      // 動物どうし
      for (let i = 0; i < animals.length; i++) {
        const a = animals[i];
        if (a.dead) continue;
        for (let j = i + 1; j < animals.length; j++) {
          const b = animals[j];
          if (b.dead) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const min = a.r + b.r;
          let d = Math.hypot(dx, dy);
          if (d >= min) continue;
          // 合体判定
          if (iter === 0 && a.tier === b.tier && !a.merging && !b.merging) {
            a.merging = b.merging = true;
            merges.push([a, b]);
            continue;
          }
          let nx, ny;
          if (d < 0.01) { d = 0.01; nx = 1; ny = 0; } else { nx = dx / d; ny = dy / d; }
          const ma = a.r * a.r, mb = b.r * b.r, tm = ma + mb;
          const push = (min - d);
          a.x -= nx * push * (mb / tm); a.y -= ny * push * (mb / tm);
          b.x += nx * push * (ma / tm); b.y += ny * push * (ma / tm);
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const e = 0.12;
            const jimp = (-(1 + e) * vn) / (1 / ma + 1 / mb);
            a.vx -= (jimp * nx) / ma; a.vy -= (jimp * ny) / ma;
            b.vx += (jimp * nx) / mb; b.vy += (jimp * ny) / mb;
          }
        }
      }
    }
    // 合体を実行
    for (const pair of merges) {
      const a = pair[0], b = pair[1];
      a.dead = b.dead = true;
      const tier = a.tier;
      const ma = a.r * a.r, mb = b.r * b.r, tm = ma + mb;
      const mx = (a.x * ma + b.x * mb) / tm;
      const my = (a.y * ma + b.y * mb) / tm;
      if (tier >= ANIMALS.length - 1) {
        // ゾウ同士 → 王者ボーナス
        score += 100;
        popup(mx, my - 40, "+100 🐘 王者!!", "#7fe7ff");
        burst(mx, my, "#7fe7ff", 40);
        burst(mx, my, "#ffffff", 20);
        beep(784, 0.2, "triangle", 0.1);
        setTimeout(function () { beep(1047, 0.3, "triangle", 0.1); }, 130);
      } else {
        const nt = tier + 1;
        const spec = ANIMALS[nt];
        animals.push({
          x: mx, y: Math.min(my, FLOOR - spec.r),
          vx: (a.vx + b.vx) / 2, vy: Math.min((a.vy + b.vy) / 2, 0),
          r: spec.r, tier: nt, grace: 0.6, overT: 0, flash: 0.25, sndCd: 0.3,
        });
        score += SCORES[tier];
        popup(mx, my - spec.r - 10, spec.emoji + " " + spec.name + "!  +" + SCORES[tier], "#ffd166");
        burst(mx, my, ANIMALS[tier].c2, 12);
        mergeSound(tier);
        gotAnimal(nt, mx, my);
      }
    }
    if (merges.length) animals = animals.filter(function (f) { return !f.dead; });
    for (const f of animals) f.merging = false;

    // ゲームオーバーライン
    let danger = false;
    for (const f of animals) {
      if (f.grace > 0) continue;
      if (f.y - f.r < LINE_Y) {
        f.overT += dt;
        danger = true;
        if (f.overT > 1.4) { gameOver(); return; }
      } else {
        f.overT = 0;
      }
    }
    dangerPulse = danger ? Math.min(dangerPulse + dt * 3, 1) : Math.max(dangerPulse - dt * 3, 0);
  }

  function update(dt) {
    // NEW！スタンプ演出（出ている間は持ち時間を止める）
    nextStamp();
    if (stampShow) {
      stampShow.t += dt;
      if (!stampShow.hit && stampShow.t >= 0.22) {
        stampShow.hit = true;
        stampSound(stampShow.complete);
        if (stampShow.complete) {
          for (let k = 0; k < 4; k++) burst(W / 2 + (k - 1.5) * 90, 300, ["#ffd166", "#ff5fa2", "#53e0d8", "#a06bff"][k], 22);
        } else {
          burst(W / 2, 290, "#ff5fa2", 16);
        }
      }
      if (stampShow.t >= stampShow.dur) stampShow = null;
    }
    if (dropCd > 0) {
      dropCd -= dt;
      if (dropCd <= 0) armTimer();
    } else if (mode === "doki" && !stampShow) {
      dropTimer -= dt;
      const sec = Math.ceil(dropTimer);
      if (sec !== lastTickSec) {
        if (sec <= 3 && sec >= 1 && lastTickSec !== 99) tickSound(sec);
        lastTickSec = sec;
      }
      if (dropTimer <= 0) { dropTimer = 0; autoDrop(); }
    }
    physics(dt);
    if (state !== "play") return;
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
      if (p.life <= 0) sparks.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].y -= 44 * dt;
      popups[i].life -= dt;
      if (popups[i].life <= 0) popups.splice(i, 1);
    }
  }

  // ============ びょうが ============
  function drawAnimal(c, x, y, r, tier, flash) {
    const spec = ANIMALS[tier];
    const ink = "#3a3355";
    c.save();
    c.lineJoin = "round";

    // ---- うしろのパーツ（耳・たてがみ） ----
    if (tier === 2) { // うさぎの長い耳
      for (const s of [-1, 1]) {
        c.save();
        c.translate(x + s * r * 0.38, y - r * 0.72);
        c.rotate(s * 0.22);
        c.fillStyle = spec.c1;
        c.beginPath(); c.ellipse(0, -r * 0.5, r * 0.24, r * 0.62, 0, 0, Math.PI * 2); c.fill();
        c.strokeStyle = spec.c2; c.lineWidth = Math.max(1, r * 0.05); c.stroke();
        c.fillStyle = "#ffb3cb";
        c.beginPath(); c.ellipse(0, -r * 0.46, r * 0.11, r * 0.4, 0, 0, Math.PI * 2); c.fill();
        c.restore();
      }
    } else if (tier === 3 || tier === 5) { // ねこ・オオカミの三角耳
      const sharp = tier === 5 ? 1.2 : 1;
      for (const s of [-1, 1]) {
        c.fillStyle = spec.c2;
        c.beginPath();
        c.moveTo(x + s * r * 0.30, y - r * 0.72);
        c.lineTo(x + s * r * 0.8, y - r * (0.98 * sharp));
        c.lineTo(x + s * r * 0.85, y - r * 0.32);
        c.closePath(); c.fill();
        c.fillStyle = tier === 3 ? "#ffb3cb" : "#c9d8e8";
        c.beginPath();
        c.moveTo(x + s * r * 0.46, y - r * 0.6);
        c.lineTo(x + s * r * 0.7, y - r * (0.8 * sharp));
        c.lineTo(x + s * r * 0.73, y - r * 0.44);
        c.closePath(); c.fill();
      }
    } else if (tier === 1 || tier === 8) { // ハムスター・クマの丸耳
      for (const s of [-1, 1]) {
        c.fillStyle = spec.c2;
        c.beginPath(); c.arc(x + s * r * 0.55, y - r * 0.72, r * 0.28, 0, Math.PI * 2); c.fill();
        c.fillStyle = spec.c1;
        c.beginPath(); c.arc(x + s * r * 0.55, y - r * 0.72, r * 0.15, 0, Math.PI * 2); c.fill();
      }
    } else if (tier === 6) { // ゴリラの小さい耳
      for (const s of [-1, 1]) {
        c.fillStyle = spec.c2;
        c.beginPath(); c.arc(x + s * r * 0.92, y - r * 0.08, r * 0.18, 0, Math.PI * 2); c.fill();
      }
    } else if (tier === 7) { // ライオンのたてがみ＋耳
      c.fillStyle = "#c2691f";
      for (let k = 0; k < 12; k++) {
        const a = (Math.PI * 2 / 12) * k + 0.13;
        c.beginPath();
        c.moveTo(x + Math.cos(a - 0.17) * r * 0.86, y + Math.sin(a - 0.17) * r * 0.86);
        c.lineTo(x + Math.cos(a) * r * 1.26, y + Math.sin(a) * r * 1.26);
        c.lineTo(x + Math.cos(a + 0.17) * r * 0.86, y + Math.sin(a + 0.17) * r * 0.86);
        c.closePath(); c.fill();
      }
      for (const s of [-1, 1]) {
        c.fillStyle = spec.c2;
        c.beginPath(); c.arc(x + s * r * 0.6, y - r * 0.76, r * 0.2, 0, Math.PI * 2); c.fill();
      }
    } else if (tier === 9) { // ゾウの大きい耳
      for (const s of [-1, 1]) {
        c.fillStyle = spec.c2;
        c.beginPath(); c.ellipse(x + s * r * 0.86, y - r * 0.04, r * 0.42, r * 0.56, s * 0.25, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#8fb3c9";
        c.beginPath(); c.ellipse(x + s * r * 0.86, y - r * 0.04, r * 0.28, r * 0.4, s * 0.25, 0, Math.PI * 2); c.fill();
      }
    } else if (tier === 4) { // いぬのたれ耳
      for (const s of [-1, 1]) {
        c.save();
        c.translate(x + s * r * 0.62, y - r * 0.4);
        c.rotate(s * 0.5);
        c.fillStyle = spec.c2;
        c.beginPath(); c.ellipse(0, r * 0.28, r * 0.26, r * 0.52, 0, 0, Math.PI * 2); c.fill();
        c.restore();
      }
    }

    // ---- 顔のベース ----
    const g = c.createRadialGradient(x - r * 0.32, y - r * 0.38, r * 0.1, x, y, r);
    g.addColorStop(0, spec.c1);
    g.addColorStop(1, spec.c2);
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = "rgba(255,255,255,0.35)";
    c.beginPath(); c.ellipse(x - r * 0.35, y - r * 0.45, r * 0.2, r * 0.12, -0.6, 0, Math.PI * 2); c.fill();

    // ---- 種類ごとの顔パーツ ----
    const eyeR = Math.max(r * 0.085, 1.5);
    const eyeY = y - r * 0.08;
    let eyeDX = r * 0.34;
    let mouth = true;

    if (tier === 0) { // ひよこ：くちばし＋あほ毛
      c.strokeStyle = "#f2a43b"; c.lineWidth = Math.max(1.2, r * 0.09); c.lineCap = "round";
      c.beginPath(); c.moveTo(x - r * 0.05, y - r * 0.98); c.quadraticCurveTo(x + r * 0.18, y - r * 1.28, x + r * 0.32, y - r * 1.12); c.stroke();
      c.fillStyle = "#ff9d3d";
      c.beginPath();
      c.moveTo(x - r * 0.22, y + r * 0.1);
      c.lineTo(x + r * 0.22, y + r * 0.1);
      c.lineTo(x, y + r * 0.42);
      c.closePath(); c.fill();
      mouth = false;
    } else if (tier === 1) { // ハムスター：ほっぺぶくろ
      c.fillStyle = "rgba(255,255,255,0.55)";
      c.beginPath();
      c.ellipse(x - r * 0.42, y + r * 0.3, r * 0.3, r * 0.26, 0, 0, Math.PI * 2);
      c.ellipse(x + r * 0.42, y + r * 0.3, r * 0.3, r * 0.26, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = ink;
      c.beginPath(); c.ellipse(x, y + r * 0.16, r * 0.09, r * 0.07, 0, 0, Math.PI * 2); c.fill();
    } else if (tier === 2) { // うさぎ：ピンクのはな
      c.fillStyle = "#ff8fb0";
      c.beginPath(); c.ellipse(x, y + r * 0.12, r * 0.1, r * 0.08, 0, 0, Math.PI * 2); c.fill();
    } else if (tier === 3) { // ねこ：マズル＋ヒゲ
      c.fillStyle = "#ffe9d2";
      c.beginPath(); c.ellipse(x, y + r * 0.3, r * 0.4, r * 0.3, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#e07a5f";
      c.beginPath();
      c.moveTo(x - r * 0.09, y + r * 0.14); c.lineTo(x + r * 0.09, y + r * 0.14); c.lineTo(x, y + r * 0.26);
      c.closePath(); c.fill();
      c.strokeStyle = "rgba(58,51,85,0.55)"; c.lineWidth = Math.max(1, r * 0.035); c.lineCap = "round";
      for (const s of [-1, 1]) {
        c.beginPath(); c.moveTo(x + s * r * 0.5, y + r * 0.2); c.lineTo(x + s * r * 0.95, y + r * 0.12); c.stroke();
        c.beginPath(); c.moveTo(x + s * r * 0.5, y + r * 0.34); c.lineTo(x + s * r * 0.95, y + r * 0.38); c.stroke();
      }
    } else if (tier === 4) { // いぬ：マズル＋はな＋した
      c.fillStyle = "#f5e0c4";
      c.beginPath(); c.ellipse(x, y + r * 0.32, r * 0.42, r * 0.32, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#ff8fb0";
      c.beginPath(); c.ellipse(x, y + r * 0.5, r * 0.12, r * 0.15, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = ink;
      c.beginPath(); c.ellipse(x, y + r * 0.16, r * 0.14, r * 0.11, 0, 0, Math.PI * 2); c.fill();
      mouth = false;
    } else if (tier === 5) { // オオカミ：つりまゆ＋マズル
      c.fillStyle = "#eef3f8";
      c.beginPath(); c.ellipse(x, y + r * 0.34, r * 0.4, r * 0.3, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = ink;
      c.beginPath(); c.ellipse(x, y + r * 0.2, r * 0.12, r * 0.09, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = ink; c.lineWidth = Math.max(1.2, r * 0.05); c.lineCap = "round";
      for (const s of [-1, 1]) {
        c.beginPath(); c.moveTo(x + s * r * 0.52, y - r * 0.36); c.lineTo(x + s * r * 0.18, y - r * 0.22); c.stroke();
      }
      mouth = false;
    } else if (tier === 6) { // ゴリラ：フェイスプレート＋まゆ
      c.fillStyle = "#8e93a8";
      c.beginPath(); c.ellipse(x, y + r * 0.24, r * 0.52, r * 0.44, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = ink;
      c.beginPath();
      c.ellipse(x - r * 0.14, y + r * 0.32, r * 0.05, r * 0.07, 0, 0, Math.PI * 2);
      c.ellipse(x + r * 0.14, y + r * 0.32, r * 0.05, r * 0.07, 0, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = ink; c.lineWidth = Math.max(1.4, r * 0.055); c.lineCap = "round";
      c.beginPath(); c.moveTo(x - r * 0.48, y - r * 0.3); c.lineTo(x + r * 0.48, y - r * 0.3); c.stroke();
      eyeDX = r * 0.26;
      mouth = false;
    } else if (tier === 7) { // ライオン：マズル＋ヒゲ
      c.fillStyle = "#ffedc9";
      c.beginPath(); c.ellipse(x, y + r * 0.32, r * 0.42, r * 0.32, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#b06a2c";
      c.beginPath();
      c.moveTo(x - r * 0.1, y + r * 0.14); c.lineTo(x + r * 0.1, y + r * 0.14); c.lineTo(x, y + r * 0.28);
      c.closePath(); c.fill();
      c.strokeStyle = "rgba(58,51,85,0.45)"; c.lineWidth = Math.max(1, r * 0.03); c.lineCap = "round";
      for (const s of [-1, 1]) {
        c.beginPath(); c.moveTo(x + s * r * 0.5, y + r * 0.24); c.lineTo(x + s * r * 0.9, y + r * 0.2); c.stroke();
      }
    } else if (tier === 8) { // クマ：マズル＋はな
      c.fillStyle = "#f0cf9e";
      c.beginPath(); c.ellipse(x, y + r * 0.3, r * 0.4, r * 0.32, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = ink;
      c.beginPath(); c.ellipse(x, y + r * 0.18, r * 0.13, r * 0.1, 0, 0, Math.PI * 2); c.fill();
    } else if (tier === 9) { // ゾウ：キバ＋ながい鼻
      c.fillStyle = "#f2ede2";
      for (const s of [-1, 1]) {
        c.beginPath();
        c.ellipse(x + s * r * 0.3, y + r * 0.5, r * 0.08, r * 0.18, s * 0.5, 0, Math.PI * 2);
        c.fill();
      }
      const tg = c.createLinearGradient(x, y, x, y + r);
      tg.addColorStop(0, spec.c1); tg.addColorStop(1, spec.c2);
      c.fillStyle = tg;
      c.beginPath();
      c.moveTo(x - r * 0.16, y + r * 0.05);
      c.quadraticCurveTo(x - r * 0.2, y + r * 0.55, x - r * 0.05, y + r * 0.8);
      c.quadraticCurveTo(x + r * 0.05, y + r * 0.92, x + r * 0.22, y + r * 0.82);
      c.quadraticCurveTo(x + r * 0.1, y + r * 0.6, x + r * 0.16, y + r * 0.05);
      c.closePath(); c.fill();
      c.strokeStyle = "rgba(58,51,85,0.25)"; c.lineWidth = Math.max(1, r * 0.03);
      for (let k = 1; k <= 3; k++) {
        c.beginPath();
        c.moveTo(x - r * 0.14, y + r * (0.12 + k * 0.16));
        c.quadraticCurveTo(x, y + r * (0.17 + k * 0.16), x + r * 0.14, y + r * (0.12 + k * 0.16));
        c.stroke();
      }
      mouth = false;
    }

    // ---- 目（共通・ハイライト付き） ----
    c.fillStyle = ink;
    c.beginPath();
    c.arc(x - eyeDX, eyeY, eyeR, 0, Math.PI * 2);
    c.arc(x + eyeDX, eyeY, eyeR, 0, Math.PI * 2);
    c.fill();
    if (r >= 22) {
      c.fillStyle = "rgba(255,255,255,0.85)";
      c.beginPath();
      c.arc(x - eyeDX + eyeR * 0.3, eyeY - eyeR * 0.32, eyeR * 0.32, 0, Math.PI * 2);
      c.arc(x + eyeDX + eyeR * 0.3, eyeY - eyeR * 0.32, eyeR * 0.32, 0, Math.PI * 2);
      c.fill();
    }
    if (mouth) {
      c.strokeStyle = ink;
      c.lineWidth = Math.max(1.2, r * 0.05);
      c.lineCap = "round";
      c.beginPath(); c.arc(x, y + r * 0.26, r * 0.16, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    }
    if (r >= 20 && tier !== 5 && tier !== 6) {
      c.fillStyle = "rgba(255, 143, 176, 0.4)";
      c.beginPath();
      c.ellipse(x - r * 0.58, y + r * 0.14, r * 0.13, r * 0.09, 0, 0, Math.PI * 2);
      c.ellipse(x + r * 0.58, y + r * 0.14, r * 0.13, r * 0.09, 0, 0, Math.PI * 2);
      c.fill();
    }

    if (flash > 0) {
      c.globalAlpha = flash * 2.4;
      c.strokeStyle = "#ffffff";
      c.lineWidth = 3;
      c.beginPath(); c.arc(x, y, r + 4, 0, Math.PI * 2); c.stroke();
      c.globalAlpha = 1;
    }
    c.restore();
  }

  function draw(t) {
    // よぞら
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#1b1836");
    sky.addColorStop(0.6, "#251d48");
    sky.addColorStop(1, "#2c2153");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    for (const s of bgStars) {
      ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(t / 900 + s.tw));
      ctx.fillStyle = "#e8e4ff";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = "30px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🌙", 445, 40);

    // はこ（ガラスふう）
    ctx.fillStyle = "rgba(255, 255, 255, 0.045)";
    ctx.fillRect(WALL_L - 8, 120, WALL_R - WALL_L + 16, FLOOR - 120 + 10);
    ctx.strokeStyle = "rgba(83, 224, 216, 0.5)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(WALL_L - 6, 122);
    ctx.lineTo(WALL_L - 6, FLOOR + 6);
    ctx.lineTo(WALL_R + 6, FLOOR + 6);
    ctx.lineTo(WALL_R + 6, 122);
    ctx.stroke();

    // きけんライン
    const lineAlpha = 0.35 + dangerPulse * 0.55 * Math.abs(Math.sin(t / 150));
    ctx.strokeStyle = dangerPulse > 0.3 ? "rgba(255, 77, 109, " + lineAlpha + ")" : "rgba(255, 209, 102, " + lineAlpha + ")";
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.moveTo(WALL_L - 6, LINE_Y);
    ctx.lineTo(WALL_R + 6, LINE_Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // 動物
    for (const f of animals) drawAnimal(ctx, f.x, f.y, f.r, f.tier, f.flash);

    // ねらい（プレイ中）
    if (state === "play") {
      const spec = ANIMALS[currentTier];
      const gx = Math.max(WALL_L + spec.r + 1, Math.min(WALL_R - spec.r - 1, aimX));
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = "#eeecfa";
      ctx.setLineDash([4, 8]);
      ctx.beginPath(); ctx.moveTo(gx, 118); ctx.lineTo(gx, FLOOR); ctx.stroke();
      ctx.setLineDash([]);
      // どきどき：のこり時間のリング
      const timed = mode === "doki" && dropCd <= 0;
      const ratio = timed && dropLimit > 0 ? Math.max(0, dropTimer / dropLimit) : 1;
      const urgent = timed && dropTimer <= 2;
      let wob = 0;
      if (urgent && !stampShow) wob = Math.sin(t / 45) * (2.2 - dropTimer) * 1.6;
      ctx.globalAlpha = dropCd > 0 ? 0.35 : 0.9;
      drawAnimal(ctx, gx + wob, 108, spec.r, currentTier, 0);
      ctx.globalAlpha = 1;
      if (timed) {
        const rr = spec.r + 8;
        const col = ratio > 0.5 ? "#53e0d8" : dropTimer > 2 ? "#ffd166" : "#ff4d6d";
        ctx.lineCap = "round";
        ctx.lineWidth = 5;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.13)";
        ctx.beginPath(); ctx.arc(gx, 108, rr, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = col;
        if (urgent) { ctx.shadowColor = col; ctx.shadowBlur = 8 + 6 * Math.abs(Math.sin(t / 90)); }
        ctx.beginPath(); ctx.arc(gx, 108, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.lineCap = "butt";
        if (dropTimer <= 3) {
          const sec = Math.max(1, Math.ceil(dropTimer));
          const frac = sec - dropTimer; // 0→1 で毎秒ぽんと出る
          const sc = 1 + Math.max(0, 0.35 - frac) * 1.4;
          ctx.save();
          ctx.translate(gx < W / 2 ? gx + rr + 20 : gx - rr - 20, 108);
          ctx.scale(sc, sc);
          ctx.font = "900 24px 'Zen Maru Gothic', sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.lineWidth = 5; ctx.strokeStyle = "rgba(19, 19, 34, 0.9)";
          ctx.strokeText(String(sec), 0, 0);
          ctx.fillStyle = col;
          ctx.fillText(String(sec), 0, 0);
          ctx.restore();
        }
      }
    }

    // パーティクル・ポップアップ
    for (const p of sparks) {
      ctx.globalAlpha = Math.max(p.life / p.max, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = "900 20px 'Zen Maru Gothic', sans-serif";
    for (const p of popups) {
      ctx.globalAlpha = Math.max(p.life / 0.9, 0);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = "rgba(19, 19, 34, 0.78)";
    roundRect(ctx, 12, 12, 150, 40, 12);
    roundRect(ctx, W - 118, 56, 106, 52, 12);
    ctx.fillStyle = "#7fe7ff";
    ctx.font = "900 20px 'Zen Maru Gothic', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🐾 " + score, 24, 33);
    ctx.fillStyle = "#9d99c0";
    ctx.font = "900 11px 'Zen Maru Gothic', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("つぎ", W - 65, 70);
    if (state === "play") {
      const ns = ANIMALS[nextTier];
      const nr = Math.min(ns.r, 15);
      drawAnimal(ctx, W - 65, 90, nr, nextTier, 0);
    }

    // しんかのじゅん（下のガイド）
    ctx.fillStyle = "rgba(19, 19, 34, 0.6)";
    ctx.fillRect(0, H - 32, W, 32);
    let gx2 = 28;
    for (let k = 0; k < ANIMALS.length; k++) {
      const got = zukan.indexOf(k) >= 0;
      ctx.globalAlpha = got ? 1 : 0.3;
      drawMini(ctx, gx2, H - 16, 8 + k * 0.55, k);
      gx2 += 47;
    }
    ctx.globalAlpha = 1;

    // モードとずかんの進みぐあい（上のまんなか）
    if (state === "play") {
      ctx.font = "900 15px 'Zen Maru Gothic', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(19, 19, 34, 0.78)";
      roundRect(ctx, W / 2 - 66, 12, 132, 40, 12);
      ctx.fillStyle = mode === "doki" ? "#ff8fbd" : "#7fe7ff";
      ctx.fillText(MODE_INFO[mode].label, W / 2, 24);
      ctx.fillStyle = "#ffd166";
      ctx.font = "900 14px 'Zen Maru Gothic', sans-serif";
      ctx.fillText("📖 ずかん " + zukan.length + "/" + ANIMALS.length, W / 2, 42);
    }

    if (stampShow) drawStampShow(t);
  }

  // NEW！スタンプゲット／コンプリートの演出
  function drawStampShow(t) {
    const s = stampShow;
    const inA = Math.min(1, s.t / 0.22);
    const outA = Math.min(1, Math.max(0, (s.dur - s.t) / 0.3));
    const a = Math.min(inA * 1.2, 1) * outA;
    const cx = W / 2, cy = s.complete ? 300 : 292;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(19, 19, 34, 0.86)";
    const pw = s.complete ? 360 : 270, ph = s.complete ? 250 : 196;
    roundRect(ctx, cx - pw / 2, cy - ph / 2 - 10, pw, ph, 22);
    ctx.strokeStyle = s.complete ? "#ffd166" : "#ff5fa2";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(cx - pw / 2, cy - ph / 2 - 10, pw, ph, 22) : ctx.rect(cx - pw / 2, cy - ph / 2 - 10, pw, ph);
    ctx.stroke();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    if (s.complete) {
      // ぜんぶの動物がまるくならぶ
      const hue = (t / 8) % 360;
      for (let k = 0; k < ANIMALS.length; k++) {
        const ang = -Math.PI / 2 + (Math.PI * 2 / ANIMALS.length) * (k + 0.5) + s.t * 0.25;
        const pop = Math.min(1, Math.max(0, (s.t - 0.2 - k * 0.06) / 0.2));
        if (pop <= 0) continue;
        drawAnimal(ctx, cx + Math.cos(ang) * 148, cy + 2 + Math.sin(ang) * 92, 14 * pop, k, 0);
      }
      ctx.font = "400 30px 'Mochiy Pop One', 'Zen Maru Gothic', sans-serif";
      ctx.lineWidth = 6; ctx.strokeStyle = "rgba(19, 19, 34, 0.95)";
      ctx.strokeText("コンプリート！", cx, cy - 2);
      ctx.fillStyle = "hsl(" + hue + ", 90%, 72%)";
      ctx.fillText("コンプリート！", cx, cy - 2);
      ctx.font = "900 16px 'Zen Maru Gothic', sans-serif";
      ctx.fillStyle = "#ffd166";
      ctx.fillText("ずかんが ぜんぶ うまったよ！", cx, cy + 30);
    } else {
      // スタンプがポンと押される
      const p = Math.min(1, s.t / 0.22);
      const sc = p < 1 ? 2.3 - 1.3 * (p * p) : 1 + Math.max(0, 0.1 - (s.t - 0.22)) * 1.5;
      ctx.save();
      ctx.translate(cx, cy - 22);
      ctx.rotate(-0.12 * Math.min(1, p));
      ctx.scale(sc, sc);
      drawStamp(ctx, 0, 0, 2.2, s.tier, true, false);
      ctx.restore();
      // NEW! リボン
      ctx.save();
      ctx.translate(cx + 52, cy - 76);
      ctx.rotate(0.2);
      ctx.fillStyle = "#ffd166";
      roundRect(ctx, -30, -13, 60, 26, 13);
      ctx.fillStyle = "#131322";
      ctx.font = "900 17px 'Zen Maru Gothic', sans-serif";
      ctx.fillText("NEW!", 0, 1);
      ctx.restore();
      ctx.font = "900 22px 'Zen Maru Gothic', sans-serif";
      ctx.fillStyle = "#ffd166";
      ctx.fillText("スタンプゲット！", cx, cy + 46);
      ctx.font = "900 17px 'Zen Maru Gothic', sans-serif";
      ctx.fillStyle = "#eeecfa";
      ctx.fillText(ANIMALS[s.tier].name + "  （" + s.n + "/" + ANIMALS.length + "）", cx, cy + 72);
    }
    ctx.restore();
  }
  function drawMini(c, x, y, r, tier) {
    drawAnimal(c, x, y, r, tier, 0);
  }
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
    c.fill();
  }

  // ============ メインループ（固定60fps） ============
  let acc = 0;
  function loop(t) {
    const dt = Math.min((t - lastTime) / 1000, 0.1);
    lastTime = t;
    acc += dt;
    while (acc >= 1 / 60) {
      if (state === "play" && !testHold) update(1 / 60);
      acc -= 1 / 60;
    }
    draw(t);
    requestAnimationFrame(loop);
  }

  // ============ 入力（さいごに初期化） ============
  function canvasX(e) {
    const rect = canvas.getBoundingClientRect();
    return ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / rect.width * W;
  }
  canvas.addEventListener("pointermove", function (e) { aimX = canvasX(e); });
  canvas.addEventListener("pointerdown", function (e) {
    pointerIsDown = true;
    aimX = canvasX(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointerup", function (e) {
    pointerIsDown = false;
    aimX = canvasX(e);
    if (ignoreNextUp) { ignoreNextUp = false; return; } // 時間ぎれで落ちたあとの指はなしは無視
    dropAnimal();
  });
  canvas.addEventListener("pointercancel", function () { pointerIsDown = false; ignoreNextUp = false; });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // キーボード：←→でねらう、スペース／↓／Enterで落とす
  const keyHeld = {};
  document.addEventListener("keydown", function (e) {
    if (state !== "play") return;
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { aimX = Math.max(WALL_L, aimX - (e.repeat ? 14 : 10)); e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { aimX = Math.min(WALL_R, aimX + (e.repeat ? 14 : 10)); e.preventDefault(); }
    else if (k === " " || k === "ArrowDown" || k === "Enter") {
      e.preventDefault();
      if (!keyHeld[k]) dropAnimal();
      keyHeld[k] = true;
    }
  });
  document.addEventListener("keyup", function (e) { keyHeld[e.key] = false; });

  // ボタン
  document.querySelectorAll(".mode-btn").forEach(function (b) {
    b.addEventListener("click", function () {
      setMode(b.getAttribute("data-mode"));
      beep(b.getAttribute("data-mode") === "doki" ? 880 : 520, 0.08, "sine", 0.06);
    });
  });
  document.getElementById("start-btn").addEventListener("click", function () { startGame(mode); });
  document.getElementById("retry-btn").addEventListener("click", function () { startGame(mode); });
  document.getElementById("menu-btn").addEventListener("click", showTitle);

  // テスト用フック
  function snap() {
    return {
      screen: state,
      mode: mode,
      score: score,
      hand: currentTier,
      next: nextTier,
      count: animals.length,
      animals: animals.map(function (f) { return { tier: f.tier, x: Math.round(f.x), y: Math.round(f.y) }; }),
      timer: Math.round(dropTimer * 100) / 100,
      limit: dropLimit,
      dropCd: Math.max(0, Math.round(dropCd * 100) / 100),
      zukan: zukan.slice(),
      complete: zukanComplete(),
      newThisGame: newThisGame.slice(),
      stamp: stampShow ? { tier: stampShow.tier, complete: stampShow.complete } : null,
      stampQueue: stampQueue.length,
      best: { doki: getBest("doki"), nonbiri: getBest("nonbiri") },
      lineY: LINE_Y, floor: FLOOR, wallL: WALL_L, wallR: WALL_R,
    };
  }
  window.__test = {
    state: snap,
    start: function (m) { startGame(m || mode); return snap(); },
    setMode: function (m) { setMode(m); return snap(); },
    hold: function (b) { testHold = b !== false; return testHold; },
    aim: function (x) { aimX = x; },
    hand: function (tier, next) { currentTier = tier; if (next !== undefined) nextTier = next; armTimer(); return snap(); },
    drop: function (x) { if (x !== undefined) aimX = x; dropCd = 0; dropAnimal(); return snap(); },
    place: function (list) {
      animals = list.map(function (o) {
        const r = ANIMALS[o.tier].r;
        return { x: o.x, y: o.y === undefined ? FLOOR - r : o.y, vx: 0, vy: 0, r: r, tier: o.tier, grace: o.grace || 0, overT: 0, flash: 0, sndCd: 0.3 };
      });
      return snap();
    },
    step: function (ms) {
      const n = Math.round(ms / (1000 / 60));
      for (let i = 0; i < n; i++) { if (state !== "play") break; update(1 / 60); }
      return snap();
    },
    skipStamps: function () { stampQueue = []; stampShow = null; return snap(); },
    resetSave: function () {
      [STORAGE_KEY, STORAGE_KEY_DOKI, STORAGE_KEY_ZUKAN, STORAGE_KEY_MODE].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
      zukan = loadZukan(); mode = "doki"; updateTitle(); return snap();
    },
    title: function () { showTitle(); return snap(); },
    seed: function (n) {
      let a = n >>> 0;
      rng = function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    },
  };

  updateMuteBtn();
  updateTitle();
  requestAnimationFrame(function (t) { lastTime = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
