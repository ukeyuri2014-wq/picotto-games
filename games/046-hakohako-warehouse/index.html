function liveCells(s,inside){const live=new Set(s.goals),q=[...s.goals];while(q.length){const i=q.shift();for(const d of [1,-1,s.width,-s.width]){const b=i+d,p=i+2*d;if(!inside.has(b)||!inside.has(p)||live.has(b))continue;live.add(b);q.push(b)}}return live}
function starsFor(moves,min){return moves<=min+Math.floor(min*.1)?3:moves<=Math.ceil(min*1.6)?2:1}
function progress(){const p=read('progress',null);return p&&typeof p==='object'&&p.best?p:{best:{}}}
function sfx(kind){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const ac=audioContext,now=ac.currentTime;const note=(f,t0,dur,type='sine',vol=.08,f2)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,now+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+t0+dur);g.gain.setValueAtTime(vol,now+t0);g.gain.exponentialRampToValueAtTime(.001,now+t0+dur);o.connect(g).connect(ac.destination);o.start(now+t0);o.stop(now+t0+dur+.02)};

 else if(kind==='push')note(150,0,.09,'square',.04,110);
 else if(kind==='goal'){note(784,0,.12,'triangle',.08);note(1175,.07,.18,'triangle',.07)}
 else if(kind==='off')note(420,0,.1,'sine',.05,300);
 else if(kind==='bump')note(90,0,.08,'sine',.07);
 else if(kind==='undo')note(520,0,.06,'sine',.05,380);

}catch{}}
function select(){stop();document.body.classList.add('playing');scrollTo(0,0);const pr=progress();const cleared=Object.keys(pr.best).length;const cur=firstOpen();
 app.innerHTML=`<section class="panel"><div class="lv-head"><h2>面をえらぶ</h2><span class="muted small">クリア ${cleared} / ${NL}</span></div><div class="lv-grid">${LEVELS.map((L,i)=>{const b=pr.best[i];const s=b?starsFor(b,L.min):0;return `<button data-lv="${i}" class="${b?'clear':''} ${i===cur?'cur':''}" aria-label="${i+1}面 ${L.name}${b?' クリア済み':''}">${i+1}<small>${b?'★'.repeat(s)+'☆'.repeat(3-s):'&nbsp;'}</small></button>`}).join('')}</div><p class="muted small center">あとの面ほど、むずかしくなるよ。★3は さいたん手数に近いクリア。</p></section>`;
 $$('[data-lv]').forEach(b=>b.onclick=()=>mount(+b.dataset.lv))}
function firstOpen(){const pr=progress();for(let i=0;i<NL;i++)if(!pr.best[i])return i;return 0}
function mount(startLevel){stop();document.body.classList.add('playing');scrollTo(0,0);
 let level=startLevel,state,hist=[],moves=0,done=false,inside,live,cell=40,walking=false;
 stage(`<div class="soko-main"><div class="soko-board-wrap" id="bw"><div id="board" class="soko-board" role="img"></div><div id="ov" class="soko-ov" hidden></div></div><div class="pad" id="pad"><button id="undo" class="side-btn">↶<br>もどす</button><button data-d="0,-1" aria-label="上へ">▲</button><button id="reset-level" class="side-btn">↺<br>さいしょから</button><button data-d="-1,0" aria-label="左へ">◀</button><button data-d="0,1" aria-label="下へ">▼</button><button data-d="1,0" aria-label="右へ">▶</button></div></div>`,stat('面',`1/${NL}`,'level')+stat('手数','0','steps')+stat('さいたん','-','min'));
 app.querySelector('.panel').classList.add('soko-panel');
 const rb=$('#restart');rb.textContent='面えらび';rb.onclick=()=>select();
 const board=$('#board'),ov=$('#ov'),bw=$('#bw');let boxEls=[],heroEl;
 function fit(){const pad=$('#pad').getBoundingClientRect();const top=bw.getBoundingClientRect().top+scrollY;const availH=innerHeight-top-pad.height-58;const availW=app.querySelector('.panel').clientWidth-28;cell=Math.floor(Math.max(24,Math.min(56,availW/state.width,availH/state.height)));build();place(false)}
 function build(){const s=state;board.style.width=s.width*cell+'px';board.style.height=s.height*cell+'px';let h='';for(let i=0;i<s.width*s.height;i++){const x=i%s.width,y=Math.floor(i/s.width);const st=`left:${x*cell}px;top:${y*cell}px;width:${cell}px;height:${cell}px`;if(s.walls.includes(i)){// only draw walls that touch the inside
    const near=[i-1,i+1,i-s.width,i+s.width,i-s.width-1,i-s.width+1,i+s.width-1,i+s.width+1].some(n=>inside.has(n));if(near)h+=`<div class="t wl" style="${st}"></div>`}else if(inside.has(i))h+=`<div class="t fl${s.goals.includes(i)?' gl':''}" style="${st}"></div>`}
  const sz=cell-6;h+=s.boxes.map((b,k)=>`<div class="sp crate" data-b="${k}" style="width:${sz}px;height:${sz}px;font-size:${Math.round(cell*.45)}px"></div>`).join('');h+=`<div class="sp hero" style="width:${cell-8}px;height:${cell-8}px"><span class="mouth"></span></div>`;board.innerHTML=h;boxEls=[...board.querySelectorAll('.crate')];heroEl=board.querySelector('.hero');board.setAttribute('aria-label',`倉庫の地図 ${s.width}×${s.height}`)}
 function xy(i){return[i%state.width,Math.floor(i/state.width)]}
 function place(anim=true){const s=state;boxEls.forEach((el,k)=>{const [x,y]=xy(s.boxes[k]);if(!anim)el.style.transition='none';el.style.transform=`translate(${x*cell+3}px,${y*cell+3}px)`;el.classList.toggle('on',s.goals.includes(s.boxes[k]));el.classList.toggle('stuck',!s.goals.includes(s.boxes[k])&&!live.has(s.boxes[k]));if(!anim){el.offsetWidth;el.style.transition=''}});const [px,py]=xy(s.player);if(!anim)heroEl.style.transition='none';heroEl.style.transform=`translate(${px*cell+4}px,${py*cell+4}px)`;if(!anim){heroEl.offsetWidth;heroEl.style.transition=''}}
 function hud(){$('#level').textContent=`${level+1}/${NL}`;$('#steps').textContent=moves;$('#min').textContent=LEVELS[level].min+'手';$('#undo').disabled=!hist.length}
 function load(i){scrollTo(0,0);level=i;state=parseLevel(LEVELS[i]);hist=[];moves=0;done=false;walking=false;inside=insideCells(state);live=liveCells(state,inside);ov.hidden=true;fit();hud();say(i===0?'箱を全部 ◯ にのせよう！':`${i+1}面「${LEVELS[i].name}」`)}
 function move(dx,dy,quiet){if(done||!ov.hidden)return false;const next=sokobanMove(state,dx,dy);if(!next){heroEl.style.setProperty('--bx',dx*4+'px');heroEl.style.setProperty('--by',dy*4+'px');heroEl.classList.remove('bump');heroEl.offsetWidth;heroEl.classList.add('bump');if(!quiet)sfx('bump');return false}
  hist.push({state,moves});const prev=state;state=next;moves++;place(true);hud();
  if(next.pushed>=0){const k=next.pushed,was=prev.goals.includes(prev.boxes[k]),now=next.goals.includes(next.boxes[k]);const el=boxEls[k];if(now&&!was){sfx('goal');el.classList.remove('pop');el.offsetWidth;el.classList.add('pop')}else if(was&&!now)sfx('off');else if(!now&&!live.has(next.boxes[k])){sfx('stuck');say('あっ、もう運べない！「もどす」で戻ろう')}else sfx('push');if(live.has(next.boxes[k])&&$('#notice').textContent.startsWith('あっ'))say('')}else if(!quiet)sfx('step');
  if(state.boxes.every(b=>state.goals.includes(b)))win();return true}
 function win(){done=true;walking=false;const L=LEVELS[level],pr=progress();const old=pr.best[level];const isBest=!old||moves<old;if(isBest){pr.best[level]=moves;save('progress',pr)}const s=starsFor(moves,L.min);later(()=>sfx('clear'),120);boxEls.forEach((el,i)=>later(()=>{el.classList.remove('pop');el.offsetWidth;el.classList.add('pop')},i*70));
  const all=Object.keys(pr.best).length===NL,last=level===NL-1;
  later(()=>{ov.innerHTML=`<div class="ov-card"><div class="ov-title">${last&&all?'全'+NL+'面クリア！':'クリア！'}</div><div class="ov-stars" aria-label="星${s}つ">${'★'.repeat(s)}<span class="off">${'★'.repeat(3-s)}</span></div><p class="ov-sub">${moves}手でクリア（さいたん ${L.min}手）<br>${isBest&&old?'ベスト記録こうしん！':old?`ベスト ${Math.min(old,moves)}手`:s===3?'すごい！ ほぼさいたん！':'★3は さいたん手数に近いクリアだよ'}</p><div class="ov-btns">${last?'':`<button class="primary" id="nextlv">つぎの面へ ▶</button>`}<button id="retry">もういちど</button><button id="tosel" ${last?'class="primary"':''}>面えらび</button></div></div>`;ov.hidden=false;const nb=$('#nextlv');if(nb)nb.onclick=()=>load(level+1);$('#retry').onclick=()=>load(level);$('#tosel').onclick=()=>select();(nb||$('#tosel')).focus({preventScroll:true})},650)}
 function undo(){if(!hist.length||walking)return;const h=hist.pop();state=h.state;moves=h.moves;done=false;ov.hidden=true;place(true);hud();sfx('undo');say('1手もどしたよ。')}
 $('#undo').onclick=undo;
 $('#reset-level').onclick=()=>{if(moves&&!done){state=parseLevel(LEVELS[level]);hist=[];moves=0;place(true);hud();say('さいしょからやり直し！')}};
 // pad: press-and-hold repeat
 $$('[data-d]').forEach(b=>{const d=b.dataset.d.split(',').map(Number);let t1,t2;const end=()=>{clearTimeout(t1);clearInterval(t2)};b.addEventListener('pointerdown',e=>{e.preventDefault();move(...d);t1=setTimeout(()=>{t2=setInterval(()=>{if(!move(...d,true))end()},120)},320)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,end));cleanup.push(end);b.addEventListener('click',e=>{if(e.detail===0)move(...d)})});
 // swipe / tap on board
 let sp=null;on(bw,'pointerdown',e=>{if(!ov.hidden)return;sp={x:e.clientX,y:e.clientY}});
 on(bw,'pointerup',e=>{if(!sp||!ov.hidden)return;const dx=e.clientX-sp.x,dy=e.clientY-sp.y;sp=null;if(Math.max(Math.abs(dx),Math.abs(dy))>=22){if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy));return}
  const r=board.getBoundingClientRect(),cx=Math.floor((e.clientX-r.left)/cell),cy=Math.floor((e.clientY-r.top)/cell);if(cx<0||cy<0||cx>=state.width||cy>=state.height)return;const [px,py]=xy(state.player);const ddx=cx-px,ddy=cy-py;if(Math.abs(ddx)+Math.abs(ddy)===1){move(ddx,ddy);return}walkTo(cy*state.width+cx)});
 function walkTo(target){if(done||walking)return;const s=state;if(s.walls.includes(target)||s.boxes.includes(target)||!inside.has(target))return;const prev=new Map([[s.player,null]]),q=[s.player];while(q.length){const i=q.shift();if(i===target)break;for(const d of [1,-1,s.width,-s.width]){const n=i+d;if(prev.has(n)||s.walls.includes(n)||s.boxes.includes(n)||!inside.has(n))continue;prev.set(n,i);q.push(n)}}if(!prev.has(target))return;const path=[];for(let i=target;prev.get(i)!=null;i=prev.get(i))path.unshift(i);walking=true;let k=0;const stepOnce=()=>{if(!walking||k>=path.length){walking=false;return}const cur=state.player,n=path[k++],d=n-cur;const dx=d===1?1:d===-1?-1:0,dy=d===s.width?1:d===-s.width?-1:0;move(dx,dy,k>1);later(stepOnce,70)};stepOnce()}
 on(window,'keydown',e=>{if(!ov.hidden){if(e.key==='Enter'){const b=ov.querySelector('button.primary');if(b){e.preventDefault();b.click()}}return}const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key.length===1?e.key.toLowerCase():e.key];if(d){e.preventDefault();walking=false;move(...d)}else if(e.key.toLowerCase()==='z'||e.key==='Backspace'){e.preventDefault();undo()}else if(e.key.toLowerCase()==='r')$('#reset-level').click()});
 on(window,'resize',()=>fit());
 window.__soko={get state(){return{level,moves,done,player:state.player,boxes:[...state.boxes]}}};
 load(level)}
function launch(){mount(firstOpen())}
function intro(){const pr=progress(),n=Object.keys(pr.best).length;app.innerHTML=`<section class="panel intro"><div class="icon">${CONFIG.emoji}</div><h2>${CONFIG.title}</h2><p>${CONFIG.rules}</p><div class="soko-legend"><span>📦 箱は押すだけ</span><span>◯ ゴール</span><span>↶ 何回でももどせる</span></div>${n?`<p class="progress">クリア ${n} / ${NL} 面</p>`:''}<div class="row" style="justify-content:center"><button class="primary" id="start">${n?'つづきから':'あそぶ'}</button>${n?'<button id="pick">面えらび</button>':''}</div><p class="small">${CONFIG.controls}</p></section>`;$('#start').onclick=launch;const pk=$('#pick');if(pk)pk.onclick=select}

</script></body></html>
