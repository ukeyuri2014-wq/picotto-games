    setSlot('stock','stock',st.stock.length?'':'↻',colX(0),0);slots.stock.textContent=st.stock.length?'':(st.waste.length?'↻':'');
    setSlot('waste','','',colX(1),0);
    for(let f=0;f<4;f++)setSlot('f'+f,'',SUITS[f],colX(3+f),0);
    for(let i=0;i<7;i++)setSlot('c'+i,'','K',colX(i),G.colTop);
    st.stock.forEach((c,i)=>place(c,colX(0)-Math.min(i,4)*0,0,10+i));
    st.waste.forEach((c,i)=>place(c,colX(1),0,100+i));
    st.found.forEach((p,f)=>p.forEach((c,i)=>place(c,colX(3+f),0,200+i)));
    st.cols.forEach((p,i)=>{const ys=colYs(p);p.forEach((c,n)=>place(c,colX(i),ys[n],300+n))});
    const fc=st.found.reduce((a,p)=>a+p.length,0);$('#progress').textContent=fc+'/52';$('#moves').textContent=st.moves;$('#undo').disabled=!undo.length||done||autoRunning;$('#hint').disabled=done||autoRunning;
  }
  function locate(id){for(let i=0;i<7;i++){const n=st.cols[i].findIndex(c=>c.id===id);if(n>=0)return{type:'col',col:i,index:n}}if(st.waste.some(c=>c.id===id))return{type:'waste',top:st.waste.at(-1).id===id};if(st.stock.some(c=>c.id===id))return{type:'stock'};for(let f=0;f<4;f++)if(st.found[f].some(c=>c.id===id))return{type:'found',f,top:st.found[f].at(-1).id===id};return null}
  function seqOf(l){if(l.type==='col')return st.cols[l.col].slice(l.index);if(l.type==='waste')return st.waste.length?[st.waste.at(-1)]:[];if(l.type==='found')return st.found[l.f].length?[st.found[l.f].at(-1)]:[];return[]}
  function legal(l,d){const seq=seqOf(l);if(!seq.length||!seq[0].up)return false;if(d.type==='found')return seq.length===1&&l.type!=='found'&&canF(seq[0]);if(l.type==='col'&&l.col===d.col)return false;return canStack(seq[0],st.cols[d.col].at(-1))}
  function snapshot(){undo.push(JSON.stringify(st));if(undo.length>200)undo.shift()}
  function tick(){if(!startAt)startAt=Date.now()}
  every(()=>{if(startAt&&!done){elapsed=Math.floor((Date.now()-startAt)/1000);const t=$('#time');if(t)t.textContent=fmtTime(elapsed)}},500);
  function destName(d){return d.type==='found'?'組札':(d.col+1)+'列目'}
  function doMove(l,d,quiet){const seq=seqOf(l);snapshot();tick();
    if(l.type==='col')st.cols[l.col].splice(l.index);else if(l.type==='waste')st.waste.pop();else st.found[l.f].pop();
    if(d.type==='found')st.found[seq[0].s].push(seq[0]);else st.cols[d.col].push(...seq);
    let flipped=false;if(l.type==='col'){const t=st.cols[l.col].at(-1);if(t&&!t.up){t.up=true;flipped=true}}
    st.moves++;clearHint();
    if(d.type==='found'){SND.found(seq[0].r)}else SND.place();
    if(flipped)setTimeout(SND.flip,120);
    render();const e=els[seq[0].id];if(d.type==='found'&&e){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
    if(!quiet)say(d.type==='found'?`${cname(seq[0])}を組札へ！`:flipped?'裏のカードがひらいた！':'');
    afterMove()}
  function drawStock(){if(done||autoRunning)return;if(!st.stock.length&&!st.waste.length)return;snapshot();tick();clearHint();
    if(st.stock.length){const c=st.stock.pop();c.up=true;st.waste.push(c);SND.draw()}else{st.stock=st.waste.reverse().map(c=>({...c,up:false}));st.waste=[];SND.flip();say('山札を もどしたよ。')}
    st.moves++;render();afterMove()}
  function bestDest(l){const seq=seqOf(l);if(!seq.length||!seq[0].up)return null;const c=seq[0];
    if(seq.length===1&&l.type!=='found'&&canF(c))return{type:'found'};
    const empties=[];const order=[...Array(7).keys()];if(l.type==='col')order.sort((a,b)=>((a-l.col+7)%7)-((b-l.col+7)%7));
    for(const j of order){if(l.type==='col'&&j===l.col)continue;const top=st.cols[j].at(-1);if(top){if(canStack(c,top))return{type:'col',col:j}}else if(c.r===13)empties.push(j)}
    if(empties.length&&!(l.type==='col'&&l.index===0))return{type:'col',col:empties[0]};return null}
  function kingWaiting(){if(st.waste.at(-1)?.r===13||st.stock.some(c=>c.r===13)||st.waste.some(c=>c.r===13))return true;return st.cols.some(p=>p.some((c,n)=>c.up&&c.r===13&&n>0))}
  function usefulMoves(){const res=[];const add=(pri,l,d)=>res.push({pri,l,d});
    st.cols.forEach((p,i)=>{const t=p.at(-1);if(t&&t.up&&canF(t))add(1,{type:'col',col:i,index:p.length-1},{type:'found'})});
    const w=st.waste.at(-1);if(w&&canF(w))add(1,{type:'waste'},{type:'found'});
    st.cols.forEach((p,i)=>{const k=p.findIndex(c=>c.up);if(k<0)return;
      const l={type:'col',col:i,index:k};
      for(let j=0;j<7;j++){if(j===i)continue;const top=st.cols[j].at(-1);if(top?canStack(p[k],top):(p[k].r===13&&k>0)){if(k>0){add(2,l,{type:'col',col:j});break}else if(p[k].r!==13&&kingWaiting()){add(4,l,{type:'col',col:j});break}}}
      for(let n=k+1;n<p.length;n++){if(canF(p[n-1])){const ln={type:'col',col:i,index:n};for(let j=0;j<7;j++){if(j!==i&&st.cols[j].length&&canStack(p[n],st.cols[j].at(-1))){add(5,ln,{type:'col',col:j});break}}}}
    });
    if(w){for(let j=0;j<7;j++){const top=st.cols[j].at(-1);if(top?canStack(w,top):w.r===13){add(3,{type:'waste'},{type:'col',col:j});break}}}
    return res.sort((a,b)=>a.pri-b.pri)}
  function stockCanHelp(){return[...st.stock,...st.waste].some(c=>canF(c)||st.cols.some(p=>p.length?canStack(c,p.at(-1)):c.r===13))}
  function clearHint(){clearTimeout(hintClear);board.querySelectorAll('.glow,.hintsrc').forEach(e=>e.classList.remove('glow','hintsrc'))}
  function glow(list){clearHint();list.forEach(e=>e&&e.classList.add('glow'));hintClear=setTimeout(clearHint,2200)}
  function showHint(){if(done||autoRunning)return;const m=usefulMoves()[0];
    if(m){const seq=seqOf(m.l);const where=m.l.type==='waste'?'捨て札':(m.l.col+1)+'列目';const destEl=m.d.type==='found'?slots['f'+seq[0].s]:(st.cols[m.d.col].length?els[st.cols[m.d.col].at(-1).id]:slots['c'+m.d.col]);glow([...seq.map(c=>els[c.id]),destEl]);seq.forEach(c=>els[c.id].classList.add('hintsrc'));SND.hint();return say(`💡 ${where}の${cname(seq[0])}を${destName(m.d)}へ動かせるよ。`)}
    if(st.stock.length||st.waste.length){if(stockCanHelp()){glow([slots.stock,...(st.stock.length?[els[st.stock.at(-1).id]]:[])]);SND.hint();return say('💡 山札をめくって、使えるカードを探そう。')}}
    checkStuck(true)}
  function checkStuck(force){if(done||autoRunning)return;if(usefulMoves().length||stockCanHelp()){return}
    if(stuckOpen)return;stuckOpen=true;SND.stuck();
    openModal(`<div style="font-size:2.6rem">🤔</div><h2>もう動かせる手がないみたい</h2><p class="sol-rec">「1手もどす」で前の場面から別の手をためすか、新しく配りなおそう。</p><div class="row"><button id="m-undo">↩ 1手もどす</button><button id="m-new" class="primary">新しく配る</button></div><div class="row" style="margin-top:8px"><button id="m-close" class="small">このまま見る</button></div>`);
    $('#m-undo',modalEl).onclick=()=>{closeModal();$('#undo').click()};$('#m-new',modalEl).onclick=()=>{stop();launch()};$('#m-close',modalEl).onclick=()=>{closeModal();say('手がなくなったよ。もどすか、新しく配ろう。')}}
  function openModal(html){closeModal();modalEl=document.createElement('div');modalEl.className='sol-modal';modalEl.innerHTML=`<div class="panel sol-box" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(modalEl);const m=modalEl;cleanup.push(()=>m.remove())}
  function closeModal(){if(modalEl){modalEl.remove();modalEl=null}stuckOpen=false}
  function afterMove(){const fc=st.found.reduce((a,p)=>a+p.length,0);if(fc===52)return win();
    if(!autoRunning&&!st.stock.length&&!st.waste.length&&st.cols.every(p=>p.every(c=>c.up)))return autoFinish();
    if(!autoRunning)setTimeout(()=>checkStuck(false),350)}
  function autoFinish(){autoRunning=true;render();say('✨ ぜんぶ表になった！ のこりは自動でそろえるよ。');
    const step=()=>{if(done)return;let bi=-1,br=99;st.cols.forEach((p,i)=>{const t=p.at(-1);if(t&&canF(t)&&t.r<br){br=t.r;bi=i}});if(bi<0){autoRunning=false;render();return}doMove({type:'col',col:bi,index:st.cols[bi].length-1},{type:'found'},true);if(!done)later(step,110)};later(step,300)}
  function win(){done=true;autoRunning=false;render();elapsed=startAt?Math.floor((Date.now()-startAt)/1000):0;$('#time').textContent=fmtTime(elapsed);SND.win();
    const old=readStats();const rec={wins:old.wins+1,bestMoves:old.bestMoves?Math.min(old.bestMoves,st.moves):st.moves,bestTime:old.bestTime?Math.min(old.bestTime,elapsed):elapsed};save('stats',rec);
    const newM=!old.bestMoves||st.moves<old.bestMoves,newT=!old.bestTime||elapsed<old.bestTime;
    say('🎉 ソリティア完成！');
    cascade(()=>{openModal(`<div style="font-size:3rem">🏆</div><h2>ソリティア完成！</h2><p style="font-size:1.1rem;margin:.4em 0"><b>${st.moves}</b>手 ・ <b>${fmtTime(elapsed)}</b></p><p class="sol-rec">${newM&&old.wins?'<span class="sol-new">手数の新記録！</span><br>':''}${newT&&old.wins?'<span class="sol-new">タイムの新記録！</span><br>':''}クリア ${rec.wins}回<br>さいしょう手数 ${rec.bestMoves}手 ／ ベスト ${fmtTime(rec.bestTime)}</p><div class="row"><button id="again" class="primary">もう一度あそぶ</button></div>`);$('#again',modalEl).onclick=()=>{stop();launch()};$('#again',modalEl).focus()})}
  function cascade(done_){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return done_();
    const cv=document.createElement('canvas');cv.id='solfx';document.body.appendChild(cv);cleanup.push(()=>cv.remove());const dpr=Math.min(2,window.devicePixelRatio||1);const W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const br=board.getBoundingClientRect();const cw=G.cw,ch=G.ch;const queue=[];for(let r=13;r>=1;r--)for(let f=0;f<4;f++)queue.push({s:f,r,x:br.left+colX(3+f),y:br.top});
    const flying=[];let t0=performance.now(),lastLaunch=0,finished=false;
    const drawCard=(c)=>{ctx.fillStyle='#fffefa';ctx.strokeStyle='#8f97ad';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect?ctx.roundRect(c.x,c.y,cw,ch,6):ctx.rect(c.x,c.y,cw,ch);ctx.fill();ctx.stroke();ctx.fillStyle=c.s%2?'#c3203f':'#1b2438';ctx.font=`900 ${Math.max(13,cw*.3)}px system-ui`;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(RANKS[c.r]+SUITS[c.s],c.x+3,c.y+3);ctx.font=`${cw*.55}px system-ui`;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(SUITS[c.s],c.x+cw/2,c.y+ch-5)};
    const end=()=>{if(finished)return;finished=true;cv.style.transition='opacity .4s';cv.style.opacity='0';setTimeout(()=>cv.remove(),450);done_()};
    cv.addEventListener('pointerdown',end);
    const frame=now=>{if(finished)return;if(queue.length&&now-lastLaunch>75){const c=queue.shift();c.vx=(Math.random()<.5?-1:1)*(2+Math.random()*4);c.vy=-(Math.random()*5);flying.push(c);lastLaunch=now;if(c.r%3===0)sfx(300+c.r*30,.05,'triangle',.03)}
      for(const c of flying){c.vy+=.45;c.x+=c.vx;c.y+=c.vy;if(c.y+ch>H){c.y=H-ch;c.vy*=-.72}drawCard(c)}
      for(let i=flying.length-1;i>=0;i--)if(flying[i].x<-cw-5||flying[i].x>W+5)flying.splice(i,1);
      if((!queue.length&&!flying.length)||now-t0>6500)return end();requestAnimationFrame(frame)};
    requestAnimationFrame(frame)}
  // input
  on(board,'pointerdown',e=>{if(done||autoRunning||e.button>0)return;const ce=e.target.closest('.cd'),se=e.target.closest('.sol-slot');
    if(!ce){if(se&&se.dataset.slot==='stock'){e.preventDefault();drawStock()}return}
    e.preventDefault();const id=+ce.dataset.id,l=locate(id);if(!l)return;
    if(l.type==='stock'){drawStock();return}
    if(l.type==='col'&&!st.cols[l.col][l.index].up){say('裏向きのカードは、上のカードをどかすとひらくよ。');return}
    if((l.type==='waste'||l.type==='found')&&!l.top)return;
    const ids=seqOf(l).map(c=>c.id);const br=board.getBoundingClientRect();
    drag={l,ids,sx:e.clientX,sy:e.clientY,moved:false,base:ids.map(i=>{const m=/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(els[i].style.transform);return[+m[1],+m[2]]}),br,pid:e.pointerId};
    try{board.setPointerCapture(e.pointerId)}catch{}});
  on(board,'pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.moved&&Math.hypot(dx,dy)<8)return;
    if(!drag.moved){drag.moved=true;clearHint()}drag.ids.forEach((id,k)=>{const el=els[id];el.classList.add('drag');el.style.zIndex=2000+k;el.style.transform=`translate(${drag.base[k][0]+dx}px,${drag.base[k][1]+dy}px)`});drag.dx=dx;drag.dy=dy});
  const endDrag=e=>{if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;d.ids.forEach(id=>els[id].classList.remove('drag'));
    if(!d.moved||e.type==='pointercancel'){if(e.type==='pointercancel'){render();return}const dest=bestDest(d.l);if(dest)doMove(d.l,dest);else{d.ids.forEach(id=>{const el=els[id];el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')});SND.err();say('このカードは、今は置ける場所がないよ。')}return}
    const cx=d.base[0][0]+d.dx+G.cw/2,cy=d.base[0][1]+d.dy+G.ch/2;let dest=null;
    if(cy<G.colTop-G.g/2){if(cx>colX(3)-G.g)dest={type:'found'}}else{const i=clamp(Math.floor((cx-G.x0+G.g/2)/(G.cw+G.g)),0,6);dest={type:'col',col:i}}
    if(dest&&legal(d.l,dest))doMove(d.l,dest);else{render();if(dest&&!(d.l.type==='col'&&dest.col===d.l.col)){SND.err();say(dest.type==='found'?'組札には、同じマークをAから順に1枚ずつ置こう。':'赤と黒をこうごに、数字が1つ小さいカードを重ねよう。空いた列にはKだけ置けるよ。')}}};
  on(board,'pointerup',endDrag);on(board,'pointercancel',endDrag);
  on(window,'resize',()=>{if(!drag)render()});
  $('#undo').onclick=()=>{if(!undo.length||done||autoRunning)return;st=JSON.parse(undo.pop());clearHint();closeModal();SND.draw();render();say('1手もどしたよ。')};
  $('#hint').onclick=showHint;
  render();say('カードをタップすると、置ける場所へ動くよ。ドラッグでもOK。');
  requestAnimationFrame(()=>{const p=app.querySelector('.panel');if(p&&p.getBoundingClientRect().top>8)p.scrollIntoView({block:'start',behavior:'smooth'})});
}

function launch(){mount()}
function intro(){const r=readStats();app.innerHTML=`<section class="panel intro"><div class="icon">${CONFIG.emoji}</div><h2>${CONFIG.title}</h2><p>${CONFIG.rules}</p><button class="primary" id="start">あそぶ</button><p class="small">${CONFIG.controls}</p>${r.wins?`<p class="small muted">クリア ${r.wins}回 ／ さいしょう手数 ${r.bestMoves} ／ ベストタイム ${fmtTime(r.bestTime)}</p>`:''}</section>`;$('#start').onclick=launch}
intro();
on(window,'keydown',e=>{if(e.key==='Enter'&&$('#start')){e.preventDefault();stop();launch()}});
</script></body></html>
