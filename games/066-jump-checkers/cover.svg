<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="c066bg" cx="50%" cy="42%" r="80%">
      <stop offset="0" stop-color="#2b2468"/>
      <stop offset="0.55" stop-color="#191a3e"/>
      <stop offset="1" stop-color="#0d0d1c"/>
    </radialGradient>
    <radialGradient id="c066cy" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#d6fffc"/>
      <stop offset="0.5" stop-color="#53e0d8"/>
      <stop offset="1" stop-color="#1b8580"/>
    </radialGradient>
    <radialGradient id="c066pk" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffe0ee"/>
      <stop offset="0.5" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#a82763"/>
    </radialGradient>
    <radialGradient id="c066glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c066arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53e0d8"/>
      <stop offset="0.5" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="c066cr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="c066blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="c066soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <g id="c066star"><path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z"/></g>
    <g id="c066cyan">
      <ellipse cx="0" cy="7" rx="25" ry="25" fill="#0b4744"/>
      <circle r="25" fill="url(#c066cy)"/>
      <circle r="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.6"/>
      <circle r="16.5" fill="none" stroke="#06302e" stroke-opacity="0.3" stroke-width="2"/>
      <circle r="7" fill="#ffffff" fill-opacity="0.25"/>
      <ellipse cx="-9" cy="-13" rx="7" ry="3" fill="#ffffff" fill-opacity="0.6" transform="rotate(-32 -9 -13)"/>
    </g>
    <g id="c066pink">
      <ellipse cx="0" cy="7" rx="25" ry="25" fill="#5a0f33"/>
      <circle r="25" fill="url(#c066pk)"/>
      <circle r="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.6"/>
      <circle r="16.5" fill="none" stroke="#3c0520" stroke-opacity="0.3" stroke-width="2"/>
      <circle r="7" fill="#ffffff" fill-opacity="0.25"/>
      <ellipse cx="-9" cy="-13" rx="7" ry="3" fill="#ffffff" fill-opacity="0.6" transform="rotate(-32 -9 -13)"/>
    </g>
