  <rect width="400" height="225" fill="url(#c066bg)"/>
  <g fill="#ffffff" fill-opacity="0.5">
    <circle cx="28" cy="22" r="1.2"/><circle cx="372" cy="30" r="1.4"/><circle cx="352" cy="196" r="1.1"/>
    <circle cx="44" cy="190" r="1.3"/><circle cx="18" cy="110" r="1"/><circle cx="385" cy="118" r="1"/>
  </g>

  <!-- board (tilted diamond of squares) -->
  <g transform="translate(200 122) scale(1 0.62) rotate(45)">
    <rect x="-122" y="-122" width="244" height="244" rx="10" fill="#a06bff" opacity="0.55" filter="url(#c066blur)"/>
    <rect x="-116" y="-116" width="232" height="232" rx="8" fill="#1b1b38" stroke="#a06bff" stroke-width="3"/>
    <g fill="#34345e">
      <rect x="-108" y="-108" width="54" height="54"/><rect x="0" y="-108" width="54" height="54"/>
      <rect x="-54" y="-54" width="54" height="54"/><rect x="54" y="-54" width="54" height="54"/>
      <rect x="-108" y="0" width="54" height="54"/><rect x="0" y="0" width="54" height="54"/>
      <rect x="-54" y="54" width="54" height="54"/><rect x="54" y="54" width="54" height="54"/>
    </g>
    <g fill="#16162f">
      <rect x="-54" y="-108" width="54" height="54"/><rect x="54" y="-108" width="54" height="54"/>
      <rect x="-108" y="-54" width="54" height="54"/><rect x="0" y="-54" width="54" height="54"/>
      <rect x="-54" y="0" width="54" height="54"/><rect x="54" y="0" width="54" height="54"/>
      <rect x="-108" y="54" width="54" height="54"/><rect x="0" y="54" width="54" height="54"/>
    </g>
    <rect x="0" y="-54" width="54" height="54" fill="#ffd166" opacity="0.28"/>
  </g>

  <!-- landing glow -->
  <ellipse cx="258" cy="92" rx="34" ry="22" fill="url(#c066glow)"/>
  <ellipse cx="258" cy="92" rx="17" ry="10.5" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- pieces on the board -->
  <use href="#c066pink" transform="translate(200 75) scale(0.8)"/>
  <use href="#c066pink" transform="translate(318 118) scale(0.86)"/>
  <use href="#c066cyan" transform="translate(84 124) scale(0.86)"/>
  <use href="#c066cyan" transform="translate(200 170) scale(0.95)"/>

  <!-- the piece being jumped over -->
  <ellipse cx="200" cy="118" rx="34" ry="30" fill="#ff5fa2" opacity="0.35" filter="url(#c066blur)"/>
  <use href="#c066pink" transform="translate(200 116) scale(0.9)"/>
  <g stroke="#fff3c4" stroke-width="4.5" stroke-linecap="round"><path d="M192 108 L208 124"/><path d="M208 108 L192 124"/></g>

  <!-- jump arc -->
  <path d="M146 138 Q200 8 254 80" fill="none" stroke="#ffd166" stroke-width="9" stroke-linecap="round" opacity="0.35" filter="url(#c066soft)"/>
  <path d="M146 138 Q200 8 254 80" fill="none" stroke="url(#c066arc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M258 90 L243 78 L262 71 Z" fill="#ffd166"/>

  <!-- jumping hero piece with crown -->
  <ellipse cx="204" cy="52" rx="34" ry="30" fill="#53e0d8" opacity="0.4" filter="url(#c066blur)"/>
  <g transform="translate(204 46) rotate(-10) scale(1.12)">
    <use href="#c066cyan"/>
    <circle r="23.5" fill="none" stroke="#ffd166" stroke-width="3"/>
    <path d="M-13 8 L-15 -7 L-7 0 L0 -11 L7 0 L15 -7 L13 8 Z" fill="url(#c066cr)" stroke="#6b4a00" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="-15" cy="-8" r="2.4" fill="#fff3c4"/><circle cx="0" cy="-12" r="2.4" fill="#fff3c4"/><circle cx="15" cy="-8" r="2.4" fill="#fff3c4"/>
    <circle cx="0" cy="3" r="2.2" fill="#ff5fa2"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffd166">
    <use href="#c066star" transform="translate(252 30) scale(1.2)"/>
    <use href="#c066star" transform="translate(160 26) scale(0.8)"/>
    <use href="#c066star" transform="translate(292 72) scale(0.7)"/>
  </g>
  <g fill="#53e0d8"><use href="#c066star" transform="translate(120 70) scale(0.7)"/><use href="#c066star" transform="translate(306 168) scale(0.6)"/></g>
  <g fill="#ff5fa2"><use href="#c066star" transform="translate(92 176) scale(0.6)"/><use href="#c066star" transform="translate(338 60) scale(0.55)"/></g>
</svg>
