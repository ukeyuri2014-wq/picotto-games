[2,"いぬ","........../.bb....bb./bbbttttbbb/bbt.tt.tbb/bbttttttbb/.bttttttb./..ttkktt../..tttttt../...tttt.../.........."]
];

const SETS=[{name:'やさしい',size:'5×5',color:'#8ed1b1'},{name:'ふつう',size:'8×8',color:'#ffc187'},{name:'むずかしい',size:'10×10',color:'#ff9cbf'}];
const PAL={r:'#ef4f63',p:'#ff9cc2',o:'#ff9f43',y:'#ffd54a',g:'#5cc26b',d:'#2f9a5c',u:'#4aa3ff',n:'#3558c9',b:'#9a6a3a',k:'#3d4460',w:'#f4f1ea',v:'#a77bff',s:'#9fdcff',t:'#e0b98a'};
const P=PICS.map(([set,name,a],i)=>{const rows=a.split('/');return{i,set,name,rows,H:rows.length,W:rows[0].length,sol:rows.join('').split('').map(c=>c==='.'?0:1)}});
const TUT=(()=>{const rows='r.r.r/rrrrr/.rrr./..d../ggggg'.split('/');return{i:'tut',set:0,name:'チューリップ',rows,H:5,W:5,sol:rows.join('').split('').map(c=>c==='.'?0:1)}})();
const TUT_STEPS=[
{mode:1,rows:[1,4],text:'左の数字は、その横1列で「つづけて ぬる マスの数」だよ。<b>5</b> は 5マスぜんぶ！ 光っている2つの行を、なぞって ぬろう。'},
{mode:1,cols:[2],text:'上の数字は、たて1列の数だよ。まんなかの <b>5</b> の列を、上から下まで ぬろう。'},
{mode:-1,rows:[3],text:'<b>1</b> の行は、もう1マスぬれたから おしまい。いまは「× メモ」になっているよ。のこりの4マスに × をつけて「ここは ぬらない」のしるしをしよう。'},
{mode:1,rows:[0],text:'<b>1 1 1</b> は「1マス・1マス・1マス」。数字と数字のあいだは 1マス以上あけるよ。左はしと右はしを ぬろう。'},
{mode:1,rows:[2],text:'さいごは <b>3</b> の行。左はしと右はしは、上の数字が <b>2 1</b> だから ぬれないね（ぬると3つ つながっちゃう）。まんなかの3マスに なるように ぬろう！'}
];
function runs(a){const out=[];let n=0;for(const x of [...a,0])if(x===1||x==='1')n++;else if(n){out.push(n);n=0}return out}
function clues(p){const g=(x,y)=>p.sol[y*p.W+x];return{rows:Array.from({length:p.H},(_,y)=>runs(Array.from({length:p.W},(_,x)=>g(x,y)))),cols:Array.from({length:p.W},(_,x)=>runs(Array.from({length:p.H},(_,y)=>g(x,y))))}}
function loadProg(){const d=read('progress2',null);return d&&typeof d==='object'&&d.cleared?d:{cleared:{},work:{}}}
function saveProg(){save('progress2',prog)}
let prog=loadProg();if(!prog.work)prog.work={};
const thumb=(p,px)=>`<svg viewBox="0 0 ${p.W} ${p.H}" width="${px}" height="${px}" aria-hidden="true" shape-rendering="crispEdges">${p.rows.map((r,y)=>[...r].map((c,x)=>c==='.'?'':`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]||'#fff'}"/>`).join('')).join('')}</svg>`;
function sfx(freq,dur=.08,type='sine',vol=.07,delay=0){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const t=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g).connect(audioContext.destination);o.start(t);o.stop(t+dur+.02)}catch{}}
const SND={fill:n=>sfx(440+(n%8)*45,.05,'triangle',.05),x:()=>sfx(260,.04,'sine',.04),clear:()=>sfx(200,.04,'sine',.03),line:()=>{sfx(880,.09,'sine',.05);sfx(1175,.1,'sine',.04,.06)},hint:()=>{sfx(988,.08,'sine',.05);sfx(1319,.1,'sine',.04,.07)},win:()=>[523,659,784,1047,1319].forEach((f,i)=>sfx(f,.25,'triangle',.08,i*.1))};
let curSet=0;
function selectScreen(setIdx=curSet){stop();curSet=setIdx;const list=P.filter(p=>p.set===setIdx);const clearedIn=s=>P.filter(p=>p.set===s&&prog.cleared[p.i]).length;
  app.innerHTML=`<section class="panel"><div class="dot-tabs" role="tablist">${SETS.map((s,i)=>`<button role="tab" aria-selected="${i===setIdx}" class="dot-tab ${i===setIdx?'active':''}" data-set="${i}" style="--c:${s.color}"><b>${s.name}</b><small>${s.size}・${clearedIn(i)}/${P.filter(p=>p.set===i).length}</small></button>`).join('')}</div><div class="dot-list">${list.map((p,k)=>{const c=prog.cleared[p.i];const w=prog.work[p.i];return `<button class="dot-item ${c?'done':''}" data-p="${p.i}" aria-label="${SETS[setIdx].name} ${k+1}${c?' '+p.name+' クリアずみ':''}">${c?thumb(p,40):`<span class="q">${w?'✏️':'？'}</span>`}<small>${k+1}${c&&!c.hint?' ⭐':''}</small></button>`}).join('')}</div><p class="small muted center" style="margin:12px 0 0">絵をえらんでね。⭐はヒントなしでクリアした絵だよ。</p><div class="center" style="margin-top:10px"><button id="howto">❓ あそびかた（れんしゅう）</button></div></section>`;
  $('#howto').onclick=()=>play('tut');
  $$('[data-set]').forEach(b=>b.onclick=()=>{sfx(660,.05,'triangle',.04);selectScreen(+b.dataset.set)});
  $$('[data-p]').forEach(b=>b.onclick=()=>play(+b.dataset.p));}
function play(pi){stop();const G=pi==='tut'?TUT_STEPS:null;const p=G?TUT:P[pi];const N=p.W*p.H;const C=clues(p);const list=P.filter(q=>q.set===p.set);const num=list.indexOf(p)+1;
  let gi=0;let marks=Array(N).fill(0);const w=G?null:prog.work[pi];if(typeof w==='string'&&w.length===N)marks=[...w].map(c=>c==='1'?1:c==='x'?-1:0);
  let mode=1,done=false,undo=[],hints=0,stroke=null,startAt=Date.now(),lineDone={};
  stage(`${G?'<div id="guide" class="dot-guide" role="status" aria-live="polite"></div>':''}<div id="nono" class="nono" style="--n:${p.W}"></div><div id="ctrl"><div class="row controls dot-ctrl"><div class="seg" role="radiogroup" aria-label="モード"><button id="m-fill" role="radio">■ ぬる</button><button id="m-x" role="radio">× メモ</button></div><button id="undo">↩ もどす</button><button id="hint"${G?' hidden':''}>💡 ヒント</button></div></div>`,stat('もんだい',G?'れんしゅう':`${SETS[p.set].name} ${num}`)+stat('サイズ',`${p.W}×${p.H}`));
  const rs=$('#restart');rs.textContent=G?'とばす':'えらぶ';rs.onclick=()=>{if(G)save('tutorial',1);saveWork();selectScreen(p.set)};
  const board=$('#nono');
  const maxR=Math.max(1,...C.rows.map(r=>r.length)),maxC=Math.max(1,...C.cols.map(c=>c.length));
  function layout(){const W=Math.min(board.parentElement.clientWidth,560);const fs=p.W>=10?13:p.W>=8?14:17;const clueW=Math.max(30,maxR*(fs*.95)+10);const clueH=maxC*(fs+3)+8;const availH=Math.max(220,window.innerHeight-(W<480?255:300)-(G?($('#guide')?$('#guide').offsetHeight:0)+10:0));let cell=Math.floor(Math.min((W-clueW)/p.W,(availH-clueH)/p.H,p.W<=5?64:46));cell=Math.max(cell,24);board.style.gridTemplateColumns=`${clueW}px repeat(${p.W},${cell}px)`;board.style.gridTemplateRows=`${clueH}px repeat(${p.H},${cell}px)`;board.style.setProperty('--fs',fs+'px');board.style.setProperty('--cell',cell+'px')}
  board.innerHTML='<div class="corner"></div>'+C.cols.map((c,x)=>`<div class="cc" data-cc="${x}">${(c.length?c:[0]).map(n=>`<span>${n}</span>`).join('')}</div>`).join('')+C.rows.map((r,y)=>`<div class="rc" data-rc="${y}">${(r.length?r:[0]).map(n=>`<span>${n}</span>`).join('')}</div>`+Array.from({length:p.W},(_,x)=>{const i=y*p.W+x;return `<div class="nc${x%5===4&&x<p.W-1?' vr':''}${y%5===4&&y<p.H-1?' hr':''}" data-i="${i}" role="gridcell" style="--d:${(x+y)*28}ms;--col:${PAL[p.rows[y][x]]||'transparent'}"></div>`}).join('')).join('');
  const cells=[...board.querySelectorAll('[data-i]')];
  function paint(i){const c=cells[i];c.classList.toggle('on',marks[i]===1);c.classList.toggle('x',marks[i]===-1);c.setAttribute('aria-label',`${Math.floor(i/p.W)+1}行${i%p.W+1}列 ${marks[i]===1?'塗り':marks[i]===-1?'×':'空白'}`)}
  function lineState(){let newly=false;for(let y=0;y<p.H;y++){const r=Array.from({length:p.W},(_,x)=>marks[y*p.W+x]===1?1:0);const ok=runs(r).join()===C.rows[y].join();const el=board.querySelector(`[data-rc="${y}"]`);if(ok&&!lineDone['r'+y]&&C.rows[y].length)newly=true;lineDone['r'+y]=ok;el.classList.toggle('ok',ok)}
    for(let x=0;x<p.W;x++){const c=Array.from({length:p.H},(_,y)=>marks[y*p.W+x]===1?1:0);const ok=runs(c).join()===C.cols[x].join();const el=board.querySelector(`[data-cc="${x}"]`);if(ok&&!lineDone['c'+x]&&C.cols[x].length)newly=true;lineDone['c'+x]=ok;el.classList.toggle('ok',ok)}return newly}
  function setMode(m){mode=m;$('#m-fill').classList.toggle('active',m===1);$('#m-x').classList.toggle('active',m===-1);$('#m-fill').setAttribute('aria-checked',m===1);$('#m-x').setAttribute('aria-checked',m===-1)}
  function saveWork(){if(done||G)return;const s=marks.map(m=>m===1?'1':m===-1?'x':'0').join('');if(marks.some(m=>m))prog.work[pi]=s;else delete prog.work[pi];saveProg()}
  function refresh(){marks.forEach((_,i)=>paint(i));lineState();$('#undo').disabled=!undo.length}
  function checkDone(){if(marks.every((m,i)=>(m===1)===(p.sol[i]===1)))finish()}
  function lineCells(s){const a=[];(s.rows||[]).forEach(y=>{for(let x=0;x<p.W;x++)a.push(y*p.W+x)});(s.cols||[]).forEach(x=>{for(let y=0;y<p.H;y++)a.push(y*p.W+x)});return a}
  function showStep(){const s=G[gi];board.querySelectorAll('.gl').forEach(e=>e.classList.remove('gl'));(s.rows||[]).forEach(y=>board.querySelector(`[data-rc="${y}"]`).classList.add('gl'));(s.cols||[]).forEach(x=>board.querySelector(`[data-cc="${x}"]`).classList.add('gl'));lineCells(s).forEach(i=>cells[i].classList.add('gl'));setMode(s.mode);$('#guide').innerHTML=`<span class="gs">れんしゅう ${gi+1} / ${G.length}</span>${s.text}`;layout()}
  function stepOk(s){return lineCells(s).every(i=>p.sol[i]===1?marks[i]===1:(s.mode===-1?marks[i]===-1:marks[i]!==1))}
  function guideCheck(){if(!G||done)return;const wrong=marks.map((m,i)=>(m===1&&p.sol[i]===0)||(m===-1&&p.sol[i]===1)?i:-1).filter(i=>i>=0);
    if(wrong.length){wrong.forEach(i=>{marks[i]=0;paint(i);cells[i].classList.add('bad');later(()=>cells[i].classList.remove('bad'),900)});lineState();say('そこは ちがったので、けしたよ。光っているところを見てね。')}
    let moved=false;while(gi<G.length&&stepOk(G[gi])){gi++;moved=true}
    if(moved&&gi<G.length){say('');showStep()}}
  function cellAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('[data-i]'):null}
  on(board,'contextmenu',e=>e.preventDefault());
  on(board,'pointerdown',e=>{if(done)return;const c=e.target.closest('[data-i]');if(!c)return;e.preventDefault();const i=+c.dataset.i;const m=e.button===2?-1:mode;const target=m===1?(marks[i]===1?0:1):(marks[i]===-1?0:-1);
    undo.push(marks.slice());if(undo.length>150)undo.shift();stroke={target,from:marks[i],start:i,axis:null,pid:e.pointerId,count:0};try{board.setPointerCapture(e.pointerId)}catch{}apply(i)});
  function apply(i){if(!stroke)return;const t=stroke.target;if(marks[i]===t)return;if(t!==0&&marks[i]!==0)return;if(t===0&&marks[i]!==stroke.from)return;marks[i]=t;paint(i);stroke.count++;if(t===1)SND.fill(stroke.count);else if(t===-1)SND.x();else SND.clear();c_pop(i)}
  function c_pop(i){const c=cells[i];c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}
  on(board,'pointermove',e=>{if(!stroke||e.pointerId!==stroke.pid)return;const c=cellAt(e.clientX,e.clientY);if(!c)return;let i=+c.dataset.i;const sx=stroke.start%p.W,sy=Math.floor(stroke.start/p.W);let x=i%p.W,y=Math.floor(i/p.W);if(i===stroke.start)return;if(!stroke.axis)stroke.axis=Math.abs(x-sx)>=Math.abs(y-sy)?'h':'v';if(stroke.axis==='h')y=sy;else x=sx;const a=stroke.axis==='h'?[sx,x]:[sy,y];const step=a[1]>a[0]?1:-1;for(let k=a[0];k!==a[1]+step;k+=step)apply(stroke.axis==='h'?sy*p.W+k:k*p.W+sx)});
  const end=e=>{if(!stroke||e.pointerId!==stroke.pid)return;const changed=stroke.count;stroke=null;if(!changed)undo.pop();$('#undo').disabled=!undo.length;if(lineState())SND.line();saveWork();guideCheck();checkDone()};
  on(board,'pointerup',end);on(board,'pointercancel',end);
  $('#m-fill').onclick=()=>{setMode(1);say('■ ぬるモード：タップやなぞるとマスを塗るよ。')};$('#m-x').onclick=()=>{setMode(-1);say('× メモモード：塗らないマスに×をつけてメモしよう。')};
  $('#undo').onclick=()=>{if(done||!undo.length)return;marks=undo.pop();refresh();SND.clear();saveWork();say('1つもどしたよ。');guideCheck()};
  $('#hint').onclick=()=>{if(done)return;const wrong=marks.map((m,i)=>m===1&&p.sol[i]===0||m===-1&&p.sol[i]===1?i:-1).filter(i=>i>=0);undo.push(marks.slice());hints++;SND.hint();
    if(wrong.length){const i=wrong[Math.floor(Math.random()*wrong.length)];marks[i]=0;paint(i);cells[i].classList.add('bad');later(()=>cells[i].classList.remove('bad'),1400);say(`💡 ${Math.floor(i/p.W)+1}行${i%p.W+1}列は まちがいだったので消したよ。`)}
    else{const todo=p.sol.map((v,i)=>v===1&&marks[i]!==1?i:-1).filter(i=>i>=0);if(!todo.length)return;const i=todo[Math.floor(Math.random()*todo.length)];marks[i]=1;paint(i);cells[i].classList.add('hinted');later(()=>cells[i].classList.remove('hinted'),1400);say(`💡 ${Math.floor(i/p.W)+1}行${i%p.W+1}列を塗ったよ。`)}
    $('#undo').disabled=!undo.length;if(lineState())SND.line();saveWork();checkDone()};
  function finish(){done=true;
    if(G){save('tutorial',1);board.querySelectorAll('.gl').forEach(e=>e.classList.remove('gl'));board.classList.add('solved');SND.win();say('');$('#guide').innerHTML='<span class="gs">できた！</span>数字どおりに ぬれたから、かくれていた絵が 出てきたよ。';
      later(()=>{$('#ctrl').innerHTML=`<div class="dot-win" role="status"><div class="dot-win-t">✨「${p.name}」が できた！</div><div class="small muted">これで あそびかたは ばっちり。こまったら 💡ヒント もつかえるよ。</div><div class="row" style="justify-content:center;margin-top:10px"><button id="next" class="primary">やさしい 1 へ ▶</button><button id="back">えらぶ</button></div></div>`;$('#next').onclick=()=>play(P.find(q=>q.set===0).i);$('#back').onclick=()=>selectScreen(0);$('#next').focus({preventScroll:true})},650);return}
    const prev=prog.cleared[pi];prog.cleared[pi]={hint:prev?(prev.hint&&hints>0):hints>0};delete prog.work[pi];saveProg();
    board.classList.add('solved');SND.win();say('');
    const next=P.find(q=>q.i>pi&&q.set===p.set&&!prog.cleared[q.i])||P.find(q=>q.set===p.set&&!prog.cleared[q.i])||P.find(q=>!prog.cleared[q.i]);
    const setDone=P.filter(q=>q.set===p.set).every(q=>prog.cleared[q.i]);
    later(()=>{$('#ctrl').innerHTML=`<div class="dot-win" role="status"><div class="dot-win-t">✨「${p.name}」が できた！</div><div class="small muted">${hints?`ヒント ${hints}回`:'⭐ ヒントなしでクリア！'}${setDone?`<br>🎉 ${SETS[p.set].name}を ぜんぶクリア！`:''}</div><div class="row" style="justify-content:center;margin-top:10px">${next?`<button id="next" class="primary">つぎの絵へ ▶</button>`:''}<button id="back">えらぶ</button></div></div>`;
      if(next)$('#next').onclick=()=>play(next.i);$('#back').onclick=()=>selectScreen(p.set);(next?$('#next'):$('#back')).focus({preventScroll:true});
      if(!next)say('🏆 33枚の絵を ぜんぶ見つけたよ！ すごい！')},p.W*p.H>40?900:650)}
  layout();on(window,'resize',layout);setMode(1);refresh();
  if(G){say('');showStep()}else if(marks.some(m=>m))say('つづきから はじめるよ。');else say('数字は「つづけて ぬる マスの数」。大きい数字の列から ぬると かんたんだよ。');
  requestAnimationFrame(()=>{const s=app.querySelector('.panel');if(s&&s.getBoundingClientRect().top>8)s.scrollIntoView({block:'start'})});
}
function launch(){selectScreen(curSet)}
const cc=Object.keys(prog.cleared).length;
app.innerHTML=`<section class="panel intro"><div class="icon">${CONFIG.emoji}</div><h2>${CONFIG.title}</h2><p>数字をヒントにマスをぬると、かくれた絵が出てくるパズルだよ。</p><div class="dot-how"><div><i>🔢</i><span>数字は「つづけて ぬる マスの数」</span></div><div><i>🖌️</i><span>タップや なぞって マスをぬる</span></div><div><i>🖼️</i><span>ぜんぶそろうと 絵がカラーで出てくる</span></div></div><div class="row" style="justify-content:center;margin-top:14px"><button class="primary" id="start">${cc||read('tutorial',0)?'あそぶ':'れんしゅうから はじめる'}</button>${cc||read('tutorial',0)?'<button id="howto0">❓ あそびかた（れんしゅう）</button>':'<button id="skip0">すぐに あそぶ</button>'}</div><p class="small muted" style="margin-top:12px">5×5・8×8・10×10の全33問</p>${cc?`<p class="small muted">見つけた絵 ${cc} / ${P.length}</p>`:''}</section>`;
const firstTime=!(cc||read('tutorial',0));
const begin=()=>{stop();if(firstTime)play('tut');else launch()};
$('#start').onclick=begin;
if($('#howto0'))$('#howto0').onclick=()=>{stop();play('tut')};
