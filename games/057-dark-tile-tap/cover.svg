<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c057bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="0.55" stop-color="#131322"/>
      <stop offset="1" stop-color="#0b1a2a"/>
    </linearGradient>
    <radialGradient id="c057glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#53e0d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#53e0d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c057gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c057board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c4ea"/>
      <stop offset="0.7" stop-color="#f4f2ff"/>
      <stop offset="1" stop-color="#dcd8f4"/>
    </linearGradient>
    <linearGradient id="c057tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e52"/>
      <stop offset="1" stop-color="#090914"/>
    </linearGradient>
    <linearGradient id="c057line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53e0d8" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#53e0d8"/>
      <stop offset="0.85" stop-color="#53e0d8"/>
      <stop offset="1" stop-color="#53e0d8" stop-opacity="0"/>
    </linearGradient>
    <filter id="c057blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="c057soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="c057clip"><rect x="0" y="0" width="400" height="225"/></clipPath>
    <clipPath id="c057bclip"><rect x="-104" y="-170" width="208" height="330" rx="14"/></clipPath>
  </defs>

  <rect width="400" height="225" fill="url(#c057bg)"/>
  <!-- stars -->
  <g fill="#eeecfa">
    <circle cx="24" cy="26" r="1.2" opacity=".8"/><circle cx="58" cy="78" r="0.9" opacity=".6"/><circle cx="36" cy="150" r="1.1" opacity=".7"/>
    <circle cx="82" cy="196" r="0.9" opacity=".5"/><circle cx="352" cy="22" r="1.2" opacity=".8"/><circle cx="378" cy="92" r="0.9" opacity=".6"/>
    <circle cx="330" cy="204" r="1.1" opacity=".6"/><circle cx="300" cy="46" r="0.8" opacity=".5"/><circle cx="96" cy="34" r="0.8" opacity=".5"/>
    <circle cx="386" cy="170" r="1" opacity=".7"/><circle cx="14" cy="104" r="0.8" opacity=".5"/>
  </g>
  <ellipse cx="200" cy="120" rx="190" ry="120" fill="url(#c057glow)" opacity=".5"/>

  <g clip-path="url(#c057clip)">
    <g transform="translate(196 122) rotate(-9)">
      <!-- board shadow / glow -->
      <rect x="-110" y="-176" width="220" height="342" rx="18" fill="#53e0d8" opacity=".35" filter="url(#c057blur)"/>
      <rect x="-104" y="-170" width="208" height="330" rx="14" fill="url(#c057board)"/>
      <g clip-path="url(#c057bclip)">
        <!-- lane and row lines -->
        <g stroke="#7a68c8" stroke-opacity=".35" stroke-width="1">
          <line x1="-52" y1="-170" x2="-52" y2="160"/><line x1="0" y1="-170" x2="0" y2="160"/><line x1="52" y1="-170" x2="52" y2="160"/>
          <line x1="-104" y1="-112" x2="104" y2="-112"/><line x1="-104" y1="-54" x2="104" y2="-54"/><line x1="-104" y1="4" x2="104" y2="4"/><line x1="-104" y1="62" x2="104" y2="62"/>
        </g>
        <rect x="-104" y="62" width="208" height="100" fill="#3c3282" opacity=".14"/>

        <!-- hit (gold) tile on the line, lane 2 -->
        <rect x="-49" y="7" width="46" height="52" rx="8" fill="#f2b21c"/>
        <rect x="-49" y="7" width="46" height="52" rx="8" fill="none" stroke="#fff3c4" stroke-width="2"/>
        <!-- dark tiles -->
        <g>
          <rect x="3" y="-51" width="46" height="52" rx="8" fill="url(#c057tile)" stroke="#53e0d8" stroke-width="2"/>
          <rect x="11" y="-10" width="30" height="5" rx="2.5" fill="#53e0d8"/>
          <rect x="9" y="-46" width="34" height="8" rx="4" fill="#ffffff" opacity=".1"/>

          <rect x="55" y="-109" width="46" height="52" rx="8" fill="url(#c057tile)" stroke="#a06bff" stroke-width="2"/>
          <rect x="63" y="-68" width="30" height="5" rx="2.5" fill="#53e0d8" opacity=".7"/>
          <rect x="61" y="-104" width="34" height="8" rx="4" fill="#ffffff" opacity=".1"/>

          <rect x="-101" y="-167" width="46" height="110" rx="8" fill="url(#c057tile)" stroke="#a06bff" stroke-width="2"/>
          <rect x="-93" y="-68" width="30" height="5" rx="2.5" fill="#53e0d8" opacity=".7"/>
          <rect x="-95" y="-160" width="34" height="8" rx="4" fill="#ffffff" opacity=".1"/>

          <rect x="3" y="-167" width="46" height="52" rx="8" fill="url(#c057tile)" stroke="#ffd166" stroke-width="2"/>
          <rect x="11" y="-126" width="30" height="5" rx="2.5" fill="#ffd166"/>
        </g>
        <!-- already played tile below the line -->
        <rect x="-101" y="65" width="46" height="52" rx="8" fill="#2cc9c0" opacity=".45"/>
        <rect x="55" y="123" width="46" height="40" rx="8" fill="#a9a3da" opacity=".5"/>

        <!-- glowing line -->
        <rect x="-104" y="54" width="208" height="16" fill="#53e0d8" opacity=".3"/>
        <rect x="-104" y="58" width="208" height="8" fill="#53e0d8" filter="url(#c057soft)"/>
        <rect x="-104" y="60" width="208" height="4" fill="#10b8ae"/>
        <rect x="-104" y="61.5" width="208" height="1" fill="#ffffff" opacity=".9"/>
      </g>
      <rect x="-104" y="-170" width="208" height="330" rx="14" fill="none" stroke="#2c2c4d" stroke-width="4"/>
      <rect x="-104" y="-170" width="208" height="330" rx="14" fill="none" stroke="#53e0d8" stroke-opacity=".7" stroke-width="1.5"/>

      <!-- tap burst on the gold tile -->
      <circle cx="-26" cy="33" r="46" fill="url(#c057gold)" opacity=".7"/>
      <circle cx="-26" cy="33" r="30" fill="none" stroke="#ffd166" stroke-width="3" opacity=".9"/>
      <circle cx="-26" cy="33" r="44" fill="none" stroke="#ff5fa2" stroke-width="2" opacity=".6"/>
      <g fill="#ffd166">
        <rect x="-70" y="6" width="6" height="6"/><rect x="12" y="62" width="5" height="5"/><rect x="-62" y="66" width="5" height="5"/>
      </g>
      <g fill="#ff5fa2"><rect x="16" y="4" width="5" height="5"/><rect x="-78" y="38" width="5" height="5"/></g>
      <g fill="#53e0d8"><rect x="-30" y="-16" width="5" height="5"/><rect x="-8" y="78" width="6" height="6"/></g>
    </g>

    <!-- finger -->
    <g transform="translate(198 200) rotate(-24)">
      <path d="M-11 -30 a11 11 0 0 1 22 0 v34 l14 6 a12 12 0 0 1 7 13 l-4 30 a14 14 0 0 1 -14 12 h-26 a14 14 0 0 1 -12 -7 l-16 -28 a8 8 0 0 1 12 -10 l6 6 z" fill="#ffe7d3" stroke="#1c1c33" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-5 -34 a6 6 0 0 1 10 0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
    </g>

    <!-- music notes -->
    <g transform="translate(318 66) rotate(10)">
      <ellipse cx="0" cy="24" rx="12" ry="9" fill="#ff5fa2" transform="rotate(-18 0 24)"/>
      <rect x="9" y="-26" width="5" height="50" fill="#ff5fa2"/>
      <path d="M9 -26 q22 2 26 24 q-10 -12 -21 -10 z" fill="#ff5fa2"/>
      <ellipse cx="-3" cy="21" rx="4" ry="2.4" fill="#ffffff" opacity=".5" transform="rotate(-18 -3 21)"/>
    </g>
    <g transform="translate(64 62) rotate(-12) scale(.82)">
      <ellipse cx="-14" cy="28" rx="11" ry="8" fill="#ffd166" transform="rotate(-18 -14 28)"/>
      <ellipse cx="22" cy="20" rx="11" ry="8" fill="#ffd166" transform="rotate(-18 22 20)"/>
      <rect x="-6" y="-18" width="5" height="46" fill="#ffd166"/>
      <rect x="30" y="-26" width="5" height="46" fill="#ffd166"/>
      <path d="M-6 -18 l41 -8 v10 l-41 8 z" fill="#ffd166"/>
    </g>
    <g transform="translate(346 164) rotate(-8) scale(.6)">
      <ellipse cx="0" cy="24" rx="12" ry="9" fill="#53e0d8" transform="rotate(-18 0 24)"/>
      <rect x="9" y="-26" width="5" height="50" fill="#53e0d8"/>
      <path d="M9 -26 q22 2 26 24 q-10 -12 -21 -10 z" fill="#53e0d8"/>
    </g>
    <g transform="translate(44 172) rotate(14) scale(.55)">
      <ellipse cx="0" cy="24" rx="12" ry="9" fill="#a06bff" transform="rotate(-18 0 24)"/>
      <rect x="9" y="-26" width="5" height="50" fill="#a06bff"/>
      <path d="M9 -26 q22 2 26 24 q-10 -12 -21 -10 z" fill="#a06bff"/>
    </g>
    <!-- sparkles -->
    <g fill="#ffffff">
      <path d="M290 126 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" opacity=".9"/>
      <path d="M104 112 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" opacity=".8"/>
      <path d="M368 40 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" opacity=".8"/>
    </g>
  </g>
</svg>
