<p class="help">
  <b>あそびかた</b>：ボールを <b>うえへ シュッ</b> と はじいて ゴールへ。ながく はじくと つよく、ななめに はじくと その向きへ とぶよ。<br>
  れんぞくで きめると ボーナス。3ぼん つづけると のこり時間が ふえる！<br>
  キーボード：← → で むき、↑ ↓ で つよさ、スペースで シュート。
</p>

<script>
(() => {
  'use strict';
  // ---- きまりごと -----------------------------------------------------------
  const W = 360, H = 430, Y0 = 240, F = 430, CAMY = 1.5, CAMZ = 3.0;
  const G = 11, TH = 62 * Math.PI / 180, SIN = Math.sin(TH), COS = Math.cos(TH);
  const HOOP_Y = 3.05, GAP = 0.30, BTOP = 0.55, RIM = 0.40, BR = 0.17, RT = 0.02, START_Y = 0.75;
  const VMIN = 7.4, VMAX = 10.4, DRAG_MIN = 16, DRAG_MAX = 130, AIM_K = 0.5, AIM_LIM = 70;
  const STEP = 1 / 120, GAME_TIME = 60, COOL = 0.4;
  const DISTS = [3.5, 4.2, 5.2];
  const KEY = 'ludot_free-throw_';
  const LV = [
    { name: 'ふつう', sub: 'ゴールは<br>とまっている', guide: 0.6, stars: [10, 30, 55] },
    { name: 'じょうきゅう', sub: 'ゴールが<br>うごく', guide: 0.34, stars: [12, 30, 50] },
    { name: 'めいじん', sub: 'はやい・<br>ガイドなし', guide: 0, stars: [10, 25, 45] },
  ];

  // ---- おと -----------------------------------------------------------------
  let muted = false, userActed = false, ac = null;
  try { muted = localStorage.getItem(KEY + 'mute') === '1'; } catch (e) {}
  function audio() {
    if (!userActed) return null;
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (muted) return; const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(); const t = a.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  let noiseBuf = null;
  function noise(dur, vol, f0, f1, delay = 0) {
    if (muted) return; const a = audio(); if (!a) return;
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * 0.6, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(); const t = a.currentTime + delay;
    s.buffer = noiseBuf; fl.type = 'bandpass'; fl.Q.value = 1.2;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur + 0.02);
  }
  const SFX = {
    shoot(p) { noise(0.16, 0.10, 500 + p * 500, 1800 + p * 900); tone('triangle', 240 + p * 120, 420 + p * 200, 0.1, 0.04); },
    rim() { tone('square', 980, 700, 0.07, 0.05); tone('triangle', 1960, 1500, 0.09, 0.03); },
    board() { tone('triangle', 190, 110, 0.1, 0.09); noise(0.05, 0.05, 900, 400); },
    floor() { tone('sine', 130, 70, 0.1, 0.07); },
    goal(streak) { noise(0.22, 0.13, 3200, 900); const b = 523 * Math.pow(1.06, Math.min(streak, 10)); tone('square', b, b, 0.09, 0.06, 0.03); tone('square', b * 1.5, b * 1.5, 0.14, 0.06, 0.11); },
    swish() { noise(0.3, 0.16, 4200, 1200); tone('triangle', 1568, 2093, 0.2, 0.05, 0.05); },
    bonus() { [784, 988, 1175, 1568].forEach((f, i) => tone('square', f, f, 0.1, 0.05, 0.16 + i * 0.07)); },
    miss() { tone('sawtooth', 220, 130, 0.16, 0.04); },
    move() { tone('triangle', 500, 900, 0.12, 0.035); },
    tick() { tone('square', 880, 880, 0.05, 0.04); },
    buzzer() { tone('sawtooth', 196, 190, 0.7, 0.08); tone('square', 98, 96, 0.7, 0.05); },
    start() { [523, 659, 784].forEach((f, i) => tone('square', f, f, 0.1, 0.05, i * 0.08)); },
    cheer(n) { for (let i = 0; i < n; i++) [659, 784, 1046, 1318].forEach((f, j) => tone('square', f, f, 0.13, 0.05, 0.25 + i * 0.5 + j * 0.09)); },
    select() { tone('square', 700, 950, 0.05, 0.03); },
    locked() { tone('square', 200, 120, 0.08, 0.04); },
  };

  // ---- ほぞん ---------------------------------------------------------------
  let best = [0, 0, 0];
  function loadBest() {
    try { const v = JSON.parse(localStorage.getItem(KEY + 'best') || '[]'); for (let i = 0; i < 3; i++) best[i] = Math.max(0, Math.floor(Number(v[i]) || 0)); } catch (e) { best = [0, 0, 0]; }
  }
  function saveBest() { try { localStorage.setItem(KEY + 'best', JSON.stringify(best)); } catch (e) {} }
  const unlocked = i => i === 0 || best[i - 1] >= LV[i - 1].stars[0];
  const starsOf = (i, sc) => LV[i].stars.filter(v => sc >= v).length;

  // ---- らんすう（テストで たねを きめられる） ----------------------------------
  let rndState = (Date.now() ^ 0x5bd1e995) >>> 0;
  function rnd() { rndState = (rndState + 0x6D2B79F5) >>> 0; let t = rndState; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

  // ---- ぶつり（ボール1こを dt びょう すすめる。じゅんすいな けいさん） ---------------
  function newBall(p, phi) {
    const v = VMIN + p * (VMAX - VMIN), vh = v * COS;
    return { x: 0, y: START_Y, z: 0, vx: vh * Math.sin(phi), vy: v * SIN, vz: vh * Math.cos(phi), t: 0, live: true, scored: false, touched: false, cross: null, age: 0, spin: 0, p, fire: false, floorHit: false };
  }
  function stepBall(b, hp, dt) {
    const py = b.y, pz = b.z;
    let ev = null;
    b.vy -= G * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt; b.t += dt;
    if (!b.scored) {
      const zb = hp.d + RIM + GAP;
      if (b.vz > 0 && b.z + BR > zb && pz + BR <= zb + 0.06 && Math.abs(b.x - hp.x) < 0.82 && b.y > HOOP_Y - 0.15 && b.y < HOOP_Y + BTOP) {
        b.z = zb - BR; b.vz *= -0.8; b.vx *= 0.9; b.touched = true; ev = 'board';
      }
      let qx = b.x - hp.x, qz = b.z - hp.d, rho = Math.hypot(qx, qz);
      if (rho > 1e-4) {
        const dx = b.x - (hp.x + RIM * qx / rho), dy = b.y - HOOP_Y, dz = b.z - (hp.d + RIM * qz / rho), d = Math.hypot(dx, dy, dz);
        if (d < BR + RT && d > 1e-5) {
          const nx = dx / d, ny = dy / d, nz = dz / d, vn = b.vx * nx + b.vy * ny + b.vz * nz;
          if (vn < 0) { b.vx -= 1.65 * vn * nx; b.vy -= 1.65 * vn * ny; b.vz -= 1.65 * vn * nz; if (vn < -0.6) ev = ev || 'rim'; b.touched = true; }
          const push = BR + RT - d; b.x += nx * push; b.y += ny * push; b.z += nz * push;
          qx = b.x - hp.x; qz = b.z - hp.d; rho = Math.hypot(qx, qz);
        }
      }
      if (py >= HOOP_Y && b.y < HOOP_Y && b.vy < 0) {
        if (rho < RIM) { b.scored = true; b.vx *= 0.25; b.vz *= 0.25; b.vy *= 0.6; ev = 'goal'; }
        else if (!b.cross) b.cross = { dx: qx, dz: qz };
      }
    }
    if (b.y < BR && b.vy < 0) { b.y = BR; b.vy *= -0.55; b.vx *= 0.8; b.vz *= 0.8; if (!b.floorHit) { b.floorHit = true; ev = ev || 'floor'; } }
    return ev;
  }
  // リングに さわらずに 入る つよさの まん中 と むき（しらべて さがす）
  function ideal(hx, d) {
    const dh = Math.hypot(hx, d), phi = Math.atan2(hx, d), dy = HOOP_Y - START_Y;
    const v = Math.sqrt(G * dh * dh / (2 * COS * COS * (dh * Math.tan(TH) - dy)));
    const p0 = (v - VMIN) / (VMAX - VMIN);
    let lo = -1, hi = -1;
    for (let p = p0 - 0.06; p <= p0 + 0.16; p += 0.002) {
      const r = simShot(hx, d, p, phi);
      if (r.goal && r.swish) { if (lo < 0) lo = p; hi = p; } else if (lo >= 0) break;
    }
    const p = lo < 0 ? p0 : (lo + hi) / 2;
    return { p, phi, a: phi / AIM_K * 180 / Math.PI, width: lo < 0 ? 0 : hi - lo };
  }
  // とまっている ゴールへの 1とうを さいごまで けいさん
  function simShot(hx, d, p, phi) {
    const hp = { x: hx, d }, b = newBall(p, phi);
    for (let i = 0; i < 600; i++) {
      const ev = stepBall(b, hp, STEP);
      if (ev === 'goal') return { goal: true, swish: !b.touched, t: b.t };
      if ((b.vy < 0 && b.y < HOOP_Y - 0.7) || b.floorHit) break;
    }
    return { goal: false, swish: false, touched: b.touched, cross: b.cross, z: b.z };
  }
  // はじいた むき・ながさ → つよさ・とぶむき
  function aimFrom(dx, dy) {
    const len = Math.hypot(dx, dy);
    if (len < DRAG_MIN || dy >= -4) return null;
    let a = Math.atan2(dx, -dy) * 180 / Math.PI;
    a = Math.max(-AIM_LIM, Math.min(AIM_LIM, a));
    const p = Math.max(0, Math.min(1, (len - DRAG_MIN) / (DRAG_MAX - DRAG_MIN)));
    return { p, a, phi: a * AIM_K * Math.PI / 180 };
  }

  // ---- じょうたい ------------------------------------------------------------
  let mode = 'title', level = 0, auto = true;
  let score = 0, time = GAME_TIME, streak = 0, bestStreak = 0, goals = 0, shots = 0, swishes = 0;
  let over = false, overT = 0, cool = 0, pending = null, simT = 0, acc = 0, lastTick = 99, newRecord = false, justUnlocked = -1;
  const hoop = { x: 0, d: 4.2, bx: 0, tx: 0, td: 4.2, ph: 0, amp: 0, om: 0, sway: 0, swayV: 0, flash: 0 };
  let balls = [], parts = [], pops = [], drag = null, banner = null, readyT = 1, animT = 0, lastRes = '';
  const kb = { on: false, a: 0, p: 0.5 };

  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay'), ovTitle = document.getElementById('ovTitle'), ovNote = document.getElementById('ovNote');
  const ovScore = document.getElementById('ovScore'), ovStars = document.getElementById('ovStars'), ovRule = document.getElementById('ovRule');
  const levelsEl = document.getElementById('levels'), startBtn = document.getElementById('startBtn'), backBtn = document.getElementById('backBtn');
  const hScore = document.getElementById('hScore'), hTime = document.getElementById('hTime'), hStreak = document.getElementById('hStreak');
  const muteBtn = document.getElementById('mute-btn');
  let bg = null;

  function pr(x, y, z) { const k = F / (z + CAMZ); return { x: W / 2 + x * k, y: Y0 - (y - CAMY) * k, k }; }

  // ---- ゴールの ばしょ --------------------------------------------------------
  function moveParams() {
    if (level === 1) { hoop.amp = 0.6 + Math.min(goals, 8) * 0.04; hoop.om = 0.9 + Math.min(goals, 10) * 0.07; }
    else if (level === 2) { hoop.amp = 0.9 + Math.min(goals, 6) * 0.03; hoop.om = 1.4 + Math.min(goals, 10) * 0.08; }
    else { hoop.amp = 0; hoop.om = 0; }
  }
  function pickSpot(first) {
    let x = 0, d = 4.2;
    const varyD = (level === 0 && goals >= 5) || (level === 1 && goals >= 3) || level === 2;
    const varyX = level === 0 && goals >= 2;
    for (let i = 0; i < 12; i++) {
      x = varyX ? Math.round((rnd() * 2.2 - 1.1) * 10) / 10 : 0;

    ctx.beginPath(); top.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.closePath(); ctx.stroke();
    ctx.restore();
    if (hoop.td >= 5 && mode === 'play') {
      const c = pr(hoop.x, HOOP_Y + BTOP, hoop.d + RIM + GAP);
      ctx.font = "13px 'DotGothic16',monospace"; ctx.textAlign = 'center'; ctx.fillStyle = '#ff5fa2';
      ctx.fillText('3てん', c.x + 66, c.y + 12);
    }
  }
  function currentAim() {
    if (drag) return aimFrom(drag.x - drag.x0, drag.y - drag.y0);
    if (kb.on) return { p: kb.p, a: kb.a, phi: kb.a * AIM_K * Math.PI / 180 };
    return null;
  }
  function drawAim() {
    const home = pr(0, START_Y, 0);
    if (mode !== 'play' || over) return;
    const aim = currentAim();
    if (drag && !aim) {
      ctx.font = "13px 'DotGothic16',monospace"; ctx.textAlign = 'center'; ctx.fillStyle = '#9d99c0';
      ctx.fillText('うえへ はじこう', home.x, home.y - 40);
      return;
    }
    if (!aim) return;
    const col = aim.p < 0.34 ? '#53e0d8' : aim.p < 0.7 ? '#ffd166' : '#ff5fa2';
    const ar = aim.a * Math.PI / 180, len = 34 + aim.p * 72;
    const ex = home.x + Math.sin(ar) * len, ey = home.y - Math.cos(ar) * len;
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 8; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(home.x + Math.sin(ar) * 28, home.y - Math.cos(ar) * 28); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex + Math.sin(ar) * 10, ey - Math.cos(ar) * 10);
    ctx.lineTo(ex + Math.cos(ar) * 8, ey + Math.sin(ar) * 8); ctx.lineTo(ex - Math.cos(ar) * 8, ey - Math.sin(ar) * 8); ctx.closePath(); ctx.fill();
    ctx.restore();
    // つよさメーター
    const mx = W - 22, my = 290, mh = 110;
    ctx.fillStyle = 'rgba(6,5,20,.7)'; ctx.strokeStyle = '#5a4b9e'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.rect(mx - 6, my, 12, mh); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col; ctx.fillRect(mx - 4, my + mh - 2 - (mh - 4) * aim.p, 8, (mh - 4) * aim.p);
    ctx.font = "11px 'DotGothic16',monospace"; ctx.textAlign = 'center'; ctx.fillStyle = '#9d99c0'; ctx.fillText('つよさ', mx - 8, my - 6);
    // とぶ みちの ガイド（モードで ながさが ちがう）
    const gf = LV[level].guide;
    if (gf > 0) {
      const b = newBall(aim.p, aim.phi), tEnd = gf * hoop.d / Math.max(0.5, b.vz);
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (let t = 0.07; t < tEnd; t += 0.07) {
        const q = pr(b.vx * t, START_Y + b.vy * t - G * t * t / 2, b.vz * t);
        ctx.globalAlpha = Math.max(0.15, 0.9 - t / tEnd * 0.7);
        ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1.5, BR * q.k * 0.22), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
  function drawText(text, x, y, size, col, alpha) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.font = size + "px 'DotGothic16',monospace"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(text).width; x = Math.max(w / 2 + 4, Math.min(W - w / 2 - 4, x));
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,8,26,.9)'; ctx.strokeText(text, x, y);
    ctx.fillStyle = col; ctx.fillText(text, x, y); ctx.restore();
  }
  function render() {
    if (!bg) bg = makeBg();
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    ctx.drawImage(bg, 0, 0, W, H);
    // かんきゃくの きらきら
    for (let i = 0; i < 14; i++) {
      const tw = Math.sin(animT * 3 + i * 2.1); if (tw < 0.5) continue;
      const x = (i * 97 + 31) % W, y = Y0 - 16 - ((i * 53) % 90);
      ctx.fillStyle = 'rgba(255,255,255,' + (tw - 0.5) + ')'; ctx.fillRect(x, y, 2, 2);
    }
    drawCourt();
    const zb = hoop.d + RIM + GAP, zf = hoop.d - RIM - BR * 0.5;
    const order = balls.slice().sort((a, b) => b.z - a.z);
    for (const b of order) drawShadow(b);
    for (const b of order) if (b.z > zb) drawBall(b);
    drawBoard();
    for (const b of order) if (b.z <= zb && b.z > zf) drawBall(b);
    drawHoop();
    for (const b of order) if (b.z <= zf) drawBall(b);
    // てもとの ボール
    if (mode === 'play' && !over) {
      const home = pr(0, START_Y, 0), k = Math.min(1, readyT / 0.25), r = BR * home.k;
      const bob = Math.sin(animT * 3) * 2;
      ctx.fillStyle = 'rgba(255,209,102,' + (0.10 + 0.05 * Math.sin(animT * 4)) + ')';
      ctx.beginPath(); ctx.arc(home.x, home.y, r + 9, 0, 7); ctx.fill();
      drawBallAt(home.x, home.y + (1 - k) * 60 + bob, r * (0.6 + 0.4 * k), 0.4, k, streak >= 3);
      if (shots === 0 && !drag && !kb.on) {
        const u = (animT % 1.4) / 1.4, fy = home.y - 10 - Math.min(1, u * 1.6) * 90;
        ctx.globalAlpha = u < 0.75 ? 1 : (1 - u) * 4;
        ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.setLineDash([5, 6]);
        ctx.beginPath(); ctx.moveTo(home.x, home.y - 10); ctx.lineTo(home.x, fy); ctx.stroke(); ctx.setLineDash([]);
        ctx.font = '30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
        ctx.fillText('👆', home.x + 4, fy + 16);
        ctx.globalAlpha = 1;
        drawText('ボールを うえへ シュッ！', W / 2, H - 22, 15, '#ffd166', 1);
      }
    }
    drawAim();
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const p of pops) {
      const k = Math.min(1, p.t / 0.15), sc = 0.6 + 0.4 * k + (p.t < 0.3 ? Math.sin(p.t / 0.3 * Math.PI) * 0.25 : 0);
      drawText(p.text, p.x, p.y - p.t * 26, Math.max(12, Math.round(p.size * sc)), p.col, p.t > 0.8 ? Math.max(0, (1.1 - p.t) / 0.3) : 1);
    }
    if (banner) drawText(banner.text, W / 2, (drag || kb.on) && !over ? H - 22 : 268, banner.text.length > 8 ? 16 : 22, banner.col, Math.min(1, banner.t * 3));
    if (mode === 'play' && !over && time <= 5) drawText(String(Math.ceil(time)), 30, 64, 40, '#ff5fa2', 0.55);
  }

  // ---- そうさ ---------------------------------------------------------------
  function evPos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  function onDown(e) {
    userActed = true;
    if (mode !== 'play' || over) return;
    e.preventDefault();
    const p = evPos(e);
    drag = { id: e.pointerId, x0: p.x, y0: p.y, x: p.x, y: p.y };
    kb.on = false;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    e.preventDefault();
    const p = evPos(e); drag.x = p.x; drag.y = p.y;
  }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const p = evPos(e); drag.x = p.x; drag.y = p.y;
    const aim = aimFrom(drag.x - drag.x0, drag.y - drag.y0);
    drag = null;
    if (aim) shoot(aim.p, aim.phi);
  }
  function onKey(e) {
    userActed = true;
    const k = e.key;
    if (mode === 'play') {
      if (over) return;
      if (k === 'ArrowLeft') { kb.on = true; kb.a = Math.max(-AIM_LIM, kb.a - 3); }
      else if (k === 'ArrowRight') { kb.on = true; kb.a = Math.min(AIM_LIM, kb.a + 3); }
      else if (k === 'ArrowUp') { kb.on = true; kb.p = Math.min(1, kb.p + 0.02); }
      else if (k === 'ArrowDown') { kb.on = true; kb.p = Math.max(0, kb.p - 0.02); }
      else if (k === ' ' || k === 'Spacebar' || k === 'Enter') { kb.on = true; if (!e.repeat) shoot(kb.p, kb.a * AIM_K * Math.PI / 180); }
      else return;
      e.preventDefault();
    } else if (k === 'Enter' || k === ' ') {
      const onBtn = e.target && e.target.tagName === 'BUTTON';
      if (onBtn && (k === ' ' || e.target.id === 'backBtn')) return;   // スペースは そのボタンを おす。Enter は いつでも スタート
      e.preventDefault(); if (guardOk()) startGame(level);
    }
  }
  function pickLevel(i) {
    if (!unlocked(i)) {
      SFX.locked();
      ovRule.textContent = '🔒「' + LV[i - 1].name + '」で ' + LV[i - 1].stars[0] + 'てん とると あそべるよ';
      return;
    }
    level = i; SFX.select(); drawLevels(); ruleText();
  }
  function setMute(v) { muted = v; try { localStorage.setItem(KEY + 'mute', muted ? '1' : '0'); } catch (e) {} muteBtn.textContent = muted ? '🔇' : '🔊'; }

  // ---- ループ ---------------------------------------------------------------
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (auto) update(dt);
    render();
  }
  function fitCanvas() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }

  // ---- テストよう -----------------------------------------------------------
  window.__test = {
    state() {
      return {
        mode, level, score, time: Math.round(time * 1000) / 1000, streak, bestStreak, goals, shots, swishes, over,
        ready: cool <= 0, pending: !!pending, lastRes, liveBalls: balls.filter(b => b.live).length, balls: balls.length,
        hoop: { x: Math.round(hoop.x * 1000) / 1000, d: Math.round(hoop.d * 1000) / 1000, tx: hoop.tx, td: hoop.td, amp: hoop.amp, om: hoop.om },
        best: best.slice(), unlocked: [unlocked(0), unlocked(1), unlocked(2)], muted, newRecord, justUnlocked,
        guide: LV[level].guide, kb: { on: kb.on, a: kb.a, p: Math.round(kb.p * 100) / 100 }, dragging: !!drag,
      };
    },
    start(lv) { startGame(lv); },
    pops() { return pops.map(q => ({ slot: q.slot, text: q.text, y: Math.round(q.y - q.t * 26), size: q.size })); },
    banner() { return banner ? banner.text : ''; },
    title() { showTitle(); },
    auto(v) { auto = !!v; },
    seed(n) { rndState = (n >>> 0) || 1; },
    step(ms) { const n = Math.round(ms / 1000 / STEP); for (let i = 0; i < n && mode === 'play'; i++) { tick(); if (i % 2 === 1) fx(STEP * 2); } hud(false); render(); },
    shoot(p, phi) { return shoot(p, phi); },
    ideal(hx, d) { return ideal(hx === undefined ? hoop.x : hx, d === undefined ? hoop.d : d); },
    sim(hx, d, p, phi) { return simShot(hx, d, p, phi); },
    aim(dx, dy) { return aimFrom(dx, dy); },
    setHoop(x, d) { hoop.tx = hoop.bx = hoop.x = x; hoop.td = hoop.d = d; hoop.amp = 0; hoop.om = 0; },
    setTime(s) { time = s; },
    setGoals(n) { goals = n; moveParams(); },
    setStreak(n) { streak = n; },
    setBest(arr) { best = arr.slice(0, 3); saveBest(); if (mode === 'title') drawLevels(); },
    resetSave() { try { localStorage.removeItem(KEY + 'best'); localStorage.removeItem(KEY + 'mute'); } catch (e) {} best = [0, 0, 0]; if (mode === 'title') showTitle(); },
    consts: { W, H, DRAG_MIN, DRAG_MAX, AIM_K, DISTS, GAME_TIME, COOL, stars: LV.map(L => L.stars), homeY: Y0 - (START_Y - CAMY) * F / CAMZ },
  };

  // ---- さいごに：しょきか と イベントとうろく -----------------------------------
  loadBest();
  fitCanvas();
  muteBtn.textContent = muted ? '🔇' : '🔊';
  showTitle();
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', () => { drag = null; });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('touchstart', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', onKey);
  document.addEventListener('pointerdown', () => { userActed = true; }, true);
  startBtn.addEventListener('click', () => { userActed = true; if (guardOk()) startGame(level); });
  backBtn.addEventListener('click', () => { userActed = true; if (!guardOk()) return; SFX.select(); showTitle(); });
  levelsEl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; userActed = true; pickLevel(Number(b.dataset.lv)); });
  muteBtn.addEventListener('click', () => { userActed = true; setMute(!muted); if (!muted) SFX.select(); });
  window.addEventListener('resize', fitCanvas);
  document.addEventListener('visibilitychange', () => { last = performance.now(); if (document.hidden) drag = null; });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
