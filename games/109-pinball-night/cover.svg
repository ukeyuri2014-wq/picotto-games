<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c109bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1546"/>
      <stop offset="0.6" stop-color="#0d1734"/>
      <stop offset="1" stop-color="#070a1c"/>
    </linearGradient>
    <linearGradient id="c109table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16124a"/>
      <stop offset="1" stop-color="#0a1230"/>
    </linearGradient>
    <radialGradient id="c109bump" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#ffd7e7"/>
      <stop offset="0.5" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#7a1d4c"/>
    </radialGradient>
    <radialGradient id="c109ball" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9d4ee"/>
      <stop offset="1" stop-color="#4f5880"/>
    </radialGradient>
    <radialGradient id="c109moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c109flip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9fffb"/>
      <stop offset="1" stop-color="#2bb7b0"/>
    </linearGradient>
    <linearGradient id="c109trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#53e0d8" stop-opacity="0"/>
      <stop offset="1" stop-color="#53e0d8" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="c109glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="225" fill="url(#c109bg)"/>
  <g fill="#cfd8ff" opacity="0.7">
