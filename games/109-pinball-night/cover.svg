    <circle cx="330" cy="24" r="1.3"/><circle cx="372" cy="70" r="1"/><circle cx="350" cy="150" r="1.5"/><circle cx="385" cy="200" r="1"/>
    <circle cx="300" cy="190" r="1"/><circle cx="96" cy="128" r="1"/>
  </g>
  <g fill="#ffd166" opacity="0.8"><circle cx="48" cy="54" r="1.6"/><circle cx="360" cy="112" r="1.6"/></g>
