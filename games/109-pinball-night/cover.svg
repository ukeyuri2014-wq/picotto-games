  <circle cx="266" cy="128" r="10" fill="none" stroke="#ffd166" stroke-width="2.5" filter="url(#c109glow)"/>
  <circle cx="266" cy="128" r="6" fill="#000"/>
  <path d="M266 104 l2.2 4.6 5 .6 -3.7 3.4 1 5 -4.5 -2.5 -4.5 2.5 1 -5 -3.7 -3.4 5 -.6z" fill="#ffd166" filter="url(#c109glow)"/>
  <!-- slings -->
  <path d="M130 158 L130 186 L150 200 Z" fill="#a06bff" fill-opacity="0.3" stroke="#a06bff" stroke-width="3" stroke-linejoin="round" filter="url(#c109glow)"/>
