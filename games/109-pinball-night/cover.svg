  <circle cx="200" cy="128" r="46" fill="url(#c109moon)"/>
  <circle cx="200" cy="128" r="20" fill="#ffe096" opacity="0.28"/>
  <circle cx="208" cy="122" r="18" fill="#0f1438" opacity="0.9"/>
