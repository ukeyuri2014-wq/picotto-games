    <rect x="206" y="130" width="4" height="5" fill="#ff5fa2"/><rect x="276" y="116" width="4" height="5" fill="#ffd166"/><rect x="344" y="110" width="4" height="5" fill="#53e0d8"/>
    <rect x="354" y="126" width="4" height="5" fill="#ffd166"/><rect x="72" y="136" width="4" height="5" fill="#ffd166"/><rect x="172" y="122" width="4" height="5" fill="#a06bff"/>
