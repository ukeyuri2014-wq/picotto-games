    <rect x="194" y="92" width="34" height="133"/><rect x="228" y="124" width="42" height="101"/><rect x="270" y="106" width="30" height="119"/>
    <rect x="300" y="128" width="38" height="97"/><rect x="338" y="100" width="28" height="125"/><rect x="366" y="120" width="34" height="105"/>
