<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c048sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090920"/>
      <stop offset="0.55" stop-color="#2d1c62"/>
      <stop offset="1" stop-color="#7a2470"/>
    </linearGradient>
    <radialGradient id="c048halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c048moon" cx="0.4" cy="0.38" r="0.7">
