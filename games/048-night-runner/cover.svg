    <circle cx="246" cy="10" r="1" opacity="0.7"/><circle cx="372" cy="16" r="1.1" opacity="0.8"/><circle cx="388" cy="58" r="0.8" opacity="0.6"/>
    <circle cx="30" cy="78" r="0.8" opacity="0.5"/><circle cx="152" cy="62" r="0.9" opacity="0.6"/><circle cx="272" cy="70" r="0.8" opacity="0.5"/>
