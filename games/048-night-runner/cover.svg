    <polygon points="-8,-31 -7.5,-37.5 -4,-32" fill="#ffb3d1"/>
    <polygon points="5,-32 8.5,-37.5 9.5,-31" fill="#ffb3d1"/>
    <circle cx="3" cy="-22" r="4.2" fill="#ffffff"/><circle cx="10.6" cy="-22" r="4.2" fill="#ffffff"/>
    <circle cx="4.5" cy="-21.6" r="2.2" fill="#131322"/><circle cx="12.1" cy="-21.6" r="2.2" fill="#131322"/>
    <circle cx="5.2" cy="-22.6" r="0.8" fill="#ffffff"/><circle cx="12.8" cy="-22.6" r="0.8" fill="#ffffff"/>
