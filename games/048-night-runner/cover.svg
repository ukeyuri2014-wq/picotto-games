    <linearGradient id="c048beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0.5"/>
