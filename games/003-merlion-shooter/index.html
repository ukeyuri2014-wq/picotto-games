<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>マーライオンシューター | ピコットゲームズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(ellipse 70% 50% at 50% -10%, #35234d 0%, transparent 70%),
      #131322;
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    color: #eeecfa;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .topbar {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 14px 16px 8px;
  }
  .topbar a, .topbar button.mute {
    color: #53e0d8;
    font-weight: 900;
    text-decoration: none;
    font-size: 0.88rem;
    background: #1e1e36;
    border: 1px solid #2c2c4d;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .topbar a:hover, .topbar button.mute:hover { border-color: #53e0d8; }
  .topbar h1 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: 0.98rem;
    background: linear-gradient(100deg, #ff5fa2, #c77dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stage { position: relative; width: min(94vw, 480px); margin: 6px 0 24px; }
  canvas {
    display: block;
    width: 100%;
    border-radius: 20px;
    border: 1px solid #2c2c4d;
    box-shadow: 0 0 40px rgba(83, 224, 216, 0.15), 0 14px 34px rgba(0, 0, 0, 0.45);
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(19, 19, 34, 0.92);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 13px;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 2.7rem; }
  .overlay h2 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: 1.5rem;
    background: linear-gradient(100deg, #ff5fa2, #53e0d8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .overlay p { font-size: 0.92rem; line-height: 1.75; color: #c9c5e6; }
  .overlay p b { color: #eeecfa; }
  .overlay .place { font-size: 0.72rem; letter-spacing: 0.28em; color: #ffd166; font-weight: 700; }
  .overlay .score-line { font-size: 1.25rem; font-weight: 900; color: #eeecfa; }
  .overlay .best-line { font-size: 0.9rem; color: #53e0d8; font-weight: 700; }
  .btn {
    border: none;
    background: linear-gradient(100deg, #ff3d8c, #ff5fa2);
    color: #fff;
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.14em;
    border-radius: 999px;
    padding: 12px 46px;
    cursor: pointer;
    box-shadow: 0 4px 22px rgba(255, 61, 140, 0.5);
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: translateY(2px); }
  .btn:focus-visible, .topbar button.mute:focus-visible { outline: 2px solid #53e0d8; outline-offset: 2px; }
  .hint { font-size: 0.78rem; color: #9d99c0; }
  .hint a { color: #9d99c0; }
  .age-badge { display:inline-flex; width:fit-content; margin:0; padding:5px 12px; border:1px solid rgba(83,224,216,.35); border-radius:999px; color:#53e0d8!important; background:rgba(83,224,216,.08); font-size:.72rem!important; font-weight:900; letter-spacing:.06em; }
</style>
</head>
<body>

<div class="topbar">
  <a href="../../index.html">← いちらんへ</a>
  <h1>🦁 マーライオンシューター</h1>
  <button class="mute" id="mute-btn" aria-label="おとのオンオフ">🔊</button>
</div>

<div class="stage">
  <canvas id="game" width="480" height="640"></canvas>

  <div class="overlay" id="title-screen">
    <div class="big">🦁💧🍈</div>
    <h2>マーライオンシューター</h2>
    <div class="place">SINGAPORE NIGHT</div>
    <p class="age-badge">対象年齢の目安：7歳〜</p>
    <p>
      シンガポールのよるけいをまもれ！<br>
      マーライオンを左右にうごかすと<br>
      みずでっぽう💧をれんしゃするよ。<br>
      🍈 ドリアン = うちおとして <b>+20てん</b><br>
      ⭐ ながれぼし = あてたら <b>+50てん</b><br>
      🍈が海におちたりぶつかると<b>ライフ−1</b>（ぜんぶで3つ）
    </p>
    <button class="btn" id="start-btn">スタート！</button>
    <p class="hint">そうさ：←→キー / マウス / ゆびでスライド</p>
  </div>

  <div class="overlay hidden" id="over-screen">
    <div class="big">🌃</div>
    <h2>ゲームオーバー！</h2>
    <p class="score-line" id="final-score">スコア：0てん</p>
    <p class="best-line" id="best-score"></p>
    <button class="btn" id="retry-btn">もういちど！</button>
    <p class="hint"><a href="../../index.html">ゲームいちらんへもどる</a></p>
  </div>
</div>

<script>
// ================================================================
// ★カスタマイズポイント★
// ================================================================
const SETTINGS = {
  enemyPoint: 20,
  bonusPoint: 50,
  lives: 3,
  shootInterval: 0.32,
  storageKey: "merlion-shooter-best",
};
// ================================================================

(function () {
  const W = 480;
  const H = 640;
  const WATER_Y = 540;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const titleScreen = document.getElementById("title-screen");
  const overScreen = document.getElementById("over-screen");
  const finalScoreEl = document.getElementById("final-score");
  const bestScoreEl = document.getElementById("best-score");
  const muteBtn = document.getElementById("mute-btn");

  let state = "title";
  let score = 0;
  let lives = SETTINGS.lives;
  let elapsed = 0;
  let bullets = [];
  let enemies = [];
  let stars = [];
  let popups = [];
  let sparks = [];
  let fireworks = [];
  let spawnTimer = 1;
  let starTimer = 5;
  let shootTimer = 0;
  let fwTimer = 3;
  let invincible = 0;
  let player = { x: W / 2, y: 575 };
  let keys = { left: false, right: false };
  let lastTime = 0;

  const bgStars = [];
  for (let i = 0; i < 42; i++) {
    bgStars.push({ x: Math.random() * W, y: Math.random() * 330, r: 0.6 + Math.random() * 1.3, tw: Math.random() * Math.PI * 2 });
  }
  const windows = [];
  (function makeWindows() {
    const blocks = [
      [0, 402, 46, 128], [52, 428, 34, 102], [148, 452, 30, 78],
      [262, 448, 26, 82], [296, 430, 32, 100],
      [340, 418, 22, 112], [376, 408, 22, 122], [412, 418, 22, 112],
    ];
    blocks.forEach(function (b) {
      for (let i = 0; i < 14; i++) {
        windows.push({ x: b[0] + 4 + Math.random() * (b[2] - 8), y: b[1] + 6 + Math.random() * (b[3] - 12), gold: Math.random() < 0.7 });
      }
    });
  })();

  // ============ おと（BGM＋こうかおん・ミュート対応） ============
  let audioCtx = null;
  let muted = localStorage.getItem("picotto-muted") === "1";
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, t, dur, type, vol) {
    const c = getCtx();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 0.05));
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.1);
  }
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try { tone(freq, getCtx().currentTime, dur, type || "sine", vol || 0.1); } catch (e) {}
  }
  // アップテンポなアーケード調BGM
  const BGM = {
    timer: null, step: 0, next: 0,
    song: {
      bpm: 132, lead: "square",
      melody: [523, 0, 659, 784, 0, 784, 659, 523, 587, 0, 587, 659, 587, 0, 494, 0,
               523, 0, 659, 784, 0, 880, 784, 659, 784, 0, 659, 587, 523, 0, 0, 0],
      bass:   [131, 0, 131, 0, 175, 0, 175, 0, 196, 0, 196, 0, 175, 0, 147, 0],
    },
    start: function () {
      try {
        const c = getCtx();
        this.stop();
        const spb = 60 / this.song.bpm / 2;
        this.next = c.currentTime + 0.1;
        this.step = 0;
        const self = this;
        this.timer = setInterval(function () {
          try {
            const cc = getCtx();
            while (self.next < cc.currentTime + 0.25) {
              if (!muted && !document.hidden) {
                const m = self.song.melody[self.step % self.song.melody.length];
                const b = self.song.bass[self.step % self.song.bass.length];
                if (m) tone(m, self.next, spb * 0.8, self.song.lead, 0.03);
                if (b) tone(b, self.next, spb * 0.9, "triangle", 0.055);
              }
              self.next += spb;
              self.step++;
            }
          } catch (e) {}
        }, 80);
      } catch (e) {}
    },
    stop: function () { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  };
  function updateMuteBtn() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    localStorage.setItem("picotto-muted", muted ? "1" : "0");
    updateMuteBtn();
  });
  updateMuteBtn();

  // ============ 手がきスプライト ============
  function drawDroplet(c, x, y) {
    const g = c.createRadialGradient(x - 2, y - 2, 1, x, y, 9);
    g.addColorStop(0, "#dffcfa");
    g.addColorStop(1, "#53e0d8");
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x, y - 11);
    c.quadraticCurveTo(x + 7, y - 2, x + 6, y + 3);
    c.arc(x, y + 3, 6, 0, Math.PI);
    c.quadraticCurveTo(x - 7, y - 2, x, y - 11);
    c.fill();
  }

  function drawDurian(c, x, y, rot) {
    const glow = c.createRadialGradient(x, y, 4, x, y, 32);
    glow.addColorStop(0, "rgba(255, 209, 102, 0.35)");
    glow.addColorStop(1, "rgba(255, 209, 102, 0)");
    c.fillStyle = glow;
    c.beginPath(); c.arc(x, y, 32, 0, Math.PI * 2); c.fill();

    c.save(); c.translate(x, y); c.rotate(rot);
    c.fillStyle = "#4f7028";
    for (let k = 0; k < 12; k++) {
      const a = (Math.PI * 2 / 12) * k;
      c.beginPath();
      c.moveTo(Math.cos(a - 0.14) * 14, Math.sin(a - 0.14) * 14);
      c.lineTo(Math.cos(a) * 22, Math.sin(a) * 22);
      c.lineTo(Math.cos(a + 0.14) * 14, Math.sin(a + 0.14) * 14);
      c.closePath();
      c.fill();
    }
    const g = c.createRadialGradient(-4, -5, 2, 0, 0, 16);
    g.addColorStop(0, "#a7c463");
    g.addColorStop(1, "#66883a");
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, 15, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#33471c";
    c.beginPath();
    c.arc(-5, -2, 2, 0, Math.PI * 2);
    c.arc(5, -2, 2, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "#33471c";
    c.lineWidth = 1.6;
    c.beginPath(); c.arc(0, 6, 3.6, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
    c.restore();
  }

  function drawGoldStar(c, x, y, r, rot) {
    const g = c.createRadialGradient(x, y, 2, x, y, r * 2.3);
    g.addColorStop(0, "rgba(255, 209, 102, 0.5)");
    g.addColorStop(1, "rgba(255, 209, 102, 0)");
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r * 2.3, 0, Math.PI * 2); c.fill();
    c.save(); c.translate(x, y); c.rotate(rot);
    c.fillStyle = "#ffd166";
    c.beginPath();
    for (let k = 0; k < 10; k++) {
      const rr = k % 2 === 0 ? r : r * 0.45;
      const a = (Math.PI / 5) * k - Math.PI / 2;
      if (k === 0) c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath(); c.fill();
    c.restore();
  }

  function drawMerlion(c, x, y, t, faded) {
    c.save();
    c.translate(x, y);
    if (faded) c.globalAlpha = 0.35;

    // だい座
    const ped = c.createLinearGradient(0, 18, 0, 42);
    ped.addColorStop(0, "#8f9bc4");
    ped.addColorStop(1, "#5a6390");
    c.fillStyle = ped;
    c.beginPath();
    c.moveTo(-24, 20); c.lineTo(24, 20); c.lineTo(19, 42); c.lineTo(-19, 42);
    c.closePath(); c.fill();

    // しっぽ（うしろで上にはねるヒレ）
    const tail = c.createLinearGradient(10, 12, 30, -12);
    tail.addColorStop(0, "#bfe8ff");
    tail.addColorStop(1, "#8fd8e8");
    c.fillStyle = tail;
    c.beginPath();
    c.moveTo(15, 12);
    c.bezierCurveTo(25, 8, 29, -1, 26, -9);
    c.bezierCurveTo(33, -5, 36, 4, 32, 13);
    c.bezierCurveTo(29, 19, 21, 20, 15, 12);
    c.closePath(); c.fill();

    // からだ（首から右下へ流れる魚体・横向き）
    const body = c.createLinearGradient(0, -10, 0, 24);
    body.addColorStop(0, "#ffffff");
    body.addColorStop(1, "#cfe6f2");
    c.fillStyle = body;
    c.beginPath();
    c.moveTo(-5, -8);
    c.bezierCurveTo(11, -9, 20, 2, 18, 13);
    c.bezierCurveTo(17, 19, 10, 22, 1, 22);
    c.bezierCurveTo(-9, 22, -13, 9, -11, -3);
    c.closePath(); c.fill();
    // うろこ
    c.strokeStyle = "rgba(120, 185, 210, 0.65)";
    c.lineWidth = 1.3;
    c.beginPath(); c.arc(4, 6, 5, Math.PI * 0.15, Math.PI * 0.95); c.stroke();
    c.beginPath(); c.arc(11, 11, 5, Math.PI * 0.15, Math.PI * 0.95); c.stroke();
    c.beginPath(); c.arc(0, 13, 5, Math.PI * 0.15, Math.PI * 0.95); c.stroke();

    // たてがみ（後ろへ流れるスパイク）— 頭の後ろ側だけ
    const hc = { x: -6, y: -18 };
    c.fillStyle = "#9fdce8";
    for (let k = 0; k < 6; k++) {
      const a = -1.35 + k * 0.42; // 上から右下へ
      const len = 15 + (k % 2) * 4;
      const tipX = hc.x + Math.cos(a) * len;
      const tipY = hc.y + Math.sin(a) * len;
      const b1x = hc.x + Math.cos(a - 0.3) * 8.5;
      const b1y = hc.y + Math.sin(a - 0.3) * 8.5;
      const b2x = hc.x + Math.cos(a + 0.3) * 8.5;
      const b2y = hc.y + Math.sin(a + 0.3) * 8.5;
      c.beginPath();
      c.moveTo(b1x, b1y);
      c.quadraticCurveTo(tipX + Math.cos(a + 0.5) * 3, tipY + Math.sin(a + 0.5) * 3, tipX, tipY);
      c.lineTo(b2x, b2y);
      c.closePath(); c.fill();
    }

    // あたま（横顔）
    const head = c.createRadialGradient(hc.x - 3, hc.y - 4, 2, hc.x, hc.y, 12);
    head.addColorStop(0, "#ffffff");
    head.addColorStop(1, "#dcecf5");
    c.fillStyle = head;
    c.beginPath(); c.arc(hc.x, hc.y, 9.5, 0, Math.PI * 2); c.fill();

    // マズル（くちさきを上むきに・みずはここから出る）
    c.save();
    c.translate(hc.x, hc.y);
    c.rotate(-0.55);
    c.fillStyle = head;
    c.beginPath(); c.ellipse(-8.5, -3.5, 6.6, 4.2, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#2b4a63";
    c.beginPath(); c.arc(-13, -5.8, 1.7, 0, Math.PI * 2); c.fill();  // はな
    c.beginPath(); c.ellipse(-11.5, -1.5, 2.2, 1.4, 0, 0, Math.PI * 2); c.fill(); // くち
    c.restore();

    // め（横顔なので1つ）・ほっぺ
    c.fillStyle = "#3a3355";
    c.beginPath(); c.arc(hc.x - 1.5, hc.y - 3.5, 1.7, 0, Math.PI * 2); c.fill();
    c.fillStyle = "rgba(255, 95, 162, 0.45)";
    c.beginPath(); c.ellipse(hc.x + 1.5, hc.y + 3, 2.6, 1.7, 0, 0, Math.PI * 2); c.fill();

    c.restore();
  }

  function burst(x, y, color, n, up) {
    for (let i = 0; i < n; i++) {
      const a = up ? Math.PI + Math.random() * Math.PI : Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 140;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (up ? 60 : 30), life: 0.5 + Math.random() * 0.35, max: 0.85, color: color });
    }
  }
  const FW_COLORS = ["#ff5fa2", "#53e0d8", "#ffd166", "#c77dff"];
  function launchFirework() {
    const fx = 60 + Math.random() * (W - 120);
    const fy = 70 + Math.random() * 150;
    const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
    for (let i = 0; i < 26; i++) {
      const a = (Math.PI * 2 / 26) * i + Math.random() * 0.1;
      const sp = 55 + Math.random() * 55;
      fireworks.push({ x: fx, y: fy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1 + Math.random() * 0.3, max: 1.3, color: color });
    }
  }

  // ---- そうさ ----
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
    if (e.key === "ArrowLeft") keys.left = true;
    if (e.key === "ArrowRight") keys.right = true;
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
  });
  function pointerMove(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    player.x = Math.max(40, Math.min(W - 40, (cx / rect.width) * W));
  }
  canvas.addEventListener("pointermove", pointerMove);
  canvas.addEventListener("pointerdown", pointerMove);

  // ---- ゲームのながれ ----
  function startGame() {
    score = 0;
    lives = SETTINGS.lives;
    elapsed = 0;
    bullets = [];
    enemies = [];
    stars = [];
    popups = [];
    sparks = [];
    fireworks = [];
    spawnTimer = 1;
    starTimer = 5;
    shootTimer = 0;
    fwTimer = 3;
    invincible = 0;
    player.x = W / 2;
    state = "play";
    titleScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    beep(660, 0.15);
    BGM.start();
  }

  function endGame() {
    state = "over";
    BGM.stop();
    const best = Math.max(score, Number(localStorage.getItem(SETTINGS.storageKey) || 0));
    localStorage.setItem(SETTINGS.storageKey, String(best));
    finalScoreEl.textContent = "スコア：" + score + "てん";
    bestScoreEl.textContent = "さいこうきろく：" + best + "てん";
    overScreen.classList.remove("hidden");
    beep(220, 0.5, "sawtooth");
  }

  document.getElementById("start-btn").addEventListener("click", startGame);
  document.getElementById("retry-btn").addEventListener("click", startGame);

  function loseLife(x, y) {
    if (invincible > 0) return;
    lives--;
    invincible = 1.5;
    popups.push({ x: x, y: y, text: "−❤️", color: "#ff5fa2", life: 0.9 });
    burst(x, Math.min(y, WATER_Y), "#8fd8e8", 14, true);
    beep(150, 0.3, "sawtooth", 0.14);
    if (lives <= 0) endGame();
  }

  function update(dt) {
    elapsed += dt;
    const ratio = Math.min(elapsed / 60, 1);
    if (invincible > 0) invincible -= dt;

    const kbSpeed = 340;
    if (keys.left) player.x -= kbSpeed * dt;
    if (keys.right) player.x += kbSpeed * dt;
    player.x = Math.max(40, Math.min(W - 40, player.x));

    shootTimer -= dt;
    if (shootTimer <= 0) {
      bullets.push({ x: player.x - 18, y: player.y - 38 }); // マーライオンの口もとから
      shootTimer = SETTINGS.shootInterval;
      beep(760, 0.05, "sine", 0.045);
    }
    for (let i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y -= 430 * dt;
      if (bullets[i].y < -20) bullets.splice(i, 1);
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      enemies.push({
        x: 40 + Math.random() * (W - 80),
        y: -30,
        vy: 85 + 105 * ratio + Math.random() * 30,
        wobble: Math.random() * Math.PI * 2,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 2.4,
      });
      spawnTimer = 1.15 - 0.6 * ratio;
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const en = enemies[i];
      en.y += en.vy * dt;
      en.wobble += dt * 3;
      en.rot += en.rotSpeed * dt;
      en.x += Math.sin(en.wobble) * 0.5;

      let hit = false;
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (Math.abs(b.x - en.x) < 26 && Math.abs(b.y - en.y) < 28) {
          bullets.splice(j, 1);
          hit = true;
          break;
        }
      }
      if (hit) {
        score += SETTINGS.enemyPoint;
        popups.push({ x: en.x, y: en.y, text: "+" + SETTINGS.enemyPoint, color: "#53e0d8", life: 0.8 });
        burst(en.x, en.y, "#a7c463", 10);
        enemies.splice(i, 1);
        beep(1000, 0.1, "triangle");
        continue;
      }
      if (Math.abs(en.x - player.x) < 40 && Math.abs(en.y - player.y) < 42) {
        enemies.splice(i, 1);
        loseLife(en.x, en.y);
        continue;
      }
      if (en.y > WATER_Y + 10) {
        enemies.splice(i, 1);
        loseLife(en.x, WATER_Y);
      }
    }

    starTimer -= dt;
    if (starTimer <= 0) {
      const fromLeft = Math.random() < 0.5;
      stars.push({
        x: fromLeft ? -20 : W + 20,
        y: 70 + Math.random() * 150,
        vx: (fromLeft ? 1 : -1) * (130 + Math.random() * 60),
        rot: 0,
      });
      starTimer = 6 + Math.random() * 4;
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      const st = stars[i];
      st.x += st.vx * dt;
      st.rot += dt * 4;
      let hit = false;
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (Math.abs(b.x - st.x) < 24 && Math.abs(b.y - st.y) < 24) {
          bullets.splice(j, 1);
          hit = true;
          break;
        }
      }
      if (hit) {
        score += SETTINGS.bonusPoint;
        popups.push({ x: st.x, y: st.y, text: "+" + SETTINGS.bonusPoint, color: "#ffd166", life: 0.9 });
        burst(st.x, st.y, "#ffd166", 14);
        stars.splice(i, 1);
        beep(1400, 0.15, "triangle");
        continue;
      }
      if (st.x < -30 || st.x > W + 30) stars.splice(i, 1);
    }

    // はなび（えんしゅつ）
    fwTimer -= dt;
    if (fwTimer <= 0) {
      launchFirework();
      if (!muted) beep(520, 0.12, "sine", 0.03);
      fwTimer = 6 + Math.random() * 4;
    }
    for (let i = fireworks.length - 1; i >= 0; i--) {
      const f = fireworks[i];
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.vy += 40 * dt;
      f.life -= dt;
      if (f.life <= 0) fireworks.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 220 * dt;
      p.life -= dt;
      if (p.life <= 0) sparks.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].y -= 50 * dt;
      popups[i].life -= dt;
      if (popups[i].life <= 0) popups.splice(i, 1);
    }
  }

  // ---- シンガポールの夜景 ----
  function drawBackground(t) {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#171432");
    sky.addColorStop(0.6, "#2b2050");
    sky.addColorStop(1, "#3a2a5e");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    for (const s of bgStars) {
      ctx.globalAlpha = 0.3 + 0.55 * Math.abs(Math.sin(t / 900 + s.tw));
      ctx.fillStyle = "#e8e4ff";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "34px serif";
    ctx.fillText("🌙", 52, 62);

    // はなび（スカイラインのうしろ）
    for (const f of fireworks) {
      ctx.globalAlpha = Math.max(f.life / f.max, 0);
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = "#221d40";
    ctx.fillRect(0, 402, 46, 128);
    ctx.fillRect(52, 428, 34, 102);
    ctx.fillRect(148, 452, 30, 78);
    ctx.fillRect(262, 448, 26, 82);
    ctx.fillRect(296, 430, 32, 100);
    ctx.fillRect(340, 418, 22, 112);
    ctx.fillRect(376, 408, 22, 122);
    ctx.fillRect(412, 418, 22, 112);
    ctx.save();
    ctx.translate(387, 402);
    ctx.rotate(-0.06);
    ctx.beginPath();
    ctx.ellipse(0, 0, 62, 9, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#2a2153";
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = "#3d3370";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(115, 462, 40, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1.5;
    const spin = t / 4000;
    for (let k = 0; k < 8; k++) {
      const a = spin + (k * Math.PI) / 4;
      ctx.beginPath();
      ctx.moveTo(115, 462);
      ctx.lineTo(115 + Math.cos(a) * 40, 462 + Math.sin(a) * 40);
      ctx.stroke();
      ctx.fillStyle = "#53e0d8";
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(115 + Math.cos(a) * 40, 462 + Math.sin(a) * 40, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "#3d3370";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(100, 530); ctx.lineTo(115, 466); ctx.lineTo(130, 530);
    ctx.stroke();

    for (const tx of [196, 222, 246]) {
      ctx.strokeStyle = "#2a2153";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(tx, 530);
      ctx.lineTo(tx, 478);
      ctx.stroke();
      ctx.fillStyle = "#2a2153";
      ctx.beginPath();
      ctx.moveTo(tx - 16, 478);
      ctx.quadraticCurveTo(tx, 448, tx + 16, 478);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#c77dff";
      ctx.globalAlpha = 0.5 + 0.4 * Math.abs(Math.sin(t / 700 + tx));
      ctx.beginPath();
      ctx.arc(tx, 470, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    for (const wnd of windows) {
      ctx.fillStyle = wnd.gold ? "#ffd166" : "#53e0d8";
      ctx.globalAlpha = 0.55;
      ctx.fillRect(wnd.x, wnd.y, 2.2, 2.2);
    }
    ctx.globalAlpha = 1;

    const water = ctx.createLinearGradient(0, WATER_Y - 10, 0, H);
    water.addColorStop(0, "#1c2a52");
    water.addColorStop(1, "#101b38");
    ctx.fillStyle = water;
    ctx.fillRect(0, WATER_Y - 10, W, H - WATER_Y + 10);
    ctx.strokeStyle = "rgba(83, 224, 216, 0.35)";
    ctx.lineWidth = 1.5;
    for (let row = 0; row < 4; row++) {
      const wy = WATER_Y + 14 + row * 22;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 8) {
        const yy = wy + Math.sin(x / 26 + t / 500 + row) * 2.5;
        if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(255, 209, 102, 0.08)";
    ctx.fillRect(340, WATER_Y - 4, 94, 34);
    ctx.fillStyle = "rgba(83, 224, 216, 0.07)";
    ctx.fillRect(90, WATER_Y - 4, 60, 26);
  }

  function draw(t) {
    drawBackground(t || 0);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const b of bullets) drawDroplet(ctx, b.x, b.y);
    for (const st of stars) drawGoldStar(ctx, st.x, st.y, 15, st.rot);
    for (const en of enemies) drawDurian(ctx, en.x, en.y, en.rot);

    const blink = invincible > 0 && Math.sin(invincible * 20) > 0;
    drawMerlion(ctx, player.x, player.y - 8, t, blink);

    for (const p of sparks) {
      ctx.globalAlpha = Math.max(p.life / p.max, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.font = "900 22px 'Zen Maru Gothic', sans-serif";
    for (const p of popups) {
      ctx.globalAlpha = Math.max(p.life / 0.9, 0);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = "rgba(19, 19, 34, 0.78)";
    roundRect(ctx, 12, 12, 160, 40, 12);
    roundRect(ctx, W - 132, 12, 120, 40, 12);
    ctx.fillStyle = "#53e0d8";
    ctx.font = "900 20px 'Zen Maru Gothic', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("💧 " + score + " てん", 24, 33);
    ctx.textAlign = "right";
    ctx.font = "18px serif";
    ctx.fillText("❤️".repeat(Math.max(lives, 0)) || "💔", W - 24, 33);
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
    c.fill();
  }

  function loop(t) {
    const dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;
    if (state === "play") update(dt);
    draw(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(function (t) {
    lastTime = t;
    requestAnimationFrame(loop);
  });
  draw(0);
})();
</script>
</body>
