<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ピコットゲームズ | PICOTTO GAMES</title>
<meta name="description" content="ちいさな手づくりミニゲームがすこしずつ増えていく、無料で遊べるゲームコレクション。スマホ・PC対応。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Press+Start+2P&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131322;
    --bg2: #1a1a2e;
    --panel: #1e1e36;
    --panel-edge: #2c2c4d;
    --ink: #eeecfa;
    --sub: #9d99c0;
    --pink: #ff5fa2;
    --pink-deep: #ff3d8c;
    --cyan: #53e0d8;
    --gold: #ffd166;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    line-height: 1.7;
  }
  .hero {
    position: relative;
    background:
      radial-gradient(ellipse 70% 55% at 50% -10%, #35234d 0%, transparent 70%),
      linear-gradient(180deg, #191930 0%, var(--bg) 100%);
    padding: 64px 20px 52px;
    text-align: center;
    overflow: hidden;
  }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars span {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--cyan);
    border-radius: 1px;
    opacity: 0.7;
    animation: twinkle 2.6s ease-in-out infinite;
  }
  .stars span:nth-child(2n) { background: var(--pink); animation-delay: 0.9s; }
  .stars span:nth-child(3n) { background: var(--gold); animation-delay: 1.7s; width: 3px; height: 3px; }
  @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) { .stars span { animation: none; } }
  .hero .eyebrow {
    font-family: "Press Start 2P", monospace;
    font-size: 0.62rem;
    letter-spacing: 0.35em;
    color: var(--cyan);
    text-shadow: 0 0 12px rgba(83, 224, 216, 0.6);
  }
  .hero h1 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    letter-spacing: 0.04em;
    margin: 14px 0 6px;
    text-wrap: balance;
    background: linear-gradient(100deg, var(--pink) 15%, #c77dff 50%, var(--cyan) 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 95, 162, 0.35));
  }
  .hero .logo-emoji { font-size: 2rem; letter-spacing: 10px; }
  .hero p.lead {
    max-width: 540px;
    margin: 16px auto 0;
    font-size: 0.95rem;
    color: var(--sub);
    font-weight: 700;
  }
  .badge-row { margin-top: 22px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .badge {
    border: 1px solid var(--panel-edge);
    background: rgba(30, 30, 54, 0.8);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--sub);
  }
  main { max-width: 1000px; margin: 0 auto; padding: 40px 20px 10px; }
  .section-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 22px; }
  .section-title h2 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: 1.35rem;
  }
  .section-title .count {
    font-family: "Press Start 2P", monospace;
    font-size: 0.6rem;
    color: var(--cyan);
    letter-spacing: 0.15em;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--pink);
    box-shadow: 0 0 0 1px var(--pink), 0 10px 32px rgba(255, 95, 162, 0.25);
  }
  .thumb {
    background:
      radial-gradient(ellipse 80% 90% at 50% 110%, rgba(255, 95, 162, 0.28) 0%, transparent 65%),
      linear-gradient(160deg, #232345, #191930);
    font-size: 4rem;
    text-align: center;
    padding: 30px 0 22px;
    border-bottom: 1px solid var(--panel-edge);
  }
  .card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-body h3 { font-size: 1.12rem; font-weight: 900; }
  .meta { font-size: 0.76rem; color: var(--sub); display: flex; gap: 12px; flex-wrap: wrap; }
  .desc { font-size: 0.86rem; color: #c9c5e6; flex: 1; }
  .controls { font-size: 0.76rem; color: var(--cyan); font-weight: 700; }
  .play-btn {
    display: block;
    text-align: center;
    background: linear-gradient(100deg, var(--pink-deep), var(--pink));
    color: #fff;
    font-weight: 900;
    font-size: 1rem;
    text-decoration: none;
    border-radius: 999px;
    padding: 11px 0;
    margin-top: 8px;
    letter-spacing: 0.2em;
    box-shadow: 0 4px 18px rgba(255, 61, 140, 0.4);
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .play-btn:hover { filter: brightness(1.12); }
  .play-btn:active { transform: translateY(1px); }
  .play-btn:focus-visible, .card a:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  .about { max-width: 1000px; margin: 44px auto 0; padding: 0 20px 30px; }
  .about-box {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    padding: 26px 26px;
  }
  .about-box h2 {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    font-size: 1.1rem;
    color: var(--cyan);
    margin-bottom: 10px;
  }
  .about-box p { font-size: 0.9rem; color: #c9c5e6; }
  footer {
    text-align: center;
    padding: 26px 20px 36px;
    font-family: "Press Start 2P", monospace;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    color: var(--sub);
  }
</style>
</head>
<body>

<header class="hero">
  <div class="stars" aria-hidden="true">
    <span style="left:8%;  top:22%"></span><span style="left:16%; top:64%"></span>
    <span style="left:24%; top:38%"></span><span style="left:33%; top:15%"></span>
    <span style="left:44%; top:70%"></span><span style="left:55%; top:18%"></span>
    <span style="left:63%; top:58%"></span><span style="left:72%; top:30%"></span>
    <span style="left:82%; top:66%"></span><span style="left:90%; top:24%"></span>
    <span style="left:12%; top:85%"></span><span style="left:87%; top:86%"></span>
  </div>
  <div class="eyebrow">PICOTTO GAMES</div>
  <h1>ピコットゲームズ</h1>
  <div class="logo-emoji">🌸🕹️⭐</div>
  <p class="lead">
    ちいさな手づくりミニゲームが、すこしずつ増えていくゲームランド。<br>
    ぜんぶ無料。気になったやつから、ピッと遊んでって！
  </p>
  <div class="badge-row">
    <span class="badge">📱 スマホOK</span>
    <span class="badge">💻 パソコンOK</span>
    <span class="badge">🆓 ぜんぶ無料</span>
  </div>
</header>

<main>
  <div class="section-title">
    <h2>🕹️ ゲームいちらん</h2>
    <span class="count" id="game-count"></span>
  </div>
  <div class="grid" id="game-grid">
    <p class="empty">よみこみ中…</p>
  </div>
</main>

<section class="about">
  <div class="about-box">
    <h2>ABOUT</h2>
    <p>
      ピコットゲームズは、ちいさなチームが1つずつ手づくりしているミニゲームのコレクション。
      あたらしいゲームが「ぽつ、ぽつ」と増えていきます。ときどきのぞきに来てね。
    </p>
  </div>
</section>

<footer>© 2026 PICOTTO GAMES</footer>

<script src="games.js"></script>
<script>
  (function () {
    const grid = document.getElementById("game-grid");
    const count = document.getElementById("game-count");
    if (typeof GAMES === "undefined" || !GAMES.length) {
      grid.innerHTML = '<p class="empty">ゲームじゅんびちゅう！もうすこしまってね🌸</p>';
      return;
    }
    const sorted = [...GAMES].sort((a, b) => (a.date < b.date ? 1 : -1));
    count.textContent = "GAMES: " + sorted.length;
    grid.innerHTML = sorted
      .map(function (g) {
        return (
          '<article class="card">' +
          '<div class="thumb">' + g.emoji + "</div>" +
          '<div class="card-body">' +
          "<h3>" + g.title + "</h3>" +
          '<div class="meta"><span>👤 ' + g.author + "</span><span>📅 " + g.date + "</span></div>" +
          '<p class="desc">' + g.description + "</p>" +
          '<div class="controls">🎮 ' + g.controls + "</div>" +
          '<a class="play-btn" href="' + g.path + '">PLAY!</a>' +
          "</div></article>"
        );
      })
      .join("");
  })();
</script>
</body>
</html>
